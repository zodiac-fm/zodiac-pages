<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Welcome — Zodiac</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap" rel="stylesheet">
<style>
:root{--cream:#F6F1E8;--ink:#1a1620;--body:#2b2533;--mut:#756e79;--rule:#eadfce;--hair:#ddd3c4;--violet:#6521c9;--violet-deep:#38007a;--serif:"Cormorant Garamond",Georgia,serif;--sans:"Switzer",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#e7e2d8;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#frame{position:relative;width:min(420px,100vw);height:min(880px,100dvh);overflow:hidden;background:var(--cream)}
@media (min-width:440px) and (min-height:900px){ #frame{border-radius:30px;box-shadow:0 30px 80px rgba(0,0,0,.22);border:1px solid rgba(0,0,0,.05)} }
@media (max-width:439px),(max-height:899px){ body{align-items:flex-start} #frame{width:100vw;height:100dvh} }

/* ---------- the aurora ground (the app's own gradient, never pure cream) ---------- */
#aurora{position:absolute;inset:-20%;z-index:0;pointer-events:none}
#aurora i{position:absolute;width:130%;aspect-ratio:1;border-radius:50%;filter:blur(72px);transition:background 1.4s ease;will-change:transform}
#aurora .b1{background:var(--c1);top:-34%;left:-52%;opacity:.19;animation:dr1 26s ease-in-out infinite alternate}
#aurora .b2{background:var(--c2);bottom:-52%;right:-50%;opacity:.28;animation:dr2 32s ease-in-out infinite alternate}
#aurora .b3{background:var(--csoft);top:44%;left:66%;width:92%;opacity:.25;animation:dr3 40s ease-in-out infinite alternate}
@keyframes dr1{to{transform:translate(9%,7%) scale(1.15)}}
@keyframes dr2{to{transform:translate(-8%,-9%) scale(1.12)}}
@keyframes dr3{to{transform:translate(-12%,6%) scale(1.2)}}

.letter{position:absolute;z-index:7;top:14px;left:14px;padding:2px 9px;border:1px solid var(--rule);border-radius:9px;background:#fff;color:#6a6470;font-size:14px;font-weight:700;letter-spacing:.05em}

#pane{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:0 22px calc(env(safe-area-inset-bottom,0px) + 16px)}

/* ---------- editorial head (W-4 spine) ---------- */
.head{padding-top:48px}
.tick{width:34px;height:3px;margin:0 0 12px;border-radius:2px;background:linear-gradient(90deg,var(--violet),#9a55d7)}
.head h2{font-family:var(--serif);font-size:34px;font-weight:600;letter-spacing:-.01em;line-height:1.06}
.head .lede{margin:10px 0 0;color:var(--body);font-size:17px;font-weight:500;line-height:1.4;text-wrap:pretty}

/* ---------- the living specimen (real app components, real colors) ---------- */
#stage{position:relative;margin-top:12px;--c1:#6521C9;--c2:#A737C8;--cink:#6521C9;--csoft:#D2C8FF}
.pills{display:flex;gap:0;padding:0;margin:0 0 10px}
.pill{flex:1;text-align:center;padding:8px 2px;border-radius:18px;background:transparent;color:#2A2530;font-size:12px;font-weight:700;cursor:pointer;user-select:none;-webkit-user-select:none}
.pill.on{background:#fff;color:var(--cink);box-shadow:0 1px 5px rgba(0,0,0,.13)}

.row{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr) 22px;align-items:center;background:#fff;border:1px solid #efe6d6;border-radius:14px;padding:10px 10px;margin-bottom:9px;cursor:pointer;user-select:none;-webkit-user-select:none}
.row:last-child{margin-bottom:0}
.row.playing{border-color:var(--rowink);box-shadow:0 0 0 1px var(--rowink),0 4px 18px rgba(0,0,0,.04)}
.lcol{display:flex;align-items:center;justify-content:center;align-self:stretch}
.qbox{width:14px;height:14px;border:1.5px solid #c2bdc7;border-radius:3px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.qbox.on{border-color:#948f9a}
.qbox.on::after{content:'';width:4px;height:8px;border:solid #1A1620;border-width:0 2px 2px 0;transform:rotate(45deg);margin-top:-2px}
.meta{min-width:0;display:flex;flex-direction:column}
.wave-title{display:flex;align-items:center;gap:7px;min-width:0}
.row-play{width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 14px;margin-right:2px;color:var(--rowink)}
.row-triangle{width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:11px solid currentColor;margin-left:1px}
.row-pause{display:none;align-items:center;gap:3px;height:14px}
.row-pause i{width:3px;height:12px;border-radius:1px;background:currentColor}
.row.playing .row-triangle{display:none}
.row.playing .row-pause{display:flex}
.wave-title h3{font-size:17px;font-weight:600;color:#1a1620;min-width:0;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--sans)}
.row-eq{display:none;width:12px;height:12px;align-items:center;gap:2px;margin-left:2px;flex:0 0 auto}
.row-eq i{width:2px;background:var(--rowink);border-radius:2px}
.row-eq i:nth-child(1){height:6px}.row-eq i:nth-child(2){height:11px}.row-eq i:nth-child(3){height:8px}
.row.playing .row-eq{display:inline-flex}
.sic{display:flex;gap:14px;align-items:center;flex:0 0 auto;margin-left:auto}
.sic .dl,.sic .heart{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;color:#c2bdc7;cursor:pointer}
.sic .heart{font-size:16px;line-height:1}
.sic .dl.on,.sic .heart.on{color:#1A1620}
.wave-stream{margin-top:6px}
.wave{display:block;width:66%;height:32px;margin:7px 0 5px;overflow:visible}
.bubs{display:flex;align-items:baseline;gap:0;margin:2px 0 0;flex-wrap:wrap;line-height:1.1;max-height:14px;overflow:hidden}
.bub{white-space:nowrap;font-size:9.5px;font-weight:600;letter-spacing:.09em;color:#8a8390}
.sep{font-size:9.5px;color:#cfc8ba}
.botrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:5px}
.wave-band{display:flex;align-items:center;gap:5px;color:var(--rowink);font-size:11px;font-weight:700}
.wave-band i{display:block;width:7px;height:7px;border-radius:50%;background:var(--rowink)}
.wave-dur{font-size:12px;font-weight:600;color:#1A1620}
.grip{display:flex;align-items:center;justify-content:center;color:#c2bdc7;align-self:stretch}

/* ---------- the teaching finger ---------- */
#finger{position:absolute;z-index:6;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),rgba(101,33,201,.38) 62%);box-shadow:0 4px 14px rgba(56,0,122,.35);opacity:0;pointer-events:none;transition:left .8s cubic-bezier(.4,0,.2,1),top .8s cubic-bezier(.4,0,.2,1),opacity .45s ease,transform .18s ease}
#finger.press{transform:scale(.74)}
#finger::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(101,33,201,.35);opacity:0}
#finger.press::after{animation:ripple .5s ease-out}
@keyframes ripple{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.5)}}

/* ---------- narration ---------- */
#narr{margin-top:10px;min-height:40px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:16.5px;font-weight:600;color:var(--ink);line-height:1.3;transition:opacity .26s ease;text-wrap:balance;padding:0 6px}
#narr .hg{color:var(--violet)}

.gap{flex:1}

.bridge{margin:0 0 12px;color:var(--body);font-size:15.5px;font-weight:500;line-height:1.45;text-wrap:pretty}

.nextwrap{display:flex;justify-content:center}
.next{display:inline-block;padding:16px 46px;border-radius:999px;background:#fff;border:1px solid var(--hair);color:var(--violet);font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;box-shadow:0 2px 12px rgba(26,22,32,.09);cursor:pointer;transition:transform .12s ease}
.next:active{transform:scale(.96)}

@media (max-height:740px){.head{padding-top:48px}.head h2{font-size:30px}.wave{height:26px}#narr{font-size:15.5px}}
</style></head><body>
<div id="frame">
  <div id="aurora" aria-hidden="true" style="--c1:#6521C9;--c2:#A737C8;--csoft:#D2C8FF"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
  <span class="letter">W-1r</span>
  <div id="pane">

    <div class="head">
      <div class="tick"></div>
      <h2>Find Your Music</h2>
      <p class="lede">This is the Immersions tab &mdash; your music library.</p>
    </div>

    <div id="stage">
      <div class="pills" id="pills">
        <div class="pill on" data-cat="core">Core</div><div class="pill" data-cat="love">Love</div><div class="pill" data-cat="vitality">Vitality</div><div class="pill" data-cat="abundance">Abundance</div>
      </div>
      <div id="rows"></div>
      <div id="finger" aria-hidden="true"></div>
    </div>

    <div id="narr">&nbsp;</div>

    <div class="gap"></div>

    <p class="bridge">You can listen to songs at your specific frequencies in the Immersions tab, but the magic happens in the Playlist tab.</p>

    <div class="nextwrap"><a class="next" href="#" onclick="return false">Next</a></div>

  </div>
</div>

function buildRows(){
 var cat=CATS[catKey];rowsEl.innerHTML='';
 SONGS.forEach(function(s){
  var r=document.createElement('div');r.className='row';
  r.style.setProperty('--rowink',cat.cink);
  r.dataset.slug=s.slug;
  var st=SSTATE[s.slug];
  r.innerHTML='<div class="lcol"><span class="qbox'+(st.q?' on':'')+'"></span></div>'
   +'<div class="meta">'
   +'<div class="wave-title"><span class="row-play" aria-hidden="true"><span class="row-triangle"></span><span class="row-pause"><i></i><i></i></span></span><h3>'+s.name+'</h3><span class="row-eq" aria-hidden="true"><i></i><i></i><i></i></span><div class="sic"><span class="dl'+(st.dl?' on':'')+'">'+DLSVG+'</span><span class="heart'+(st.heart?' on':'')+'">'+(st.heart?'&#9829;':'&#9825;')+'</span></div></div>'
   +'<div class="wave-stream">'+waveSVG(s.slug,cat)+'</div>'
   +bubs(s)
   +'<div class="botrow"><div class="wave-band"><i></i>'+cat.label+' &middot; '+cat.hz+' Hz</div><span class="wave-dur">'+s.dur+'</span></div>'
   +'</div>'
   +'<div class="grip">'+GRIPSVG+'</div>';
  rowsEl.appendChild(r);
 });
}

function recolor(){
 var cat=CATS[catKey];
 document.querySelectorAll('#rows .row').forEach(function(r){
  r.style.setProperty('--rowink',cat.cink);
  r.querySelector('.wave-band').innerHTML='<i></i>'+cat.label+' &middot; '+cat.hz+' Hz';
  var stops=r.querySelectorAll('.wave stop');
  if(stops.length===2){stops[0].setAttribute('stop-color',cat.c2);stops[1].setAttribute('stop-color',cat.c1);}
 });
 var au=document.getElementById('aurora');
 au.style.setProperty('--c1',cat.c1);au.style.setProperty('--c2',cat.c2);au.style.setProperty('--csoft',cat.csoft);
 document.getElementById('stage').style.setProperty('--cink',cat.cink);
 document.querySelectorAll('#pills .pill').forEach(function(p){p.classList.toggle('on',p.dataset.cat===catKey);});
}
function setCat(k){if(k===catKey)return;var playing=null;document.querySelectorAll('#rows .row').forEach(function(r){if(r.classList.contains('playing'))playing=r.dataset.slug;});catKey=k;buildRows();recolor();if(playing){var pr=document.querySelector('#rows .row[data-slug="'+playing+'"]');if(pr)pr.classList.add('playing');}}

buildRows();recolor();

/* ---------- narration ---------- */
var narr=document.getElementById('narr');
function say(html){narr.style.opacity=0;setTimeout(function(){narr.innerHTML=html;narr.style.opacity=1;},260);}

/* ---------- the teaching finger ---------- */
var finger=document.getElementById('finger');
var stage=document.getElementById('stage');
function moveTo(el,dx,dy){
 var s=stage.getBoundingClientRect(),t=el.getBoundingClientRect();
 finger.style.left=(t.left-s.left+t.width/2-17+(dx||0))+'px';
 finger.style.top=(t.top-s.top+t.height/2-17+(dy||0))+'px';
}
function press(fn){finger.classList.add('press');setTimeout(function(){fn&&fn();},170);setTimeout(function(){finger.classList.remove('press');},340);}

var live=false;
function goLive(){
 live=true;finger.style.opacity=0;
 setTimeout(function(){finger.style.display='none';},500);
}

/* live interaction (after the demo, the specimen is real) */
document.getElementById('pills').addEventListener('click',function(e){
 if(!live)return;var p=e.target.closest('.pill');if(p)setCat(p.dataset.cat);
});
rowsEl.addEventListener('click',function(e){
 if(!live)return;
 var rr=e.target.closest('.row');var slug=rr?rr.dataset.slug:null;
 var h=e.target.closest('.heart');if(h){h.classList.toggle('on');var on=h.classList.contains('on');h.innerHTML=on?'&#9829;':'&#9825;';if(slug)SSTATE[slug].heart=on;return;}
 var d=e.target.closest('.dl');if(d){d.classList.toggle('on');if(slug)SSTATE[slug].dl=d.classList.contains('on');return;}
 var q=e.target.closest('.qbox');if(q){q.classList.toggle('on');if(slug)SSTATE[slug].q=q.classList.contains('on');return;}
 if(e.target.closest('.grip'))return;
 var r=e.target.closest('.row');if(!r)return;
 var was=r.classList.contains('playing');
 document.querySelectorAll('#rows .row').forEach(function(x){x.classList.remove('playing');});
 if(!was)r.classList.add('playing');
});

/* ---------- choreography ---------- */
function row1(){return document.querySelector('#rows .row');}
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduce){
 row1().classList.add('playing');
 var hh=row1().querySelector('.heart');hh.classList.add('on');hh.innerHTML='&#9829;';SSTATE[row1().dataset.slug].heart=true;
 say('Tap a song to play it. Tap &#9825; to add it to your Playlist. Now try it yourself.');
 goLive();
}else{
 setTimeout(function(){
  moveTo(row1(),-40,0);finger.style.opacity=1;
  say('Tap any song to play it.');
 },900);
 setTimeout(function(){press(function(){row1().classList.add('playing');});},2100);
 setTimeout(function(){
  say('Pick a frequency: Core, Love, Vitality, or Abundance.');
  moveTo(document.querySelector('#pills .pill[data-cat="love"]'));
 },4200);
 setTimeout(function(){press(function(){setCat('love');});},5600);
 setTimeout(function(){
  say('In Immersions, tap &#9825; to add music to Playlist.');
  moveTo(row1().querySelector('.heart'));
 },7600);
 setTimeout(function(){press(function(){var h=row1().querySelector('.heart');h.classList.add('on');h.innerHTML='&#9829;';SSTATE[row1().dataset.slug].heart=true;});},9000);
 setTimeout(function(){
  say('Now try it yourself.');
  goLive();
 },10600);
}
</script>
</body></html>
