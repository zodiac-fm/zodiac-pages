 drain your lifeforce are best identified and clarified through articulation.\n\nYour most trusted route towards choosing what truly lights you up is by journaling or putting this recognition into words.\n\nThis is also how you may identify actions which are slowly draining your energy.\n\n#### Additional paragraph from 717 Hz\n\nAt {hz} Hz, Vitality is close to the Crown Band, so you may also gain clarity on what feeds and drains you energetically by looking at the bigger picture, or seeing how it fits into a bigger system.\n\n### Crown\n\nThe actions and thoughts that feed and drain your lifeforce are best identified and clarified through seeing the big picture.\n\nYour most trusted route towards choosing what truly lights you up is by widening your lens and thinking in systems.\n\nThis is also how you may identify actions which are slowly draining your energy.\n\n\n\n## ABUNDANCE\n\n### Root\n\nRecognizing opportunities and your timing are naturally identified and clarified when you are still, steady and grounded.\n\nTrusting your gut is a real thing here, and is best when nurtured. Make time to settle in while deciding what to move on and when.\n\nManifesting is best done when grounded.\n\n#### Additional paragraph from 367 Hz\n\nAt {hz} Hz, your Abundance is close to the Solar Plexus Band, so taking one small step first may help clarify the opportunity.\n\n### Solar Plexus\n\nRecognizing opportunities and your timing are naturally identified and clarified when you take action or are in motion.\n\nPaying attention to your inner drive and creating micro actions on your opportunities will lead to a more accurate read on what to do and when.\n\nYou manifest through action and drive.\n\n#### Additional paragraph from 542 Hz\n\nAt {hz} Hz, your Abundance is close to the Throat Band, so talking or writing it out might clarify the opportunity.\n\n### Throat\n\nRecognizing opportunities and your timing are naturally identified and clarified when you can talk or write it out.\n\nArticulating verbally or through a journal will lead to a more accurate read on what to do and when.\n\nFor manifesting, the natural way is to write it out or talk it through with trusted friends and advisors.\n\n#### Additional paragraph from 717 Hz\n\nAt {hz} Hz, your Abundance is close to the Crown Band, so trying to get some perspective on the opportunity as a whole might help you gain clarity.\n\n### Crown\n\nRecognizing opportunities and your timing are more naturally identified and clarified when you widen your lens and see the bigger picture.\n\nStep back and try to see the opportunity as a whole before deciding if and when to dive in.\n\nManifesting will work best for you with mind maps, pictures and systems thinking."},{"category":"Affiliate","slug":"swipe-general-recommendation-email","title":"Affiliate swipe · General · RECOMMENDATION EMAIL","label":"Affiliate swipe · recommendation email","hasSourceH1":false,"html":"\u003cp>Subject: What if your birth pattern had a sound?\nPreheader: Explore your birth pattern through music.\u003c/p>\n\u003cp>Sponsored by Zodiac.fm. I may earn a commission if you join through my link.\u003c/p>\n\u003cp>Your birth date can tell a story. Zodiac asks whether it can also give you something to listen to.\u003c/p>\n\u003cp>The idea begins with the Vedic view that the world is sound. A mantra lineage developed a way to find frequencies in a person&#39;s birth pattern. Zodiac uses that method to derive four fixed frequencies from your birth date, time and place, then carries them through music.\u003c/p>\n\u003cp>So why listen?\u003c/p>\n\u003cp>Think of something you&#39;d be proud to put your name on. Or a relationship with room for all of you.\u003c/p>\n\u003cp>Knowing what matters to you and living from it are closely related. They&#39;re also different experiences.\u003c/p>\n\u003cp>Zodiac&#39;s premise is that music can amplify the signal connecting you to your Connected Self, the whole self that&#39;s already you rt songs in each frequency for free. No paid trial is required.\n\nIf something stopped you at the form, reply and tell us where you got stuck. We can help you find the right next step.\n\nTeam Zodiac","copyText":"**Subject:** Your birth details are saved\n\n**Preheader:** Pick up where you left off and find your four frequencies.\n\nHi {{given_name}},\n\nYou can finish entering your birth details here:\n\n[Finish my birth details]({{resume_birth_details_url}})\n\nZodiac uses your date, time and place of birth to find four personal frequencies, then brings those frequencies into music.\n\nOnce your results are ready, you can hear three short songs in each frequency for free. No paid trial is required.\n\nIf something stopped you at the form, reply and tell us where you got stuck. We can help you find the right next step.\n\nTeam Zodiac"},{"category":"Emails","slug":"funnel-e02","title":"E02 · Why birth details matter","label":"Review email · E02","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Why Zodiac asks when and where you were born\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Those details are how we find the frequencies in your music.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>Your birth details determine the frequencies in your Zodiac music. That is why we ask for the time and place as well as the date.\u003c/p>\n\u003cp>The method comes from a mantra lineage within the Vedic tradition. It begins with Nāda Brahma, the idea that reality is sound, and finds a sound pattern from the moment of your birth.\u003c/p>\n\u003cp>Zodiac takes the frequency part of that method and puts it into music. Your four frequencies stay the same as your life changes.\u003c/p>\n\u003cp>You do not have to study the tradition to try listening. But you should know where the idea comes from, rather than being asked to accept a number without an explanation.\u003c/p>\n\u003cp>If you are unsure about a birth detail, reply before guessing. We can help you understand what the form needs.\u003c/p>\n\u003cp>Return to my birth details — Review placeholder: \u003ccode>{{resume_birth_details_url}}\u003c/code>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n","text":"Subject: Why Zodiac asks when and where you were born\n\nPreheader: Those details are how we find the frequencies in your music.\n\nHi {{givenname}},\n\nYour birth details determine the frequencies in your Zodiac music. That is why we ask for the time and place as well as the date.\n\nThe method comes from a mantra lineage within the Vedic tradition. It begins with Nāda Brahma, the idea that reality is sound, and finds a sound pattern from the moment of your birth.\n\nZodiac takes the frequency part of that method and puts it into music. Your four frequencies stay the same as your life changes.\n\nYou do not have to study the tradition to try listening. But you should know where the idea comes from, rather than being asked to accept a number without an explanation.\n\nIf you are unsure about a birth detail, reply before guessing. We can help you understand what the form needs.\n\nReturn to my birth details — Review placeholder: {{resumebirthdetailsurl}}\n\nTeam Zodiac","copyText":"**Subject:** Why Zodiac asks when and where you were born\n\n**Preheader:** Those details are how we find the frequencies in your music.\n\nHi {{given_name}},\n\nYour birth details determine the frequencies in your Zodiac music. That is why we ask for the time and place as well as the date.\n\nThe method comes from a mantra lineage within the Vedic tradition. It begins with Nāda Brahma, the idea that reality is sound, and finds a sound pattern from the moment of your birth.\n\nZodiac takes the frequency part of that method and puts it into music. Your four frequencies stay the same as your life changes.\n\nYou do not have to study the tradition to try listening. But you should know where the idea comes from, rather than being asked to accept a number without an explanation.\n\nIf you are unsure about a birth detail, reply before guessing. We can help you understand what the form needs.\n\n[Return to my birth details]({{resume_birth_details_url}})\n\nTeam Zodiac"},{"category":"Emails","slug":"funnel-e03","title":"E03 · Your results","label":"Review email · E03","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Your four Zodiac frequencies\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Your results are ready, with music you can try for free.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>Your Zodiac results are ready:\u003c/p>\n\u003cp>See my frequencies — Review placeholder: \u003ccode>{{personal_results_url}}\u003c/code>\u003c/p>\n\u003cp>You will find your four frequencies: Core, Love, Vitality and Abundance. They come from your birth details and are fixed. They do not change with the daily movement of the planets.\u003c/p>\n\u003cp>The music gives you a way to explore those frequencies through listening. Three short songs in each frequency are yours to keep using for free, whether or not you ever become a paid member.\u003c/p>\n\u003cp>Choose a track you like. Put it on while you walk or make dinner, or listen during meditation if that is part of your practice.\u003c/p>\n\u003cp>There is no particular feeling you have to produce. Start with the music, then see what you notice in your own life.\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n","text":"Subject: Your four Zodiac frequencies\n\nPreheader: Your results are ready, with music you can try for free.\n\nHi {{givenname}},\n\nYour Zodiac results are ready:\n\nSee my frequencies — Review placeholder: {{personalresultsurl}}\n\nYou will find your four frequencies: Core, Love, Vitality and Abundance. They come from your birth details and are fixed. They do not change with the daily movement of the planets.\n\nThe music gives you a way to explore those frequencies through listening. Three short songs in each frequency are yours to keep using for free, whether or not you ever become a paid member.\n\nChoose a track you like. Put it on while you walk or make dinner, or listen during meditation if that is part of your practice.\n\nThere is no particular feeling you have to produce. Start with the music, then see what you notice in your own life.\n\nTeam Zodiac","copyText":"**Subject:** Your four Zodiac frequencies\n\n**Preheader:** Your results are ready, with music you can try for free.\n\nHi {{given_name}},\n\nYour Zodiac results are ready:\n\n[See my frequencies]({{personal_results_url}})\n\nYou will find your four frequencies: Core, Love, Vitality and Abundance. They come from your birth details and are fixed. They do not change with the daily movement of the planets.\n\nThe music gives you a way to explore those frequencies through listening. Three short songs in each frequency are yours to keep using for free, whether or not you ever become a paid member.\n\nChoose a track you like. Put it on while you walk or make dinner, or listen during meditation if that is part of your practice.\n\nThere is no particular feeling you have to produce. Start with the music, then see what you notice in your own life.\n\nTeam Zodiac"},{"category":"Emails","slug":"funnel-e04","title":"E04 · Recognition through sound","label":"Review email · E04","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> When a reading feels like someone knows you\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Zodiac explores that recognition through music.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>Have you ever read a description of yourself and felt that someone had found words for something you already knew?\u003c/p>\n\u003cp>That recognition is part of what drew us to Zodiac. We wanted to explore whether the pattern described by a reading could also be experienced through sound.\u003c/p>\n\u003cp>Zehra Ashary, a Kundalini practitioner in London and a member of the Zodiac.fm team, put her experience this way:\u003c/p>\n\u003cp>“It lets you finally feel the parts of yourself you have only ever read about.”\u003c/p>\n\u003cp>Zehra is describing her own experience, which leaves you room to discover what the music means in your life.\u003c/p>\n\u003cp>Zodiac carries your four birth frequencies through music. The idea is to amplify your signal, your connection to what we call the connected self. The self is already whole.\u003c/p>\n\u003cp>Your free songs let you explore the idea without buying a subscription. Choose music you enjoy and include each of your four frequencies as you return to listen.\u003c/p>\n\u003cp>Return to my frequencies — Review placeholder: \u003ccode>{{personal_results_url}}\u003c/code>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n","text":"Subject: When a reading feels like someone knows you\n\nPreheader: Zodiac explores that recognition through music.\n\nHi {{givenname}},\n\nHave you ever read a description of yourself and felt that someone had found words for something you already knew?\n\nThat recognition is part of what drew us to Zodiac. We wanted to explore whether the pattern described by a reading could also be experienced through sound.\n\nZehra Ashary, a Kundalini practitioner in London and a member of the Zodiac.fm team, put her experience this way:\n\n“It lets you finally feel the parts of yourself you have only ever read about.”\n\nZehra is describing her own experience, which leaves you room to discover what the music means in your life.\n\nZodiac carries your four birth frequencies through music. The idea is to amplify your signal, your connection to what we call the connected self. The self is already whole.\n\nYour free songs let you explore the idea without buying a subscription. Choose music you enjoy and include each of your four frequencies as you return to listen.\n\nReturn to my frequencies — Review placeholder: {{personalresultsurl}}\n\nTeam Zodiac","copyText":"**Subject:** When a reading feels like someone knows you\n\n**Preheader:** Zodiac explores that recognition through music.\n\nHi {{given_name}},\n\nHave you ever read a description of yourself and felt that someone had found words for something you already knew?\n\nThat recognition is part of what drew us to Zodiac. We wanted to explore whether the pattern described by a reading could also be experienced through sound.\n\nZehra Ashary, a Kundalini practitioner in London and a member of the Zodiac.fm team, put her experience this way:\n\n“It lets you finally feel the parts of yourself you have only ever read about.”\n\nZehra is describing her own experience, which leaves you room to discover what the music means in your life.\n\nZodiac carries your four birth frequencies through music. The idea is to amplify your signal, your connection to what we call the connected self. The self is already whole.\n\nYour free songs let you explore the idea without buying a subscription. Choose music you enjoy and include each of your four frequencies as you return to listen.\n\n[Return to my frequencies]({{personal_results_url}})\n\nTeam Zodiac"},{"category":"Emails","slug":"funnel-e05","title":"E05 · Eligible never-paid offer","label":"Review email · E05","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Try all your Zodiac music for $3\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Seven days, with a choice of monthly or annual membership afterward.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>You can try the full Zodiac music library for $3 for seven days.\u003c/p>\n\u003cp>Alongside the short songs you already have, membership includes longer tracks for the times you want to keep listening. All four of your personal frequencies are included.\u003c/p>\n\u003cp>Choose the plan you want after the trial:\u003c/p>\n\u003cul>\n\u003cli>Annual membership works out to $7.33 a month, billed at $88 a year.\u003c/li>\n\u003cli>Monthly membership is $14 a month.\u003c/li>\n\u003c/ul>\n\u003cp>Your selected plan starts billing after the seven days unless you cancel before the renewal date shown at checkout. The $3 trial payment is not refundable.\u003c/p>\n\u003cp>If you decide to cancel, your three short songs in each frequency remain free. There is no need to start over with a different account.\u003c/p>\n\u003cp>Choose my seven-day trial — Review placeholder: \u003ccode>{{eligible_email_offer_url}}\u003c/code>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n","text":"Subject: Try all your Zodiac music for $3\n\nPreheader: Seven days, with a choice of monthly or annual membership afterward.\n\nHi {{givenname}},\n\nYou can try the full Zodiac music library for $3 for seven days.\n\nAlongside the short songs you already have, membership includes longer tracks for the times you want to keep listening. All four of your personal frequencies are included.\n\nChoose the plan you want after the trial:\n\n- Annual membership works out to $7.33 a month, billed at $88 a year.\n- Monthly membership is $14 a month.\n\nYour selected plan starts billing after the seven days unless you cancel before the renewal date shown at checkout. The $3 trial payment is not refundable.\n\nIf you decide to cancel, your three short songs in each frequency remain free. There is no need to start over with a different account.\n\nChoose my seven-day trial — Review placeholder: {{eligibleemailofferurl}}\n\nTeam Zodiac","copyText":"**Subject:** Try all your Zodiac music for $3\n\n**Preheader:** Seven days, with a choice of monthly or annual membership afterward.\n\nHi {{given_name}},\n\nYou can try the full Zodiac music library for $3 for seven days.\n\nAlongside the short songs you already have, membership includes longer tracks for the times you want to keep listening. All four of your personal frequencies are included.\n\nChoose the plan you want after the trial:\n\n- Annual membership works out to $7.33 a month, billed at $88 a year.\n- Monthly membership is $14 a month.\n\nYour selected plan starts billing after the seven days unless you cancel before the renewal date shown at checkout. The $3 trial payment is not refundable.\n\nIf you decide to cancel, your three short songs in each frequency remain free. There is no need to start over with a different account.\n\n[Choose my seven-day trial]({{eligible_email_offer_url}})\n\nTeam Zodiac"},{"category":"Emails","slug":"funnel-e06","title":"E06 · Resume checkout","label":"Review email · E06","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Need a hand finishing your Zodiac membership?\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Return to the plan you selected, or reply if something went wrong.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>You can return to your unfinished Zodiac checkout here:\u003c/p>\n\u003cp>Return to my checkout — Review placeholder: \u003ccode>{{resume_checkout_url}}\u003c/code>\u003c/p>\n\u003cp>Here is the offer you selected:\u003c/p>\n\u003cp>{{checkout_offer_summary}}\u003c/p>\n\u003cp>If something failed or a charge looks wrong, reply and tell us what happened before trying again. Please do not send card details by email.\u003c/p>\n\u003cp>If you decided to wait, your free songs remain available in the same account.\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n","text":"Subject: Need a hand finishing your Zodiac membership?\n\nPreheader: Return to the plan you selected, or reply if something went wrong.\n\nHi {{givenname}},\n\nYou can return to your unfinished Zodiac checkout here:\n\nReturn to my checkout — Review placeholder: {{resumecheckouturl}}\n\nHere is the offer you selected:\n\n{{checkoutoffersummary}}\n\nIf something failed or a charge looks wrong, reply and tell us what happened before trying again. Please do not send card details by email.\n\nIf you decided to wait, your free songs remain available in the same account.\n\nTeam Zodiac","copyText":"**Subject:** Need a hand finishing your Zodiac membership?\n\n**Preheader:** Return to the plan you selected, or reply if something went wrong.\n\nHi {{given_name}},\n\nYou can return to your unfinished Zodiac checkout here:\n\n[Return to my checkout]({{resume_checkout_url}})\n\nHere is the offer you selected:\n\n{{checkout_offer_summary}}\n\nIf something failed or a charge looks wrong, reply and tell us what happened before trying again. Please do not send card details by email.\n\nIf you decided to wait, your free songs remain available in the same account.\n\nTeam Zodiac"},{"category":"Emails","slug":"funnel-e07-a","title":"E07-A · Free trial account confirmation","label":"Review email · E07-A","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Your seven-day Zodiac trial has started\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Your selected plan, first billing date and account details.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>Your free seven-day Zodiac trial is active, with the full music library available in all four of your frequencies.\u003c/p>\n\u003cp>Account email: {{account_email}}\nSelected plan: {{plan_name}}\nFirst subscription charge: {{next_charge_amount_with_currency}}\nCharge date: {{next_charge_date_with_timezone}}\nAfter that: {{renewal_amount_and_interval}}\u003c/p>\n\u003cp>If you want to stop the subscription from starting, cancel before that charge date:\u003c/p>\n\u003cp>Manage my membership — Review placeholder: \u003ccode>{{manage_membership_url}}\u003c/code>\u003c/p>\n\u003cp>You can listen on a desktop or laptop at \u003ca href=\"https://app.zodiac.fm\" target=\"_blank\" rel=\"noopener noreferrer\">app.zodiac.fm\u003c/a>. On your phone, use the Zodiac app for \u003ca href=\"https://apps.apple.com/us/app/zodiacfm/id6764863619\" target=\"_blank\" rel=\"noopener noreferrer\">iPhone\u003c/a> or \u003ca href=\"https://play.google.com/store/apps/details?id=fm.zodiac.app\" target=\"_blank\" rel=\"noopener noreferrer\">Android\u003c/a>, signing in with the same account email.\u003c/p>\n\u003cp>Your payment receipt, if applicable, comes separately from your payment provider. Reply here if you need help accessing your music.\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n","text":"Subject: Your seven-day Zodiac trial has started\n\nPreheader: Your selected plan, first billing date and account details.\n\nHi {{givenname}},\n\nYour free seven-day Zodiac trial is active, with the full music library available in all four of your frequencies.\n\nAccount email: {{accountemail}}\nSelected plan: {{planname}}\nFirst subscription charge: {{nextchargeamountwithcurrency}}\nCharge date: {{nextchargedatewithtimezone}}\nAfter that: {{renewalamountandinterval}}\n\nIf you want to stop the subscription from starting, cancel before that charge date:\n\nManage my membership — Review placeholder: {{managemembershipurl}}\n\nYou can listen on a desktop or laptop at app.zodiac.fm. On your phone, use the Zodiac app for iPhone or Android, signing in with the same account email.\n\nYour payment receipt, if applicable, comes separately from your payment provider. Reply here if you need help accessing your music.\n\nTeam Zodiac","copyText":"**Subject:** Your seven-day Zodiac trial has started\n\n**Preheader:** Your selected plan, first billing date and account details.\n\nHi {{given_name}},\n\nYour free seven-day Zodiac trial is active, with the full music library available in all four of your frequencies.\n\nAccount email: {{account_email}}\nSelected plan: {{plan_name}}\nFirst subscription charge: {{next_charge_amount_with_currency}}\nCharge date: {{next_charge_date_with_timezone}}\nAfter that: {{renewal_amount_and_interval}}\n\nIf you want to stop the subscription from starting, cancel before that charge date:\n\n[Manage my membership]({{manage_membership_url}})\n\nYou can listen on a desktop or laptop at [app.zodiac.fm](https://app.zodiac.fm). On your phone, use the Zodiac app for [iPhone](https://apps.apple.com/us/app/zodiacfm/id6764863619) or [Android](https://play.google.com/store/apps/details?id=fm.zodiac.app), signing in with the same account email.\n\nYour payment receipt, if applicable, comes separately from your payment provider. Reply here if you need help accessing your music.\n\nTeam Zodiac"},{"category":"Emails","slug":"funnel-e07-b","title":"E07-B · Paid trial account confirmation","label":"Review email · E07-B","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Your seven-day Zodiac trial is active\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Your trial payment and the plan you chose afterward.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>Your seven-day Zodiac trial is active. Your trial payment was {{trial_fee_with_currency}}. The full music library is now available in all four of your frequencies.\u003c/p>\n\u003cp>Account email: {{account_email}}\nSelected plan: {{plan_name}}\nFirst subscription charge: {{next_charge_amount_with_currency}}\nCharge date: {{next_charge_date_with_timezone}}\nAfter that: {{renewal_amount_and_interval}}\u003c/p>\n\u003cp>Cancel before that charge date if you do not want the subscription to begin. The trial payment is not refundable.\u003c/p>\n\u003cp>Manage my membership — Review placeholder: \u003ccode>{{manage_membership_url}}\u003c/code>\u003c/p>\n\u003cp>For desktop or laptop listening, sign in at \u003ca href=\"https://app.zodiac.fm\" target=\"_blank\" rel=\"noopener noreferrer\">app.zodiac.fm\u003c/a>. On your phone, use Zodiac for \u003ca href=\"https://apps.apple.com/us/app/zodiacfm/id6764863619\" target=\"_blank\" rel=\"noopener noreferrer\">iPhone\u003c/a> or \u003ca href=\"https://play.google.com/store/apps/details?id=fm.zodiac.app\" target=\"_blank\" rel=\"noopener noreferrer\">Android\u003c/a>, signing in with the same account email.\u003c/p>\n\u003cp>Your payment provider sends the receipt. You can reply to us here for help with your account or music.\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n","text":"Subject: Your seven-day Zodiac trial is active\n\nPreheader: Your trial payment and the plan you chose afterward.\n\nHi {{givenname}},\n\nYour seven-day Zodiac trial is active. Your trial payment was {{trialfeewithcurrency}}. The full music library is now available in all four of your frequencies.\n\nAccount email: {{accountemail}}\nSelected plan: {{planname}}\nFirst subscription charge: {{nextchargeamountwithcurrency}}\nCharge date: {{nextchargedatewithtimezone}}\nAfter that: {{renewalamountandinterval}}\n\nCancel before that charge date if you do not want the subscription to begin. The trial payment is not refundable.\n\nManage my membership — Review placeholder: {{managemembershipurl}}\n\nFor desktop or laptop listening, sign in at app.zodiac.fm. On your phone, use Zodiac for iPhone or Android, signing in with the same account email.\n\nYour payment provider sends the receipt. You can reply to us here for help with your account or music.\n\nTeam Zodiac","copyText":"**Subject:** Your seven-day Zodiac trial is active\n\n**Preheader:** Your trial payment and the plan you chose afterward.\n\nHi {{given_name}},\n\nYour seven-day Zodiac trial is active. Your trial payment was {{trial_fee_with_currency}}. The full music library is now available in all four of your frequencies.\n\nAccount email: {{account_email}}\nSelected plan: {{plan_name}}\nFirst subscription charge: {{next_charge_amount_with_currency}}\nCharge date: {{next_charge_date_with_timezone}}\nAfter that: {{renewal_amount_and_interval}}\n\nCancel before that charge date if you do not want the subscription to begin. The trial payment is not refundable.\n\n[Manage my membership]({{manage_membership_url}})\n\nFor desktop or laptop listening, sign in at [app.zodiac.fm](https://app.zodiac.fm). On your phone, use Zodiac for [iPhone](https://apps.apple.com/us/app/zodiacfm/id6764863619) or [Android](https://play.google.com/store/apps/details?id=fm.zodiac.app), signing in with the same account email.\n\nYour payment provider sends the receipt. You can reply to us here for help with your account or music.\n\nTeam Zodiac"},{"category":"Emails","slug":"funnel-e08","title":"E08 · First-listen help","label":"Review email · E08","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Let’s get your first Zodiac track playing\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Use the email you signed up with, wherever you listen.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>If getting into your account has held you up, start with the email you used to join Zodiac:\u003c/p>\n\u003cp>{{account_email}}\u003c/p>\n\u003cp>Use that same email in the app, even if you bought your membership on the website. If you cannot remember your password, choose the email-code login option and have a code sent to your inbox.\u003c/p>\n\u003cp>On your phone, open Zodiac for \u003ca href=\"https://apps.apple.com/us/app/zodiacfm/id6764863619\" target=\"_blank\" rel=\"noopener noreferrer\">iPhone\u003c/a> or \u003ca href=\"https://play.google.com/store/apps/details?id=fm.zodiac.app\" target=\"_blank\" rel=\"noopener noreferrer\">Android\u003c/a>. On a desktop or laptop:\u003c/p>\n\u003cp>\u003ca href=\"https://app.zodiac.fm\" target=\"_blank\" rel=\"noopener noreferrer\">Open Zodiac on my computer\u003c/a>\u003c/p>\n\u003cp>Choose a song you like and start listening at a comfortable volume, through good headphones or a suitable speaker. There is no special state you need to get into first.\u003c/p>\n\u003cp>Still stuck? Reply and tell us what you see. We would rather help you get started than leave you trying the same thing again.\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n","text":"Subject: Let’s get your first Zodiac track playing\n\nPreheader: Use the email you signed up with, wherever you listen.\n\nHi {{givenname}},\n\nIf getting into your account has held you up, start with the email you used to join Zodiac:\n\n{{accountemail}}\n\nUse that same email in the app, even if you bought your membership on the website. If you cannot remember your password, choose the email-code login option and have a code sent to your inbox.\n\nOn your phone, open Zodiac for iPhone or Android. On a desktop or laptop:\n\nOpen Zodiac on my computer\n\nChoose a song you like and start listening at a comfortable volume, through good headphones or a suitable speaker. There is no special state you need to get into first.\n\nStill stuck? Reply and tell us what you see. We would rather help you get started than leave you trying the same thing again.\n\nTeam Zodiac","copyText":"**Subject:** Let’s get your first Zodiac track playing\n\n**Preheader:** Use the email you signed up with, wherever you listen.\n\nHi {{given_name}},\n\nIf getting into your account has held you up, start with the email you used to join Zodiac:\n\n{{account_email}}\n\nUse that same email in the app, even if you bought your membership on the website. If you cannot remember your password, choose the email-code login option and have a code sent to your inbox.\n\nOn your phone, open Zodiac for [iPhone](https://apps.apple.com/us/app/zodiacfm/id6764863619) or [Android](https://play.google.com/store/apps/details?id=fm.zodiac.app). On a desktop or laptop:\n\n[Open Zodiac on my computer](https://app.zodiac.fm)\n\nChoose a song you like and start listening at a comfortable volume, through good headphones or a suitable speaker. There is no special state you need to get into first.\n\nStill stuck? Reply and tell us what you see. We would rather help you get started than leave you trying the same thing again.\n\nTeam Zodiac"},{"category":"Emails","slug":"funnel-e09","title":"E09 · After the first listen","label":"Review email · E09","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Give all four frequencies some time\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> A useful way to keep listening without making it a project.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>Now that you have started listening, the next step is to find where the music fits in your day.\u003c/p>\n\u003cp>It might be during a walk, while you work on something familiar, or when you have a little time to yourself. Pick a place in your day you will want to return to.\u003c/p>\n\u003cp>Across the week, include Core, Love, Vitality and Abundance. Aim for at least nine minutes a day on average, with at least fifteen percent of your weekly listening in each frequency. You do not need a perfect daily streak or four identical sessions.\u003c/p>\n\u003cp>Those are the listening conditions used in our internal product study. They are a practical starting point, not a promise of a particular result.\u003c/p>\n\u003cp>You may enjoy a track without noticing anything else while it plays. Pay attention to ordinary life too, including how you meet a decision or respond to someone you care about. There is no need to manufacture an experience.\u003c/p>\n\u003cp>\u003ca href=\"#how-to-listen\">Read the listening guide\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n","text":"Subject: Give all four frequencies some time\n\nPreheader: A useful way to keep listening without making it a project.\n\nHi {{givenname}},\n\nNow that you have started listening, the next step is to find where the music fits in your day.\n\nIt might be during a walk, while you work on something familiar, or when you have a little time to yourself. Pick a place in your day you will want to return to.\n\nAcross the week, include Core, Love, Vitality and Abundance. Aim for at least nine minutes a day on average, with at least fifteen percent of your weekly listening in each frequency. You do not need a perfect daily streak or four identical sessions.\n\nThose are the listening conditions used in our internal product study. They are a practical starting point, not a promise of a particular result.\n\nYou may enjoy a track without noticing anything else while it plays. Pay attention to ordinary life too, including how you meet a decision or respond to someone you care about. There is no need to manufacture an experience.\n\nRead the listening guide\n\nTeam Zodiac","copyText":"**Subject:** Give all four frequencies some time\n\n**Preheader:** A useful way to keep listening without making it a project.\n\nHi {{given_name}},\n\nNow that you have started listening, the next step is to find where the music fits in your day.\n\nIt might be during a walk, while you work on something familiar, or when you have a little time to yourself. Pick a place in your day you will want to return to.\n\nAcross the week, include Core, Love, Vitality and Abundance. Aim for at least nine minutes a day on average, with at least fifteen percent of your weekly listening in each frequency. You do not need a perfect daily streak or four identical sessions.\n\nThose are the listening conditions used in our internal product study. They are a practical starting point, not a promise of a particular result.\n\nYou may enjoy a track without noticing anything else while it plays. Pay attention to ordinary life too, including how you meet a decision or respond to someone you care about. There is no need to manufacture an experience.\n\n[Read the listening guide]({{article_01_listening}})\n\nTeam Zodiac"},{"category":"Emails","slug":"funnel-e10","title":"E10 · Listening in ordinary life","label":"Review email · E10","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> What you notice may happen after the music stops\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Give your own experience room to be different.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>It is natural to wonder what you should feel while listening to Zodiac.\u003c/p>\n\u003cp>There is no single answer. Some people describe a feeling in the music. Others become interested in something they notice later, in a conversation or in how they approach a choice.\u003c/p>\n\u003cp>Katie Wells, founder of Wellness Mama, described her own experience this way:\u003c/p>\n\u003cp>“Listening to my frequency immersion feels like coming home to myself.”\u003c/p>\n\u003cp>You do not need to reproduce her experience for your listening to be worth exploring.\u003c/p>\n\u003cp>Our premise is that the music amplifies your signal, your connection to the connected self. We are interested in how that connection becomes part of your life, as you meet people, make decisions and pursue things that matter to you.\u003c/p>\n\u003cp>Keep listening to music you enjoy across all four frequencies. Notice what you actually notice. If you have questions, you can reply to us without having to report a breakthrough.\u003c/p>\n\u003cp>\u003ca href=\"#what-to-expect\">Read what to expect\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n","text":"Subject: What you notice may happen after the music stops\n\nPreheader: Give your own experience room to be different.\n\nHi {{givenname}},\n\nIt is natural to wonder what you should feel while listening to Zodiac.\n\nThere is no single answer. Some people describe a feeling in the music. Others become interested in something they notice later, in a conversation or in how they approach a choice.\n\nKatie Wells, founder of Wellness Mama, described her own experience this way:\n\n“Listening to my frequency immersion feels like coming home to myself.”\n\nYou do not need to reproduce her experience for your listening to be worth exploring.\n\nOur premise is that the music amplifies your signal, your connection to the connected self. We are interested in how that connection becomes part of your life, as you meet people, make decisions and pursue things that matter to you.\n\nKeep listening to music you enjoy across all four frequencies. Notice what you actually notice. If you have questions, you can reply to us without having to report a breakthrough.\n\nRead what to expect\n\nTeam Zodiac","copyText":"**Subject:** What you notice may happen after the music stops\n\n**Preheader:** Give your own experience room to be different.\n\nHi {{given_name}},\n\nIt is natural to wonder what you should feel while listening to Zodiac.\n\nThere is no single answer. Some people describe a feeling in the music. Others become interested in something they notice later, in a conversation or in how they approach a choice.\n\nKatie Wells, founder of Wellness Mama, described her own experience this way:\n\n“Listening to my frequency immersion feels like coming home to myself.”\n\nYou do not need to reproduce her experience for your listening to be worth exploring.\n\nOur premise is that the music amplifies your signal, your connection to the connected self. We are interested in how that connection becomes part of your life, as you meet people, make decisions and pursue things that matter to you.\n\nKeep listening to music you enjoy across all four frequencies. Notice what you actually notice. If you have questions, you can reply to us without having to report a breakthrough.\n\n[Read what to expect]({{article_06_expectations}})\n\nTeam Zodiac"},{"category":"Emails","slug":"funnel-e11","title":"E11 · Trial-ending notice","label":"Review email · E11","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Your Zodiac trial ends on {{trial_end_date}}\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Your next charge is {{next_charge_amount_with_currency}}. Review your membership here.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>Your Zodiac trial ends on {{trial_end_date_with_timezone}}.\u003c/p>\n\u003cp>Your {{plan_name}} membership is set to begin with a charge of {{next_charge_amount_with_currency}} on {{next_charge_date_with_timezone}}. It then renews for {{renewal_amount_and_interval}} unless you cancel.\u003c/p>\n\u003cp>There is nothing you need to do to continue. To stop that charge, cancel through your membership settings by {{cancellation_deadline_with_timezone}}:\u003c/p>\n\u003cp>{{provider_specific_refund_sentence}}\u003c/p>\n\u003cp>Manage my membership — Review placeholder: \u003ccode>{{manage_membership_url}}\u003c/code>\u003c/p>\n\u003cp>{{verified_cancellation_access_sentence}}\u003c/p>\n\u003cp>Your three short songs in each frequency remain free after full-library access ends.\u003c/p>\n\u003cp>Reply if you need help finding the right account settings.\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n","text":"Subject: Your Zodiac trial ends on {{trialenddate}}\n\nPreheader: Your next charge is {{nextchargeamountwithcurrency}}. Review your membership here.\n\nHi {{givenname}},\n\nYour Zodiac trial ends on {{trialenddatewithtimezone}}.\n\nYour {{planname}} membership is set to begin with a charge of {{nextchargeamountwithcurrency}} on {{nextchargedatewithtimezone}}. It then renews for {{renewalamountandinterval}} unless you cancel.\n\nThere is nothing you need to do to continue. To stop that charge, cancel through your membership settings by {{cancellationdeadlinewithtimezone}}:\n\n{{providerspecificrefundsentence}}\n\nManage my membership — Review placeholder: {{managemembershipurl}}\n\n{{verifiedcancellationaccesssentence}}\n\nYour three short songs in each frequency remain free after full-library access ends.\n\nReply if you need help finding the right account settings.\n\nTeam Zodiac","copyText":"**Subject:** Your Zodiac trial ends on {{trial_end_date}}\n\n**Preheader:** Your next charge is {{next_charge_amount_with_currency}}. Review your membership here.\n\nHi {{given_name}},\n\nYour Zodiac trial ends on {{trial_end_date_with_timezone}}.\n\nYour {{plan_name}} membership is set to begin with a charge of {{next_charge_amount_with_currency}} on {{next_charge_date_with_timezone}}. It then renews for {{renewal_amount_and_interval}} unless you cancel.\n\nThere is nothing you need to do to continue. To stop that charge, cancel through your membership settings by {{cancellation_deadline_with_timezone}}:\n\n{{provider_specific_refund_sentence}}\n\n[Manage my membership]({{manage_membership_url}})\n\n{{verified_cancellation_access_sentence}}\n\nYour three short songs in each frequency remain free after full-library access ends.\n\nReply if you need help finding the right account settings.\n\nTeam Zodiac"},{"category":"Emails","slug":"funnel-e12","title":"E12 · First full paid conversion","label":"Review email · E12","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Keep listening. Your Zodiac membership is active.\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Your music stays in the same account.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>Your Zodiac membership is now active, and your access to the full music library continues.\u003c/p>\n\u003cp>Use the same account you have been listening with. There is nothing to set up again.\u003c/p>\n\u003cp>As you keep going, give each of your four frequencies time. The music can fit around things you already do, so listening does not need to become another task to keep up with.\u003c/p>\n\u003cp>We will send you occasional ideas for exploring the music and the premise behind it. You can take what is useful and let your own experience lead.\u003c/p>\n\u003cp>\u003ca href=\"#four-frequencies\">Read the guide to all four frequencies\u003c/a>\u003c/p>\n\u003cp>Your payment provider sends the receipt, and you can review your membership through your account settings — Review placeholder: \u003ccode>{{manage_membership_url}}\u003c/code>.\u003c/p>\n\u003cp>Thanks for continuing with us.\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n","text":"Subject: Keep listening. Your Zodiac membership is active.\n\nPreheader: Your music stays in the same account.\n\nHi {{givenname}},\n\nYour Zodiac membership is now active, and your access to the full music library continues.\n\nUse the same account you have been listening with. There is nothing to set up again.\n\nAs you keep going, give each of your four frequencies time. The music can fit around things you already do, so listening does not need to become another task to keep up with.\n\nWe will send you occasional ideas for exploring the music and the premise behind it. You can take what is useful and let your own experience lead.\n\nRead the guide to all four frequencies\n\nYour payment provider sends the receipt, and you can review your membership through your account settings — Review placeholder: {{managemembershipurl}}.\n\nThanks for continuing with us.\n\nTeam Zodiac","copyText":"**Subject:** Keep listening. Your Zodiac membership is active.\n\n**Preheader:** Your music stays in the same account.\n\nHi {{given_name}},\n\nYour Zodiac membership is now active, and your access to the full music library continues.\n\nUse the same account you have been listening with. There is nothing to set up again.\n\nAs you keep going, give each of your four frequencies time. The music can fit around things you already do, so listening does not need to become another task to keep up with.\n\nWe will send you occasional ideas for exploring the music and the premise behind it. You can take what is useful and let your own experience lead.\n\n[Read the guide to all four frequencies]({{article_04_four_frequencies}})\n\nYour payment provider sends the receipt, and you can review your membership through [your account settings]({{manage_membership_url}}).\n\nThanks for continuing with us.\n\nTeam Zodiac"},{"category":"Emails","slug":"funnel-e13","title":"E13 · Cancellation confirmation","label":"Review email · E13","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Your Zodiac renewal is canceled\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Your full-library access continues until {{access_end_date}}.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>Your Zodiac renewal is canceled. There will be no further subscription renewal charges for this membership unless you choose to restart it.\u003c/p>\n\u003cp>Your full-library access continues until {{access_end_date_with_timezone}}. You can keep listening during that time.\u003c/p>\n\u003cp>Afterward, three short songs in each of your four frequencies remain available for free in the same account.\u003c/p>\n\u003cp>View my membership — Review placeholder: \u003ccode>{{manage_membership_url}}\u003c/code>\u003c/p>\n\u003cp>If you would like to tell us why you canceled, reply here. If there was a problem with the app or your account, we would like to know that too.\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n","text":"Subject: Your Zodiac renewal is canceled\n\nPreheader: Your full-library access continues until {{accessenddate}}.\n\nHi {{givenname}},\n\nYour Zodiac renewal is canceled. There will be no further subscription renewal charges for this membership unless you choose to restart it.\n\nYour full-library access continues until {{accessenddatewithtimezone}}. You can keep listening during that time.\n\nAfterward, three short songs in each of your four frequencies remain available for free in the same account.\n\nView my membership — Review placeholder: {{managemembershipurl}}\n\nIf you would like to tell us why you canceled, reply here. If there was a problem with the app or your account, we would like to know that too.\n\nTeam Zodiac","copyText":"**Subject:** Your Zodiac renewal is canceled\n\n**Preheader:** Your full-library access continues until {{access_end_date}}.\n\nHi {{given_name}},\n\nYour Zodiac renewal is canceled. There will be no further subscription renewal charges for this membership unless you choose to restart it.\n\nYour full-library access continues until {{access_end_date_with_timezone}}. You can keep listening during that time.\n\nAfterward, three short songs in each of your four frequencies remain available for free in the same account.\n\n[View my membership]({{manage_membership_url}})\n\nIf you would like to tell us why you canceled, reply here. If there was a problem with the app or your account, we would like to know that too.\n\nTeam Zodiac"},{"category":"Emails","slug":"funnel-e14","title":"E14 · Full access ended","label":"Review email · E14","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Your free Zodiac songs are still yours to use\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Three short songs in each frequency remain in your account.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>Your full-library Zodiac access has ended. You still have three short songs in each of your four frequencies, free, in the same account.\u003c/p>\n\u003cp>You can keep listening in the Zodiac app or on your desktop or laptop:\u003c/p>\n\u003cp>\u003ca href=\"https://app.zodiac.fm\" target=\"_blank\" rel=\"noopener noreferrer\">Listen on my computer\u003c/a>\u003c/p>\n\u003cp>Use your usual account email, {{account_email}}. There is no need to create another account to keep your free music.\u003c/p>\n\u003cp>If you believe your membership should still be active, reply and we will help you check it.\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n","text":"Subject: Your free Zodiac songs are still yours to use\n\nPreheader: Three short songs in each frequency remain in your account.\n\nHi {{givenname}},\n\nYour full-library Zodiac access has ended. You still have three short songs in each of your four frequencies, free, in the same account.\n\nYou can keep listening in the Zodiac app or on your desktop or laptop:\n\nListen on my computer\n\nUse your usual account email, {{accountemail}}. There is no need to create another account to keep your free music.\n\nIf you believe your membership should still be active, reply and we will help you check it.\n\nTeam Zodiac","copyText":"**Subject:** Your free Zodiac songs are still yours to use\n\n**Preheader:** Three short songs in each frequency remain in your account.\n\nHi {{given_name}},\n\nYour full-library Zodiac access has ended. You still have three short songs in each of your four frequencies, free, in the same account.\n\nYou can keep listening in the Zodiac app or on your desktop or laptop:\n\n[Listen on my computer](https://app.zodiac.fm)\n\nUse your usual account email, {{account_email}}. There is no need to create another account to keep your free music.\n\nIf you believe your membership should still be active, reply and we will help you check it.\n\nTeam Zodiac"},{"category":"Emails","slug":"funnel-e15","title":"E15 · Payment-recovery exception","label":"Review email · E15","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Your Zodiac subscription payment did not go through\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Check your payment details through {{billing_provider_name}}.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>The {{failed_amount_with_currency}} payment for your Zodiac subscription on {{failed_payment_date}} did not go through.\u003c/p>\n\u003cp>You can review your payment details securely with {{billing_provider_name}}:\u003c/p>\n\u003cp>Review payment details — Review placeholder: \u003ccode>{{secure_payment_update_url}}\u003c/code>\u003c/p>\n\u003cp>{{verified_current_access_sentence}}\u003c/p>\n\u003cp>{{verified_retry_sentence}}\u003c/p>\n\u003cp>Please do not send payment-card details by email. If the charge looks unfamiliar or you cannot reach the payment page, reply and we will help you find the right account.\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n","text":"Subject: Your Zodiac subscription payment did not go through\n\nPreheader: Check your payment details through {{billingprovidername}}.\n\nHi {{givenname}},\n\nThe {{failedamountwithcurrency}} payment for your Zodiac subscription on {{failedpaymentdate}} did not go through.\n\nYou can review your payment details securely with {{billingprovidername}}:\n\nReview payment details — Review placeholder: {{securepaymentupdateurl}}\n\n{{verifiedcurrentaccesssentence}}\n\n{{verifiedretrysentence}}\n\nPlease do not send payment-card details by email. If the charge looks unfamiliar or you cannot reach the payment page, reply and we will help you find the right account.\n\nTeam Zodiac","copyText":"**Subject:** Your Zodiac subscription payment did not go through\n\n**Preheader:** Check your payment details through {{billing_provider_name}}.\n\nHi {{given_name}},\n\nThe {{failed_amount_with_currency}} payment for your Zodiac subscription on {{failed_payment_date}} did not go through.\n\nYou can review your payment details securely with {{billing_provider_name}}:\n\n[Review payment details]({{secure_payment_update_url}})\n\n{{verified_current_access_sentence}}\n\n{{verified_retry_sentence}}\n\nPlease do not send payment-card details by email. If the charge looks unfamiliar or you cannot reach the payment page, reply and we will help you find the right account.\n\nTeam Zodiac"},{"category":"Emails","slug":"family-f01","title":"F01 · Trial listening welcome","label":"Review email · F01","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Welcome to your Zodiac music\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Start with something you enjoy, and give all four frequencies time.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>Welcome to Zodiac. Your trial gives you the full music library in Core, Love, Vitality and Abundance, with each frequency drawn from your own birth details.\u003c/p>\n\u003cp>Start with a song you want to hear. Put on good headphones or use a suitable speaker, keep the volume comfortable, and listen wherever it fits in your day.\u003c/p>\n\u003cp>You can sit quietly with it or let it accompany breakfast and a walk. Meditation is optional.\u003c/p>\n\u003cp>Across the week, give all four frequencies time. Nine minutes a day on average is the starting point we used in our internal product study, with at least fifteen percent of listening in each frequency. That is guidance for how to listen, not a timetable for what you should feel.\u003c/p>\n\u003cp>If you bought on the website, sign in to the phone app with the same email. Desktop and laptop listening is available at \u003ca href=\"https://app.zodiac.fm\" target=\"_blank\" rel=\"noopener noreferrer\">app.zodiac.fm\u003c/a>.\u003c/p>\n\u003cp>\u003ca href=\"#how-to-listen\">Read the listening guide\u003c/a>\u003c/p>\n\u003cp>We are here if you need help. Just reply.\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n","text":"Subject: Welcome to your Zodiac music\n\nPreheader: Start with something you enjoy, and give all four frequencies time.\n\nHi {{givenname}},\n\nWelcome to Zodiac. Your trial gives you the full music library in Core, Love, Vitality and Abundance, with each frequency drawn from your own birth details.\n\nStart with a song you want to hear. Put on good headphones or use a suitable speaker, keep the volume comfortable, and listen wherever it fits in your day.\n\nYou can sit quietly with it or let it accompany breakfast and a walk. Meditation is optional.\n\nAcross the week, give all four frequencies time. Nine minutes a day on average is the starting point we used in our internal product study, with at least fifteen percent of listening in each frequency. That is guidance for how to listen, not a timetable for what you should feel.\n\nIf you bought on the website, sign in to the phone app with the same email. Desktop and laptop listening is available at app.zodiac.fm.\n\nRead the listening guide\n\nWe are here if you need help. Just reply.\n\nTeam Zodiac","copyText":"**Subject:** Welcome to your Zodiac music\n\n**Preheader:** Start with something you enjoy, and give all four frequencies time.\n\nHi {{given_name}},\n\nWelcome to Zodiac. Your trial gives you the full music library in Core, Love, Vitality and Abundance, with each frequency drawn from your own birth details.\n\nStart with a song you want to hear. Put on good headphones or use a suitable speaker, keep the volume comfortable, and listen wherever it fits in your day.\n\nYou can sit quietly with it or let it accompany breakfast and a walk. Meditation is optional.\n\nAcross the week, give all four frequencies time. Nine minutes a day on average is the starting point we used in our internal product study, with at least fifteen percent of listening in each frequency. That is guidance for how to listen, not a timetable for what you should feel.\n\nIf you bought on the website, sign in to the phone app with the same email. Desktop and laptop listening is available at [app.zodiac.fm](https://app.zodiac.fm).\n\n[Read the listening guide]({{article_01_listening}})\n\nWe are here if you need help. Just reply.\n\nTeam Zodiac"},{"category":"Emails","slug":"family-f02","title":"F02 · Your bands","label":"Review email · F02","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> What the bands in your Zodiac results mean\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> A useful way to explore how you take things in.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>Alongside your frequencies, your Zodiac results show bands. These offer a way to explore how you tend to take things in.\u003c/p>\n\u003cp>Root is associated with stillness. Solar Plexus brings movement into the picture. Throat concerns words and expression, while Crown concerns perspective.\u003c/p>\n\u003cp>Treat those descriptions as something to try against your life. You might find that an idea becomes clearer on a walk, or that saying it aloud helps you recognize what you mean. Someone else may want quiet before they can hear themselves.\u003c/p>\n\u003cp>The bands are not a ranking, and they do not confine you to one way of being. Having a particular band does not mean you are missing the others.\u003c/p>\n\u003cp>Our guide explains the bands in more detail. Read your results alongside it, then notice where the description is useful and where your own experience asks for more nuance.\u003c/p>\n\u003cp>\u003ca href=\"#your-bands\">Read about my bands\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n","text":"Subject: What the bands in your Zodiac results mean\n\nPreheader: A useful way to explore how you take things in.\n\nHi {{givenname}},\n\nAlongside your frequencies, your Zodiac results show bands. These offer a way to explore how you tend to take things in.\n\nRoot is associated with stillness. Solar Plexus brings movement into the picture. Throat concerns words and expression, while Crown concerns perspective.\n\nTreat those descriptions as something to try against your life. You might find that an idea becomes clearer on a walk, or that saying it aloud helps you recognize what you mean. Someone else may want quiet before they can hear themselves.\n\nThe bands are not a ranking, and they do not confine you to one way of being. Having a particular band does not mean you are missing the others.\n\nOur guide explains the bands in more detail. Read your results alongside it, then notice where the description is useful and where your own experience asks for more nuance.\n\nRead about my bands\n\nTeam Zodiac","copyText":"**Subject:** What the bands in your Zodiac results mean\n\n**Preheader:** A useful way to explore how you take things in.\n\nHi {{given_name}},\n\nAlongside your frequencies, your Zodiac results show bands. These offer a way to explore how you tend to take things in.\n\nRoot is associated with stillness. Solar Plexus brings movement into the picture. Throat concerns words and expression, while Crown concerns perspective.\n\nTreat those descriptions as something to try against your life. You might find that an idea becomes clearer on a walk, or that saying it aloud helps you recognize what you mean. Someone else may want quiet before they can hear themselves.\n\nThe bands are not a ranking, and they do not confine you to one way of being. Having a particular band does not mean you are missing the others.\n\nOur guide explains the bands in more detail. Read your results alongside it, then notice where the description is useful and where your own experience asks for more nuance.\n\n[Read about my bands]({{article_02_bands}})\n\nTeam Zodiac"},{"category":"Emails","slug":"family-f03","title":"F03 · The premise behind the trial","label":"Review email · F03","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> The idea behind the music you’re hearing\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Your birth pattern, sound and the connected self.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>Zodiac begins with a possibility: that the pattern present at your birth has an expression in sound.\u003c/p>\n\u003cp>The idea comes from Nāda Brahma, the Vedic view that reality is sound. Within that tradition, a mantra lineage developed a method for finding a person&#39;s sound from their birth details. Zodiac uses the frequency part of that method and carries it through music.\u003c/p>\n\u003cp>We call the part of you this connects with the connected self. It is already whole. The music is intended to amplify your signal, your access to it.\u003c/p>\n\u003cp>That matters beyond the time you spend listening. Think of a decision that feels like your own, or a conversation where you can say what you mean and hear the other person too. Those are places to explore the premise in a life you are actually living.\u003c/p>\n\u003cp>This is a philosophical starting point, not scientific proof of how the universe works. You can understand where it comes from and still let your experience decide what you make of it.\u003c/p>\n\u003cp>\u003ca href=\"#where-zodiac-comes-from\">Read where Zodiac comes from\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n","text":"Subject: The idea behind the music you’re hearing\n\nPreheader: Your birth pattern, sound and the connected self.\n\nHi {{givenname}},\n\nZodiac begins with a possibility: that the pattern present at your birth has an expression in sound.\n\nThe idea comes from Nāda Brahma, the Vedic view that reality is sound. Within that tradition, a mantra lineage developed a method for finding a person's sound from their birth details. Zodiac uses the frequency part of that method and carries it through music.\n\nWe call the part of you this connects with the connected self. It is already whole. The music is intended to amplify your signal, your access to it.\n\nThat matters beyond the time you spend listening. Think of a decision that feels like your own, or a conversation where you can say what you mean and hear the other person too. Those are places to explore the premise in a life you are actually living.\n\nThis is a philosophical starting point, not scientific proof of how the universe works. You can understand where it comes from and still let your experience decide what you make of it.\n\nRead where Zodiac comes from\n\nTeam Zodiac","copyText":"**Subject:** The idea behind the music you’re hearing\n\n**Preheader:** Your birth pattern, sound and the connected self.\n\nHi {{given_name}},\n\nZodiac begins with a possibility: that the pattern present at your birth has an expression in sound.\n\nThe idea comes from Nāda Brahma, the Vedic view that reality is sound. Within that tradition, a mantra lineage developed a method for finding a person's sound from their birth details. Zodiac uses the frequency part of that method and carries it through music.\n\nWe call the part of you this connects with the connected self. It is already whole. The music is intended to amplify your signal, your access to it.\n\nThat matters beyond the time you spend listening. Think of a decision that feels like your own, or a conversation where you can say what you mean and hear the other person too. Those are places to explore the premise in a life you are actually living.\n\nThis is a philosophical starting point, not scientific proof of how the universe works. You can understand where it comes from and still let your experience decide what you make of it.\n\n[Read where Zodiac comes from]({{article_12_origin}})\n\nTeam Zodiac"},{"category":"Emails","slug":"family-f04","title":"F04 · Free listening after results","label":"Review email · F04","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Your free Zodiac music is ready\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Three short songs in each of your four frequencies, with no expiry date.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>Three short songs in each of your four Zodiac frequencies are free to keep listening to, whether or not you ever start a paid membership.\u003c/p>\n\u003cp>You do not need to make a buying decision before you hear what the music is like.\u003c/p>\n\u003cp>For desktop or laptop listening, sign in at \u003ca href=\"https://app.zodiac.fm\" target=\"_blank\" rel=\"noopener noreferrer\">app.zodiac.fm\u003c/a>. You can also use the native Zodiac app on your phone, available for \u003ca href=\"https://apps.apple.com/us/app/zodiacfm/id6764863619\" target=\"_blank\" rel=\"noopener noreferrer\">iPhone\u003c/a> or \u003ca href=\"https://play.google.com/store/apps/details?id=fm.zodiac.app\" target=\"_blank\" rel=\"noopener noreferrer\">Android\u003c/a>.\u003c/p>\n\u003cp>Use your account email, {{account_email}}, wherever you listen. If you need help signing in, the email-code login option can send a code to that inbox.\u003c/p>\n\u003cp>Pick a song you like. As you return, include each of the four frequencies rather than staying with only one. You can listen while you get on with your day.\u003c/p>\n\u003cp>\u003ca href=\"#how-to-listen\">Read how to start listening\u003c/a>\u003c/p>\n\u003cp>Reply if something gets in the way. We can help with the practical part while you explore the music for yourself.\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n","text":"Subject: Your free Zodiac music is ready\n\nPreheader: Three short songs in each of your four frequencies, with no expiry date.\n\nHi {{givenname}},\n\nThree short songs in each of your four Zodiac frequencies are free to keep listening to, whether or not you ever start a paid membership.\n\nYou do not need to make a buying decision before you hear what the music is like.\n\nFor desktop or laptop listening, sign in at app.zodiac.fm. You can also use the native Zodiac app on your phone, available for iPhone or Android.\n\nUse your account email, {{accountemail}}, wherever you listen. If you need help signing in, the email-code login option can send a code to that inbox.\n\nPick a song you like. As you return, include each of the four frequencies rather than staying with only one. You can listen while you get on with your day.\n\nRead how to start listening\n\nReply if something gets in the way. We can help with the practical part while you explore the music for yourself.\n\nTeam Zodiac","copyText":"**Subject:** Your free Zodiac music is ready\n\n**Preheader:** Three short songs in each of your four frequencies, with no expiry date.\n\nHi {{given_name}},\n\nThree short songs in each of your four Zodiac frequencies are free to keep listening to, whether or not you ever start a paid membership.\n\nYou do not need to make a buying decision before you hear what the music is like.\n\nFor desktop or laptop listening, sign in at [app.zodiac.fm](https://app.zodiac.fm). You can also use the native Zodiac app on your phone, available for [iPhone](https://apps.apple.com/us/app/zodiacfm/id6764863619) or [Android](https://play.google.com/store/apps/details?id=fm.zodiac.app).\n\nUse your account email, {{account_email}}, wherever you listen. If you need help signing in, the email-code login option can send a code to that inbox.\n\nPick a song you like. As you return, include each of the four frequencies rather than staying with only one. You can listen while you get on with your day.\n\n[Read how to start listening]({{article_01_listening}})\n\nReply if something gets in the way. We can help with the practical part while you explore the music for yourself.\n\nTeam Zodiac"},{"category":"Emails","slug":"family-f05","title":"F05 · Checkout terms clarified","label":"Review email · F05","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> When your Zodiac trial would start billing\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> The trial and the subscription are two separate steps.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>Before you finish your Zodiac checkout, here are the payment terms for the offer you selected.\u003c/p>\n\u003cp>{{checkout_trial_terms}}\u003c/p>\n\u003cp>The trial includes the full music library in all four frequencies. Cancel before the subscription starts billing and there will be no subscription charge. {{trial_fee_cancellation_sentence}}\u003c/p>\n\u003cp>After the trial, subscription payments are nonrefundable under Zodiac&#39;s terms, and you can stop future renewals through your membership settings.\u003c/p>\n\u003cp>If you decide to cancel, the three short songs in each frequency remain available for free.\u003c/p>\n\u003cp>Review my selected plan — Review placeholder: \u003ccode>{{resume_checkout_url}}\u003c/code>\u003c/p>\n\u003cp>Reply if any part of the offer is unclear. You should know what you are agreeing to before you join.\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n","text":"Subject: When your Zodiac trial would start billing\n\nPreheader: The trial and the subscription are two separate steps.\n\nHi {{givenname}},\n\nBefore you finish your Zodiac checkout, here are the payment terms for the offer you selected.\n\n{{checkouttrialterms}}\n\nThe trial includes the full music library in all four frequencies. Cancel before the subscription starts billing and there will be no subscription charge. {{trialfeecancellationsentence}}\n\nAfter the trial, subscription payments are nonrefundable under Zodiac's terms, and you can stop future renewals through your membership settings.\n\nIf you decide to cancel, the three short songs in each frequency remain available for free.\n\nReview my selected plan — Review placeholder: {{resumecheckouturl}}\n\nReply if any part of the offer is unclear. You should know what you are agreeing to before you join.\n\nTeam Zodiac","copyText":"**Subject:** When your Zodiac trial would start billing\n\n**Preheader:** The trial and the subscription are two separate steps.\n\nHi {{given_name}},\n\nBefore you finish your Zodiac checkout, here are the payment terms for the offer you selected.\n\n{{checkout_trial_terms}}\n\nThe trial includes the full music library in all four frequencies. Cancel before the subscription starts billing and there will be no subscription charge. {{trial_fee_cancellation_sentence}}\n\nAfter the trial, subscription payments are nonrefundable under Zodiac's terms, and you can stop future renewals through your membership settings.\n\nIf you decide to cancel, the three short songs in each frequency remain available for free.\n\n[Review my selected plan]({{resume_checkout_url}})\n\nReply if any part of the offer is unclear. You should know what you are agreeing to before you join.\n\nTeam Zodiac"},{"category":"Emails","slug":"family-f06","title":"F06 · Final checkout help","label":"Review email · F06","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Your free songs are still available\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> You can keep listening while you decide about membership.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>You can keep using your free Zodiac music even if you leave the membership checkout unfinished.\u003c/p>\n\u003cp>Three short songs in each frequency remain available. Give them time in your day and see whether you want to explore further.\u003c/p>\n\u003cp>Return to my music — Review placeholder: \u003ccode>{{personal_results_url}}\u003c/code>\u003c/p>\n\u003cp>If you do want to finish joining, return to your selected plan — Review placeholder: \u003ccode>{{resume_checkout_url}}\u003c/code>. The checkout shows the terms before you confirm anything.\u003c/p>\n\u003cp>If a technical problem stopped you, reply and tell us what happened. Otherwise, we will leave this checkout here and let you get on with listening.\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n","text":"Subject: Your free songs are still available\n\nPreheader: You can keep listening while you decide about membership.\n\nHi {{givenname}},\n\nYou can keep using your free Zodiac music even if you leave the membership checkout unfinished.\n\nThree short songs in each frequency remain available. Give them time in your day and see whether you want to explore further.\n\nReturn to my music — Review placeholder: {{personalresultsurl}}\n\nIf you do want to finish joining, return to your selected plan — Review placeholder: {{resumecheckouturl}}. The checkout shows the terms before you confirm anything.\n\nIf a technical problem stopped you, reply and tell us what happened. Otherwise, we will leave this checkout here and let you get on with listening.\n\nTeam Zodiac","copyText":"**Subject:** Your free songs are still available\n\n**Preheader:** You can keep listening while you decide about membership.\n\nHi {{given_name}},\n\nYou can keep using your free Zodiac music even if you leave the membership checkout unfinished.\n\nThree short songs in each frequency remain available. Give them time in your day and see whether you want to explore further.\n\n[Return to my music]({{personal_results_url}})\n\nIf you do want to finish joining, [return to your selected plan]({{resume_checkout_url}}). The checkout shows the terms before you confirm anything.\n\nIf a technical problem stopped you, reply and tell us what happened. Otherwise, we will leave this checkout here and let you get on with listening.\n\nTeam Zodiac"},{"category":"Emails","slug":"family-f07","title":"F07 · Former member, door left open","label":"Review email · F07","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> You’re welcome to keep listening\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Your free songs stay in the same Zodiac account.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>You do not need a paid membership to keep some Zodiac music in your day.\u003c/p>\n\u003cp>Your three short songs in each frequency remain in the same account, ready in the app whenever you want to return. You can listen on a desktop or laptop too:\u003c/p>\n\u003cp>\u003ca href=\"https://app.zodiac.fm\" target=\"_blank\" rel=\"noopener noreferrer\">Listen on my computer\u003c/a>\u003c/p>\n\u003cp>If there is something we could have made clearer or easier while you were a member, we would like to hear it. A reply reaches our team.\u003c/p>\n\u003cp>There is no need to explain your decision. We simply want you to know that the free music remains available.\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n","text":"Subject: You’re welcome to keep listening\n\nPreheader: Your free songs stay in the same Zodiac account.\n\nHi {{givenname}},\n\nYou do not need a paid membership to keep some Zodiac music in your day.\n\nYour three short songs in each frequency remain in the same account, ready in the app whenever you want to return. You can listen on a desktop or laptop too:\n\nListen on my computer\n\nIf there is something we could have made clearer or easier while you were a member, we would like to hear it. A reply reaches our team.\n\nThere is no need to explain your decision. We simply want you to know that the free music remains available.\n\nTeam Zodiac","copyText":"**Subject:** You’re welcome to keep listening\n\n**Preheader:** Your free songs stay in the same Zodiac account.\n\nHi {{given_name}},\n\nYou do not need a paid membership to keep some Zodiac music in your day.\n\nYour three short songs in each frequency remain in the same account, ready in the app whenever you want to return. You can listen on a desktop or laptop too:\n\n[Listen on my computer](https://app.zodiac.fm)\n\nIf there is something we could have made clearer or easier while you were a member, we would like to hear it. A reply reaches our team.\n\nThere is no need to explain your decision. We simply want you to know that the free music remains available.\n\nTeam Zodiac"},{"category":"Emails","slug":"family-f08","title":"F08 · New app prospect welcome","label":"Review email · F08","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Welcome to your Zodiac music\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Start with the three free songs in each frequency.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>Welcome to Zodiac. Your birth details have given you four personal frequencies, and you can now hear them through music in the app.\u003c/p>\n\u003cp>Three short songs in each frequency are free to keep listening to. No trial is required.\u003c/p>\n\u003cp>Open Zodiac and choose a track you like. Use good headphones or a suitable speaker at a comfortable volume, then let the music fit around your day.\u003c/p>\n\u003cp>As you return, include Core, Love, Vitality and Abundance. Your results explain the frequencies and their bands, so you can explore those ideas while you get to know the music.\u003c/p>\n\u003cp>\u003ca href=\"#how-to-listen\">Read the listening guide\u003c/a>\u003c/p>\n\u003cp>If you need help with your account, reply here. Use the same email you signed up with, {{account_email}}, whenever you sign in on another device.\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n","text":"Subject: Welcome to your Zodiac music\n\nPreheader: Start with the three free songs in each frequency.\n\nHi {{givenname}},\n\nWelcome to Zodiac. Your birth details have given you four personal frequencies, and you can now hear them through music in the app.\n\nThree short songs in each frequency are free to keep listening to. No trial is required.\n\nOpen Zodiac and choose a track you like. Use good headphones or a suitable speaker at a comfortable volume, then let the music fit around your day.\n\nAs you return, include Core, Love, Vitality and Abundance. Your results explain the frequencies and their bands, so you can explore those ideas while you get to know the music.\n\nRead the listening guide\n\nIf you need help with your account, reply here. Use the same email you signed up with, {{accountemail}}, whenever you sign in on another device.\n\nTeam Zodiac","copyText":"**Subject:** Welcome to your Zodiac music\n\n**Preheader:** Start with the three free songs in each frequency.\n\nHi {{given_name}},\n\nWelcome to Zodiac. Your birth details have given you four personal frequencies, and you can now hear them through music in the app.\n\nThree short songs in each frequency are free to keep listening to. No trial is required.\n\nOpen Zodiac and choose a track you like. Use good headphones or a suitable speaker at a comfortable volume, then let the music fit around your day.\n\nAs you return, include Core, Love, Vitality and Abundance. Your results explain the frequencies and their bands, so you can explore those ideas while you get to know the music.\n\n[Read the listening guide]({{article_01_listening}})\n\nIf you need help with your account, reply here. Use the same email you signed up with, {{account_email}}, whenever you sign in on another device.\n\nTeam Zodiac"},{"category":"Emails","slug":"family-f09","title":"F09 · Immediate-paid monthly welcome","label":"Review email · F09","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Your Zodiac membership is ready\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Start listening with your full music library.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>Welcome to Zodiac, and thank you for becoming a member. Your full music library is available in all four of your personal frequencies.\u003c/p>\n\u003cp>Open the app with your account email, {{account_email}}, and choose a track you want to hear. You can also listen on a desktop or laptop at \u003ca href=\"https://app.zodiac.fm\" target=\"_blank\" rel=\"noopener noreferrer\">app.zodiac.fm\u003c/a>.\u003c/p>\n\u003cp>Use good headphones or a suitable speaker at a comfor
