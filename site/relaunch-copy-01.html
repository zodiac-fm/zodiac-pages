y configuration when you were born, then a protected method turns that pattern into four frequencies in the audible range of 250 to 950 hertz.\u003c/p>\n\u003cp>\u003cstrong>8. What if I don&#39;t know my birth time?\u003c/strong>\n\u003cem>Website and getting started\u003c/em>\u003c/p>\n\u003cp>Use your best estimate. If you know it was morning or evening, choose a time within that period. Use noon only if you have no idea.\u003c/p>\n\u003cp>Give that starting point a steady week of listening before trying another time. If you&#39;re unsure how to approach it, write to us and we&#39;ll help you work with the information you have.\u003c/p>\n\u003cp>\u003cstrong>9. Do my frequencies change over time?\u003c/strong>\n\u003cem>Website and My Zodiac\u003c/em>\u003c/p>\n\u003cp>Your four frequencies stay fixed. What grows with listening is your access to them, rather than the numbers changing as you grow.\u003c/p>\n\u003cp>Correcting your birth information can change the calculation, although not every correction produces different values.\u003c/p>\n\u003cp>\u003cstrong>10. How do I correct my birth information?\u003c/strong>\n\u003cem>Account help\u003c/em>\u003c/p>\n\u003cp>Email \u003ca href=\"mailto:support@zodiac.fm\">support@zodiac.fm\u003c/a> and tell us which detail needs correcting, without sending your full birth information in the first message. We&#39;ll help you make the change and check that it has gone through.\u003c/p>\n\u003cp>\u003cstrong>11. What do my bands mean?\u003c/strong>\n\u003cem>Website and My Zodiac\u003c/em>\u003c/p>\n\u003cp>Your band tells you how you most naturally process information in that area of your life.\u003c/p>\n\u003cul>\n\u003cli>Root works through grounding and steadiness. Clarity comes when you&#39;re still, settled, and able to trust your gut.\u003c/li>\n\u003cli>Solar Plexus works through drive and motion. Moving or taking a small action helps you find out what feels right.\u003c/li>\n\u003cli>Throat works through articulation and expression. Speaking or writing helps you understand what you&#39;re processing.\u003c/li>\n\u003cli>Crown works through systems, perspective, and the bigger picture, helping you see where something fits when you widen your view.\u003c/li>\n\u003c/ul>\n\u003cp>For example, if your Core falls in Throat, questions about who you are and what matters to you become clearer through speaking or writing. Everyone can use all four approaches, with your band describing your most natural route.\u003c/p>\n\u003cp>\u003cstrong>12. Why are several of my frequencies in the same band?\u003c/strong>\n\u003cem>My Zodiac and member help\u003c/em>\u003c/p>\n\u003cp>That&#39;s a normal result. Your four frequencies don&#39;t have to spread across all four bands, and a repeated band doesn&#39;t mean you&#39;re missing something.\u003c/p>\n\u003cp>It means that the same way of processing may come naturally in more than one area of your life. We haven&#39;t studied the distributions enough to give every combination a further meaning.\u003c/p>\n\u003cp>\u003cstrong>13. What does it mean to be near the top of a band?\u003c/strong>\n\u003cem>My Zodiac and member help\u003c/em>\u003c/p>\n\u003cp>In the top third of Root, Solar Plexus, or Throat, you also carry aspects of the next band up. Your home band still leads.\u003c/p>\n\u003cp>For example, Core near the top of Root still finds clarity through groundedness, while drive and motion may also help clarify your identity signal. Crown has no next-band addition.\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>Listening\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>14. Can I listen through my phone or computer speakers?\u003c/strong>\n\u003cem>Website and getting started\u003c/em>\u003c/p>\n\u003cp>Please use headphones, a quality Bluetooth speaker, or your car&#39;s sound system instead of built-in phone or computer speakers. Your phone or computer can play the music through those.\u003c/p>\n\u003cp>Choose a volume that&#39;s clear and comfortable, without turning it up to overpower the noise around you.\u003c/p>\n\u003cp>\u003cstrong>15. How much should I listen?\u003c/strong>\n\u003cem>Website and getting started\u003c/em>\u003c/p>\n\u003cp>Aim for about nine minutes a day on average across the week. That&#39;s roughly 63 minutes, with all four frequencies included. Find a time that fits your life so listening becomes easy to keep coming back to.\u003c/p>\n\u003cp>\u003cstrong>16. How do I balance my four frequencies?\u003c/strong>\n\u003cem>Getting started and My Zodiac\u003c/em>\u003c/p>\n\u003cp>Give each frequency at least 15 percent of your total listening across the week. The remaining 40 percent can go wherever you&#39;d like more emphasis.\u003c/p>\n\u003cp>You don&#39;t need exactly equal time. Rotate through the four, then check your weekly percentages to see whether one needs a little more attention.\u003c/p>\n\u003cp>\u003cstrong>17. What happens if I miss a day?\u003c/strong>\n\u003cem>Member help\u003c/em>\u003c/p>\n\u003cp>Just pick up again when you can. The listening guidance is a weekly average, so you don&#39;t have to maintain a daily streak. A missed day doesn&#39;t erase the listening you&#39;ve already done.\u003c/p>\n\u003cp>\u003cstrong>18. Can I do other things while listening?\u003c/strong>\n\u003cem>Website and getting started\u003c/em>\u003c/p>\n\u003cp>Yes. You can listen while working, walking, cooking, or relaxing. Choose music that suits what you&#39;re doing and keep it at a comfortable volume.\u003c/p>\n\u003cp>If you&#39;re driving or doing something that needs your full attention, avoid sleep music or anything you find distracting.\u003c/p>\n\u003cp>\u003cstrong>19. Can I listen while sleeping?\u003c/strong>\n\u003cem>Website and member help\u003c/em>\u003c/p>\n\u003cp>Yes, the library includes music intended for sleep. Choose a comfortable volume and include all four frequencies across your week, rather than playing only one every night.\u003c/p>\n\u003cp>\u003cstrong>20. What if the music isn&#39;t my style?\u003c/strong>\n\u003cem>Music library and member help\u003c/em>\u003c/p>\n\u003cp>Try a different piece or one with a quieter feel. You don&#39;t have to enjoy every piece.\u003c/p>\n\u003cp>And tell us what you&#39;d like to hear. Favorite artists or genres give us something useful to work with as we add music.\u003c/p>\n\u003cp>\u003cstrong>21. Can I listen to a pure tone instead?\u003c/strong>\n\u003cem>Member help\u003c/em>\u003c/p>\n\u003cp>We don&#39;t currently offer a pure-tone option. What we&#39;ve studied is listening to your frequencies in the Zodiac music, so we can&#39;t say a tone generator gives you the same experience.\u003c/p>\n\u003cp>\u003cstrong>22. How is my frequency put into the music?\u003c/strong>\n\u003cem>Website and member help\u003c/em>\u003c/p>\n\u003cp>Each piece is retuned until your personal frequency becomes one of its harmonies, so you can enjoy the music without trying to pick out a separate tone.\u003c/p>\n\u003cp>\u003cstrong>23. Is Zodiac binaural beats?\u003c/strong>\n\u003cem>Website\u003c/em>\u003c/p>\n\u003cp>No. Binaural beats use a different tone in each ear. Zodiac carries one of your personal frequencies in the music, so it doesn&#39;t depend on that separation between your ears.\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>Your experience\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>24. What might I notice?\u003c/strong>\n\u003cem>Website and getting started\u003c/em>\u003c/p>\n\u003cp>You may find yourself recognizing what feels right for you more easily. A decision becomes clearer, you notice what&#39;s draining your energy, or you stop talking yourself out of a boundary you already know you need.\u003c/p>\n\u003cp>It isn&#39;t necessarily a sensation while the music plays. Sometimes it&#39;s a gradual, instinctive knowing, and you recognize the difference in how you&#39;re living.\u003c/p>\n\u003cp>\u003cstrong>25. What if I don&#39;t feel anything?\u003c/strong>\n\u003cem>Website and member help\u003c/em>\u003c/p>\n\u003cp>That happens. Michael didn&#39;t notice a difference himself until about a month, while some people notice something much sooner.\u003c/p>\n\u003cp>Give all four frequencies a place in your week and look at what happens outside the listening itself, such as decisions becoming clearer or recognizing what gives you energy a little sooner.\u003c/p>\n\u003cp>If you still aren&#39;t noticing anything, write to us with how long you&#39;ve been listening and what you&#39;ve tried so we can help you check the setup and routine.\u003c/p>\n\u003cp>\u003cstrong>26. What if listening brings up difficult emotions?\u003c/strong>\n\u003cem>Member help\u003c/em>\u003c/p>\n\u003cp>You don&#39;t have to push through or finish a track that feels uncomfortable. Some people have described reconnecting with parts of themselves as tender or overwhelming, and that unfamiliar feeling has sometimes eased with time.\u003c/p>\n\u003cp>If you&#39;d like to continue, try a gentler track or just a few minutes. Taking a break is fine too. Tell us what you&#39;re experiencing so we can respond to you, rather than assume everyone needs the same advice.\u003c/p>\n\u003cp>We can&#39;t tell from an emotional reaction alone what caused it, and discomfort isn&#39;t proof that Zodiac is working.\u003c/p>\n\u003cp>\u003cstrong>27. What if the sound causes physical discomfort?\u003c/strong>\n\u003cem>Member help\u003c/em>\u003c/p>\n\u003cp>Stop listening if the sound hurts or you notice a concerning physical reaction. You don&#39;t need to keep testing the same headphones or track.\u003c/p>\n\u003cp>For symptoms that are severe, persistent, or worrying, seek appropriate professional advice. Zodiac isn&#39;t medical treatment, and we won&#39;t explain away physical symptoms as part of the process.\u003c/p>\n\u003cp>\u003cstrong>28. Do I have to listen forever?\u003c/strong>\n\u003cem>Website and member help\u003c/em>\u003c/p>\n\u003cp>There isn&#39;t a fixed finish line. Zodiac builds through repeated listening, and we haven&#39;t established a point where everyone can stop and keep a permanent result. You can decide what continuing adds to your life and take a break when you want to.\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>The study\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>29. What were the results of your study?\u003c/strong>\n\u003cem>Website\u003c/em>\u003c/p>\n\u003cp>In our 52-week internal study, 300 people started and 278 completed it. Participants answered open-ended questions every two weeks, and Michael grouped their responses into recurring themes.\u003c/p>\n\u003cp>Among people who listened as designed, \u003cstrong>84 percent called Zodiac life-changing\u003c/strong>. Listening as designed meant averaging at least nine minutes a day across the week, with each frequency receiving at least 15 percent of their listening.\u003c/p>\n\u003cp>That group reported seven kinds of change:\u003c/p>\n\u003cul>\n\u003cli>Internal regulation, 92 percent. Feeling calmer, with easier mornings, deeper sleep, or energy that held through more of the day.\u003c/li>\n\u003cli>Deeper self-access, 94 percent. Less effort to perform a version of themselves and more recognition of who they are underneath it. A feeling of coming home.\u003c/li>\n\u003cli>Sharper instincts, 91 percent. A clearer sense of what felt right, with less second-guessing.\u003c/li>\n\u003cli>Better relationships and love, 90 percent. More ease in showing up as themselves and connecting with others.\u003c/li>\n\u003cli>Life responds, 88 percent. Useful opportunities, connections, and timing showing up as they moved through life differently.\u003c/li>\n\u003cli>Connection to something bigger, 90 percent. Feeling part of something beyond their individual life.\u003c/li>\n\u003cli>The witness, 91 percent. This change tended to arrive later, bringing more space between what happened and how they responded.\u003c/li>\n\u003c/ul>\n\u003cp>In that group, \u003cstrong>96 percent reported three or more outcomes\u003c/strong>. Across all completers, \u003cstrong>98.6 percent would recommend Zodiac and 70.5 percent called it life-changing\u003c/strong>.\u003c/p>\n\u003cp>These are participants&#39; reports from our own study, rather than results from an independent clinical trial. Internal regulation describes their experience, not a measured biological change.\u003c/p>\n\u003cp>\u003cstrong>30. How long does it take to notice a change?\u003c/strong>\n\u003cem>Website and getting started\u003c/em>\u003c/p>\n\u003cp>It varies. Some people notice something quickly, while others recognize changes gradually in everyday life.\u003c/p>\n\u003cp>In our year-long internal study, among people averaging at least nine minutes a day with every frequency receiving at least 15 percent of their listening, 61 percent reported a clear shift by month one, 81 percent by month three, and 87 percent by month six.\u003c/p>\n\u003cp>Those are cumulative reports, so the later figures include people who noticed something earlier. They give you a sense of the range we saw, rather than a deadline you have to meet.\u003c/p>\n\u003cp>\u003cstrong>31. Is Zodiac scientifically proven?\u003c/strong>\n\u003cem>Website\u003c/em>\u003c/p>\n\u003cp>No independent clinical trial has proven Zodiac or its complete mechanism. What we have is a year-long internal study and a growing body of customer experiences that help us understand what people notice.\u003c/p>\n\u003cp>Our explanation for why it happens is still a working model.\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>App and account help\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>32. Where can I listen to Zodiac?\u003c/strong>\n\u003cem>Website and getting started\u003c/em>\u003c/p>\n\u003cp>You can listen in the native iPhone app, the native Android app, or through Zodiac in a desktop or laptop browser. Sign in with the same email address wherever you listen.\u003c/p>\n\u003cp>\u003cstrong>33. What should I do if I can&#39;t sign in?\u003c/strong>\n\u003cem>Account help\u003c/em>\u003c/p>\n\u003cp>Check that you&#39;re using the email address you signed up with. If you&#39;re still stuck, email \u003ca href=\"mailto:support@zodiac.fm\">support@zodiac.fm\u003c/a> and tell us what happens when you try. An error screenshot can help us find the problem. Please don&#39;t send your password.\u003c/p>\n\u003cp>\u003cstrong>34. Why is my paid music still locked?\u003c/strong>\n\u003cem>Account help\u003c/em>\u003c/p>\n\u003cp>First check that you&#39;re signed into the account you used to purchase. If you are, contact \u003ca href=\"mailto:support@zodiac.fm\">support@zodiac.fm\u003c/a> with your account email and purchase reference so we can check the access.\u003c/p>\n\u003cp>Please don&#39;t buy again to solve it. Let us help with the membership you&#39;ve already paid for.\u003c/p>\n\u003cp>\u003cstrong>35. What should I do if the music keeps stopping?\u003c/strong>\n\u003cem>Member help\u003c/em>\u003c/p>\n\u003cp>Email \u003ca href=\"mailto:support@zodiac.fm\">support@zodiac.fm\u003c/a> with your device and whether you&#39;re listening in the app or a browser. Include when it stops, such as when you lock the screen.\u003c/p>\n\u003cp>Those details help us investigate the problem you are having, rather than send you through a list of unrelated fixes.\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>Membership\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>36. Can I use Zodiac for free?\u003c/strong>\n\u003cem>Website\u003c/em>\u003c/p>\n\u003cp>Yes. You keep three short songs in each of your four frequencies for free, without a paid membership. You can get started at your own pace.\u003c/p>\n\u003cp>\u003cstrong>37. What does Zodiac cost?\u003c/strong>\n\u003cem>Homepage\u003c/em>\u003c/p>\n\u003cp>Annual membership is $9.08 a month, billed as $109 yearly. The monthly option is $17, and both plans include access to the longer music.\u003c/p>\n\u003cp>\u003cstrong>38. Can I try the paid membership first?\u003c/strong>\n\u003cem>Homepage\u003c/em>\u003c/p>\n\u003cp>Yes. You can try either plan for seven days for $3. Choose monthly or annual when you join, and that plan begins on day eight unless you cancel during the trial.\u003c/p>\n\u003cp>\u003cstrong>39. How do I cancel my website subscription?\u003c/strong>\n\u003cem>Website billing help\u003c/em>\u003c/p>\n\u003cp>Email \u003ca href=\"mailto:support@zodiac.fm\">support@zodiac.fm\u003c/a> from your account address and ask us to stop the renewal. You don&#39;t need to explain why. If you&#39;re in the seven-day website trial, contact us before it ends to avoid the membership charge.\u003c/p>\n\u003cp>If Apple bills you, manage the subscription through your Apple subscription settings. Cancellation stops the next charge but does not delete your Zodiac account or personal information.\u003c/p>\n\u003cp>\u003cstrong>40. Can I get a refund on my website purchase?\u003c/strong>\n\u003cem>Website billing help\u003c/em>\u003c/p>\n\u003cp>Purchases that begin with a trial aren&#39;t refundable. That includes the $3 trial charge. Please cancel during the seven days if you don&#39;t want your selected plan to begin.\u003c/p>\n\u003cp>If you joined before trials were introduced, your original refund window applies: 90 days from purchase for annual membership or 30 days for monthly membership. If you&#39;re unsure which applies to you, write to us and we&#39;ll check your purchase.\u003c/p>\n\u003cp>\u003cstrong>41. Why was I charged after I canceled?\u003c/strong>\n\u003cem>Billing help\u003c/em>\u003c/p>\n\u003cp>Please contact \u003ca href=\"mailto:support@zodiac.fm\">support@zodiac.fm\u003c/a> so we can check what happened. Send the charge date, amount, account email, and any cancellation confirmation you have. Leave out your full card number.\u003c/p>\n\u003cp>If you believe you canceled, we want to investigate that with you. We won&#39;t assume the charge is correct just because it appears in the account.\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>Privacy\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>42. How do you use my personal information?\u003c/strong>\n\u003cem>Website and account help\u003c/em>\u003c/p>\n\u003cp>We use your birth date, time, and place to calculate your frequencies. We use account and listening information to provide Zodiac. The current \u003ca href=\"https://zodiac.fm/privacy\" target=\"_blank\" rel=\"noopener noreferrer\">Privacy Policy\u003c/a> explains the service providers involved, any advertising or analytics use, retention, and the choices available to you.\u003c/p>\n\u003cp>Because those details can differ by signup surface and change over time, the Privacy Policy is the controlling public answer. Please contact \u003ca href=\"mailto:support@zodiac.fm\">support@zodiac.fm\u003c/a> if you want help with a specific privacy question.\u003c/p>\n\u003cp>\u003cstrong>43. How do I delete my account?\u003c/strong>\n\u003cem>Account help\u003c/em>\u003c/p>\n\u003cp>Follow the account-deletion route in our \u003ca href=\"https://zodiac.fm/privacy\" target=\"_blank\" rel=\"noopener noreferrer\">Privacy Policy\u003c/a>, or contact \u003ca href=\"mailto:support@zodiac.fm\">support@zodiac.fm\u003c/a> for help. Cancel any active subscription with the billing provider too, because cancellation, account closure, and deletion of personal information are separate requests.\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>Understanding the product\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>44. Is Zodiac a horoscope, Human Design reading, or astrology reading?\u003c/strong>\n\u003cem>Website\u003c/em>\u003c/p>\n\u003cp>No. Zodiac uses your birth information, but it does not return a horoscope or a written chart reading. It turns your birth pattern into four personal frequencies and puts those frequencies into music.\u003c/p>\n\u003cp>\u003cstrong>45. How is Zodiac different from astrology, Human Design, or a sound app?\u003c/strong>\n\u003cem>Website\u003c/em>\u003c/p>\n\u003cp>Astrology and Human Design give you a map and language for understanding your nature. Zodiac gives you another way in: listening to the frequencies of your own birth pattern so that what a good reading helps you recognize can become easier to know from within.\u003c/p>\n\u003cp>Unlike a general sound app, the music is tuned to your four personal frequencies.\u003c/p>\n\u003cp>\u003cstrong>46. What do I receive when I sign up?\u003c/strong>\n\u003cem>Website\u003c/em>\u003c/p>\n\u003cp>You receive your four calculated frequencies, their four domains and bands, and personalized music in Zodiac&#39;s native apps or desktop and laptop browser experience. Every account keeps three short pieces in each frequency. A paid membership opens the longer music available under the offer you chose.\u003c/p>\n\u003cp>\u003cstrong>47. Does Zodiac make me more myself?\u003c/strong>\n\u003cem>Website\u003c/em>\u003c/p>\n\u003cp>It does not add a new self or change your connected self. Zodiac is designed to amplify your access to what is already there, so your own nature becomes easier to recognize and live from.\u003c/p>\n\u003cp>\u003cstrong>48. Is Zodiac a religion, guru system, or belief system?\u003c/strong>\n\u003cem>Website\u003c/em>\u003c/p>\n\u003cp>No. Zodiac draws from a Vedic view of sound, but it does not ask you to join a religion, follow a guru, or surrender your judgment. You press play, live your life, and pay attention to your own experience.\u003c/p>\n\u003cp>\u003cstrong>49. Who is behind Zodiac?\u003c/strong>\n\u003cem>About and website\u003c/em>\u003c/p>\n\u003cp>Zodiac was founded by Michael Lovitch, who kept following the question of how a birth pattern could be experienced through sound after Vedic astrologers described what years of therapy had helped him uncover. He brought the frequency part of a mantra lineage&#39;s protected method into music, then tested Zodiac in a year-long internal study.\u003c/p>\n\u003cp>\u003cstrong>50. What does my frequency number mean? Is a higher number better?\u003c/strong>\n\u003cem>Website and My Zodiac\u003c/em>\u003c/p>\n\u003cp>The number is the acoustic value of one part of your birth signature, measured in hertz. Higher is not better, stronger, or more evolved. Its domain tells you what area of life it speaks to, and its band describes how you most naturally process information in that area.\u003c/p>\n\u003cp>\u003cstrong>51. Why are there four frequencies? Are they four versions of me?\u003c/strong>\n\u003cem>Website and My Zodiac\u003c/em>\u003c/p>\n\u003cp>Core, Love, Vitality, and Abundance are four parts of one birth signature, not four separate selves. Together they cover identity and direction, connection, energy, and opportunity. They are useful reference points, not a claim to contain your whole life.\u003c/p>\n\u003cp>\u003cstrong>52. Are my bands fixed, or can they change?\u003c/strong>\n\u003cem>My Zodiac\u003c/em>\u003c/p>\n\u003cp>Your bands come from your four fixed frequency values, so they stay fixed too. A band can change only if corrected birth information changes the underlying frequency enough to place it in another range.\u003c/p>\n\u003cp>\u003cstrong>53. Am I supposed to feel a frequency in the body area connected to its band?\u003c/strong>\n\u003cem>My Zodiac and member help\u003c/em>\u003c/p>\n\u003cp>No. You may notice something there, or you may not. The body area is an invitation to pay attention, not a test of whether the music is working.\u003c/p>\n\u003cp>\u003cstrong>54. Where did the band system come from?\u003c/strong>\n\u003cem>Website and My Zodiac\u003c/em>\u003c/p>\n\u003cp>The protected method produces the four frequency values. Zodiac built the band model around where those values fall between 250 and 950 hertz, using patterns observed during the year-long beta. The band interpretation is Zodiac&#39;s model, not an ancient teaching supplied with the calculation.\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>The calculation and the music\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>55. What birth information does Zodiac need?\u003c/strong>\n\u003cem>Website\u003c/em>\u003c/p>\n\u003cp>Your birth date, exact or best-known birth time, and birth place. Those details establish the planetary arrangement at the moment and location of your birth.\u003c/p>\n\u003cp>\u003cstrong>56. Does my name affect the calculation?\u003c/strong>\n\u003cem>Website\u003c/em>\u003c/p>\n\u003cp>No. Your name can identify your account, but it is not part of the frequency calculation. Zodiac is not numerology.\u003c/p>\n\u003cp>\u003cstrong>57. Does Zodiac use Western, Vedic, tropical, or sidereal astrology?\u003c/strong>\n\u003cem>Website\u003c/em>\u003c/p>\n\u003cp>Zodiac comes through a Vedic sound worldview and uses the planetary pattern at birth as its starting point. It does not give you a Western, Vedic, tropical, or sidereal chart reading. A protected method turns the birth pattern into four frequencies.\u003c/p>\n\u003cp>\u003cstrong>58. Do current transits or planetary cycles change my four frequencies?\u003c/strong>\n\u003cem>Website and My Zodiac\u003c/em>\u003c/p>\n\u003cp>No. Your birth frequencies remain fixed while the sky and your life keep moving. That stable reference is what helps you find your way through changing transits, returns, progressions, and other cycles.\u003c/p>\n\u003cp>\u003cstrong>59. Why does Zodiac use sound?\u003c/strong>\n\u003cem>Website\u003c/em>\u003c/p>\n\u003cp>Nāda Brahma is a Vedic teaching that says the one reality beneath everything is sound. Within it, your birth pattern can have a sound too. Zodiac holds this as a possibility rather than scientific proof, then makes the four calculated frequencies practical by placing them in music.\u003c/p>\n\u003cp>\u003cstrong>60. How is repeated listening understood to help?\u003c/strong>\n\u003cem>Website and getting started\u003c/em>\u003c/p>\n\u003cp>Each listen brings you back into contact with the same four personal signals. With repeated, balanced listening, those signals can become easier to recognize in ordinary life, including your decisions, relationships, energy, and sense of timing. There is no required sensation during a track.\u003c/p>\n\u003cp>\u003cstrong>61. Does Zodiac use isochronic, brainwave, healing, Solfeggio, or nervous-system frequencies?\u003c/strong>\n\u003cem>Website\u003c/em>\u003c/p>\n\u003cp>No. Your four frequencies come from your birth information through Zodiac&#39;s protected method. They are not brainwave targets, Solfeggio numbers, a medical treatment, or a claim to regulate your nervous system.\u003c/p>\n\u003cp>\u003cstrong>62. What does hertz mean for my audible frequency?\u003c/strong>\n\u003cem>Website\u003c/em>\u003c/p>\n\u003cp>Hertz means cycles per second. Zodiac brings each calculated value into the audible range between 250 and 950 hertz, then retunes the music so your frequency sits inside it as a harmony. You do not need to isolate the frequency by ear for the music to carry it.\u003c/p>\n\u003cp>\u003cstrong>63. Why can the same piece appear under different frequencies?\u003c/strong>\n\u003cem>Music library and member help\u003c/em>\u003c/p>\n\u003cp>The composition can stay the same while its tuning changes. Zodiac makes a frequency-specific version so Core, Love, Vitality, or Abundance carries the correct personal value for that part of your system.\u003c/p>\n\u003cp>\u003cstrong>64. Is the music made with AI?\u003c/strong>\n\u003cem>Website and music library\u003c/em>\u003c/p>\n\u003cp>No. Real musicians compose the music. Zodiac then creates the frequency-specific versions required to place each personal frequency inside the piece.\u003c/p>\n\u003cp>\u003cstrong>65. What kinds of music are available, and why is the catalog still growing?\u003c/strong>\n\u003cem>Music library\u003c/em>\u003c/p>\n\u003cp>The library includes pieces for different moods, lengths, and moments in the day. Each new composition also has to be tuned across the personal frequency range and prepared for all four domains, so adding music is more involved than uploading one ordinary recording. Check the current library for what is available now.\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>Listening well\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>66. Where should I start?\u003c/strong>\n\u003cem>Getting started\u003c/em>\u003c/p>\n\u003cp>Choose any piece you want to hear and press play. Over the week, include Core, Love, Vitality, and Abundance rather than trying to find one perfect starting frequency.\u003c/p>\n\u003cp>\u003cstrong>67. Can I focus more on one frequency?\u003c/strong>\n\u003cem>Getting started and My Zodiac\u003c/em>\u003c/p>\n\u003cp>Yes. Give every frequency at least 15 percent of your weekly listening, then use the remaining 40 percent wherever you want more attention. Balance leaves room for emphasis.\u003c/p>\n\u003cp>\u003cstrong>68. What time of day is best?\u003c/strong>\n\u003cem>Getting started\u003c/em>\u003c/p>\n\u003cp>The time you can return to is best. You can listen in the morning, during the day, or at night. Choose music that fits the moment and build a rhythm that works in your actual life.\u003c/p>\n\u003cp>\u003cstrong>69. Can I listen while driving or operating machinery?\u003c/strong>\n\u003cem>Member help\u003c/em>\u003c/p>\n\u003cp>Ordinary music listening can be fine while driving when it is legal, safely set up, and not distracting. Avoid sleep-oriented, deeply unwinding, or personally distracting pieces whenever you need full alertness.\u003c/p>\n\u003cp>\u003cstrong>70. Can I use Zodiac with meditation, journaling, therapy, coaching, or another practice?\u003c/strong>\n\u003cem>Website and member help\u003c/em>\u003c/p>\n\u003cp>Yes. Zodiac does not replace those practices, and it does not require them. Use the music alongside what already supports you, or simply let it play during an ordinary day.\u003c/p>\n\u003cp>\u003cstrong>71. Do I need two working ears or a particular hearing setup?\u003c/strong>\n\u003cem>Member help\u003c/em>\u003c/p>\n\u003cp>Zodiac does not use a different tone in each ear, so split-ear listening is not part of the method. You can choose headphones, a speaker, a car system, or either-ear listening at a comfortable volume. We cannot promise that every hearing aid, device, speaker, or audio path reproduces every recording in exactly the same way. Contact support if you need help finding a workable setup.\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>Results, evidence, and safety\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>72. Why does everyone experience Zodiac differently?\u003c/strong>\n\u003cem>Website and member help\u003c/em>\u003c/p>\n\u003cp>People begin with different lives, habits, sensitivities, and ways of recognizing change. Your four frequencies and bands are personal too. Some people notice something during the music, while others first see it in a decision, relationship, or change of direction later.\u003c/p>\n\u003cp>\u003cstrong>73. Is Zodiac supposed to make me feel amazing all the time?\u003c/strong>\n\u003cem>Website and member help\u003c/em>\u003c/p>\n\u003cp>No. The point is clearer access to yourself, not one permanent mood. Your life still contains difficulty, uncertainty, grief, conflict, and change.\u003c/p>\n\u003cp>\u003cstrong>74. Does Zodiac guarantee results?\u003c/strong>\n\u003cem>Website\u003c/em>\u003c/p>\n\u003cp>No individual result or timetable is guaranteed. Zodiac can tell you what participants reported in its internal study and how the product is designed to be used. Your own experience is still your own.\u003c/p>\n\u003cp>\u003cstrong>75. Is Zodiac medical, and can it treat a condition?\u003c/strong>\n\u003cem>Website and member help\u003c/em>\u003c/p>\n\u003cp>Zodiac is music and self-recognition rather than medical care, so it does not diagnose, treat, cure, or prevent a condition. Bring health questions to an appropriate professional.\u003c/p>\n\u003cp>\u003cstrong>76. Is Zodiac established as safe for children, pregnancy, seizure conditions, implanted devices, or other special populations?\u003c/strong>\n\u003cem>Member help\u003c/em>\u003c/p>\n\u003cp>Zodiac-specific guidance has not been established for those situations, which does not mean the music is unsafe. We will not guess. Ask an appropriate professional who understands your circumstances before using it, and contact support with product questions.\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>Astrology, Human Design, and other practices\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>77. How does Zodiac relate to astrology?\u003c/strong>\n\u003cem>Website\u003c/em>\u003c/p>\n\u003cp>Astrology reads your birth imprint as a chart and puts it into words. Zodiac&#39;s premise is that the same birth pattern has a sound. Your four fixed frequencies give you a way to recognize your nature from within as you move through changing transits and cycles.\u003c/p>\n\u003cp>\u003cstrong>78. How does Zodiac work with Human Design?\u003c/strong>\n\u003cem>Website\u003c/em>\u003c/p>\n\u003cp>Human Design gives you language for Type, Strategy, Authority, Centers, profile, and incarnation cross. Zodiac does not turn each of those chart parts into a tone. It offers intuitive access to the nature that Human Design helps you understand, so living your design can become less abstract.\u003c/p>\n\u003cp>\u003cstrong>79. How does Zodiac work with Gene Keys?\u003c/strong>\n\u003cem>Website\u003c/em>\u003c/p>\n\u003cp>Gene Keys offers a contemplative language for patterns and possibilities, while Zodiac does not encode those teachings into the music. It can sit beside that practice as another way to recognize your own nature from within.\u003c/p>\n\u003cp>\u003cstrong>80. Does Zodiac replace astrology, Human Design, Gene Keys, meditation, or another practice?\u003c/strong>\n\u003cem>Website\u003c/em>\u003c/p>\n\u003cp>No. A reading or practice can give you language, context, and a way to reflect, while Zodiac adds a listening practice that can make your own signal more available in everyday life.\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>App and product features\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>81. Is there an app, and how do I install it?\u003c/strong>\n\u003cem>Getting started\u003c/em>\u003c/p>\n\u003cp>Yes. \u003ca href=\"https://apps.apple.com/us/app/zodiacfm/id6764863619\" target=\"_blank\" rel=\"noopener noreferrer\">Download Zodiac for iPhone\u003c/a>, \u003ca href=\"https://play.google.com/store/apps/details?id=fm.zodiac.app\" target=\"_blank\" rel=\"noopener noreferrer\">download Zodiac for Android\u003c/a>, or \u003ca href=\"https://app.zodiac.fm/\" target=\"_blank\" rel=\"noopener noreferrer\">listen in a desktop or laptop browser\u003c/a>. Sign in with the same email address you used when you joined, and email \u003ca href=\"mailto:support@zodiac.fm\">support@zodiac.fm\u003c/a> if the app or your account does not open.\u003c/p>\n\u003cp>\u003cstrong>82. Which devices and operating systems are supported?\u003c/strong>\n\u003cem>App help\u003c/em>\u003c/p>\n\u003cp>Native iPhone and Android listening is available, and desktop or laptop browser listening continues.\u003c/p>\n\u003cp>Use the current App Store or Google Play listing for phone requirements. If installation or playback fails, contact \u003ca href=\"mailto:support@zodiac.fm\">support@zodiac.fm\u003c/a> with your device, operating-system version, and whether you were using the native app or a desktop or laptop browser.\u003c/p>\n\u003cp>\u003cstrong>83. Does Zodiac play in the background or offline?\u003c/strong>\n\u003cem>App help\u003c/em>\u003c/p>\n\u003cp>Background, lock-screen, download, and offline behavior can differ by device and app release. If a feature is missing or fails, contact support with your phone model, operating-system version, app version, and what happened.\u003c/p>\n\u003cp>\u003cstrong>84a. Where is Favorites?\u003c/strong>\n\u003cem>App help\u003c/em>\u003c/p>\n\u003cp>The current navigation calls your saved-music area \u003cstrong>Playlist\u003c/strong>. If you expected to see Favorites or cannot find music you saved, email \u003ca href=\"mailto:support@zodiac.fm\">support@zodiac.fm\u003c/a> with your device and app version.\u003c/p>\n\u003cp>\u003cstrong>84b. How do I add music to my Playlist?\u003c/strong>\n\u003cem>App help\u003c/em>\u003c/p>\n\u003cp>Email \u003ca href=\"mailto:support@zodiac.fm\">support@zodiac.fm\u003c/a> with your device and app version, and we will give you the current steps for adding music to your Playlist.\u003c/p>\n\u003cp>\u003cstrong>84c. How do I use the Queue?\u003c/strong>\n\u003cem>App help\u003c/em>\u003c/p>\n\u003cp>Email \u003ca href=\"mailto:support@zodiac.fm\">support@zodiac.fm\u003c/a> with your device and app version, and tell us what you want to play in order. We will give you the current Queue steps for that version.\u003c/p>\n\u003cp>\u003cstrong>84d. How do I reorder my Playlist?\u003c/strong>\n\u003cem>App help\u003c/em>\u003c/p>\n\u003cp>Email \u003ca href=\"mailto:support@zodiac.fm\">support@zodiac.fm\u003c/a> with your device and app version, and we will give you the current reordering steps for your Playlist.\u003c/p>\n\u003cp>\u003cstrong>84e. How do downloads work?\u003c/strong>\n\u003cem>App help\u003c/em>\u003c/p>\n\u003cp>Download and offline behavior can differ by device and app release. Email \u003ca href=\"mailto:support@zodiac.fm\">support@zodiac.fm\u003c/a> with your device, operating-system version, and app version so we can give you the current steps and help if a download fails.\u003c/p>\n\u003cp>\u003cstrong>85. What is My Zodiac?\u003c/strong>\n\u003cem>My Zodiac\u003c/em>\u003c/p>\n\u003cp>My Zodiac brings together your four fixed frequencies, their domains, their bands, and your listening picture so you can understand each part without turning your profile into a score or prediction.\u003c/p>\n\u003cp>\u003cstrong>86. What do weekly balance and all-time listening mean?\u003c/strong>\n\u003cem>My Zodiac\u003c/em>\u003c/p>\n\u003cp>Weekly balance shows how your listening is distributed across Core, Love, Vitality, and Abundance in the current week. All-time listening gives historical context. An earlier imbalance is not a debt, does not erase prior listening, and does not mean nothing happened.\u003c/p>\n\u003cp>\u003cstrong>87. What are Experiences to Explore, and where did they go?\u003c/strong>\n\u003cem>My Zodiac and app help\u003c/em>\u003c/p>\n\u003cp>Experiences to Explore are optional prompts for bringing one part of your profile into a real question or moment. They are not levels, assignments, or tests. Their location and availability depend on the current app release, so contact support if you expected to see them and cannot.\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>Membership, billing, and support\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>88. Are there discounts, coupons, partner prices, or protected renewal rates?\u003c/strong>\n\u003cem>Billing help\u003c/em>\u003c/p>\n\u003cp>Use the price and trial shown on the page where you are joining. Some approved routes and legacy accounts have different terms, but a private support adjustment or old code is not a public offer. If you already have an account, contact support before changing plans so your current terms can be checked.\u003c/p>\n\u003cp>\u003cstrong>89. How do renewals work, and what if I do not recognize a charge?\u003c/strong>\n\u003cem>Billing help\u003c/em>\u003c/p>\n\u003cp>Your checkout or app receipt states the plan, first charge, and renewal cadence you accepted. If a charge looks wrong, contact support with the date, amount, account email, and receipt or purchase reference. Do not send your full card number.\u003c/p>\n\u003cp>\u003cstrong>90. Can I pause, switch plans, change my email, or update billing information?\u003c/strong>\n\u003cem>Account help\u003c/em>\u003c/p>\n\u003cp>Those are separate account actions, and the available path depends on who bills you. Contact \u003ca href=\"mailto:support@zodiac.fm\">support@zodiac.fm\u003c/a> from your account email with the change you need, knowing that Apple must handle some subscription and payment changes when it bills you.\u003c/p>\n\u003cp>\u003cstrong>91. Can family members share an account or use multiple profiles?\u003c/strong>\n\u003cem>Account help\u003c/em>\u003c/p>\n\u003cp>There is no public family or multi-profile plan to promise here because each person&#39;s frequencies belong to that person&#39;s birth information and account. Contact support before sharing access or entering someone else&#39;s birth information.\u003c/p>\n\u003cp>\u003cstrong>92. Can I give Zodiac as a gift?\u003c/strong>\n\u003cem>Account help\u003c/em>\u003c/p>\n\u003cp>There is no verified self-serve gifting path to promise here. Contact support before purchasing for someone else. Do not create their profile or enter their birth information without their knowledge and permission.\u003c/p>\n\u003cp>\u003cstrong>93. Is there an affiliate, referral, practitioner, or partner program?\u003c/strong>\n\u003cem>Partner help\u003c/em>\u003c/p>\n\u003cp>Zodiac works with selected partners, including practitioners and newsletter writers. Program terms, enrollment, customer offers, and data permissions are separate and can change. Contact \u003ca href=\"mailto:support@zodiac.fm\">support@zodiac.fm\u003c/a> for the current route rather than relying on an old link or price.\u003c/p>\n\u003cp>\u003cstrong>94. Can I pay outside the United States, and why might a payment fail?\u003c/strong>\n\u003cem>Billing help\u003c/em>\u003c/p>\n\u003cp>Availability, currency conversion, taxes, card rules, and payment errors depend on the checkout and payment provider. Use the amount and currency shown before you confirm. If payment fails, contact support with your country, the checkout you used, and the error message. Do not send full card details.\u003c/p>\n\u003cp>\u003cstrong>95. How do I contact Zodiac for help?\u003c/strong>\n\u003cem>Website and app\u003c/em>\u003c/p>\n\u003cp>Email \u003ca href=\"mailto:support@zodiac.fm\">support@zodiac.fm\u003c/a>. Write from your account email when you can, describe the question or problem, and include your device and app version for playback issues. Never send your password, full card number, or complete birth information in an unsecured first message.\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>Privacy and future products\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>96. Is my information encrypted and secure?\u003c/strong>\n\u003cem>Privacy and account help\u003c/em>\u003c/p>\n\u003cp>Zodiac is committed to protecting your information, but we do not make a blanket technical promise about every data type, system, and storage state without current verification. The \u003ca href=\"https://zodiac.fm/privacy\" target=\"_blank\" rel=\"noopener noreferrer\">Privacy Policy\u003c/a> is the controlling public account. Contact support if you need an answer about a specific kind of information.\u003c/p>\n\u003cp>\u003cstrong>97. Can I correct, export, delete, or close my account and data?\u003c/strong>\n\u003cem>Privacy and account help\u003c/em>\u003c/p>\n\u003cp>Those are separate requests, as are subscription cancellation and removal from marketing messages. Follow the current route in the \u003ca href=\"https://zodiac.fm/privacy\" target=\"_blank\" rel=\"noopener noreferrer\">Privacy Policy\u003c/a>, or contact \u003ca href=\"mailto:support@zodiac.fm\">support@zodiac.fm\u003c/a> and say exactly what you want to do. Support will guide you through the applicable identity and account steps.\u003c/p>\n\u003cp>\u003cstrong>98. What is Frequency Matchmaking?\u003c/strong>\n\u003cem>Future-product education\u003c/em>\u003c/p>\n\u003cp>Frequency Matchmaking is a future way to compare two complete four-frequency profiles across their musical relationships. It is designed as a reading of harmony, contrast, and tension, not a compatibility score or a verdict about whether two people should be together. Any use of another person&#39;s information will require an approved product and consent path.\u003c/p>\n\u003cp>\u003cstrong>99. What is the future Planetary Cycle Engine?\u003c/strong>\n\u003cem>Future-product education\u003c/em>\u003c/p>\n\u003cp>It is a planned way to interpret changing transits, returns, and other cycles against your fixed birth pattern. It would not change your four frequencies or put current transits into the music. Detailed behavior and release timing are not yet promises.\u003c/p>\n\u003cp>\u003cstrong>100. What is coming next, and what does founding member mean?\u003c/strong>\n\u003cem>Membership and roadmap\u003c/em>\u003c/p>\n\u003cp>Zodiac is continuing to build the music library and member experience. A founding rate is protected while the membership remains continuous under its original terms. It does not automatically promise every future product, feature, or release date. Current entitlements come from the offer you joined.\u003c/p>\n\u003cp>\u003cstrong>101. Can I listen to or use another person&#39;s frequencies?\u003c/strong>\n\u003cem>Member help\u003c/em>\u003c/p>\n\u003cp>Zodiac is built around your own calculated result. We do not claim that another person&#39;s frequencies will do the same thing for you. Do not enter, save, or share someone else&#39;s birth information without their knowledge and an approved consent path.\u003c/p>\n\u003cp>\u003cstrong>102. Are my frequencies literally unique to me?\u003c/strong>\n\u003cem>Website\u003c/em>\u003c/p>\n\u003cp>Your frequencies are personal because Zodiac calculates them from your birth information. That does not make the values mathematically exclusive to one person, since people born at the same time and place can share them. How those signals meet your life remains personal to you.\u003c/p>\n\u003cp>\u003cstrong>103. Why are the frequencies between 250 and 950 hertz?\u003c/strong>\n\u003cem>Website\u003c/em>\u003c/p>\n\u003cp>Zodiac folds the calculated values into a directly audible musical range that suitable everyday audio equipment can reproduce while preserving the harmonic identity the product uses to place those frequencies inside music.\u003c/p>\n\u003cp>\u003cstrong>104. Why doesn&#39;t Zodiac publish the exact calculation formula?\u003c/strong>\n\u003cem>Website\u003c/em>\u003c/p>\n\u003cp>The calculation is protected intellectual property. Zodiac can explain what goes in, what comes out, and what it built around the method without publishing the recipe or private provider details. Privacy is a boundary, not proof of the method.\u003c/p>\n\u003cp>\u003cstrong>105. What is the difference between a frequency, a band, and balance?\u003c/strong>\n\u003cem>Website and My Zodiac\u003c/em>\u003c/p>\n\u003cp>Your frequency is the fixed personal value for one domain. Its band describes your preferred way of processing information in that domain. Balance describes how your weekly listening time is distributed across Core, Love, Vitality, and Abundance.\u003c/p>\n\u003cp>\u003cstrong>106. Where did the protected method come from?\u003c/strong>\n\u003cem>Website and About\u003c/em>\u003c/p>\n\u003cp>Zodiac begins with Nāda Brahma, the Vedic view that reality is sound. Within that worldview, a birth pattern having a sound follows naturally. A mantra lineage had developed a protected method for finding it. Zodiac uses the frequency part of that method, while the sacred mantras remain private.\u003c/p>\n\u003cp>Zodiac does not ask you to treat that privacy as proof, does not claim that all astrology or Human Design came from Nāda Brahma, and does not present its modern app, band model, or music system as ancient technology.\u003c/p>\n","text":"Zodiac customer FAQ bank\n\nFinal writing pass, October 18, 2026. Each question has one job and a named placement. Website answers serve the general public. Member, account, billing, and app help answers apply only where their stated route and current product evidence match.\n\nGetting to know Zodiac\n\n1. What is Zodiac.fm?\nWebsite and app\n\nZodiac uses music tuned to four personal frequencies calculated from your birth information. Over time, listening to your personalized frequencies amplifies your access to the connected self, making it more available in your everyday life.\n\n2. What do you mean by my connected self?\nWebsite and app\n\nIt's the part of you connected to everything and everyone else, who you were before anyone taught you who to be. You might call it your essence, soul, or higher self. Use the word that means something to you.\n\nThat part of you is already whole. Zodiac is about amplifying your access to it, so more of who you are can come through in your relationships, your decisions, and what you contribute.\n\n3. How do I listen to Zodiac.fm?\nWebsite and getting started\n\nJust play your personalized music through headphones or a quality Bluetooth speaker. You don't have to concentrate on a tone or try to make anything happen. Listening amplifies your access to your connected self over time.\n\nThe change you notice may be a decision that becomes obvious, a boundary you recognize, or a growing sense of what is yours to do.\n\n4. Do I need to believe in astrology or Human Design?\nWebsite\n\nNo. You don't need to know your chart or adopt a belief system to listen. You can try Zodiac and pay attention to your own experience.\n\n5. Do I need to meditate while listening?\nWebsite and getting started\n\nNo, you can simply listen. If you enjoy meditation, you're welcome to use Zodiac with it. There's no special technique to learn.\n\n---\n\nYour frequencies and bands\n\n6. What are my four frequencies?\nWebsite and My Zodiac\n\nYour four frequencies are Core, Love, Vitality, and Abundance:\n\n- Core: The signal for who you are and what is yours to do.\n- Love: The signal for who to let close and how to connect.\n- Vitality: The signal for what feeds you and what drains you.\n- Abundance: The signal for when to move and which opportunities are yours.\n\n7. How are my frequencies calculated?\nWebsite\n\nWe use your birth date, time, and place to identify the planetary configuration when you were born, then a protected method turns that pattern into four frequencies in the audible range of 250 to 950 hertz.\n\n8. What if I don't know my birth time?\nWebsite and getting started\n\nUse your best estimate. If you know it was morning or evening, choose a time within that period. Use noon only if you have no idea.\n\nGive that starting point a steady week of listening before trying another time. If you're unsure how to approach it, write to us and we'll help you work with the information you have.\n\n9. Do my frequencies change over time?\nWebsite and My Zodiac\n\nYour four frequencies stay fixed. What grows with listening is your access to them, rather than the numbers changing as you grow.\n\nCorrecting your birth information can change the calculation, although not every correction produces different values.\n\n10. How do I correct my birth information?\nAccount help\n\nEmail support@zodiac.fm and tell us which detail needs correcting, without sending your full birth information in the first message. We'll help you make the change and check that it has gone through.\n\n11. What do my bands mean?\nWebsite and My Zodiac\n\nYour band tells you how you most naturally process information in that area of your life.\n\n- Root works through grounding and steadiness. Clarity comes when you're still, settled, and able to trust your gut.\n- Solar Plexus works through drive and motion. Moving or taking a small action helps you find out what feels right.\n- Throat works through articulation and expression. Speaking or writing helps you understand what you're processing.\n- Crown works through systems, perspective, and the bigger picture, helping you see where something fits when you widen your view.\n\nFor example, if your Core falls in Throat, questions about who you are and what matters to you become clearer through speaking or writing. Everyone can use all four approaches, with your band describing your most natural route.\n\n12. Why are several of my frequencies in the same band?\nMy Zodiac and member help\n\nThat's a normal result. Your four frequencies don't have to spread across all four bands, and a repeated band doesn't mean you're missing something.\n\nIt means that the same way of processing may come naturally in more than one area of your life. We haven't studied the distributions enough to give every combination a further meaning.\n\n13. What does it mean to be near the top of a band?\nMy Zodiac and member help\n\nIn the top third of Root, Solar Plexus, or Throat, you also carry aspects of the next band up. Your home band still leads.\n\nFor example, Core near the top of Root still finds clarity through groundedness, while drive and motion may also help clarify your identity signal. Crown has no next-band addition.\n\n---\n\nListening\n\n14. Can I listen through my phone or computer speakers?\nWebsite and getting started\n\nPlease use headphones, a quality Bluetooth speaker, or your car's sound system instead of built-in phone or computer speakers. Your phone or computer can play the music through those.\n\nChoose a volume that's clear and comfortable, without turning it up to overpower the noise around you.\n\n15. How much should I listen?\nWebsite and getting started\n\nAim for about nine minutes a day on average across the week. That's roughly 63 minutes, with all four frequencies included. Find a time that fits your life so listening becomes easy to keep coming back to.\n\n16. How do I balance my four frequencies?\nGetting started and My Zodiac\n\nGive each frequency at least 15 percent of your total listening across the week. The remaining 40 percent can go wherever you'd like more emphasis.\n\nYou don't need exactly equal time. Rotate through the four, then check your weekly percentages to see whether one needs a little more attention.\n\n17. What happens if I miss a day?\nMember help\n\nJust pick up again when you can. The listening guidance is a weekly average, so you don't have to maintain a daily streak. A missed day doesn't erase the listening you've already done.\n\n18. Can I do other things while listening?\nWebsite and getting started\n\nYes. You can listen while working, walking, cooking, or relaxing. Choose music that suits what you're doing and keep it at a comfortable volume.\n\nIf you're driving or doing something that needs your full attention, avoid sleep music or anything you find distracting.\n\n19. Can I listen while sleeping?\nWebsite and member help\n\nYes, the library includes music intended for sleep. Choose a comfortable volume and include all four frequencies across your week, rather than playing only one every night.\n\n20. What if the music isn't my style?\nMusic library and member help\n\nTry a different piece or one with a quieter feel. You don't have to enjoy every piece.\n\nAnd tell us what you'd like to hear. Favorite artists or genres give us something useful to work with as we add music.\n\n21. Can I listen to a pure tone instead?\nMember help\n\nWe don't currently offer a pure-tone option. What we've studied is listening to your frequencies in the Zodiac music, so we can't say a tone generator gives you the same experience.\n\n22. How is my frequency put into the music?\nWebsite and member help\n\nEach piece is retuned until your personal frequency becomes one of its harmonies, so you can enjoy the music without trying to pick out a separate tone.\n\n23. Is Zodiac binaural beats?\nWebsite\n\nNo. Binaural beats use a different tone in each ear. Zodiac carries one of your personal frequencies in the music, so it doesn't depend on that separation between your ears.\n\n---\n\nYour experience\n\n24. What might I notice?\nWebsite and getting started\n\nYou may find yourself recognizing what feels right for you more easily. A decision becomes clearer, you notice what's draining your energy, or you stop talking yourself out of a boundary you already know you need.\n\nIt isn't necessarily a sensation while the music plays. Sometimes it's a gradual, instinctive knowing, and you recognize the difference in how you're living.\n\n25. What if I don't feel anything?\nWebsite and member help\n\nThat happens. Michael didn't notice a difference himself until about a month, while some people notice something much sooner.\n\nGive all four frequencies a place in your week and look at what happens outside the listening itself, such as decisions becoming clearer or recognizing what gives you energy a little sooner.\n\nIf you still aren't noticing anything, write to us with how long you've been listening and what you've tried so we can help you check the setup and routine.\n\n26. What if listening brings up difficult emotions?\nMember help\n\nYou don't have to push through or finish a track that feels uncomfortable. Some people have described reconnecting with parts of themselves as tender or overwhelming, and that unfamiliar feeling has sometimes eased with time.\n\nIf you'd like to continue, try a gentler track or just a few minutes. Taking a break is fine too. Tell us what you're experiencing so we can respond to you, rather than assume everyone needs the same advice.\n\nWe can't tell from an emotional reaction alone what caused it, and discomfort isn't proof that Zodiac is working.\n\n27. What if the sound causes physical discomfort?\nMember help\n\nStop listening if the sound hurts or you notice a concerning physical reaction. You don't need to keep testing the same headphones or track.\n\nFor symptoms that are severe, persistent, or worrying, seek appropriate professional advice. Zodiac isn't medical treatment, and we won't explain away physical symptoms as part of the process.\n\n28. Do I have to listen forever?\nWebsite and member help\n\nThere isn't a fixed finish line. Zodiac builds through repeated listening, and we haven't established a point where everyone can stop and keep a permanent result. You can decide what continuing adds to your life and take a break when you want to.\n\n---\n\nThe study\n\n29. What were the results of your study?\nWebsite\n\nIn our 52-week internal study, 300 people started and 278 completed it. Participants answered open-ended questions every two weeks, and Michael grouped their responses into recurring themes.\n\nAmong people who listened as designed, 84 percent called Zodiac life-changing. Listening as designed meant averaging at least nine minutes a day across the week, with each frequency receiving at least 15 percent of their listening.\n\nThat group reported seven kinds of change:\n\n- Internal regulation, 92 percent. Feeling calmer, with easier mornings, deeper sleep, or energy that held through more of the day.\n- Deeper self-access, 94 percent. Less effort to perform a version of themselves and more recognition of who they are underneath it. A feeling of coming home.\n- Sharper instincts, 91 percent. A clearer sense of what felt right, with less second-guessing.\n- Better relationships and love, 90 percent. More ease in showing up as themselves and connecting with others.\n- Life responds, 88 percent. Useful opportunities, connections, and timing showing up as they moved through life differently.\n- Connection to something bigger, 90 percent. Feeling part of something beyond their individual life.\n- The witness, 91 percent. This change tended to arrive later, bringing more space between what happened and how they responded.\n\nIn that group, 96 percent reported three or more outcomes. Across all completers, 98.6 percent would recommend Zodiac and 70.5 percent called it life-changing.\n\nThese are participants' reports from our own study, rather than results from an independent clinical trial. Internal regulation describes their experience, not a measured biological change.\n\n30. How long does it take to notice a change?\nWebsite and getting started\n\nIt varies. Some people notice something quickly, while others recognize changes gradually in everyday life.\n\nIn our year-long internal study, among people averaging at least nine minutes a day with every frequency receiving at least 15 percent of their listening, 61 percent reported a clear shift by month one, 81 percent by month three, and 87 percent by month six.\n\nThose are cumulative reports, so the later figures include people who noticed something earlier. They give you a sense of the range we saw, rather than a deadline you have to meet.\n\n31. Is Zodiac scientifically proven?\nWebsite\n\nNo independent clinical trial has proven Zodiac or its complete mechanism. What we have is a year-long internal study and a growing body of customer experiences that help us understand what people notice.\n\nOur explanation for why it happens is still a working model.\n\n---\n\nApp and account help\n\n32. Where can I listen to Zodiac?\nWebsite and getting started\n\nYou can listen in the native iPhone app, the native Android app, or through Zodiac in a desktop or laptop browser. Sign in with the same email address wherever you listen.\n\n33. What should I do if I can't sign in?\nAccount help\n\nCheck that you're using the email address you signed up with. If you're still stuck, email support@zodiac.fm and tell us what happens when you try. An error screenshot can help us find the problem. Please don't send your password.\n\n34. Why is my paid music still locked?\nAccount help\n\nFirst check that you're signed into the account you used to purchase. If you are, contact support@zodiac.fm with your account email and purchase reference so we can check the access.\n\nPlease don't buy again to solve it. Let us help with the membership you've already paid for.\n\n35. What should I do if the music keeps stopping?\nMember help\n\nEmail support@zodiac.fm with your device and whether you're listening in the app or a browser. Include when it stops, such as when you lock the screen.\n\nThose details help us investigate the problem you are having, rather than send you through a list of unrelated fixes.\n\n---\n\nMembership\n\n36. Can I use Zodiac for free?\nWebsite\n\nYes. You keep three short songs in each of your four frequencies for free, without a paid membership. You can get started at your own pace.\n\n37. What does Zodiac cost?\nHomepage\n\nAnnual membership is $9.08 a month, billed as $109 yearly. The monthly option is $17, and both plans include access to the longer music.\n\n38. Can I try the paid membership first?\nHomepage\n\nYes. You can try either plan for seven days for $3. Choose monthly or annual when you join, and that plan begins on day eight unless you cancel during the trial.\n\n39. How do I cancel my website subscription?\nWebsite billing help\n\nEmail support@zodiac.fm from your account address and ask us to stop the renewal. You don't need to explain why. If you're in the seven-day website trial, contact us before it ends to avoid the membership charge.\n\nIf Apple bills you, manage the subscription through your Apple subscription settings. Cancellation stops the next charge but does not delete your Zodiac account or personal information.\n\n40. Can I get a refund on my website purchase?\nWebsite billing help\n\nPurchases that begin with a trial aren't refundable. That includes the $3 trial charge. Please cancel during the seven days if you don't want your selected plan to begin.\n\nIf you joined before trials were introduced, your original refund window applies: 90 days from purchase for annual membership or 30 days for monthly membership. If you're unsure which applies to you, write to us and we'll check your purchase.\n\n41. Why was I charged after I canceled?\nBilling help\n\nPlease contact support@zodiac.fm so we can check what happened. Send the charge date, amount, account email, and any cancellation confirmation you have. Leave out your full card number.\n\nIf you believe you canceled, we want to investigate that with you. We won't assume the charge is correct just because it appears in the account.\n\n---\n\nPrivacy\n\n42. How do you use my personal information?\nWebsite and account help\n\nWe use your birth date, time, and place to calculate your frequencies. We use account and listening information to provide Zodiac. The current Privacy Policy explains the service providers involved, any advertising or analytics use, retention, and the choices available to you.\n\nBecause those details can differ by signup surface and change over time, the Privacy Policy is the controlling public answer. Please contact support@zodiac.fm if you want help with a specific privacy question.\n\n43. How do I delete my account?\nAccount help\n\nFollow the account-deletion route in our Privacy Policy, or contact support@zodiac.fm for help. Cancel any active subscription with the billing provider too, because cancellation, account closure, and deletion of personal information are separate requests.\n\n---\n\nUnderstanding the product\n\n44. Is Zodiac a horoscope, Human Design reading, or astrology reading?\nWebsite\n\nNo. Zodiac uses your birth information, but it does not return a horoscope or a written chart reading. It turns your birth pattern into four personal frequencies and puts those frequencies into music.\n\n45. How is Zodiac different from astrology, Human Design, or a sound app?\nWebsite\n\nAstrology and Human Design give you a map and language for understanding your nature. Zodiac gives you another way in: listening to the frequencies of your own birth pattern so that what a good reading helps you recognize can become easier to know from within.\n\nUnlike a general sound app, the music is tuned to your four personal frequencies.\n\n46. What do I receive when I sign up?\nWebsite\n\nYou receive your four calculated frequencies, their four domains and bands, and personalized music in Zodiac's native apps or desktop and laptop browser experience. Every account keeps three short pieces in each frequency. A paid membership opens the longer music available under the offer you chose.\n\n47. Does Zodiac make me more myself?\nWebsite\n\nIt does not add a new self or change your connected self. Zodiac is designed to amplify your access to what is already there, so your own nature becomes easier to recognize and live from.\n\n48. Is Zodiac a religion, guru system, or belief system?\nWebsite\n\nNo. Zodiac draws from a Vedic view of sound, but it does not ask you to join a religion, follow a guru, or surrender your judgment. You press play, live your life, and pay attention to your own experience.\n\n49. Who is behind Zodiac?\nAbout and website\n\nZodiac was founded by Michael Lovitch, who kept following the question of how a birth pattern could be experienced through sound after Vedic astrologers described what years of therapy had helped him uncover. He brought the frequency part of a mantra lineage's protected method into music, then tested Zodiac in a year-long internal study.\n\n50. What does my frequency number mean? Is a higher number better?\nWebsite and My Zodiac\n\nThe number is the acoustic value of one part of your birth signature, measured in hertz. Higher is not better, stronger, or more evolved. Its domain tells you what area of life it speaks to, and its band describes how you most naturally process information in that area.\n\n51. Why are there four frequencies? Are they four versions of me?\nWebsite and My Zodiac\n\nCore, Love, Vitality, and Abundance are four parts of one birth signature, not four separate selves. Together they cover identity and direction, connection, energy, and opportunity. They are useful reference points, not a claim to contain your whole life.\n\n52. Are my bands fixed, or can they change?\nMy Zodiac\n\nYour bands come from your four fixed frequency values, so they stay fixed too. A band can change only if corrected birth information changes the underlying frequency enough to place it in another range.\n\n53. Am I supposed to feel a frequency in the body area connected to its band?\nMy Zodiac and member help\n\nNo. You may notice something there, or you may not. The body area is an invitation to pay attention, not a test of whether the music is working.\n\n54. Where did the band system come from?\nWebsite and My Zodiac\n\nThe protected method produces the four frequency values. Zodiac built the band model around where those values fall between 250 and 950 hertz, using patterns observed during the year-long beta. The band interpretation is Zodiac's model, not an ancient teaching supplied with the calculation.\n\n---\n\nThe calculation and the music\n\n55. What birth information does Zodiac need?\nWebsite\n\nYour birth date, exact or best-known birth time, and birth place. Those details establish the planetary arrangement at the moment and location of your birth.\n\n56. Does my name affect the calculation?\nWebsite\n\nNo. Your name can identify your account, but it is not part of the frequency calculation. Zodiac is not numerology.\n\n57. Does Zodiac use Western, Vedic, tropical, or sidereal astrology?\nWebsite\n\nZodiac comes through a Vedic sound worldview and uses the planetary pattern at birth as its starting point. It does not give you a Western, Vedic, tropical, or sidereal chart reading. A protected method turns the birth pattern into four frequencies.\n\n58. Do current transits or planetary cycles change my four frequencies?\nWebsite and My Zodiac\n\nNo. Your birth frequencies remain fixed while the sky and your life keep moving. That stable reference is what helps you find your way through changing transits, returns, progressions, and other cycles.\n\n59. Why does Zodiac use sound?\nWebsite\n\nNāda Brahma is a Vedic teaching that says the one reality beneath everything is sound. Within it, your birth pattern can have a sound too. Zodiac holds this as a possibility rather than scientific proof, then makes the four calculated frequencies practical by placing them in music.\n\n60. How is repeated listening understood to help?\nWebsite and getting started\n\nEach listen brings you back into contact with the same four personal signals. With repeated, balanced listening, those signals can become easier to recognize in ordinary life, including your decisions, relationships, energy, and sense of timing. There is no required sensation during a track.\n\n61. Does Zodiac use isochronic, brainwave, healing, Solfeggio, or nervous-system frequencies?\nWebsite\n\nNo. Your four frequencies come from your birth information through Zodiac's protected method. They are not brainwave targets, Solfeggio numbers, a medical treatment, or a claim to regulate your nervous system.\n\n62. What does hertz mean for my audible frequency?\nWebsite\n\nHertz means cycles per second. Zodiac brings each calculated value into the audible range between 250 and 950 hertz, then retunes the music so your frequency sits inside it as a harmony. You do not need to isolate the frequency by ear for the music to carry it.\n\n63. Why can the same piece appear under different frequencies?\nMusic library and member help\n\nThe composition can stay the same while its tuning changes. Zodiac makes a frequency-specific version so Core, Love, Vitality, or Abundance carries the correct personal value for that part of your system.\n\n64. Is the music made with AI?\nWebsite and music library\n\nNo. Real musicians compose the music. Zodiac then creates the frequency-specific versions required to place each personal frequency inside the piece.\n\n65. What kinds of music are available, and why is the catalog still growing?\nMusic library\n\nThe library includes pieces for different moods, lengths, and moments in the day. Each new composition also has to be tuned across the personal frequency range and prepared for all four domains, so adding music is more involved than uploading one ordinary recording. Check the current library for what is available now.\n\n---\n\nListening well\n\n66. Where should I start?\nGetting started\n\nChoose any piece you want to hear and press play. Over the week, include Core, Love, Vitality, and Abundance rather than trying to find one perfect starting frequency.\n\n67. Can I focus more on one frequency?\nGetting started and My Zodiac\n\nYes. Give every frequency at least 15 percent of your weekly listening, then use the remaining 40 percent wherever you want more attention. Balance leaves room for emphasis.\n\n68. What time of day is best?\nGetting started\n\nThe time you can return to is best. You can listen in the morning, during the day, or at night. Choose music that fits the moment and build a rhythm that works in your actual life.\n\n69. Can I listen while driving or operating machinery?\nMember help\n\nOrdinary music listening can be fine while driving when it is legal, safely set up, and not distracting. Avoid sleep-oriented, deeply unwinding, or personally distracting pieces whenever you need full alertness.\n\n70. Can I use Zodiac with meditation, journaling, therapy, coaching, or another practice?\nWebsite and member help\n\nYes. Zodiac does not replace those practices, and it does not require them. Use the music alongside what already supports you, or simply let it play during an ordinary day.\n\n71. Do I need two working ears or a particular hearing setup?\nMember help\n\nZodiac does not use a different tone in each ear, so split-ear listening is not part of the method. You can choose headphones, a speaker, a car system, or either-ear listening at a comfortable volume. We cannot promise that every hearing aid, device, speaker, or audio path reproduces every recording in exactly the same way. Contact support if you need help finding a workable setup.\n\n---\n\nResults, evidence, and safety\n\n72. Why does everyone experience Zodiac differently?\nWebsite and member help\n\nPeople begin with different lives, habits, sensitivities, and ways of recognizing change. Your four frequencies and bands are personal too. Some people notice something during the music, while others first see it in a decision, relationship, or change of direction later.\n\n73. Is Zodiac supposed to make me feel amazing all the time?\nWebsite and member help\n\nNo. The point is clearer access to yourself, not one permanent mood. Your life still contains difficulty, uncertainty, grief, conflict, and change.\n\n74. Does Zodiac guarantee results?\nWebsite\n\nNo individual result or timetable is guaranteed. Zodiac can tell you what participants reported in its internal study and how the product is designed to be used. Your own experience is still your own.\n\n75. Is Zodiac medical, and can it treat a condition?\nWebsite and member help\n\nZodiac is music and self-recognition rather than medical care, so it does not diagnose, treat, cure, or prevent a condition. Bring health questions to an appropriate professional.\n\n76. Is Zodiac established as safe for children, pregnancy, seizure conditions, implanted devices, or other special populations?\nMember help\n\nZodiac-specific guidance has not been established for those situations, which does not mean the music is unsafe. We will not guess. Ask an appropriate professional who understands your circumstances before using it, and contact support with product questions.\n\n---\n\nAstrology, Human Design, and other practices\n\n77. How does Zodiac relate to astrology?\nWebsite\n\nAstrology reads your birth imprint as a chart and puts it into words. Zodiac's premise is that the same birth pattern has a sound. Your four fixed frequencies give you a way to recognize your nature from within as you move through changing transits and cycles.\n\n78. How does Zodiac work with Human Design?\nWebsite\n\nHuman Design gives you language for Type, Strategy, Authority, Centers, profile, and incarnation cross. Zodiac does not turn each of those chart parts into a tone. It offers intuitive access to the nature that Human Design helps you understand, so living your design can become less abstract.\n\n79. How does Zodiac work with Gene Keys?\nWebsite\n\nGene Keys offers a contemplative language for patterns and possibilities, while Zodiac does not encode those teachings into the music. It can sit beside that practice as another way to recognize your own nature from within.\n\n80. Does Zodiac replace astrology, Human Design, Gene Keys, meditation, or another practice?\nWebsite\n\nNo. A reading or practice can give you language, context, and a way to reflect, while Zodiac adds a listening practice that can make your own signal more available in everyday life.\n\n---\n\nApp and product features\n\n81. Is there an app, and how do I install it?\nGetting started\n\nYes. Download Zodiac for iPhone, download Zodiac for Android, or listen in a desktop or laptop browser. Sign in with the same email address you used when you joined, and email support@zodiac.fm if the app or your account does not open.\n\n82. Which devices and operating systems are supported?\nApp help\n\nNative iPhone and Android listening is available, and desktop or laptop browser listening continues.\n\nUse the current App Store or Google Play listing for phone requirements. If installation or playback fails, contact support@zodiac.fm with your device, operating-system version, and whether you were using the native app or a desktop or laptop browser.\n\n83. Does Zodiac play in the background or offline?\nApp help\n\nBackground, lock-screen, download, and offline behavior can differ by device and app release. If a feature is missing or fails, contact support with your phone model, operating-system version, app version, and what happened.\n\n84a. Where is Favorites?\nApp help\n\nThe current navigation calls your saved-music area Playlist. If you expected to see Favorites or cannot find music you saved, email support@zodiac.fm with your device and app version.\n\n84b. How do I add music to my Playlist?\nApp help\n\nEmail support@zodiac.fm with your device and app version, and we will give you the current steps for adding music to your Playlist.\n\n84c. How do I use the Queue?\nApp help\n\nEmail support@zodiac.fm with your device and app version, and tell us what you want to play in order. We will give you the current Queue steps for that version.\n\n84d. How do I reorder my Playlist?\nApp help\n\nEmail support@zodiac.fm with your device and app version, and we will give you the current reordering steps for your Playlist.\n\n84e. How do downloads work?\nApp help\n\nDownload and offline behavior can differ by device and app release. Email support@zodiac.fm with your device, operating-system version, and app version so we can give you the current steps and help if a download fails.\n\n85. What is My Zodiac?\nMy Zodiac\n\nMy Zodiac brings together your four fixed frequencies, their domains, their bands, and your listening picture so you can understand each part without turning your profile into a score or prediction.\n\n86. What do weekly balance and all-time listening mean?\nMy Zodiac\n\nWeekly balance shows how your listening is distributed across Core, Love, Vitality, and Abundance in the current week. All-time listening gives historical context. An earlier imbalance is not a debt, does not erase prior listening, and does not mean nothing happened.\n\n87. What are Experiences to Explore, and where did they go?\nMy Zodiac and app help\n\nExperiences to Explore are optional prompts for bringing one part of your profile into a real question or moment. They are not levels, assignments, or tests. Their location and availability depend on the current app release, so contact support if you expected to see them and cannot.\n\n---\n\nMembership, billing, and support\n\n88. Are there discounts, coupons, partner prices, or protected renewal rates?\nBilling help\n\nUse the price and trial shown on the page where you are joining. Some approved routes and legacy accounts have different terms, but a private suppor
