t adjustment or old code is not a public offer. If you already have an account, contact support before changing plans so your current terms can be checked.\n\n89. How do renewals work, and what if I do not recognize a charge?\nBilling help\n\nYour checkout or app receipt states the plan, first charge, and renewal cadence you accepted. If a charge looks wrong, contact support with the date, amount, account email, and receipt or purchase reference. Do not send your full card number.\n\n90. Can I pause, switch plans, change my email, or update billing information?\nAccount help\n\nThose are separate account actions, and the available path depends on who bills you. Contact support@zodiac.fm from your account email with the change you need, knowing that Apple must handle some subscription and payment changes when it bills you.\n\n91. Can family members share an account or use multiple profiles?\nAccount help\n\nThere is no public family or multi-profile plan to promise here because each person's frequencies belong to that person's birth information and account. Contact support before sharing access or entering someone else's birth information.\n\n92. Can I give Zodiac as a gift?\nAccount help\n\nThere is no verified self-serve gifting path to promise here. Contact support before purchasing for someone else. Do not create their profile or enter their birth information without their knowledge and permission.\n\n93. Is there an affiliate, referral, practitioner, or partner program?\nPartner help\n\nZodiac works with selected partners, including practitioners and newsletter writers. Program terms, enrollment, customer offers, and data permissions are separate and can change. Contact support@zodiac.fm for the current route rather than relying on an old link or price.\n\n94. Can I pay outside the United States, and why might a payment fail?\nBilling help\n\nAvailability, currency conversion, taxes, card rules, and payment errors depend on the checkout and payment provider. Use the amount and currency shown before you confirm. If payment fails, contact support with your country, the checkout you used, and the error message. Do not send full card details.\n\n95. How do I contact Zodiac for help?\nWebsite and app\n\nEmail support@zodiac.fm. Write from your account email when you can, describe the question or problem, and include your device and app version for playback issues. Never send your password, full card number, or complete birth information in an unsecured first message.\n\n---\n\nPrivacy and future products\n\n96. Is my information encrypted and secure?\nPrivacy and account help\n\nZodiac is committed to protecting your information, but we do not make a blanket technical promise about every data type, system, and storage state without current verification. The Privacy Policy is the controlling public account. Contact support if you need an answer about a specific kind of information.\n\n97. Can I correct, export, delete, or close my account and data?\nPrivacy and account help\n\nThose are separate requests, as are subscription cancellation and removal from marketing messages. Follow the current route in the Privacy Policy, or contact support@zodiac.fm and say exactly what you want to do. Support will guide you through the applicable identity and account steps.\n\n98. What is Frequency Matchmaking?\nFuture-product education\n\nFrequency Matchmaking is a future way to compare two complete four-frequency profiles across their musical relationships. It is designed as a reading of harmony, contrast, and tension, not a compatibility score or a verdict about whether two people should be together. Any use of another person's information will require an approved product and consent path.\n\n99. What is the future Planetary Cycle Engine?\nFuture-product education\n\nIt is a planned way to interpret changing transits, returns, and other cycles against your fixed birth pattern. It would not change your four frequencies or put current transits into the music. Detailed behavior and release timing are not yet promises.\n\n100. What is coming next, and what does founding member mean?\nMembership and roadmap\n\nZodiac is continuing to build the music library and member experience. A founding rate is protected while the membership remains continuous under its original terms. It does not automatically promise every future product, feature, or release date. Current entitlements come from the offer you joined.\n\n101. Can I listen to or use another person's frequencies?\nMember help\n\nZodiac is built around your own calculated result. We do not claim that another person's frequencies will do the same thing for you. Do not enter, save, or share someone else's birth information without their knowledge and an approved consent path.\n\n102. Are my frequencies literally unique to me?\nWebsite\n\nYour frequencies are personal because Zodiac calculates them from your birth information. That does not make the values mathematically exclusive to one person, since people born at the same time and place can share them. How those signals meet your life remains personal to you.\n\n103. Why are the frequencies between 250 and 950 hertz?\nWebsite\n\nZodiac folds the calculated values into a directly audible musical range that suitable everyday audio equipment can reproduce while preserving the harmonic identity the product uses to place those frequencies inside music.\n\n104. Why doesn't Zodiac publish the exact calculation formula?\nWebsite\n\nThe calculation is protected intellectual property. Zodiac can explain what goes in, what comes out, and what it built around the method without publishing the recipe or private provider details. Privacy is a boundary, not proof of the method.\n\n105. What is the difference between a frequency, a band, and balance?\nWebsite and My Zodiac\n\nYour frequency is the fixed personal value for one domain. Its band describes your preferred way of processing information in that domain. Balance describes how your weekly listening time is distributed across Core, Love, Vitality, and Abundance.\n\n106. Where did the protected method come from?\nWebsite and About\n\nZodiac begins with Nāda Brahma, the Vedic view that reality is sound. Within that worldview, a birth pattern having a sound follows naturally. A mantra lineage had developed a protected method for finding it. Zodiac uses the frequency part of that method, while the sacred mantras remain private.\n\nZodiac does not ask you to treat that privacy as proof, does not claim that all astrology or Human Design came from Nāda Brahma, and does not present its modern app, band model, or music system as ancient technology.","copyText":"# Zodiac customer FAQ bank\n\nFinal writing pass, October 18, 2026. Each question has one job and a named placement. Website answers serve the general public. Member, account, billing, and app help answers apply only where their stated route and current product evidence match.\n\n**Getting to know Zodiac**\n\n**1. What is Zodiac.fm?**\n*Website and app*\n\nZodiac uses music tuned to four personal frequencies calculated from your birth information. Over time, listening to your personalized frequencies amplifies your access to the connected self, making it more available in your everyday life.\n\n**2. What do you mean by my connected self?**\n*Website and app*\n\nIt's the part of you connected to everything and everyone else, who you were before anyone taught you who to be. You might call it your essence, soul, or higher self. Use the word that means something to you.\n\nThat part of you is already whole. Zodiac is about amplifying your access to it, so more of who you are can come through in your relationships, your decisions, and what you contribute.\n\n**3. How do I listen to Zodiac.fm?**\n*Website and getting started*\n\nJust play your personalized music through headphones or a quality Bluetooth speaker. You don't have to concentrate on a tone or try to make anything happen. Listening amplifies your access to your connected self over time.\n\nThe change you notice may be a decision that becomes obvious, a boundary you recognize, or a growing sense of what is yours to do.\n\n**4. Do I need to believe in astrology or Human Design?**\n*Website*\n\nNo. You don't need to know your chart or adopt a belief system to listen. You can try Zodiac and pay attention to your own experience.\n\n**5. Do I need to meditate while listening?**\n*Website and getting started*\n\nNo, you can simply listen. If you enjoy meditation, you're welcome to use Zodiac with it. There's no special technique to learn.\n\n---\n\n**Your frequencies and bands**\n\n**6. What are my four frequencies?**\n*Website and My Zodiac*\n\nYour four frequencies are Core, Love, Vitality, and Abundance:\n\n- Core: The signal for who you are and what is yours to do.\n- Love: The signal for who to let close and how to connect.\n- Vitality: The signal for what feeds you and what drains you.\n- Abundance: The signal for when to move and which opportunities are yours.\n\n**7. How are my frequencies calculated?**\n*Website*\n\nWe use your birth date, time, and place to identify the planetary configuration when you were born, then a protected method turns that pattern into four frequencies in the audible range of 250 to 950 hertz.\n\n**8. What if I don't know my birth time?**\n*Website and getting started*\n\nUse your best estimate. If you know it was morning or evening, choose a time within that period. Use noon only if you have no idea.\n\nGive that starting point a steady week of listening before trying another time. If you're unsure how to approach it, write to us and we'll help you work with the information you have.\n\n**9. Do my frequencies change over time?**\n*Website and My Zodiac*\n\nYour four frequencies stay fixed. What grows with listening is your access to them, rather than the numbers changing as you grow.\n\nCorrecting your birth information can change the calculation, although not every correction produces different values.\n\n**10. How do I correct my birth information?**\n*Account help*\n\nEmail support@zodiac.fm and tell us which detail needs correcting, without sending your full birth information in the first message. We'll help you make the change and check that it has gone through.\n\n**11. What do my bands mean?**\n*Website and My Zodiac*\n\nYour band tells you how you most naturally process information in that area of your life.\n\n- Root works through grounding and steadiness. Clarity comes when you're still, settled, and able to trust your gut.\n- Solar Plexus works through drive and motion. Moving or taking a small action helps you find out what feels right.\n- Throat works through articulation and expression. Speaking or writing helps you understand what you're processing.\n- Crown works through systems, perspective, and the bigger picture, helping you see where something fits when you widen your view.\n\nFor example, if your Core falls in Throat, questions about who you are and what matters to you become clearer through speaking or writing. Everyone can use all four approaches, with your band describing your most natural route.\n\n**12. Why are several of my frequencies in the same band?**\n*My Zodiac and member help*\n\nThat's a normal result. Your four frequencies don't have to spread across all four bands, and a repeated band doesn't mean you're missing something.\n\nIt means that the same way of processing may come naturally in more than one area of your life. We haven't studied the distributions enough to give every combination a further meaning.\n\n**13. What does it mean to be near the top of a band?**\n*My Zodiac and member help*\n\nIn the top third of Root, Solar Plexus, or Throat, you also carry aspects of the next band up. Your home band still leads.\n\nFor example, Core near the top of Root still finds clarity through groundedness, while drive and motion may also help clarify your identity signal. Crown has no next-band addition.\n\n---\n\n**Listening**\n\n**14. Can I listen through my phone or computer speakers?**\n*Website and getting started*\n\nPlease use headphones, a quality Bluetooth speaker, or your car's sound system instead of built-in phone or computer speakers. Your phone or computer can play the music through those.\n\nChoose a volume that's clear and comfortable, without turning it up to overpower the noise around you.\n\n**15. How much should I listen?**\n*Website and getting started*\n\nAim for about nine minutes a day on average across the week. That's roughly 63 minutes, with all four frequencies included. Find a time that fits your life so listening becomes easy to keep coming back to.\n\n**16. How do I balance my four frequencies?**\n*Getting started and My Zodiac*\n\nGive each frequency at least 15 percent of your total listening across the week. The remaining 40 percent can go wherever you'd like more emphasis.\n\nYou don't need exactly equal time. Rotate through the four, then check your weekly percentages to see whether one needs a little more attention.\n\n**17. What happens if I miss a day?**\n*Member help*\n\nJust pick up again when you can. The listening guidance is a weekly average, so you don't have to maintain a daily streak. A missed day doesn't erase the listening you've already done.\n\n**18. Can I do other things while listening?**\n*Website and getting started*\n\nYes. You can listen while working, walking, cooking, or relaxing. Choose music that suits what you're doing and keep it at a comfortable volume.\n\nIf you're driving or doing something that needs your full attention, avoid sleep music or anything you find distracting.\n\n**19. Can I listen while sleeping?**\n*Website and member help*\n\nYes, the library includes music intended for sleep. Choose a comfortable volume and include all four frequencies across your week, rather than playing only one every night.\n\n**20. What if the music isn't my style?**\n*Music library and member help*\n\nTry a different piece or one with a quieter feel. You don't have to enjoy every piece.\n\nAnd tell us what you'd like to hear. Favorite artists or genres give us something useful to work with as we add music.\n\n**21. Can I listen to a pure tone instead?**\n*Member help*\n\nWe don't currently offer a pure-tone option. What we've studied is listening to your frequencies in the Zodiac music, so we can't say a tone generator gives you the same experience.\n\n**22. How is my frequency put into the music?**\n*Website and member help*\n\nEach piece is retuned until your personal frequency becomes one of its harmonies, so you can enjoy the music without trying to pick out a separate tone.\n\n**23. Is Zodiac binaural beats?**\n*Website*\n\nNo. Binaural beats use a different tone in each ear. Zodiac carries one of your personal frequencies in the music, so it doesn't depend on that separation between your ears.\n\n---\n\n**Your experience**\n\n**24. What might I notice?**\n*Website and getting started*\n\nYou may find yourself recognizing what feels right for you more easily. A decision becomes clearer, you notice what's draining your energy, or you stop talking yourself out of a boundary you already know you need.\n\nIt isn't necessarily a sensation while the music plays. Sometimes it's a gradual, instinctive knowing, and you recognize the difference in how you're living.\n\n**25. What if I don't feel anything?**\n*Website and member help*\n\nThat happens. Michael didn't notice a difference himself until about a month, while some people notice something much sooner.\n\nGive all four frequencies a place in your week and look at what happens outside the listening itself, such as decisions becoming clearer or recognizing what gives you energy a little sooner.\n\nIf you still aren't noticing anything, write to us with how long you've been listening and what you've tried so we can help you check the setup and routine.\n\n**26. What if listening brings up difficult emotions?**\n*Member help*\n\nYou don't have to push through or finish a track that feels uncomfortable. Some people have described reconnecting with parts of themselves as tender or overwhelming, and that unfamiliar feeling has sometimes eased with time.\n\nIf you'd like to continue, try a gentler track or just a few minutes. Taking a break is fine too. Tell us what you're experiencing so we can respond to you, rather than assume everyone needs the same advice.\n\nWe can't tell from an emotional reaction alone what caused it, and discomfort isn't proof that Zodiac is working.\n\n**27. What if the sound causes physical discomfort?**\n*Member help*\n\nStop listening if the sound hurts or you notice a concerning physical reaction. You don't need to keep testing the same headphones or track.\n\nFor symptoms that are severe, persistent, or worrying, seek appropriate professional advice. Zodiac isn't medical treatment, and we won't explain away physical symptoms as part of the process.\n\n**28. Do I have to listen forever?**\n*Website and member help*\n\nThere isn't a fixed finish line. Zodiac builds through repeated listening, and we haven't established a point where everyone can stop and keep a permanent result. You can decide what continuing adds to your life and take a break when you want to.\n\n---\n\n**The study**\n\n**29. What were the results of your study?**\n*Website*\n\nIn our 52-week internal study, 300 people started and 278 completed it. Participants answered open-ended questions every two weeks, and Michael grouped their responses into recurring themes.\n\nAmong people who listened as designed, **84 percent called Zodiac life-changing**. Listening as designed meant averaging at least nine minutes a day across the week, with each frequency receiving at least 15 percent of their listening.\n\nThat group reported seven kinds of change:\n\n- Internal regulation, 92 percent. Feeling calmer, with easier mornings, deeper sleep, or energy that held through more of the day.\n- Deeper self-access, 94 percent. Less effort to perform a version of themselves and more recognition of who they are underneath it. A feeling of coming home.\n- Sharper instincts, 91 percent. A clearer sense of what felt right, with less second-guessing.\n- Better relationships and love, 90 percent. More ease in showing up as themselves and connecting with others.\n- Life responds, 88 percent. Useful opportunities, connections, and timing showing up as they moved through life differently.\n- Connection to something bigger, 90 percent. Feeling part of something beyond their individual life.\n- The witness, 91 percent. This change tended to arrive later, bringing more space between what happened and how they responded.\n\nIn that group, **96 percent reported three or more outcomes**. Across all completers, **98.6 percent would recommend Zodiac and 70.5 percent called it life-changing**.\n\nThese are participants' reports from our own study, rather than results from an independent clinical trial. Internal regulation describes their experience, not a measured biological change.\n\n**30. How long does it take to notice a change?**\n*Website and getting started*\n\nIt varies. Some people notice something quickly, while others recognize changes gradually in everyday life.\n\nIn our year-long internal study, among people averaging at least nine minutes a day with every frequency receiving at least 15 percent of their listening, 61 percent reported a clear shift by month one, 81 percent by month three, and 87 percent by month six.\n\nThose are cumulative reports, so the later figures include people who noticed something earlier. They give you a sense of the range we saw, rather than a deadline you have to meet.\n\n**31. Is Zodiac scientifically proven?**\n*Website*\n\nNo independent clinical trial has proven Zodiac or its complete mechanism. What we have is a year-long internal study and a growing body of customer experiences that help us understand what people notice.\n\nOur explanation for why it happens is still a working model.\n\n---\n\n**App and account help**\n\n**32. Where can I listen to Zodiac?**\n*Website and getting started*\n\nYou can listen in the native iPhone app, the native Android app, or through Zodiac in a desktop or laptop browser. Sign in with the same email address wherever you listen.\n\n**33. What should I do if I can't sign in?**\n*Account help*\n\nCheck that you're using the email address you signed up with. If you're still stuck, email support@zodiac.fm and tell us what happens when you try. An error screenshot can help us find the problem. Please don't send your password.\n\n**34. Why is my paid music still locked?**\n*Account help*\n\nFirst check that you're signed into the account you used to purchase. If you are, contact support@zodiac.fm with your account email and purchase reference so we can check the access.\n\nPlease don't buy again to solve it. Let us help with the membership you've already paid for.\n\n**35. What should I do if the music keeps stopping?**\n*Member help*\n\nEmail support@zodiac.fm with your device and whether you're listening in the app or a browser. Include when it stops, such as when you lock the screen.\n\nThose details help us investigate the problem you are having, rather than send you through a list of unrelated fixes.\n\n---\n\n**Membership**\n\n**36. Can I use Zodiac for free?**\n*Website*\n\nYes. You keep three short songs in each of your four frequencies for free, without a paid membership. You can get started at your own pace.\n\n**37. What does Zodiac cost?**\n*Homepage*\n\nAnnual membership is $9.08 a month, billed as $109 yearly. The monthly option is $17, and both plans include access to the longer music.\n\n**38. Can I try the paid membership first?**\n*Homepage*\n\nYes. You can try either plan for seven days for $3. Choose monthly or annual when you join, and that plan begins on day eight unless you cancel during the trial.\n\n**39. How do I cancel my website subscription?**\n*Website billing help*\n\nEmail support@zodiac.fm from your account address and ask us to stop the renewal. You don't need to explain why. If you're in the seven-day website trial, contact us before it ends to avoid the membership charge.\n\nIf Apple bills you, manage the subscription through your Apple subscription settings. Cancellation stops the next charge but does not delete your Zodiac account or personal information.\n\n**40. Can I get a refund on my website purchase?**\n*Website billing help*\n\nPurchases that begin with a trial aren't refundable. That includes the $3 trial charge. Please cancel during the seven days if you don't want your selected plan to begin.\n\nIf you joined before trials were introduced, your original refund window applies: 90 days from purchase for annual membership or 30 days for monthly membership. If you're unsure which applies to you, write to us and we'll check your purchase.\n\n**41. Why was I charged after I canceled?**\n*Billing help*\n\nPlease contact support@zodiac.fm so we can check what happened. Send the charge date, amount, account email, and any cancellation confirmation you have. Leave out your full card number.\n\nIf you believe you canceled, we want to investigate that with you. We won't assume the charge is correct just because it appears in the account.\n\n---\n\n**Privacy**\n\n**42. How do you use my personal information?**\n*Website and account help*\n\nWe use your birth date, time, and place to calculate your frequencies. We use account and listening information to provide Zodiac. The current [Privacy Policy](https://zodiac.fm/privacy) explains the service providers involved, any advertising or analytics use, retention, and the choices available to you.\n\nBecause those details can differ by signup surface and change over time, the Privacy Policy is the controlling public answer. Please contact support@zodiac.fm if you want help with a specific privacy question.\n\n**43. How do I delete my account?**\n*Account help*\n\nFollow the account-deletion route in our [Privacy Policy](https://zodiac.fm/privacy), or contact support@zodiac.fm for help. Cancel any active subscription with the billing provider too, because cancellation, account closure, and deletion of personal information are separate requests.\n\n---\n\n**Understanding the product**\n\n**44. Is Zodiac a horoscope, Human Design reading, or astrology reading?**\n*Website*\n\nNo. Zodiac uses your birth information, but it does not return a horoscope or a written chart reading. It turns your birth pattern into four personal frequencies and puts those frequencies into music.\n\n**45. How is Zodiac different from astrology, Human Design, or a sound app?**\n*Website*\n\nAstrology and Human Design give you a map and language for understanding your nature. Zodiac gives you another way in: listening to the frequencies of your own birth pattern so that what a good reading helps you recognize can become easier to know from within.\n\nUnlike a general sound app, the music is tuned to your four personal frequencies.\n\n**46. What do I receive when I sign up?**\n*Website*\n\nYou receive your four calculated frequencies, their four domains and bands, and personalized music in Zodiac's native apps or desktop and laptop browser experience. Every account keeps three short pieces in each frequency. A paid membership opens the longer music available under the offer you chose.\n\n**47. Does Zodiac make me more myself?**\n*Website*\n\nIt does not add a new self or change your connected self. Zodiac is designed to amplify your access to what is already there, so your own nature becomes easier to recognize and live from.\n\n**48. Is Zodiac a religion, guru system, or belief system?**\n*Website*\n\nNo. Zodiac draws from a Vedic view of sound, but it does not ask you to join a religion, follow a guru, or surrender your judgment. You press play, live your life, and pay attention to your own experience.\n\n**49. Who is behind Zodiac?**\n*About and website*\n\nZodiac was founded by Michael Lovitch, who kept following the question of how a birth pattern could be experienced through sound after Vedic astrologers described what years of therapy had helped him uncover. He brought the frequency part of a mantra lineage's protected method into music, then tested Zodiac in a year-long internal study.\n\n**50. What does my frequency number mean? Is a higher number better?**\n*Website and My Zodiac*\n\nThe number is the acoustic value of one part of your birth signature, measured in hertz. Higher is not better, stronger, or more evolved. Its domain tells you what area of life it speaks to, and its band describes how you most naturally process information in that area.\n\n**51. Why are there four frequencies? Are they four versions of me?**\n*Website and My Zodiac*\n\nCore, Love, Vitality, and Abundance are four parts of one birth signature, not four separate selves. Together they cover identity and direction, connection, energy, and opportunity. They are useful reference points, not a claim to contain your whole life.\n\n**52. Are my bands fixed, or can they change?**\n*My Zodiac*\n\nYour bands come from your four fixed frequency values, so they stay fixed too. A band can change only if corrected birth information changes the underlying frequency enough to place it in another range.\n\n**53. Am I supposed to feel a frequency in the body area connected to its band?**\n*My Zodiac and member help*\n\nNo. You may notice something there, or you may not. The body area is an invitation to pay attention, not a test of whether the music is working.\n\n**54. Where did the band system come from?**\n*Website and My Zodiac*\n\nThe protected method produces the four frequency values. Zodiac built the band model around where those values fall between 250 and 950 hertz, using patterns observed during the year-long beta. The band interpretation is Zodiac's model, not an ancient teaching supplied with the calculation.\n\n---\n\n**The calculation and the music**\n\n**55. What birth information does Zodiac need?**\n*Website*\n\nYour birth date, exact or best-known birth time, and birth place. Those details establish the planetary arrangement at the moment and location of your birth.\n\n**56. Does my name affect the calculation?**\n*Website*\n\nNo. Your name can identify your account, but it is not part of the frequency calculation. Zodiac is not numerology.\n\n**57. Does Zodiac use Western, Vedic, tropical, or sidereal astrology?**\n*Website*\n\nZodiac comes through a Vedic sound worldview and uses the planetary pattern at birth as its starting point. It does not give you a Western, Vedic, tropical, or sidereal chart reading. A protected method turns the birth pattern into four frequencies.\n\n**58. Do current transits or planetary cycles change my four frequencies?**\n*Website and My Zodiac*\n\nNo. Your birth frequencies remain fixed while the sky and your life keep moving. That stable reference is what helps you find your way through changing transits, returns, progressions, and other cycles.\n\n**59. Why does Zodiac use sound?**\n*Website*\n\nNāda Brahma is a Vedic teaching that says the one reality beneath everything is sound. Within it, your birth pattern can have a sound too. Zodiac holds this as a possibility rather than scientific proof, then makes the four calculated frequencies practical by placing them in music.\n\n**60. How is repeated listening understood to help?**\n*Website and getting started*\n\nEach listen brings you back into contact with the same four personal signals. With repeated, balanced listening, those signals can become easier to recognize in ordinary life, including your decisions, relationships, energy, and sense of timing. There is no required sensation during a track.\n\n**61. Does Zodiac use isochronic, brainwave, healing, Solfeggio, or nervous-system frequencies?**\n*Website*\n\nNo. Your four frequencies come from your birth information through Zodiac's protected method. They are not brainwave targets, Solfeggio numbers, a medical treatment, or a claim to regulate your nervous system.\n\n**62. What does hertz mean for my audible frequency?**\n*Website*\n\nHertz means cycles per second. Zodiac brings each calculated value into the audible range between 250 and 950 hertz, then retunes the music so your frequency sits inside it as a harmony. You do not need to isolate the frequency by ear for the music to carry it.\n\n**63. Why can the same piece appear under different frequencies?**\n*Music library and member help*\n\nThe composition can stay the same while its tuning changes. Zodiac makes a frequency-specific version so Core, Love, Vitality, or Abundance carries the correct personal value for that part of your system.\n\n**64. Is the music made with AI?**\n*Website and music library*\n\nNo. Real musicians compose the music. Zodiac then creates the frequency-specific versions required to place each personal frequency inside the piece.\n\n**65. What kinds of music are available, and why is the catalog still growing?**\n*Music library*\n\nThe library includes pieces for different moods, lengths, and moments in the day. Each new composition also has to be tuned across the personal frequency range and prepared for all four domains, so adding music is more involved than uploading one ordinary recording. Check the current library for what is available now.\n\n---\n\n**Listening well**\n\n**66. Where should I start?**\n*Getting started*\n\nChoose any piece you want to hear and press play. Over the week, include Core, Love, Vitality, and Abundance rather than trying to find one perfect starting frequency.\n\n**67. Can I focus more on one frequency?**\n*Getting started and My Zodiac*\n\nYes. Give every frequency at least 15 percent of your weekly listening, then use the remaining 40 percent wherever you want more attention. Balance leaves room for emphasis.\n\n**68. What time of day is best?**\n*Getting started*\n\nThe time you can return to is best. You can listen in the morning, during the day, or at night. Choose music that fits the moment and build a rhythm that works in your actual life.\n\n**69. Can I listen while driving or operating machinery?**\n*Member help*\n\nOrdinary music listening can be fine while driving when it is legal, safely set up, and not distracting. Avoid sleep-oriented, deeply unwinding, or personally distracting pieces whenever you need full alertness.\n\n**70. Can I use Zodiac with meditation, journaling, therapy, coaching, or another practice?**\n*Website and member help*\n\nYes. Zodiac does not replace those practices, and it does not require them. Use the music alongside what already supports you, or simply let it play during an ordinary day.\n\n**71. Do I need two working ears or a particular hearing setup?**\n*Member help*\n\nZodiac does not use a different tone in each ear, so split-ear listening is not part of the method. You can choose headphones, a speaker, a car system, or either-ear listening at a comfortable volume. We cannot promise that every hearing aid, device, speaker, or audio path reproduces every recording in exactly the same way. Contact support if you need help finding a workable setup.\n\n---\n\n**Results, evidence, and safety**\n\n**72. Why does everyone experience Zodiac differently?**\n*Website and member help*\n\nPeople begin with different lives, habits, sensitivities, and ways of recognizing change. Your four frequencies and bands are personal too. Some people notice something during the music, while others first see it in a decision, relationship, or change of direction later.\n\n**73. Is Zodiac supposed to make me feel amazing all the time?**\n*Website and member help*\n\nNo. The point is clearer access to yourself, not one permanent mood. Your life still contains difficulty, uncertainty, grief, conflict, and change.\n\n**74. Does Zodiac guarantee results?**\n*Website*\n\nNo individual result or timetable is guaranteed. Zodiac can tell you what participants reported in its internal study and how the product is designed to be used. Your own experience is still your own.\n\n**75. Is Zodiac medical, and can it treat a condition?**\n*Website and member help*\n\nZodiac is music and self-recognition rather than medical care, so it does not diagnose, treat, cure, or prevent a condition. Bring health questions to an appropriate professional.\n\n**76. Is Zodiac established as safe for children, pregnancy, seizure conditions, implanted devices, or other special populations?**\n*Member help*\n\nZodiac-specific guidance has not been established for those situations, which does not mean the music is unsafe. We will not guess. Ask an appropriate professional who understands your circumstances before using it, and contact support with product questions.\n\n---\n\n**Astrology, Human Design, and other practices**\n\n**77. How does Zodiac relate to astrology?**\n*Website*\n\nAstrology reads your birth imprint as a chart and puts it into words. Zodiac's premise is that the same birth pattern has a sound. Your four fixed frequencies give you a way to recognize your nature from within as you move through changing transits and cycles.\n\n**78. How does Zodiac work with Human Design?**\n*Website*\n\nHuman Design gives you language for Type, Strategy, Authority, Centers, profile, and incarnation cross. Zodiac does not turn each of those chart parts into a tone. It offers intuitive access to the nature that Human Design helps you understand, so living your design can become less abstract.\n\n**79. How does Zodiac work with Gene Keys?**\n*Website*\n\nGene Keys offers a contemplative language for patterns and possibilities, while Zodiac does not encode those teachings into the music. It can sit beside that practice as another way to recognize your own nature from within.\n\n**80. Does Zodiac replace astrology, Human Design, Gene Keys, meditation, or another practice?**\n*Website*\n\nNo. A reading or practice can give you language, context, and a way to reflect, while Zodiac adds a listening practice that can make your own signal more available in everyday life.\n\n---\n\n**App and product features**\n\n**81. Is there an app, and how do I install it?**\n*Getting started*\n\nYes. [Download Zodiac for iPhone](https://apps.apple.com/us/app/zodiacfm/id6764863619), [download Zodiac for Android](https://play.google.com/store/apps/details?id=fm.zodiac.app), or [listen in a desktop or laptop browser](https://app.zodiac.fm/). Sign in with the same email address you used when you joined, and email support@zodiac.fm if the app or your account does not open.\n\n**82. Which devices and operating systems are supported?**\n*App help*\n\nNative iPhone and Android listening is available, and desktop or laptop browser listening continues.\n\nUse the current App Store or Google Play listing for phone requirements. If installation or playback fails, contact support@zodiac.fm with your device, operating-system version, and whether you were using the native app or a desktop or laptop browser.\n\n**83. Does Zodiac play in the background or offline?**\n*App help*\n\nBackground, lock-screen, download, and offline behavior can differ by device and app release. If a feature is missing or fails, contact support with your phone model, operating-system version, app version, and what happened.\n\n**84a. Where is Favorites?**\n*App help*\n\nThe current navigation calls your saved-music area **Playlist**. If you expected to see Favorites or cannot find music you saved, email support@zodiac.fm with your device and app version.\n\n**84b. How do I add music to my Playlist?**\n*App help*\n\nEmail support@zodiac.fm with your device and app version, and we will give you the current steps for adding music to your Playlist.\n\n**84c. How do I use the Queue?**\n*App help*\n\nEmail support@zodiac.fm with your device and app version, and tell us what you want to play in order. We will give you the current Queue steps for that version.\n\n**84d. How do I reorder my Playlist?**\n*App help*\n\nEmail support@zodiac.fm with your device and app version, and we will give you the current reordering steps for your Playlist.\n\n**84e. How do downloads work?**\n*App help*\n\nDownload and offline behavior can differ by device and app release. Email support@zodiac.fm with your device, operating-system version, and app version so we can give you the current steps and help if a download fails.\n\n**85. What is My Zodiac?**\n*My Zodiac*\n\nMy Zodiac brings together your four fixed frequencies, their domains, their bands, and your listening picture so you can understand each part without turning your profile into a score or prediction.\n\n**86. What do weekly balance and all-time listening mean?**\n*My Zodiac*\n\nWeekly balance shows how your listening is distributed across Core, Love, Vitality, and Abundance in the current week. All-time listening gives historical context. An earlier imbalance is not a debt, does not erase prior listening, and does not mean nothing happened.\n\n**87. What are Experiences to Explore, and where did they go?**\n*My Zodiac and app help*\n\nExperiences to Explore are optional prompts for bringing one part of your profile into a real question or moment. They are not levels, assignments, or tests. Their location and availability depend on the current app release, so contact support if you expected to see them and cannot.\n\n---\n\n**Membership, billing, and support**\n\n**88. Are there discounts, coupons, partner prices, or protected renewal rates?**\n*Billing help*\n\nUse the price and trial shown on the page where you are joining. Some approved routes and legacy accounts have different terms, but a private support adjustment or old code is not a public offer. If you already have an account, contact support before changing plans so your current terms can be checked.\n\n**89. How do renewals work, and what if I do not recognize a charge?**\n*Billing help*\n\nYour checkout or app receipt states the plan, first charge, and renewal cadence you accepted. If a charge looks wrong, contact support with the date, amount, account email, and receipt or purchase reference. Do not send your full card number.\n\n**90. Can I pause, switch plans, change my email, or update billing information?**\n*Account help*\n\nThose are separate account actions, and the available path depends on who bills you. Contact support@zodiac.fm from your account email with the change you need, knowing that Apple must handle some subscription and payment changes when it bills you.\n\n**91. Can family members share an account or use multiple profiles?**\n*Account help*\n\nThere is no public family or multi-profile plan to promise here because each person's frequencies belong to that person's birth information and account. Contact support before sharing access or entering someone else's birth information.\n\n**92. Can I give Zodiac as a gift?**\n*Account help*\n\nThere is no verified self-serve gifting path to promise here. Contact support before purchasing for someone else. Do not create their profile or enter their birth information without their knowledge and permission.\n\n**93. Is there an affiliate, referral, practitioner, or partner program?**\n*Partner help*\n\nZodiac works with selected partners, including practitioners and newsletter writers. Program terms, enrollment, customer offers, and data permissions are separate and can change. Contact support@zodiac.fm for the current route rather than relying on an old link or price.\n\n**94. Can I pay outside the United States, and why might a payment fail?**\n*Billing help*\n\nAvailability, currency conversion, taxes, card rules, and payment errors depend on the checkout and payment provider. Use the amount and currency shown before you confirm. If payment fails, contact support with your country, the checkout you used, and the error message. Do not send full card details.\n\n**95. How do I contact Zodiac for help?**\n*Website and app*\n\nEmail support@zodiac.fm. Write from your account email when you can, describe the question or problem, and include your device and app version for playback issues. Never send your password, full card number, or complete birth information in an unsecured first message.\n\n---\n\n**Privacy and future products**\n\n**96. Is my information encrypted and secure?**\n*Privacy and account help*\n\nZodiac is committed to protecting your information, but we do not make a blanket technical promise about every data type, system, and storage state without current verification. The [Privacy Policy](https://zodiac.fm/privacy) is the controlling public account. Contact support if you need an answer about a specific kind of information.\n\n**97. Can I correct, export, delete, or close my account and data?**\n*Privacy and account help*\n\nThose are separate requests, as are subscription cancellation and removal from marketing messages. Follow the current route in the [Privacy Policy](https://zodiac.fm/privacy), or contact support@zodiac.fm and say exactly what you want to do. Support will guide you through the applicable identity and account steps.\n\n**98. What is Frequency Matchmaking?**\n*Future-product education*\n\nFrequency Matchmaking is a future way to compare two complete four-frequency profiles across their musical relationships. It is designed as a reading of harmony, contrast, and tension, not a compatibility score or a verdict about whether two people should be together. Any use of another person's information will require an approved product and consent path.\n\n**99. What is the future Planetary Cycle Engine?**\n*Future-product education*\n\nIt is a planned way to interpret changing transits, returns, and other cycles against your fixed birth pattern. It would not change your four frequencies or put current transits into the music. Detailed behavior and release timing are not yet promises.\n\n**100. What is coming next, and what does founding member mean?**\n*Membership and roadmap*\n\nZodiac is continuing to build the music library and member experience. A founding rate is protected while the membership remains continuous under its original terms. It does not automatically promise every future product, feature, or release date. Current entitlements come from the offer you joined.\n\n**101. Can I listen to or use another person's frequencies?**\n*Member help*\n\nZodiac is built around your own calculated result. We do not claim that another person's frequencies will do the same thing for you. Do not enter, save, or share someone else's birth information without their knowledge and an approved consent path.\n\n**102. Are my frequencies literally unique to me?**\n*Website*\n\nYour frequencies are personal because Zodiac calculates them from your birth information. That does not make the values mathematically exclusive to one person, since people born at the same time and place can share them. How those signals meet your life remains personal to you.\n\n**103. Why are the frequencies between 250 and 950 hertz?**\n*Website*\n\nZodiac folds the calculated values into a directly audible musical range that suitable everyday audio equipment can reproduce while preserving the harmonic identity the product uses to place those frequencies inside music.\n\n**104. Why doesn't Zodiac publish the exact calculation formula?**\n*Website*\n\nThe calculation is protected intellectual property. Zodiac can explain what goes in, what comes out, and what it built around the method without publishing the recipe or private provider details. Privacy is a boundary, not proof of the method.\n\n**105. What is the difference between a frequency, a band, and balance?**\n*Website and My Zodiac*\n\nYour frequency is the fixed personal value for one domain. Its band describes your preferred way of processing information in that domain. Balance describes how your weekly listening time is distributed across Core, Love, Vitality, and Abundance.\n\n**106. Where did the protected method come from?**\n*Website and About*\n\nZodiac begins with Nāda Brahma, the Vedic view that reality is sound. Within that worldview, a birth pattern having a sound follows naturally. A mantra lineage had developed a protected method for finding it. Zodiac uses the frequency part of that method, while the sacred mantras remain private.\n\nZodiac does not ask you to treat that privacy as proof, does not claim that all astrology or Human Design came from Nāda Brahma, and does not present its modern app, band model, or music system as ancient technology."},{"category":"Getting started","slug":"customer-onboarding","title":"Zodiac onboarding and first listen","label":"Getting started","hasSourceH1":true,"html":"\u003ch1>Zodiac onboarding and first listen\u003c/h1>\n\u003cp>This is the complete short onboarding sequence. Each numbered section is one small screen or message.\u003c/p>\n\u003ch2>1. Welcome to Zodiac\u003c/h2>\n\u003cp>Your birth date, time, and place give you four personal frequencies. Zodiac places them inside music so your access to your connected self can become more available in everyday life.\u003c/p>\n\u003cp>Action label: “Meet my frequencies”\u003c/p>\n\u003ch2>2. Meet your four frequencies\u003c/h2>\n\u003cp>\u003cstrong>Core\u003c/strong> is the signal for who you are and what is yours to do.\u003c/p>\n\u003cp>\u003cstrong>Love\u003c/strong> is the signal for who to let close and how to connect.\u003c/p>\n\u003cp>\u003cstrong>Vitality\u003c/strong> is the signal for what feeds you and what drains you.\u003c/p>\n\u003cp>\u003cstrong>Abundance\u003c/strong> is the signal for when to move and which opportunities are yours.\u003c/p>\n\u003cp>You will give each one a place in your week.\u003c/p>\n\u003cp>Action label: “How to listen”\u003c/p>\n\u003ch2>3. Your first listen\u003c/h2>\n\u003cp>Choose music you want to hear and press play. Use headphones, a quality Bluetooth speaker, or your car sound system. Keep the volume clear and comfortable.\u003c/p>\n\u003cp>You do not need to concentrate on a tone or try to make anything happen. Let the music be part of your day.\u003c/p>\n\u003cp>Action label: “Choose where to listen”\u003c/p>\n\u003ch2>4. Listen wherever you are\u003c/h2>\n\u003cp>\u003ca href=\"https://apps.apple.com/us/app/zodiacfm/id6764863619\" target=\"_blank\" rel=\"noopener noreferrer\">Get Zodiac for iPhone\u003c/a>\u003c/p>\n\u003cp>\u003ca href=\"https://play.google.com/store/apps/details?id=fm.zodiac.app\" target=\"_blank\" rel=\"noopener noreferrer\">Get Zodiac for Android\u003c/a>\u003c/p>\n\u003cp>\u003ca href=\"https://app.zodiac.fm/\" target=\"_blank\" rel=\"noopener noreferrer\">Listen on a desktop or laptop\u003c/a>\u003c/p>\n\u003cp>Sign in with the same email address you used when you joined because your frequencies and membership belong to that account wherever you listen.\u003c/p>\n\u003cp>Action label: “Build my week”\u003c/p>\n\u003ch2>5. A rhythm you can keep\u003c/h2>\n\u003cp>Aim for about nine minutes a day on average, or 63 minutes across the week. Give each frequency at least 15 percent of your total listening. The remaining 40 percent is flexible, so you can spend more time wherever you want more emphasis.\u003c/p>\n\u003cp>Missing a day does not erase what came before. Come back when you can and keep all four in the mix.\u003c/p>\n\u003cp>Action label: “Understand my band”\u003c/p>\n\u003ch2>6. Your natural way of finding clarity\u003c/h2>\n\u003cp>Your band describes how you most naturally process information in that area of your life:\u003c/p>\n\u003cul>\n\u003cli>Root: grounding and steadiness\u003c/li>\n\u003cli>Solar Plexus: drive and motion\u003c/li>\n\u003cli>Throat: articulation and expression\u003c/li>\n\u003cli>Crown: systems, perspective, and the bigger picture\u003c/li>\n\u003c/ul>\n\u003cp>Everyone can use all four approaches. Your band names the route that comes most naturally. If your frequency sits in the top third of Root, Solar Plexus, or Throat, you also carry aspects of the next band up. Your home band still leads.\u003c/p>\n\u003cp>Action label: “What to notice”\u003c/p>\n\u003ch2>7. Notice what changes in your life\u003c/h2>\n\u003cp>You may enjoy the music without feeling anything unusual while it plays. The difference can show up later: a decision becomes obvious, you recognize a boundary, or you have a growing sense of what is yours to do.\u003c/p>\n\u003cp>There is no required sensation and no promised timetable.\u003c/p>\n\u003cp>Action label: “Open Zodiac”\u003c/p>\n\u003ch2>8. Help when you need it\u003c/h2>\n\u003cp>For account, billing, playback, or birth-information help, \u003ca href=\"mailto:support@zodiac.fm\">email support@zodiac.fm\u003c/a>. Write from your account email when you can. Do not send your password, full card number, or complete birth information in an unsecured first message.\u003c/p>\n\u003cp>The \u003ca href=\"https://zodiac.fm/privacy\" target=\"_blank\" rel=\"noopener noreferrer\">Privacy Policy\u003c/a> explains how personal information is handled and how to make a privacy request.\u003c/p>\n","text":"Zodiac onboarding and first listen\n\nThis is the complete short onboarding sequence. Each numbered section is one small screen or message.\n\n 1. Welcome to Zodiac\n\nYour birth date, time, and place give you four personal frequencies. Zodiac places them inside music so your access to your connected self can become more available in everyday life.\n\nAction label: “Meet my frequencies”\n\n 2. Meet your four frequencies\n\nCore is the signal for who you are and what is yours to do.\n\nLove is the signal for who to let close and how to connect.\n\nVitality is the signal for what feeds you and what drains you.\n\nAbundance is the signal for when to move and which opportunities are yours.\n\nYou will give each one a place in your week.\n\nAction label: “How to listen”\n\n 3. Your first listen\n\nChoose music you want to hear and press play. Use headphones, a quality Bluetooth speaker, or your car sound system. Keep the volume clear and comfortable.\n\nYou do not need to concentrate on a tone or try to make anything happen. Let the music be part of your day.\n\nAction label: “Choose where to listen”\n\n 4. Listen wherever you are\n\nGet Zodiac for iPhone\n\nGet Zodiac for Android\n\nListen on a desktop or laptop\n\nSign in with the same email address you used when you joined because your frequencies and membership belong to that account wherever you listen.\n\nAction label: “Build my week”\n\n 5. A rhythm you can keep\n\nAim for about nine minutes a day on average, or 63 minutes across the week. Give each frequency at least 15 percent of your total listening. The remaining 40 percent is flexible, so you can spend more time wherever you want more emphasis.\n\nMissing a day does not erase what came before. Come back when you can and keep all four in the mix.\n\nAction label: “Understand my band”\n\n 6. Your natural way of finding clarity\n\nYour band describes how you most naturally process information in that area of your life:\n\n- Root: grounding and steadiness\n- Solar Plexus: drive and motion\n- Throat: articulation and expression\n- Crown: systems, perspective, and the bigger picture\n\nEveryone can use all four approaches. Your band names the route that comes most naturally. If your frequency sits in the top third of Root, Solar Plexus, or Throat, you also carry aspects of the next band up. Your home band still leads.\n\nAction label: “What to notice”\n\n 7. Notice what changes in your life\n\nYou may enjoy the music without feeling anything unusual while it plays. The difference can show up later: a decision becomes obvious, you recognize a boundary, or you have a growing sense of what is yours to do.\n\nThere is no required sensation and no promised timetable.\n\nAction label: “Open Zodiac”\n\n 8. Help when you need it\n\nFor account, billing, playback, or birth-information help, email support@zodiac.fm. Write from your account email when you can. Do not send your password, full card number, or complete birth information in an unsecured first message.\n\nThe Privacy Policy explains how personal information is handled and how to make a privacy request.","copyText":"# Zodiac onboarding and first listen\n\nThis is the complete short onboarding sequence. Each numbered section is one small screen or message.\n\n## 1. Welcome to Zodiac\n\nYour birth date, time, and place give you four personal frequencies. Zodiac places them inside music so your access to your connected self can become more available in everyday life.\n\nAction label: “Meet my frequencies”\n\n## 2. Meet your four frequencies\n\n**Core** is the signal for who you are and what is yours to do.\n\n**Love** is the signal for who to let close and how to connect.\n\n**Vitality** is the signal for what feeds you and what drains you.\n\n**Abundance** is the signal for when to move and which opportunities are yours.\n\nYou will give each one a place in your week.\n\nAction label: “How to listen”\n\n## 3. Your first listen\n\nChoose music you want to hear and press play. Use headphones, a quality Bluetooth speaker, or your car sound system. Keep the volume clear and comfortable.\n\nYou do not need to concentrate on a tone or try to make anything happen. Let the music be part of your day.\n\nAction label: “Choose where to listen”\n\n## 4. Listen wherever you are\n\n[Get Zodiac for iPhone](https://apps.apple.com/us/app/zodiacfm/id6764863619)\n\n[Get Zodiac for Android](https://play.google.com/store/apps/details?id=fm.zodiac.app)\n\n[Listen on a desktop or laptop](https://app.zodiac.fm/)\n\nSign in with the same email address you used when you joined because your frequencies and membership belong to that account wherever you listen.\n\nAction label: “Build my week”\n\n## 5. A rhythm you can keep\n\nAim for about nine minutes a day on average, or 63 minutes across the week. Give each frequency at least 15 percent of your total listening. The remaining 40 percent is flexible, so you can spend more time wherever you want more emphasis.\n\nMissing a day does not erase what came before. Come back when you can and keep all four in the mix.\n\nAction label: “Understand my band”\n\n## 6. Your natural way of finding clarity\n\nYour band describes how you most naturally process information in that area of your life:\n\n- Root: grounding and steadiness\n- Solar Plexus: drive and motion\n- Throat: articulation and expression\n- Crown: systems, perspective, and the bigger picture\n\nEveryone can use all four approaches. Your band names the route that comes most naturally. If your frequency sits in the top third of Root, Solar Plexus, or Throat, you also carry aspects of the next band up. Your home band still leads.\n\nAction label: “What to notice”\n\n## 7. Notice what changes in your life\n\nYou may enjoy the music without feeling anything unusual while it plays. The difference can show up later: a decision becomes obvious, you recognize a boundary, or you have a growing sense of what is yours to do.\n\nThere is no required sensation and no promised timetable.\n\nAction label: “Open Zodiac”\n\n## 8. Help when you need it\n\nFor account, billing, playback, or birth-information help, [email support@zodiac.fm](mailto:support@zodiac.fm). Write from your account email when you can. Do not send your password, full card number, or complete birth information in an unsecured first message.\n\nThe [Privacy Policy](https://zodiac.fm/privacy) explains how personal information is handled and how to make a privacy request."},{"category":"Getting started","slug":"band-descriptions","title":"Your personal band descriptions","label":"Getting started","hasSourceH1":true,"html":"\u003ch1>Your personal band descriptions\u003c/h1>\n\u003cp>These are the sixteen descriptions used to personalize results. A listener sees the matching description for each frequency. The additional paragraph appears only when their frequency is in the top third of that band.\u003c/p>\n\u003ch2>CORE\u003c/h2>\n\u003ch3>Root\u003c/h3>\n\u003cp>Who you are and your life&#39;s purpose are most naturally processed through groundedness.\u003c/p>\n\u003cp>Your read on issues related to your identity will be most accurate when you are still, steady and grounded.\u003c/p>\n\u003cp>Your most trusted route on your life&#39;s purpose may be trusting your gut, literally.\u003c/p>\n\u003ch4>Additional paragraph from 367 Hz\u003c/h4>\n\u003cp>At {hz} Hz, Core is approaching the Solar Plexus Band, so drive and motion may also help clarify your identity signal.\u003c/p>\n\u003ch3>Solar Plexus\u003c/h3>\n\u003cp>Who you are and your life&#39;s purpose are most naturally processed through action and drive.\u003c/p>\n\u003cp>Insights into your true self tend to happen through motion, and your values get clearer through the initiative you take.\u003c/p>\n\u003cp>This is ultimately how you will naturally begin to trust and accept yourself at the Core level.\u003c/p>\n\u003ch4>Additional paragraph from 542 Hz\u003c/h4>\n\u003cp>At {hz} Hz, Core is approaching the Throat Band, so articulating by writing or speaking may also help clarify issues at the identity level.\u003c/p>\n\u003ch3>Throat\u003c/h3>\n\u003cp>Who you are and your life&#39;s purpose are most naturally processed through articulation.\u003c/p>\n\u003cp>Insights into your true self and values become more clear through writing and speaking.\u003c/p>\n\u003cp>This is ultimately how you will naturally begin to trust and accept yourself at the Core level.\u003c/p>\n\u003ch4>Additional paragraph from 717 Hz\u003c/h4>\n\u003cp>At {hz} Hz, Core is approaching the Crown Band, so giving attention to your identity issues by taking a wider perspective and thinking in systems might lend clarity.\u003c/p>\n\u003ch3>Crown\u003c/h3>\n\u003cp>Who you are and your life&#39;s purpose are most naturally processed through the big picture.\u003c/p>\n\u003cp>You tend to recognize yourself by seeing where you fit, and the wider the view, the clearer you get.\u003c/p>\n\u003cp>This is ultimately how you will naturally begin to trust and accept yourself at the Core level.\u003c/p>\n\u003ch2>LOVE\u003c/h2>\n\u003ch3>Root\u003c/h3>\n\u003cp>Who to let in, how close to become, and how you connect tend to clarify while you are grounded and steady.\u003c/p>\n\u003cp>You can trust how to approach the connection most accurately through stillness. You can take &quot;trusting your gut&quot; literally.\u003c/p>\n\u003ch4>Additional paragraph from 367 Hz\u003c/h4>\n\u003cp>At {hz} Hz, Love sits close to the Solar Plexus Band, so taking mini actions may also help you clarify the connection.\u003c/p>\n\u003ch3>Solar Plexus\u003c/h3>\n\u003cp>Who to let in, how close to become, and how you connect tend to clarify through drive and motion.\u003c/p>\n\u003cp>You can trust how to approach the connection most accurately through action and engagement, either with the person directly or by thinking about the relationship while moving.\u003c/p>\n\u003ch4>Additional paragraph from 542 Hz\u003c/h4>\n\u003cp>At {hz} Hz, Love sits close to the Throat Band, so articulating the relationship, by talking through it or journaling, will also bring clarity.\u003c/p>\n\u003ch3>Throat\u003c/h3>\n\u003cp>Who to let in, how close to become, and how you connect tend to clarify through articulation and expression.\u003c/p>\n\u003cp>You can trust how to approach the connection most accurately by talking it out with yourself, with a friend, or through journaling.\u003c/p>\n\u003cp>And being able to express yourself in words, in relationships of any kind, is more important to you than it is to most.\u003c/p>\n\u003ch4>Additional paragraph from 717 Hz\u003c/h4>\n\u003cp>At {hz} Hz, Love sits close to the Crown Band, so putting your attention on how this connection fits into the bigger picture will also help you clarify how you connect.\u003c/p>\n\u003ch3>Crown\u003c/h3>\n\u003cp>Who to let in, how close to become, and how you connect tend to clarify through perspective, and how the connection fits into an overall system.\u003c/p>\n\u003cp>You can trust how to approach the connection most accurately by widening your lens and seeing the bigger picture.\u003c/p>\n\u003cp>You might find it helpful to even sketch it out into a mind map of other related connections.\u003c/p>\n\u003ch2>VITALITY\u003c/h2>\n\u003ch3>Root\u003c/h3>\n\u003cp>The actions and thoughts that feed and drain your lifeforce are best identified and clarified when you are still, steady and grounded.\u003c/p>\n\u003cp>Your most trusted route towards choosing what truly lights you up is in this still, grounded state.\u003c/p>\n\u003cp>This is also how you may identify actions which are slowly draining your energy.\u003c/p>\n\u003ch4>Additional paragraph from 367 Hz\u003c/h4>\n\u003cp>At {hz} Hz, your Vitality is also close to the Solar Plexus Band, so you may also identify energy drains and enhancers by taking small actions or while moving around.\u003c/p>\n\u003ch3>Solar Plexus\u003c/h3>\n\u003cp>The thoughts and actions that feed and drain your lifeforce are best identified and clarified when you are moving and taking action.\u003c/p>\n\u003cp>Your most trusted route towards choosing what truly lights you up is through drive and motion.\u003c/p>\n\u003cp>This is also how you may identify actions which are slowly draining your energy.\u003c/p>\n\u003ch4>Additional paragraph from 542 Hz\u003c/h4>\n\u003cp>At {hz} Hz, your Vitality is also close to the Throat Band, so you may also gain clarity on what feeds and drains you energetically by journaling or talking things out. Using words is important to your process.\u003c/p>\n\u003ch3>Throat\u003c/h3>\n\u003cp>The actions and thoughts that feed and drain your lifeforce are best identified and clarified through articulation.\u003c/p>\n\u003cp>Your most trusted route towards choosing what truly lights you up is by journaling or putting this recognition into words.\u003c/p>\n\u003cp>This is also how you may identify actions which are slowly draining your energy.\u003c/p>\n\u003ch4>Additional paragraph from 717 Hz\u003c/h4>\n\u003cp>At {hz} Hz, Vitality is close to the Crown Band, so you may also gain clarity on what feeds and drains you energetically by looking at the bigger picture, or seeing how it fits into a bigger system.\u003c/p>\n\u003ch3>Crown\u003c/h3>\n\u003cp>The actions and thoughts that feed and drain your lifeforce are best identified and clarified through seeing the big picture.\u003c/p>\n\u003cp>Your most trusted route towards choosing what truly lights you up is by widening your lens and thinking in systems.\u003c/p>\n\u003cp>This is also how you may identify actions which are slowly draining your energy.\u003c/p>\n\u003ch2>ABUNDANCE\u003c/h2>\n\u003ch3>Root\u003c/h3>\n\u003cp>Recognizing opportunities and your timing are naturally identified and clarified when you are still, steady and grounded.\u003c/p>\n\u003cp>Trusting your gut is a real thing here, and is best when nurtured. Make time to settle in while deciding what to move on and when.\u003c/p>\n\u003cp>Manifesting is best done when grounded.\u003c/p>\n\u003ch4>Additional paragraph from 367 Hz\u003c/h4>\n\u003cp>At {hz} Hz, your Abundance is close to the Solar Plexus Band, so taking one small step first may help clarify the opportunity.\u003c/p>\n\u003ch3>Solar Plexus\u003c/h3>\n\u003cp>Recognizing opportunities and your timing are naturally identified and clarified when you take action or are in motion.\u003c/p>\n\u003cp>Paying attention to your inner drive and creating micro actions on your opportunities will lead to a more accurate read on what to do and when.\u003c/p>\n\u003cp>You manifest through action and drive.\u003c/p>\n\u003ch4>Additional paragraph from 542 Hz\u003c/h4>\n\u003cp>At {hz} Hz, your Abundance is close to the Throat Band, so talking or writing it out might clarify the opportunity.\u003c/p>\n\u003ch3>Throat\u003c/h3>\n\u003cp>Recognizing opportunities and your timing are naturally identified and clarified when you can talk or write it out.\u003c/p>\n\u003cp>Articulating verbally or through a journal will lead to a more accurate read on what to do and when.\u003c/p>\n\u003cp>For manifesting, the natural way is to write it out or talk it through with trusted friends and advisors.\u003c/p>\n\u003ch4>Additional paragraph from 717 Hz\u003c/h4>\n\u003cp>At {hz} Hz, your Abundance is close to the Crown Band, so trying to get some perspective on the opportunity as a whole might help you gain clarity.\u003c/p>\n\u003ch3>Crown\u003c/h3>\n\u003cp>Recognizing opportunities and your timing are more naturally identified and clarified when you widen your lens and see the bigger picture.\u003c/p>\n\u003cp>Step back and try to see the opportunity as a whole before deciding if and when to dive in.\u003c/p>\n\u003cp>Manifesting will work best for you with mind maps, pictures and systems thinking.\u003c/p>\n","text":"Your personal band descriptions\n\nThese are the sixteen descriptions used to personalize results. A listener sees the matching description for each frequency. The additional paragraph appears only when their frequency is in the top third of that band.\n\n CORE\n\n Root\n\nWho you are and your life's purpose are most naturally processed through groundedness.\n\nYour read on issues related to your identity will be most accurate when you are still, steady and grounded.\n\nYour most trusted route on your life's purpose may be trusting your gut, literally.\n\n Additional paragraph from 367 Hz\n\nAt {hz} Hz, Core is approaching the Solar Plexus Band, so drive and motion may also help clarify your identity signal.\n\n Solar Plexus\n\nWho you are and your life's purpose are most naturally processed through action and drive.\n\nInsights into your true self tend to happen through motion, and your values get clearer through the initiative you take.\n\nThis is ultimately how you will naturally begin to trust and accept yourself at the Core level.\n\n Additional paragraph from 542 Hz\n\nAt {hz} Hz, Core is approaching the Throat Band, so articulating by writing or speaking may also help clarify issues at the identity level.\n\n Throat\n\nWho you are and your life's purpose are most naturally processed through articulation.\n\nInsights into your true self and values become more clear through writing and speaking.\n\nThis is ultimately how you will naturally begin to trust and accept yourself at the Core level.\n\n Additional paragraph from 717 Hz\n\nAt {hz} Hz, Core is approaching the Crown Band, so giving attention to your identity issues by taking a wider perspective and thinking in systems might lend clarity.\n\n Crown\n\nWho you are and your life's purpose are most naturally processed through the big picture.\n\nYou tend to recognize yourself by seeing where you fit, and the wider the view, the clearer you get.\n\nThis is ultimately how you will naturally begin to trust and accept yourself at the Core level.\n\n LOVE\n\n Root\n\nWho to let in, how close to become, and how you connect tend to clarify while you are grounded and steady.\n\nYou can trust how to approach the connection most accurately through stillness. You can take \"trusting your gut\" literally.\n\n Additional paragraph from 367 Hz\n\nAt {hz} Hz, Love sits close to the Solar Plexus Band, so taking mini actions may also help you clarify the connection.\n\n Solar Plexus\n\nWho to let in, how close to become, and how you connect tend to clarify through drive and motion.\n\nYou can trust how to approach the connection most accurately through action and engagement, either with the person directly or by thinking about the relationship while moving.\n\n Additional paragraph from 542 Hz\n\nAt {hz} Hz, Love sits close to the Throat Band, so articulating the relationship, by talking through it or journaling, will also bring clarity.\n\n Throat\n\nWho to let in, how close to become, and how you connect tend to clarify through articulation and expression.\n\nYou can trust how to approach the connection most accurately by talking it out with yourself, with a friend, or through journaling.\n\nAnd being able to express yourself in words, in relationships of any kind, is more important to you than it is to most.\n\n Additional paragraph from 717 Hz\n\nAt {hz} Hz, Love sits close to the Crown Band, so putting your attention on how this connection fits into the bigger picture will also help you clarify how you connect.\n\n Crown\n\nWho to let in, how close to become, and how you connect tend to clarify through perspective, and how the connection fits into an overall system.\n\nYou can trust how to approach the connection most accurately by widening your lens and seeing the bigger picture.\n\nYou might find it helpful to even sketch it out into a mind map of other related connections.\n\n VITALITY\n\n Root\n\nThe actions and thoughts that feed and drain your lifeforce are best identified and clarified when you are still, steady and grounded.\n\nYour most trusted route towards choosing what truly lights you up is in this still, grounded state.\n\nThis is also how you may identify actions which are slowly draining your energy.\n\n Additional paragraph from 367 Hz\n\nAt {hz} Hz, your Vitality is also close to the Solar Plexus Band, so you may also identify energy drains and enhancers by taking small actions or while moving around.\n\n Solar Plexus\n\nThe thoughts and actions that feed and drain your lifeforce are best identified and clarified when you are moving and taking action.\n\nYour most trusted route towards choosing what truly lights you up is through drive and motion.\n\nThis is also how you may identify actions which are slowly draining your energy.\n\n Additional paragraph from 542 Hz\n\nAt {hz} Hz, your Vitality is also close to the Throat Band, so you may also gain clarity on what feeds and drains you energetically by journaling or talking things out. Using words is important to your process.\n\n Throat\n\nThe actions and thoughts that feed and drain your lifeforce are best identified and clarified through articulation.\n\nYour most trusted route towards choosing what truly lights you up is by journaling or putting this recognition into words.\n\nThis is also how you may identify actions which are slowly draining your energy.\n\n Additional paragraph from 717 Hz\n\nAt {hz} Hz, Vitality is close to the Crown Band, so you may also gain clarity on what feeds and drains you energetically by looking at the bigger picture, or seeing how it fits into a bigger system.\n\n Crown\n\nThe actions and thoughts that feed and drain your lifeforce are best identified and clarified through seeing the big picture.\n\nYour most trusted route towards choosing what truly lights you up is by widening your lens and thinking in systems.\n\nThis is also how you may identify actions which are slowly draining your energy.\n\n ABUNDANCE\n\n Root\n\nRecognizing opportunities and your timing are naturally identified and clarified when you are still, steady and grounded.\n\nTrusting your gut is a real thing here, and is best when nurtured. Make time to settle in while deciding what to move on and when.\n\nManifesting is best done when grounded.\n\n Additional paragraph from 367 Hz\n\nAt {hz} Hz, your Abundance is close to the Solar Plexus Band, so taking one small step first may help clarify the opportunity.\n\n Solar Plexus\n\nRecognizing opportunities and your timing are naturally identified and clarified when you take action or are in motion.\n\nPaying attention to your inner drive and creating micro actions on your opportunities will lead to a more accurate read on what to do and when.\n\nYou manifest through action and drive.\n\n Additional paragraph from 542 Hz\n\nAt {hz} Hz, your Abundance is close to the Throat Band, so talking or writing it out might clarify the opportunity.\n\n Throat\n\nRecognizing opportunities and your timing are naturally identified and clarified when you can talk or write it out.\n\nArticulating verbally or through a journal will lead to a more accurate read on what to do and when.\n\nFor manifesting, the natural way is to write it out or talk it through with trusted friends and advisors.\n\n Additional paragraph from 717 Hz\n\nAt {hz} Hz, your Abundance is close to the Crown Band, so trying to get some perspective on the opportunity as a whole might help you gain clarity.\n\n Crown\n\nRecognizing opportunities and your timing are more naturally identified and clarified when you widen your lens and see the bigger picture.\n\nStep back and try to see the opportunity as a whole before deciding if and when to dive in.\n\nManifesting will work best for you with mind maps, pictures and systems thinking.","copyText":"# Your personal band descriptions\n\nThese are the sixteen descriptions used to personalize results. A listener sees the matching description for each frequency. The additional paragraph appears only when their frequency is in the top third of that band.\n\n## CORE\n\n### Root\n\nWho you are and your life's purpose are most naturally processed through groundedness.\n\nYour read on issues related to your identity will be most accurate when you are still, steady and grounded.\n\nYour most trusted route on your life's purpose may be trusting your gut, literally.\n\n#### Additional paragraph from 367 Hz\n\nAt {hz} Hz, Core is approaching the Solar Plexus Band, so drive and motion may also help clarify your identity signal.\n\n### Solar Plexus\n\nWho you are and your life's purpose are most naturally processed through action and drive.\n\nInsights into your true self tend to happen through motion, and your values get clearer through the initiative you take.\n\nThis is ultimately how you will naturally begin to trust and accept yourself at the Core level.\n\n#### Additional paragraph from 542 Hz\n\nAt {hz} Hz, Core is approaching the Throat Band, so articulating by writing or speaking may also help clarify issues at the identity level.\n\n### Throat\n\nWho you are and your life's purpose are most naturally processed through articulation.\n\nInsights into your true self and values become more clear through writing and speaking.\n\nThis is ultimately how you will naturally begin to trust and accept yourself at the Core level.\n\n#### Additional paragraph from 717 Hz\n\nAt {hz} Hz, Core is approaching the Crown Band, so giving attention to your identity issues by taking a wider perspective and thinking in systems might lend clarity.\n\n### Crown\n\nWho you are and your life's purpose are most naturally processed through the big picture.\n\nYou tend to recognize yourself by seeing where you fit, and the wider the view, the clearer you get.\n\nThis is ultimately how you will naturally begin to trust and accept yourself at the Core level.\n\n\n\n## LOVE\n\n### Root\n\nWho to let in, how close to become, and how you connect tend to clarify while you are grounded and steady.\n\nYou can trust how to approach the connection most accurately through stillness. You can take \"trusting your gut\" literally.\n\n#### Additional paragraph from 367 Hz\n\nAt {hz} Hz, Love sits close to the Solar Plexus Band, so taking mini actions may also help you clarify the connection.\n\n### Solar Plexus\n\nWho to let in, how close to become, and how you connect tend to clarify through drive and motion.\n\nYou can trust how to approach the connection most accurately through action and engagement, either with the person directly or by thinking about the relationship while moving.\n\n#### Additional paragraph from 542 Hz\n\nAt {hz} Hz, Love sits close to the Throat Band, so articulating the relationship, by talking through it or journaling, will also bring clarity.\n\n### Throat\n\nWho to let in, how close to become, and how you connect tend to clarify through articulation and expression.\n\nYou can trust how to approach the connection most accurately by talking it out with yourself, with a friend, or through journaling.\n\nAnd being able to express yourself in words, in relationships of any kind, is more important to you than it is to most.\n\n#### Additional paragraph from 717 Hz\n\nAt {hz} Hz, Love sits close to the Crown Band, so putting your attention on how this connection fits into the bigger picture will also help you clarify how you connect.\n\n### Crown\n\nWho to let in, how close to become, and how you connect tend to clarify through perspective, and how the connection fits into an overall system.\n\nYou can trust how to approach the connection most accurately by widening your lens and seeing the bigger picture.\n\nYou might find it helpful to even sketch it out into a mind map of other related connections.\n\n\n\n## VITALITY\n\n### Root\n\nThe actions and thoughts that feed and drain your lifeforce are best identified and clarified when you are still, steady and grounded.\n\nYour most trusted route towards choosing what truly lights you up is in this still, grounded state.\n\nThis is also how you may identify actions which are slowly draining your energy.\n\n#### Additional paragraph from 367 Hz\n\nAt {hz} Hz, your Vitality is also close to the Solar Plexus Band, so you may also identify energy drains and enhancers by taking small actions or while moving around.\n\n### Solar Plexus\n\nThe thoughts and actions that feed and drain your lifeforce are best identified and clarified when you are moving and taking action.\n\nYour most trusted route towards choosing what truly lights you up is through drive and motion.\n\nThis is also how you may identify actions which are slowly draining your energy.\n\n#### Additional paragraph from 542 Hz\n\nAt {hz} Hz, your Vitality is also close to the Throat Band, so you may also gain clarity on what feeds and drains you energetically by journaling or talking things out. Using words is important to your process.\n\n### Throat\n\nThe actions and thoughts that feed and
