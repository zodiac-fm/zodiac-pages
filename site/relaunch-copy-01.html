bscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: What we mean by your actual frequency\n\nPreheader: A precise tone, held inside the music.\n\nHi {{givenname}},\n\nThe word frequency gets used for many kinds of audio. In Zodiac, it has a specific meaning. Each personal frequency is a pitch derived from your birth information, and that exact pitch is present in the recording you hear.\n\nIt is carried as a steady pure tone inside music retuned to fit it. That makes it part of the harmony.\n\nThe recording doesn't require a different tone in each ear. You can use suitable headphones or a speaker that reproduces the music clearly, at a comfortable volume.\n\nYou also don't have to identify the tone by listening hard. Its presence is a feature of how the recording is made, not something you need to prove with your attention.\n\nThe larger reason remains the same. Zodiac brings your four fixed birth frequencies into repeated listening to amplify the connection with your connected self.\n\nKnowing how the music is built can answer a useful question. Once that question is answered, you can return to simply hearing a song you enjoy.\n\nSee how the music is made\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** What we mean by your actual frequency\n\n**Preheader:** A precise tone, held inside the music.\n\nHi {{given_name}},\n\nThe word frequency gets used for many kinds of audio. In Zodiac, it has a specific meaning. Each personal frequency is a pitch derived from your birth information, and that exact pitch is present in the recording you hear.\n\nIt is carried as a steady pure tone inside music retuned to fit it. That makes it part of the harmony.\n\nThe recording doesn't require a different tone in each ear. You can use suitable headphones or a speaker that reproduces the music clearly, at a comfortable volume.\n\nYou also don't have to identify the tone by listening hard. Its presence is a feature of how the recording is made, not something you need to prove with your attention.\n\nThe larger reason remains the same. Zodiac brings your four fixed birth frequencies into repeated listening to amplify the connection with your connected self.\n\nKnowing how the music is built can answer a useful question. Once that question is answered, you can return to simply hearing a song you enjoy.\n\n[See how the music is made]({{article_08_actual_frequency}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m27","title":"M27 · A personal way to hear the idea","label":"Review email · M27","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> What MaryEllen Tribby heard in Zodiac\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> The idea behind the music became a personal experience for her.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>MaryEllen Tribby, CEO of Centerpointe Research Institute, described listening to Zodiac in these words:\u003c/p>\n\u003cp>“Experiencing my own astrological energy expressed through sound was both beautiful and deeply personal. It&#39;s a remarkable fusion of ancient insight and modern innovation.”\u003c/p>\n\u003cp>Her description brings the origin of Zodiac into something a person can hear and experience.\u003c/p>\n\u003cp>The Vedic teaching of Nāda Brahma understands reality as sound, including the pattern present at birth. A mantra lineage developed a method for finding it, and Zodiac brings the four personal frequencies it identifies into music.\u003c/p>\n\u003cp>We hold that account as a possibility, not scientific proof. MaryEllen is describing her own experience of the music, rather than establishing what every listener will encounter.\u003c/p>\n\u003cp>What interests us in her words is the personal part. The music begins with something particular to you, then meets a life that is also particular to you.\u003c/p>\n\u003cp>You can know the story behind it and still leave room to discover your own relationship with the listening. Both kinds of understanding have a place.\u003c/p>\n\u003cp>\u003ca href=\"#where-zodiac-comes-from\">Read where Zodiac comes from\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: What MaryEllen Tribby heard in Zodiac\n\nPreheader: The idea behind the music became a personal experience for her.\n\nHi {{givenname}},\n\nMaryEllen Tribby, CEO of Centerpointe Research Institute, described listening to Zodiac in these words:\n\n“Experiencing my own astrological energy expressed through sound was both beautiful and deeply personal. It's a remarkable fusion of ancient insight and modern innovation.”\n\nHer description brings the origin of Zodiac into something a person can hear and experience.\n\nThe Vedic teaching of Nāda Brahma understands reality as sound, including the pattern present at birth. A mantra lineage developed a method for finding it, and Zodiac brings the four personal frequencies it identifies into music.\n\nWe hold that account as a possibility, not scientific proof. MaryEllen is describing her own experience of the music, rather than establishing what every listener will encounter.\n\nWhat interests us in her words is the personal part. The music begins with something particular to you, then meets a life that is also particular to you.\n\nYou can know the story behind it and still leave room to discover your own relationship with the listening. Both kinds of understanding have a place.\n\nRead where Zodiac comes from\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** What MaryEllen Tribby heard in Zodiac\n\n**Preheader:** The idea behind the music became a personal experience for her.\n\nHi {{given_name}},\n\nMaryEllen Tribby, CEO of Centerpointe Research Institute, described listening to Zodiac in these words:\n\n“Experiencing my own astrological energy expressed through sound was both beautiful and deeply personal. It's a remarkable fusion of ancient insight and modern innovation.”\n\nHer description brings the origin of Zodiac into something a person can hear and experience.\n\nThe Vedic teaching of Nāda Brahma understands reality as sound, including the pattern present at birth. A mantra lineage developed a method for finding it, and Zodiac brings the four personal frequencies it identifies into music.\n\nWe hold that account as a possibility, not scientific proof. MaryEllen is describing her own experience of the music, rather than establishing what every listener will encounter.\n\nWhat interests us in her words is the personal part. The music begins with something particular to you, then meets a life that is also particular to you.\n\nYou can know the story behind it and still leave room to discover your own relationship with the listening. Both kinds of understanding have a place.\n\n[Read where Zodiac comes from]({{article_12_origin}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m28","title":"M28 · People you can make something with","label":"Review email · M28","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Who would you enjoy doing this with?\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Shared interests can become a place for real connection.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>There may be something you enjoy that becomes different in company. Playing music, growing food, walking somewhere new, working out how to make a difficult thing work.\u003c/p>\n\u003cp>Shared attention gives people a place to meet. You have something real to do together, and a chance to learn how the other person approaches it.\u003c/p>\n\u003cp>That is part of what we mean by finding your people. It includes the people you can make something with, even when the thing you&#39;re making is an enjoyable afternoon.\u003c/p>\n\u003cp>Self-connection can help you recognize what you want to bring and what you value in someone else&#39;s contribution. Difference can make the collaboration more interesting. Everyone doesn&#39;t need to have the same strengths or the same way of getting clear.\u003c/p>\n\u003cp>If someone comes to mind, you could invite them to do something you would both enjoy. The invitation can be simple and leave them room to answer.\u003c/p>\n\u003cp>Zodiac belongs alongside that participation. Keep the music in your week, and let some of your attention go toward what you could share with another person.\u003c/p>\n\u003cp>\u003ca href=\"#finding-your-people\">Read about finding your people\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: Who would you enjoy doing this with?\n\nPreheader: Shared interests can become a place for real connection.\n\nHi {{givenname}},\n\nThere may be something you enjoy that becomes different in company. Playing music, growing food, walking somewhere new, working out how to make a difficult thing work.\n\nShared attention gives people a place to meet. You have something real to do together, and a chance to learn how the other person approaches it.\n\nThat is part of what we mean by finding your people. It includes the people you can make something with, even when the thing you're making is an enjoyable afternoon.\n\nSelf-connection can help you recognize what you want to bring and what you value in someone else's contribution. Difference can make the collaboration more interesting. Everyone doesn't need to have the same strengths or the same way of getting clear.\n\nIf someone comes to mind, you could invite them to do something you would both enjoy. The invitation can be simple and leave them room to answer.\n\nZodiac belongs alongside that participation. Keep the music in your week, and let some of your attention go toward what you could share with another person.\n\nRead about finding your people\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** Who would you enjoy doing this with?\n\n**Preheader:** Shared interests can become a place for real connection.\n\nHi {{given_name}},\n\nThere may be something you enjoy that becomes different in company. Playing music, growing food, walking somewhere new, working out how to make a difficult thing work.\n\nShared attention gives people a place to meet. You have something real to do together, and a chance to learn how the other person approaches it.\n\nThat is part of what we mean by finding your people. It includes the people you can make something with, even when the thing you're making is an enjoyable afternoon.\n\nSelf-connection can help you recognize what you want to bring and what you value in someone else's contribution. Difference can make the collaboration more interesting. Everyone doesn't need to have the same strengths or the same way of getting clear.\n\nIf someone comes to mind, you could invite them to do something you would both enjoy. The invitation can be simple and leave them room to answer.\n\nZodiac belongs alongside that participation. Keep the music in your week, and let some of your attention go toward what you could share with another person.\n\n[Read about finding your people]({{article_14_people}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m29","title":"M29 · Learning from the choice you made","label":"Review email · M29","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Self-trust can include changing your mind\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Experience gives you information your earlier self didn&#39;t have.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>You make a choice with what you know, then living with it tells you more. You discover which part you enjoy, what costs more than you expected, or what you would like to do differently.\u003c/p>\n\u003cp>Changing your mind can be a reasonable response to that information. Self-trust has room to learn.\u003c/p>\n\u003cp>Zodiac is designed to make your own reference more available when you choose. It doesn&#39;t make every instinct infallible or remove the need to see how a decision works in life.\u003c/p>\n\u003cp>If there is a choice you want to revisit, you can look at it without turning the review into a judgment of your whole character. What did you know then, and what has experience added? Think about what you can adjust or what needs a conversation with someone affected by the choice.\u003c/p>\n\u003cp>This is one use for the optional practice of noticing without immediately condemning what you find. A specific observation gives you something to work with.\u003c/p>\n\u003cp>Your four frequencies stay fixed. You continue learning. The combination leaves room for a steadier sense of yourself and an honest willingness to respond to new information.\u003c/p>\n\u003cp>\u003ca href=\"#your-bands\">Read how your bands describe getting clear\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: Self-trust can include changing your mind\n\nPreheader: Experience gives you information your earlier self didn't have.\n\nHi {{givenname}},\n\nYou make a choice with what you know, then living with it tells you more. You discover which part you enjoy, what costs more than you expected, or what you would like to do differently.\n\nChanging your mind can be a reasonable response to that information. Self-trust has room to learn.\n\nZodiac is designed to make your own reference more available when you choose. It doesn't make every instinct infallible or remove the need to see how a decision works in life.\n\nIf there is a choice you want to revisit, you can look at it without turning the review into a judgment of your whole character. What did you know then, and what has experience added? Think about what you can adjust or what needs a conversation with someone affected by the choice.\n\nThis is one use for the optional practice of noticing without immediately condemning what you find. A specific observation gives you something to work with.\n\nYour four frequencies stay fixed. You continue learning. The combination leaves room for a steadier sense of yourself and an honest willingness to respond to new information.\n\nRead how your bands describe getting clear\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** Self-trust can include changing your mind\n\n**Preheader:** Experience gives you information your earlier self didn't have.\n\nHi {{given_name}},\n\nYou make a choice with what you know, then living with it tells you more. You discover which part you enjoy, what costs more than you expected, or what you would like to do differently.\n\nChanging your mind can be a reasonable response to that information. Self-trust has room to learn.\n\nZodiac is designed to make your own reference more available when you choose. It doesn't make every instinct infallible or remove the need to see how a decision works in life.\n\nIf there is a choice you want to revisit, you can look at it without turning the review into a judgment of your whole character. What did you know then, and what has experience added? Think about what you can adjust or what needs a conversation with someone affected by the choice.\n\nThis is one use for the optional practice of noticing without immediately condemning what you find. A specific observation gives you something to work with.\n\nYour four frequencies stay fixed. You continue learning. The combination leaves room for a steadier sense of yourself and an honest willingness to respond to new information.\n\n[Read how your bands describe getting clear]({{article_11_exercises}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m30","title":"M30 · A practice you can keep using","label":"Review email · M30","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Make listening fit the life you&#39;re living now\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> A familiar rhythm can change when the rest of your day changes.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>The time that once suited your listening might belong to something else now. Work changes, households change, and an ordinary week can look different from the one you built a habit around.\u003c/p>\n\u003cp>It is worth finding a place for the music that fits your life now. Perhaps that is while you get ready, during a walk or alongside a practice you already enjoy.\u003c/p>\n\u003cp>The listening guidance stays simple. Include all four frequencies across the week, with each receiving at least 15 percent of your listening. The remaining 40 percent can follow your preference. The study&#39;s threshold was at least nine minutes a day on average across the week.\u003c/p>\n\u003cp>Missing a day doesn&#39;t erase previous listening, and an uneven week doesn&#39;t create a debt you have to repay. Return to a complete mix in the week ahead.\u003c/p>\n\u003cp>There is no special virtue in making the arrangement difficult. Choose music you want to hear and a time you can use.\u003c/p>\n\u003cp>The reason to continue is the possibility of bringing that connection into the choices and relationships that fill this part of your life.\u003c/p>\n\u003cp>\u003ca href=\"#balance-across-all-four\">Revisit balanced listening\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: Make listening fit the life you're living now\n\nPreheader: A familiar rhythm can change when the rest of your day changes.\n\nHi {{givenname}},\n\nThe time that once suited your listening might belong to something else now. Work changes, households change, and an ordinary week can look different from the one you built a habit around.\n\nIt is worth finding a place for the music that fits your life now. Perhaps that is while you get ready, during a walk or alongside a practice you already enjoy.\n\nThe listening guidance stays simple. Include all four frequencies across the week, with each receiving at least 15 percent of your listening. The remaining 40 percent can follow your preference. The study's threshold was at least nine minutes a day on average across the week.\n\nMissing a day doesn't erase previous listening, and an uneven week doesn't create a debt you have to repay. Return to a complete mix in the week ahead.\n\nThere is no special virtue in making the arrangement difficult. Choose music you want to hear and a time you can use.\n\nThe reason to continue is the possibility of bringing that connection into the choices and relationships that fill this part of your life.\n\nRevisit balanced listening\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** Make listening fit the life you're living now\n\n**Preheader:** A familiar rhythm can change when the rest of your day changes.\n\nHi {{given_name}},\n\nThe time that once suited your listening might belong to something else now. Work changes, households change, and an ordinary week can look different from the one you built a habit around.\n\nIt is worth finding a place for the music that fits your life now. Perhaps that is while you get ready, during a walk or alongside a practice you already enjoy.\n\nThe listening guidance stays simple. Include all four frequencies across the week, with each receiving at least 15 percent of your listening. The remaining 40 percent can follow your preference. The study's threshold was at least nine minutes a day on average across the week.\n\nMissing a day doesn't erase previous listening, and an uneven week doesn't create a debt you have to repay. Return to a complete mix in the week ahead.\n\nThere is no special virtue in making the arrangement difficult. Choose music you want to hear and a time you can use.\n\nThe reason to continue is the possibility of bringing that connection into the choices and relationships that fill this part of your life.\n\n[Revisit balanced listening]({{article_15_balance}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m31","title":"M31 · Bringing your own view into the room","label":"Review email · M31","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> You can have your own view and stay curious\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Connection includes what you think, and room for what someone else sees.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>In a conversation that matters, you can know what you think and still be interested in another person&#39;s view. Having a position doesn&#39;t have to close the conversation.\u003c/p>\n\u003cp>Core concerns your sense of who you are and what is yours. A clearer connection with that reference can give you somewhere to speak from, without needing every person in the room to agree.\u003c/p>\n\u003cp>That leaves more room for an actual exchange. You can offer an idea, hear an objection and consider it on its merits. Someone else might have seen something you missed.\u003c/p>\n\u003cp>The connected self is already whole. Its worth doesn&#39;t rise or fall with how well an argument goes. Remembering that can make the question itself more interesting than the impression you&#39;re making.\u003c/p>\n\u003cp>If this is useful, bring it to an ordinary conversation. Say what you mean clearly enough that the other person can respond to it.\u003c/p>\n\u003cp>Keep listening across all four frequencies. Self-connection has value when it lets more of you take part, with more attention available for the other person too.\u003c/p>\n\u003cp>\u003ca href=\"#connected-self\">Return to the connected self\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: You can have your own view and stay curious\n\nPreheader: Connection includes what you think, and room for what someone else sees.\n\nHi {{givenname}},\n\nIn a conversation that matters, you can know what you think and still be interested in another person's view. Having a position doesn't have to close the conversation.\n\nCore concerns your sense of who you are and what is yours. A clearer connection with that reference can give you somewhere to speak from, without needing every person in the room to agree.\n\nThat leaves more room for an actual exchange. You can offer an idea, hear an objection and consider it on its merits. Someone else might have seen something you missed.\n\nThe connected self is already whole. Its worth doesn't rise or fall with how well an argument goes. Remembering that can make the question itself more interesting than the impression you're making.\n\nIf this is useful, bring it to an ordinary conversation. Say what you mean clearly enough that the other person can respond to it.\n\nKeep listening across all four frequencies. Self-connection has value when it lets more of you take part, with more attention available for the other person too.\n\nReturn to the connected self\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** You can have your own view and stay curious\n\n**Preheader:** Connection includes what you think, and room for what someone else sees.\n\nHi {{given_name}},\n\nIn a conversation that matters, you can know what you think and still be interested in another person's view. Having a position doesn't have to close the conversation.\n\nCore concerns your sense of who you are and what is yours. A clearer connection with that reference can give you somewhere to speak from, without needing every person in the room to agree.\n\nThat leaves more room for an actual exchange. You can offer an idea, hear an objection and consider it on its merits. Someone else might have seen something you missed.\n\nThe connected self is already whole. Its worth doesn't rise or fall with how well an argument goes. Remembering that can make the question itself more interesting than the impression you're making.\n\nIf this is useful, bring it to an ordinary conversation. Say what you mean clearly enough that the other person can respond to it.\n\nKeep listening across all four frequencies. Self-connection has value when it lets more of you take part, with more attention available for the other person too.\n\n[Return to the connected self]({{article_03_connected_self}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m32","title":"M32 · Room before the reply","label":"Review email · M32","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> A moment before you answer\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Sometimes recognition gives you room for a different response.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>A message arrives, and you can already hear the answer you want to send. Then you notice something about your own response. There is another way you could say it, or a question you could ask first.\u003c/p>\n\u003cp>That room before responding is one of the possibilities we care about in Zodiac. It can let you see a familiar reaction while there is still a choice about what comes next.\u003c/p>\n\u003cp>This kind of recognition can develop as you keep listening, but it has no deadline. Receiving this letter doesn&#39;t mean you should have reached a particular stage.\u003c/p>\n\u003cp>If you recognize such a moment, notice what it made possible. Perhaps you answered more accurately, waited for context or returned to repair something you had already said.\u003c/p>\n\u003cp>You will still have reactions. The useful difference is having more of yourself available within them.\u003c/p>\n\u003cp>Listening can remain ordinary. You don&#39;t need to spend the day watching for this. The next real conversation will give you enough to be present for.\u003c/p>\n\u003cp>\u003ca href=\"#what-to-expect\">Read what to expect as you listen\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: A moment before you answer\n\nPreheader: Sometimes recognition gives you room for a different response.\n\nHi {{givenname}},\n\nA message arrives, and you can already hear the answer you want to send. Then you notice something about your own response. There is another way you could say it, or a question you could ask first.\n\nThat room before responding is one of the possibilities we care about in Zodiac. It can let you see a familiar reaction while there is still a choice about what comes next.\n\nThis kind of recognition can develop as you keep listening, but it has no deadline. Receiving this letter doesn't mean you should have reached a particular stage.\n\nIf you recognize such a moment, notice what it made possible. Perhaps you answered more accurately, waited for context or returned to repair something you had already said.\n\nYou will still have reactions. The useful difference is having more of yourself available within them.\n\nListening can remain ordinary. You don't need to spend the day watching for this. The next real conversation will give you enough to be present for.\n\nRead what to expect as you listen\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** A moment before you answer\n\n**Preheader:** Sometimes recognition gives you room for a different response.\n\nHi {{given_name}},\n\nA message arrives, and you can already hear the answer you want to send. Then you notice something about your own response. There is another way you could say it, or a question you could ask first.\n\nThat room before responding is one of the possibilities we care about in Zodiac. It can let you see a familiar reaction while there is still a choice about what comes next.\n\nThis kind of recognition can develop as you keep listening, but it has no deadline. Receiving this letter doesn't mean you should have reached a particular stage.\n\nIf you recognize such a moment, notice what it made possible. Perhaps you answered more accurately, waited for context or returned to repair something you had already said.\n\nYou will still have reactions. The useful difference is having more of yourself available within them.\n\nListening can remain ordinary. You don't need to spend the day watching for this. The next real conversation will give you enough to be present for.\n\n[Read what to expect as you listen]({{article_06_expectations}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m33","title":"M33 · Two years, with more life ahead","label":"Review email · M33","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> What do you want to carry forward?\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Two years offers perspective, and the next part belongs to you.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>Two years is enough time for life to change in ways you could have planned and ways you couldn&#39;t. Look back at what mattered most to you.\u003c/p>\n\u003cp>What do you understand about yourself more clearly? Which relationships have become important? Where do you want to put your energy now?\u003c/p>\n\u003cp>You can value what you have learned and still have unanswered questions. A continuing life gives you new occasions to recognize yourself, reconsider a choice and meet someone more fully.\u003c/p>\n\u003cp>Your four birth frequencies remain yours. The connected self they help you reach was already whole when you began. The purpose of listening is to make that connection more available as you take part in the world.\u003c/p>\n\u003cp>So keep what helps you live with more honesty and interest. Make room for the work you care about, the people you want to know and the pleasure of being here.\u003c/p>\n\u003cp>There is no final version of you to present at the end of this email. What would you like to bring to the life ahead?\u003c/p>\n\u003cp>\u003ca href=\"#what-we-believe\">Read what the music is here for\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: What do you want to carry forward?\n\nPreheader: Two years offers perspective, and the next part belongs to you.\n\nHi {{givenname}},\n\nTwo years is enough time for life to change in ways you could have planned and ways you couldn't. Look back at what mattered most to you.\n\nWhat do you understand about yourself more clearly? Which relationships have become important? Where do you want to put your energy now?\n\nYou can value what you have learned and still have unanswered questions. A continuing life gives you new occasions to recognize yourself, reconsider a choice and meet someone more fully.\n\nYour four birth frequencies remain yours. The connected self they help you reach was already whole when you began. The purpose of listening is to make that connection more available as you take part in the world.\n\nSo keep what helps you live with more honesty and interest. Make room for the work you care about, the people you want to know and the pleasure of being here.\n\nThere is no final version of you to present at the end of this email. What would you like to bring to the life ahead?\n\nRead what the music is here for\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** What do you want to carry forward?\n\n**Preheader:** Two years offers perspective, and the next part belongs to you.\n\nHi {{given_name}},\n\nTwo years is enough time for life to change in ways you could have planned and ways you couldn't. Look back at what mattered most to you.\n\nWhat do you understand about yourself more clearly? Which relationships have become important? Where do you want to put your energy now?\n\nYou can value what you have learned and still have unanswered questions. A continuing life gives you new occasions to recognize yourself, reconsider a choice and meet someone more fully.\n\nYour four birth frequencies remain yours. The connected self they help you reach was already whole when you began. The purpose of listening is to make that connection more available as you take part in the world.\n\nSo keep what helps you live with more honesty and interest. Make room for the work you care about, the people you want to know and the pleasure of being here.\n\nThere is no final version of you to present at the end of this email. What would you like to bring to the life ahead?\n\n[Read what the music is here for]({{article_16_beliefs}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"}]};</script>
<script>
(() => { const store=window.ZODIAC_REVIEW_CONTENT, nav=document.querySelector('#nav'), mobile=document.querySelector('#mobile-nav'), search=document.querySelector('#search'), content=document.querySelector('#content'), meta=document.querySelector('#item-meta'), pager=document.querySelector('#pager'), copied=document.querySelector('#copied'); let shown=[...store.items], current;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function grouped(){return ['Pages','Articles','FAQ','Getting started','Emails','Affiliate'].map(category=>[category,shown.filter(i=>i.category===category)]).filter(([,items])=>items.length)}
function renderNav(){nav.innerHTML=grouped().map(([category,items])=>'<section class="nav-group"><p class="nav-label">'+esc(category)+'</p>'+items.map(i=>'<button class="nav-item '+(current&&i.slug===current.slug?'active':'')+'" data-slug="'+esc(i.slug)+'">'+esc(i.title)+'</button>').join('')+'</section>').join('')||'<p class="empty">No matching content.</p>'; mobile.innerHTML='<option value="">Choose content…</option>'+grouped().map(([category,items])=>'<optgroup label="'+esc(category)+'">'+items.map(i=>'<option value="'+esc(i.slug)+'" '+(current&&i.slug===current.slug?'selected':'')+'>'+esc(i.title)+'</option>').join('')+'</optgroup>').join('');}
function show(slug){const item=shown.find(i=>i.slug===slug)||shown.find(i=>i.slug===store.defaultSlug)||shown[0]; if(!item){current=null;meta.textContent='';content.innerHTML='<p class="empty">No matching content.</p><button class="tool" id="clear-search" type="button">Clear search</button>';pager.innerHTML='';renderNav();document.querySelector('#clear-search').addEventListener('click',()=>{search.value='';shown=[...store.items];show(store.defaultSlug)});return} current=item; meta.textContent=item.label||item.category; content.innerHTML=(item.hasSourceH1?'':'<h1>'+esc(item.title)+'</h1>')+item.html; renderNav(); const index=shown.indexOf(item), prev=shown[index-1], next=shown[index+1]; pager.innerHTML=(prev?'<button data-slug="'+esc(prev.slug)+'">← '+esc(prev.title)+'</button>':'<span></span>')+(next?'<button data-slug="'+esc(next.slug)+'">'+esc(next.title)+' →</button>':'<span></span>'); if(location.hash.slice(1)!==item.slug) history.replaceState(null,'','#'+item.slug); window.scrollTo({top:0,behavior:'instant'});}
function filter(){const q=search.value.trim().toLowerCase();shown=store.items.filter(i=>!q||(i.title+' '+i.text).toLowerCase().includes(q));show((current&&shown.some(i=>i.slug===current.slug))?current.slug:shown[0]?.slug);}
nav.addEventListener('click',e=>{const b=e.target.closest('[data-slug]');if(b)show(b.dataset.slug)}); mobile.addEventListener('change',e=>e.target.value&&show(e.target.value)); pager.addEventListener('click',e=>{const b=e.target.closest('[data-slug]');if(b)show(b.dataset.slug)}); search.addEventListener('input',filter); document.querySelector('#copy').addEventListener('click',async()=>{if(!current)return; try{await navigator.clipboard.writeText(current.copyText);copied.textContent='Copied.'}catch{copied.textContent='Copy unavailable in this browser.'} setTimeout(()=>copied.textContent='',2200)}); window.addEventListener('hashchange',()=>show(decodeURIComponent(location.hash.slice(1)))); show(decodeURIComponent(location.hash.slice(1)||store.defaultSlug));})();
</script></body></html>
