atterns in Centers, profile and incarnation cross.\n\nLiving that design is personal. For someone whose Authority involves emotional clarity over time, a clearer connection with themselves can include knowing to wait. Intuition is not a command to act on the first impulse.\n\nZodiac does not calculate each of those chart components into a separate tone or teach their meanings through music. Its contribution is access to the self you are learning about.\n\nKeep the language and context that help you. The music can come with you into the parts of life where you use them.\n\nRead where the frequencies come from.\n\n Hear your own music\n\nNew to Zodiac? Find your frequencies and hear three short songs in each one without a card.\n\nAlready have your frequencies? Open your music with the same account email.","copyText":"# Living what your chart describes\n\nThere is a particular pleasure in being described accurately. A trait you have spent years explaining suddenly makes sense. Someone names the pattern, and you recognize yourself.\n\nA reading can do that. It can give you compassion for your nature and context for the chapter you are in.\n\nNow imagine that recognition becoming more available while you live. In the conversation itself. At the point of choosing. When you need to know whether to move or give something time.\n\nThat is the possibility behind Zodiac.\n\n## The pattern can be approached through sound\n\nNāda Brahma is the Vedic teaching that the world is sound. Within that understanding, the pattern present at birth has a sound too.\n\nA mantra lineage developed a method for finding it. We use the frequency part of that method to derive four frequencies from your birth date, time and place, then put them into music.\n\nListening amplifies your access to the connected self. The nature you recognize in a reading can become something you recognize from within, while the day is happening.\n\n## Your timing, through a changing sky\n\nIf you follow astrology, a transit or return can give language to a change you are already living. Progressions and profections can put that chapter in a larger frame.\n\nYour birth frequencies remain fixed through it. Zodiac does not mix today's sky into a new set of tones. Your own signal is the steady reference.\n\nThe appeal is being more connected to your nature as you meet the change. You can value the reading and still want that access when you are making a choice, not only while discussing one.\n\n## Your design, with room to live it\n\nHuman Design gives specific language to Type, Strategy and Authority, and to patterns in Centers, profile and incarnation cross.\n\nLiving that design is personal. For someone whose Authority involves emotional clarity over time, a clearer connection with themselves can include knowing to wait. Intuition is not a command to act on the first impulse.\n\nZodiac does not calculate each of those chart components into a separate tone or teach their meanings through music. Its contribution is access to the self you are learning about.\n\nKeep the language and context that help you. The music can come with you into the parts of life where you use them.\n\n[Read where the frequencies come from](./where-zodiac-comes-from.md).\n\n\n## Hear your own music\n\nNew to Zodiac? [Find your frequencies](../pages/birth-details.md) and hear three short songs in each one without a card.\n\nAlready have your frequencies? [Open your music](../pages/free-listen.md) with the same account email."},{"category":"Articles","slug":"manifestation-and-your-own-signal","title":"What if the wanting became clearer?","label":"Articles","hasSourceH1":true,"html":"\u003ch1>What if the wanting became clearer?\u003c/h1>\n\u003cp>You can want the same thing as someone else for completely different reasons.\u003c/p>\n\u003cp>A bigger business might mean freedom to make the work you care about. It might mean finally earning somebody&#39;s approval. From the outside, the ambition looks the same. Living it can be very different.\u003c/p>\n\u003cp>Manifestation gets interesting here. Who is doing the wanting?\u003c/p>\n\u003ch2>Start with your own nature\u003c/h2>\n\u003cp>Your connected self is who you were before you learned who to be, and the part of you connected to everything and everyone else.\u003c/p>\n\u003cp>Zodiac starts there. The Vedic teaching of Nāda Brahma says the world is sound, which led us to a mantra lineage working with the sound of the birth pattern itself. Their method gives us four fixed frequencies from your birth date, time and place.\u003c/p>\n\u003cp>We put those frequencies into music to amplify your connection with that self.\u003c/p>\n\u003cp>The attraction is simple. What you set out to create can come from a place you recognize as yours.\u003c/p>\n\u003ch2>Clarity still has somewhere to go\u003c/h2>\n\u003cp>You may find yourself wanting something different. Or wanting the same thing with a clearer reason for pursuing it.\u003c/p>\n\u003cp>Then comes the application, the conversation, the work. Sometimes the useful move is waiting without turning the wait into a verdict on yourself.\u003c/p>\n\u003cp>Core concerns who you are and what is yours to do. Love concerns connection. Vitality concerns what feeds you. Abundance concerns timing and which opportunities are yours. Together, they bring the idea of alignment into the choices a life is made of.\u003c/p>\n\u003ch2>Your practice has room for music\u003c/h2>\n\u003cp>Listen while you visualize or journal, if that is part of your day. You can also let the music play while you get on with the work.\u003c/p>\n\u003cp>You don&#39;t need to keep every thought positive or turn listening into another performance. Zodiac is about access to yourself.\u003c/p>\n\u003cp>We cannot promise a particular person, job, amount of money or event. What makes this worth exploring is the possibility of meeting what comes with more of yourself available, and recognizing what you actually want to meet.\u003c/p>\n\u003cp>\u003ca href=\"#connected-self\">Read about the connected self\u003c/a>.\u003c/p>\n\u003ch2>Hear your own music\u003c/h2>\n\u003cp>New to Zodiac? \u003ca href=\"#birth-details\">Find your frequencies\u003c/a> and hear three short songs in each one without a card.\u003c/p>\n\u003cp>Already have your frequencies? \u003ca href=\"#free-listen\">Open your music\u003c/a> with the same account email.\u003c/p>\n","text":"What if the wanting became clearer?\n\nYou can want the same thing as someone else for completely different reasons.\n\nA bigger business might mean freedom to make the work you care about. It might mean finally earning somebody's approval. From the outside, the ambition looks the same. Living it can be very different.\n\nManifestation gets interesting here. Who is doing the wanting?\n\n Start with your own nature\n\nYour connected self is who you were before you learned who to be, and the part of you connected to everything and everyone else.\n\nZodiac starts there. The Vedic teaching of Nāda Brahma says the world is sound, which led us to a mantra lineage working with the sound of the birth pattern itself. Their method gives us four fixed frequencies from your birth date, time and place.\n\nWe put those frequencies into music to amplify your connection with that self.\n\nThe attraction is simple. What you set out to create can come from a place you recognize as yours.\n\n Clarity still has somewhere to go\n\nYou may find yourself wanting something different. Or wanting the same thing with a clearer reason for pursuing it.\n\nThen comes the application, the conversation, the work. Sometimes the useful move is waiting without turning the wait into a verdict on yourself.\n\nCore concerns who you are and what is yours to do. Love concerns connection. Vitality concerns what feeds you. Abundance concerns timing and which opportunities are yours. Together, they bring the idea of alignment into the choices a life is made of.\n\n Your practice has room for music\n\nListen while you visualize or journal, if that is part of your day. You can also let the music play while you get on with the work.\n\nYou don't need to keep every thought positive or turn listening into another performance. Zodiac is about access to yourself.\n\nWe cannot promise a particular person, job, amount of money or event. What makes this worth exploring is the possibility of meeting what comes with more of yourself available, and recognizing what you actually want to meet.\n\nRead about the connected self.\n\n Hear your own music\n\nNew to Zodiac? Find your frequencies and hear three short songs in each one without a card.\n\nAlready have your frequencies? Open your music with the same account email.","copyText":"# What if the wanting became clearer?\n\nYou can want the same thing as someone else for completely different reasons.\n\nA bigger business might mean freedom to make the work you care about. It might mean finally earning somebody's approval. From the outside, the ambition looks the same. Living it can be very different.\n\nManifestation gets interesting here. Who is doing the wanting?\n\n## Start with your own nature\n\nYour connected self is who you were before you learned who to be, and the part of you connected to everything and everyone else.\n\nZodiac starts there. The Vedic teaching of Nāda Brahma says the world is sound, which led us to a mantra lineage working with the sound of the birth pattern itself. Their method gives us four fixed frequencies from your birth date, time and place.\n\nWe put those frequencies into music to amplify your connection with that self.\n\nThe attraction is simple. What you set out to create can come from a place you recognize as yours.\n\n## Clarity still has somewhere to go\n\nYou may find yourself wanting something different. Or wanting the same thing with a clearer reason for pursuing it.\n\nThen comes the application, the conversation, the work. Sometimes the useful move is waiting without turning the wait into a verdict on yourself.\n\nCore concerns who you are and what is yours to do. Love concerns connection. Vitality concerns what feeds you. Abundance concerns timing and which opportunities are yours. Together, they bring the idea of alignment into the choices a life is made of.\n\n## Your practice has room for music\n\nListen while you visualize or journal, if that is part of your day. You can also let the music play while you get on with the work.\n\nYou don't need to keep every thought positive or turn listening into another performance. Zodiac is about access to yourself.\n\nWe cannot promise a particular person, job, amount of money or event. What makes this worth exploring is the possibility of meeting what comes with more of yourself available, and recognizing what you actually want to meet.\n\n[Read about the connected self](./connected-self.md).\n\n\n## Hear your own music\n\nNew to Zodiac? [Find your frequencies](../pages/birth-details.md) and hear three short songs in each one without a card.\n\nAlready have your frequencies? [Open your music](../pages/free-listen.md) with the same account email."},{"category":"Articles","slug":"the-year-long-study","title":"What listeners reported over a year","label":"Articles","hasSourceH1":true,"html":"\u003ch1>What listeners reported over a year\u003c/h1>\n\u003cp>After trying Zodiac ourselves and with smaller groups, we wanted to follow the experience for longer.\u003c/p>\n\u003cp>Three hundred people began a 52-week study. Two hundred and seventy-eight completed it. Every two weeks, participants answered open questions about their lives, and their listening was logged.\u003c/p>\n\u003cp>We coded the responses in-house. This was our own study, not a clinical trial, and it has not been published in a journal.\u003c/p>\n\u003ch2>Who the figures describe\u003c/h2>\n\u003cp>Of those who completed the year, 98.6 percent said they would recommend Zodiac to a friend. Seventy-point-five percent called it life-changing.\u003c/p>\n\u003cp>We also looked at people who listened as designed: at least nine minutes a day on average, with each of the four frequencies receiving at least 15 percent of their listening time. Eighty-four percent of that group called it life-changing.\u003c/p>\n\u003cp>The outcome and timing percentages below describe that as-designed group. These are not percentages of everyone who signed up, and the 278 completers are not automatically the denominator for each figure.\u003c/p>\n\u003ch2>What they described\u003c/h2>\n\u003cp>Ninety-four percent reported deeper self-access. They described feeling like themselves again.\u003c/p>\n\u003cp>Ninety-one percent reported sharper instincts. Their own sense of a person, a choice or an opening became easier to recognize and trust.\u003c/p>\n\u003cp>Ninety-two percent reported internal regulation. That was our label for experiences of feeling calmer and steadier, not a measured medical effect.\u003c/p>\n\u003cp>Ninety percent reported better relationships and love, with more real connection.\u003c/p>\n\u003cp>Eighty-eight percent reported that life responded, including openings and situations moving their way.\u003c/p>\n\u003cp>Ninety percent reported connection to something bigger.\u003c/p>\n\u003cp>Ninety-one percent described the witness: a little space between what happened and their reaction, giving them more room to choose. This was the one change that tended to arrive later than the others. We do not have a measured month for that individual outcome.\u003c/p>\n\u003cp>Ninety-six percent reported three or more of these seven changes.\u003c/p>\n\u003ch2>When an overall shift became clear\u003c/h2>\n\u003cp>Sixty-one percent of the as-designed listeners reported a clear shift by month one. By month three, it was 81 percent. By month six, 87 percent.\u003c/p>\n\u003cp>Those are group findings. They are not deadlines for you, and they do not tell us when a particular change will arrive.\u003c/p>\n\u003cp>People who listened more tended to report change sooner. The study does not give us a formula for how quickly an individual will respond.\u003c/p>\n\u003ch2>What to take from this\u003c/h2>\n\u003cp>The study gives us a sustained record of what listeners reported. It does not, by itself, establish that the frequencies caused every change, prove the metaphysical explanation or guarantee your result.\u003c/p>\n\u003cp>It does give you something more useful than a promise about your first song: the experiences of people who kept listening through an ordinary year.\u003c/p>\n\u003cp>\u003ca href=\"#what-to-expect\">Read what to expect when you begin\u003c/a>.\u003c/p>\n\u003ch2>Hear your own music\u003c/h2>\n\u003cp>New to Zodiac? \u003ca href=\"#birth-details\">Find your frequencies\u003c/a> and hear three short songs in each one without a card.\u003c/p>\n\u003cp>Already have your frequencies? \u003ca href=\"#free-listen\">Open your music\u003c/a> with the same account email.\u003c/p>\n","text":"What listeners reported over a year\n\nAfter trying Zodiac ourselves and with smaller groups, we wanted to follow the experience for longer.\n\nThree hundred people began a 52-week study. Two hundred and seventy-eight completed it. Every two weeks, participants answered open questions about their lives, and their listening was logged.\n\nWe coded the responses in-house. This was our own study, not a clinical trial, and it has not been published in a journal.\n\n Who the figures describe\n\nOf those who completed the year, 98.6 percent said they would recommend Zodiac to a friend. Seventy-point-five percent called it life-changing.\n\nWe also looked at people who listened as designed: at least nine minutes a day on average, with each of the four frequencies receiving at least 15 percent of their listening time. Eighty-four percent of that group called it life-changing.\n\nThe outcome and timing percentages below describe that as-designed group. These are not percentages of everyone who signed up, and the 278 completers are not automatically the denominator for each figure.\n\n What they described\n\nNinety-four percent reported deeper self-access. They described feeling like themselves again.\n\nNinety-one percent reported sharper instincts. Their own sense of a person, a choice or an opening became easier to recognize and trust.\n\nNinety-two percent reported internal regulation. That was our label for experiences of feeling calmer and steadier, not a measured medical effect.\n\nNinety percent reported better relationships and love, with more real connection.\n\nEighty-eight percent reported that life responded, including openings and situations moving their way.\n\nNinety percent reported connection to something bigger.\n\nNinety-one percent described the witness: a little space between what happened and their reaction, giving them more room to choose. This was the one change that tended to arrive later than the others. We do not have a measured month for that individual outcome.\n\nNinety-six percent reported three or more of these seven changes.\n\n When an overall shift became clear\n\nSixty-one percent of the as-designed listeners reported a clear shift by month one. By month three, it was 81 percent. By month six, 87 percent.\n\nThose are group findings. They are not deadlines for you, and they do not tell us when a particular change will arrive.\n\nPeople who listened more tended to report change sooner. The study does not give us a formula for how quickly an individual will respond.\n\n What to take from this\n\nThe study gives us a sustained record of what listeners reported. It does not, by itself, establish that the frequencies caused every change, prove the metaphysical explanation or guarantee your result.\n\nIt does give you something more useful than a promise about your first song: the experiences of people who kept listening through an ordinary year.\n\nRead what to expect when you begin.\n\n Hear your own music\n\nNew to Zodiac? Find your frequencies and hear three short songs in each one without a card.\n\nAlready have your frequencies? Open your music with the same account email.","copyText":"# What listeners reported over a year\n\nAfter trying Zodiac ourselves and with smaller groups, we wanted to follow the experience for longer.\n\nThree hundred people began a 52-week study. Two hundred and seventy-eight completed it. Every two weeks, participants answered open questions about their lives, and their listening was logged.\n\nWe coded the responses in-house. This was our own study, not a clinical trial, and it has not been published in a journal.\n\n## Who the figures describe\n\nOf those who completed the year, 98.6 percent said they would recommend Zodiac to a friend. Seventy-point-five percent called it life-changing.\n\nWe also looked at people who listened as designed: at least nine minutes a day on average, with each of the four frequencies receiving at least 15 percent of their listening time. Eighty-four percent of that group called it life-changing.\n\nThe outcome and timing percentages below describe that as-designed group. These are not percentages of everyone who signed up, and the 278 completers are not automatically the denominator for each figure.\n\n## What they described\n\nNinety-four percent reported deeper self-access. They described feeling like themselves again.\n\nNinety-one percent reported sharper instincts. Their own sense of a person, a choice or an opening became easier to recognize and trust.\n\nNinety-two percent reported internal regulation. That was our label for experiences of feeling calmer and steadier, not a measured medical effect.\n\nNinety percent reported better relationships and love, with more real connection.\n\nEighty-eight percent reported that life responded, including openings and situations moving their way.\n\nNinety percent reported connection to something bigger.\n\nNinety-one percent described the witness: a little space between what happened and their reaction, giving them more room to choose. This was the one change that tended to arrive later than the others. We do not have a measured month for that individual outcome.\n\nNinety-six percent reported three or more of these seven changes.\n\n## When an overall shift became clear\n\nSixty-one percent of the as-designed listeners reported a clear shift by month one. By month three, it was 81 percent. By month six, 87 percent.\n\nThose are group findings. They are not deadlines for you, and they do not tell us when a particular change will arrive.\n\nPeople who listened more tended to report change sooner. The study does not give us a formula for how quickly an individual will respond.\n\n## What to take from this\n\nThe study gives us a sustained record of what listeners reported. It does not, by itself, establish that the frequencies caused every change, prove the metaphysical explanation or guarantee your result.\n\nIt does give you something more useful than a promise about your first song: the experiences of people who kept listening through an ordinary year.\n\n[Read what to expect when you begin](./what-to-expect.md).\n\n\n## Hear your own music\n\nNew to Zodiac? [Find your frequencies](../pages/birth-details.md) and hear three short songs in each one without a card.\n\nAlready have your frequencies? [Open your music](../pages/free-listen.md) with the same account email."},{"category":"Articles","slug":"where-zodiac-comes-from","title":"If the world is sound, what is your sound?","label":"Articles","hasSourceH1":true,"html":"\u003ch1>If the world is sound, what is your sound?\u003c/h1>\n\u003cp>An accurate reading raises an interesting question. How does the arrangement of the sky at birth give someone so much to recognize about themselves?\u003c/p>\n\u003cp>The Vedic teaching of Nāda Brahma offers a way to approach it. The world is sound. You, the planets and the music are part of one reality.\u003c/p>\n\u003cp>Within that worldview, it makes sense that the pattern present at birth would have a sound of its own. The next question is how to find it.\u003c/p>\n\u003ch2>A lineage was already working with it\u003c/h2>\n\u003cp>A mantra lineage was making personal mantras from birth information. Its seed mantras remain protected. Zodiac uses the frequency part of the method to find four frequencies from your birth date, time and place.\u003c/p>\n\u003cp>We call them Core, Love, Vitality and Abundance.\u003c/p>\n\u003cp>The origin matters because these are derived from your birth pattern. They are not four popular frequencies chosen because someone associates them with love, money or calm.\u003c/p>\n\u003ch2>Getting the frequencies into your day\u003c/h2>\n\u003cp>The frequency method gave us the pitches. Making them enjoyable to listen to was a different job.\u003c/p>\n\u003cp>Real musicians make the songs. Audio engineers then prepare each composition across the frequency range, retuning the music so your exact pitch belongs inside the harmony.\u003c/p>\n\u003cp>Your frequency plays throughout its track. You can leave the music on while you work, meditate or do something as ordinary as making dinner.\u003c/p>\n\u003ch2>The idea and the experience\u003c/h2>\n\u003cp>We work from the possibility that these frequencies amplify the signal connecting you with your connected self. The person a reading helps you recognize becomes more available from within.\u003c/p>\n\u003cp>That is our explanation of what we are doing. It is not scientific proof of the worldview behind it.\u003c/p>\n\u003cp>We also studied what listeners reported over a full year. Their experiences are worth reading on their own terms, with the limits of that study stated plainly.\u003c/p>\n\u003cp>\u003ca href=\"#the-year-long-study\">Read about the year-long study\u003c/a>.\u003c/p>\n\u003ch2>Hear your own music\u003c/h2>\n\u003cp>New to Zodiac? \u003ca href=\"#birth-details\">Find your frequencies\u003c/a> and hear three short songs in each one without a card.\u003c/p>\n\u003cp>Already have your frequencies? \u003ca href=\"#free-listen\">Open your music\u003c/a> with the same account email.\u003c/p>\n","text":"If the world is sound, what is your sound?\n\nAn accurate reading raises an interesting question. How does the arrangement of the sky at birth give someone so much to recognize about themselves?\n\nThe Vedic teaching of Nāda Brahma offers a way to approach it. The world is sound. You, the planets and the music are part of one reality.\n\nWithin that worldview, it makes sense that the pattern present at birth would have a sound of its own. The next question is how to find it.\n\n A lineage was already working with it\n\nA mantra lineage was making personal mantras from birth information. Its seed mantras remain protected. Zodiac uses the frequency part of the method to find four frequencies from your birth date, time and place.\n\nWe call them Core, Love, Vitality and Abundance.\n\nThe origin matters because these are derived from your birth pattern. They are not four popular frequencies chosen because someone associates them with love, money or calm.\n\n Getting the frequencies into your day\n\nThe frequency method gave us the pitches. Making them enjoyable to listen to was a different job.\n\nReal musicians make the songs. Audio engineers then prepare each composition across the frequency range, retuning the music so your exact pitch belongs inside the harmony.\n\nYour frequency plays throughout its track. You can leave the music on while you work, meditate or do something as ordinary as making dinner.\n\n The idea and the experience\n\nWe work from the possibility that these frequencies amplify the signal connecting you with your connected self. The person a reading helps you recognize becomes more available from within.\n\nThat is our explanation of what we are doing. It is not scientific proof of the worldview behind it.\n\nWe also studied what listeners reported over a full year. Their experiences are worth reading on their own terms, with the limits of that study stated plainly.\n\nRead about the year-long study.\n\n Hear your own music\n\nNew to Zodiac? Find your frequencies and hear three short songs in each one without a card.\n\nAlready have your frequencies? Open your music with the same account email.","copyText":"# If the world is sound, what is your sound?\n\nAn accurate reading raises an interesting question. How does the arrangement of the sky at birth give someone so much to recognize about themselves?\n\nThe Vedic teaching of Nāda Brahma offers a way to approach it. The world is sound. You, the planets and the music are part of one reality.\n\nWithin that worldview, it makes sense that the pattern present at birth would have a sound of its own. The next question is how to find it.\n\n## A lineage was already working with it\n\nA mantra lineage was making personal mantras from birth information. Its seed mantras remain protected. Zodiac uses the frequency part of the method to find four frequencies from your birth date, time and place.\n\nWe call them Core, Love, Vitality and Abundance.\n\nThe origin matters because these are derived from your birth pattern. They are not four popular frequencies chosen because someone associates them with love, money or calm.\n\n## Getting the frequencies into your day\n\nThe frequency method gave us the pitches. Making them enjoyable to listen to was a different job.\n\nReal musicians make the songs. Audio engineers then prepare each composition across the frequency range, retuning the music so your exact pitch belongs inside the harmony.\n\nYour frequency plays throughout its track. You can leave the music on while you work, meditate or do something as ordinary as making dinner.\n\n## The idea and the experience\n\nWe work from the possibility that these frequencies amplify the signal connecting you with your connected self. The person a reading helps you recognize becomes more available from within.\n\nThat is our explanation of what we are doing. It is not scientific proof of the worldview behind it.\n\nWe also studied what listeners reported over a full year. Their experiences are worth reading on their own terms, with the limits of that study stated plainly.\n\n[Read about the year-long study](./the-year-long-study.md).\n\n\n## Hear your own music\n\nNew to Zodiac? [Find your frequencies](../pages/birth-details.md) and hear three short songs in each one without a card.\n\nAlready have your frequencies? [Open your music](../pages/free-listen.md) with the same account email."},{"category":"Articles","slug":"finding-your-people","title":"The people you can be yourself with","label":"Articles","hasSourceH1":true,"html":"\u003ch1>The people you can be yourself with\u003c/h1>\n\u003cp>There are people with whom you don&#39;t have to explain your pace. You can think out loud, take your time or follow an idea further than you meant to. Something in the connection has room for it.\u003c/p>\n\u003cp>That doesn&#39;t mean you agree on everything. It means your nature has somewhere to go.\u003c/p>\n\u003ch2>Different ways can belong together\u003c/h2>\n\u003cp>One person sees the whole project. Another knows the next step. Someone finds the words, and someone else notices what needs to settle before a decision will hold.\u003c/p>\n\u003cp>The same is true in a family or a friendship. Not everyone has to bring the same thing for the relationship to work.\u003c/p>\n\u003cp>Your Zodiac bands give language to some of these differences. Stillness, motion, expression and perspective are all ways of finding clarity. None is a higher level than the others.\u003c/p>\n\u003cp>Knowing your own preference can help you make room for someone else&#39;s. They may need a walk where you need a conversation. You can respect both.\u003c/p>\n\u003ch2>Let the relationship tell you something\u003c/h2>\n\u003cp>Love is the signal for who to let close and how to connect.\u003c/p>\n\u003cp>It can be useful to notice what happens around a person. Can you say what you mean? Is there room for a no? Do you feel able to be warm without making yourself smaller?\u003c/p>\n\u003cp>Those questions belong to your judgment. A frequency number cannot tell you whether to trust someone, and matching numbers are not a compatibility verdict.\u003c/p>\n\u003cp>Zodiac&#39;s purpose is to amplify your access to your connected self as you meet the relationship. The music uses four fixed birth frequencies derived through the frequency part of a Vedic mantra lineage&#39;s method. Your own response still matters.\u003c/p>\n\u003ch2>You have something to bring\u003c/h2>\n\u003cp>Finding your people can include recognizing where your contribution is welcome. The thing that comes naturally to you may be exactly what a group needs.\u003c/p>\n\u003cp>You don&#39;t have to become someone with a different nature to have a place. Nor does every group have to be your group.\u003c/p>\n\u003cp>Let your music accompany the life where you find that out. Keep all four frequencies in your week, and give the people in it room to surprise you.\u003c/p>\n\u003cp>\u003ca href=\"#your-bands\">Explore your bands\u003c/a>\u003c/p>\n\u003ch2>Hear your own music\u003c/h2>\n\u003cp>New to Zodiac? \u003ca href=\"#birth-details\">Find your frequencies\u003c/a> and hear three short songs in each one without a card.\u003c/p>\n\u003cp>Already have your frequencies? \u003ca href=\"#free-listen\">Open your music\u003c/a> with the same account email.\u003c/p>\n","text":"The people you can be yourself with\n\nThere are people with whom you don't have to explain your pace. You can think out loud, take your time or follow an idea further than you meant to. Something in the connection has room for it.\n\nThat doesn't mean you agree on everything. It means your nature has somewhere to go.\n\n Different ways can belong together\n\nOne person sees the whole project. Another knows the next step. Someone finds the words, and someone else notices what needs to settle before a decision will hold.\n\nThe same is true in a family or a friendship. Not everyone has to bring the same thing for the relationship to work.\n\nYour Zodiac bands give language to some of these differences. Stillness, motion, expression and perspective are all ways of finding clarity. None is a higher level than the others.\n\nKnowing your own preference can help you make room for someone else's. They may need a walk where you need a conversation. You can respect both.\n\n Let the relationship tell you something\n\nLove is the signal for who to let close and how to connect.\n\nIt can be useful to notice what happens around a person. Can you say what you mean? Is there room for a no? Do you feel able to be warm without making yourself smaller?\n\nThose questions belong to your judgment. A frequency number cannot tell you whether to trust someone, and matching numbers are not a compatibility verdict.\n\nZodiac's purpose is to amplify your access to your connected self as you meet the relationship. The music uses four fixed birth frequencies derived through the frequency part of a Vedic mantra lineage's method. Your own response still matters.\n\n You have something to bring\n\nFinding your people can include recognizing where your contribution is welcome. The thing that comes naturally to you may be exactly what a group needs.\n\nYou don't have to become someone with a different nature to have a place. Nor does every group have to be your group.\n\nLet your music accompany the life where you find that out. Keep all four frequencies in your week, and give the people in it room to surprise you.\n\nExplore your bands\n\n Hear your own music\n\nNew to Zodiac? Find your frequencies and hear three short songs in each one without a card.\n\nAlready have your frequencies? Open your music with the same account email.","copyText":"# The people you can be yourself with\n\nThere are people with whom you don't have to explain your pace. You can think out loud, take your time or follow an idea further than you meant to. Something in the connection has room for it.\n\nThat doesn't mean you agree on everything. It means your nature has somewhere to go.\n\n## Different ways can belong together\n\nOne person sees the whole project. Another knows the next step. Someone finds the words, and someone else notices what needs to settle before a decision will hold.\n\nThe same is true in a family or a friendship. Not everyone has to bring the same thing for the relationship to work.\n\nYour Zodiac bands give language to some of these differences. Stillness, motion, expression and perspective are all ways of finding clarity. None is a higher level than the others.\n\nKnowing your own preference can help you make room for someone else's. They may need a walk where you need a conversation. You can respect both.\n\n## Let the relationship tell you something\n\nLove is the signal for who to let close and how to connect.\n\nIt can be useful to notice what happens around a person. Can you say what you mean? Is there room for a no? Do you feel able to be warm without making yourself smaller?\n\nThose questions belong to your judgment. A frequency number cannot tell you whether to trust someone, and matching numbers are not a compatibility verdict.\n\nZodiac's purpose is to amplify your access to your connected self as you meet the relationship. The music uses four fixed birth frequencies derived through the frequency part of a Vedic mantra lineage's method. Your own response still matters.\n\n## You have something to bring\n\nFinding your people can include recognizing where your contribution is welcome. The thing that comes naturally to you may be exactly what a group needs.\n\nYou don't have to become someone with a different nature to have a place. Nor does every group have to be your group.\n\nLet your music accompany the life where you find that out. Keep all four frequencies in your week, and give the people in it room to surprise you.\n\n[Explore your bands](your-bands.md)\n\n\n## Hear your own music\n\nNew to Zodiac? [Find your frequencies](../pages/birth-details.md) and hear three short songs in each one without a card.\n\nAlready have your frequencies? [Open your music](../pages/free-listen.md) with the same account email."},{"category":"Articles","slug":"what-we-believe","title":"There is room for more of you","label":"Articles","hasSourceH1":true,"html":"\u003ch1>There is room for more of you\u003c/h1>\n\u003cp>We think people have something of their own to bring into the world.\u003c/p>\n\u003cp>A way of seeing. A kind of work. A way of loving that becomes possible when they can be more fully themselves.\u003c/p>\n\u003cp>You may have already built a life you love. There can still be more of you available to live it.\u003c/p>\n\u003ch2>The connection is already yours\u003c/h2>\n\u003cp>Your connected self is who you were before anyone taught you who to be, and the part of you connected to everything and everyone else.\u003c/p>\n\u003cp>That self doesn&#39;t need us to make it whole. Zodiac is about access: amplifying the signal that connects you with it, so your nature can be more available in your life.\u003c/p>\n\u003cp>The music turns you up. The walking is yours.\u003c/p>\n\u003ch2>We tell you where the idea comes from\u003c/h2>\n\u003cp>Nāda Brahma is the Vedic teaching that the world is sound. From that perspective, your birth pattern can have a sound too.\u003c/p>\n\u003cp>A mantra lineage developed a way to find it. Zodiac uses the frequency part of that protected method to derive four fixed frequencies from your birth information, then places them inside music.\u003c/p>\n\u003cp>We hold that explanation as a possibility worth exploring. It is not scientific proof. Our internal study gives us a separate record of what listeners reported, with its own limits.\u003c/p>\n\u003ch2>Keep what you value\u003c/h2>\n\u003cp>A good teacher, a reading that gives you language, a practice you return to. They can all have a place.\u003c/p>\n\u003cp>Zodiac can play beside those things. It can also play while you cook dinner or work on something that matters to you.\u003c/p>\n\u003cp>You don&#39;t need to become a different kind of person to listen. There is no higher band you should try to reach, and no particular sensation you have to produce.\u003c/p>\n\u003ch2>Your life remains yours\u003c/h2>\n\u003cp>Listening doesn&#39;t make your decisions or guarantee what the world will do. You still choose, act, learn and meet other people who have choices of their own.\u003c/p>\n\u003cp>What interests us is how much becomes possible when more of you is present for it.\u003c/p>\n\u003cp>\u003ca href=\"#connected-self\">Read about the connected self\u003c/a>\u003c/p>\n\u003cp>\u003ca href=\"#the-year-long-study\">See what listeners reported in our study\u003c/a>\u003c/p>\n\u003ch2>Hear your own music\u003c/h2>\n\u003cp>New to Zodiac? \u003ca href=\"#birth-details\">Find your frequencies\u003c/a> and hear three short songs in each one without a card.\u003c/p>\n\u003cp>Already have your frequencies? \u003ca href=\"#free-listen\">Open your music\u003c/a> with the same account email.\u003c/p>\n","text":"There is room for more of you\n\nWe think people have something of their own to bring into the world.\n\nA way of seeing. A kind of work. A way of loving that becomes possible when they can be more fully themselves.\n\nYou may have already built a life you love. There can still be more of you available to live it.\n\n The connection is already yours\n\nYour connected self is who you were before anyone taught you who to be, and the part of you connected to everything and everyone else.\n\nThat self doesn't need us to make it whole. Zodiac is about access: amplifying the signal that connects you with it, so your nature can be more available in your life.\n\nThe music turns you up. The walking is yours.\n\n We tell you where the idea comes from\n\nNāda Brahma is the Vedic teaching that the world is sound. From that perspective, your birth pattern can have a sound too.\n\nA mantra lineage developed a way to find it. Zodiac uses the frequency part of that protected method to derive four fixed frequencies from your birth information, then places them inside music.\n\nWe hold that explanation as a possibility worth exploring. It is not scientific proof. Our internal study gives us a separate record of what listeners reported, with its own limits.\n\n Keep what you value\n\nA good teacher, a reading that gives you language, a practice you return to. They can all have a place.\n\nZodiac can play beside those things. It can also play while you cook dinner or work on something that matters to you.\n\nYou don't need to become a different kind of person to listen. There is no higher band you should try to reach, and no particular sensation you have to produce.\n\n Your life remains yours\n\nListening doesn't make your decisions or guarantee what the world will do. You still choose, act, learn and meet other people who have choices of their own.\n\nWhat interests us is how much becomes possible when more of you is present for it.\n\nRead about the connected self\n\nSee what listeners reported in our study\n\n Hear your own music\n\nNew to Zodiac? Find your frequencies and hear three short songs in each one without a card.\n\nAlready have your frequencies? Open your music with the same account email.","copyText":"# There is room for more of you\n\nWe think people have something of their own to bring into the world.\n\nA way of seeing. A kind of work. A way of loving that becomes possible when they can be more fully themselves.\n\nYou may have already built a life you love. There can still be more of you available to live it.\n\n## The connection is already yours\n\nYour connected self is who you were before anyone taught you who to be, and the part of you connected to everything and everyone else.\n\nThat self doesn't need us to make it whole. Zodiac is about access: amplifying the signal that connects you with it, so your nature can be more available in your life.\n\nThe music turns you up. The walking is yours.\n\n## We tell you where the idea comes from\n\nNāda Brahma is the Vedic teaching that the world is sound. From that perspective, your birth pattern can have a sound too.\n\nA mantra lineage developed a way to find it. Zodiac uses the frequency part of that protected method to derive four fixed frequencies from your birth information, then places them inside music.\n\nWe hold that explanation as a possibility worth exploring. It is not scientific proof. Our internal study gives us a separate record of what listeners reported, with its own limits.\n\n## Keep what you value\n\nA good teacher, a reading that gives you language, a practice you return to. They can all have a place.\n\nZodiac can play beside those things. It can also play while you cook dinner or work on something that matters to you.\n\nYou don't need to become a different kind of person to listen. There is no higher band you should try to reach, and no particular sensation you have to produce.\n\n## Your life remains yours\n\nListening doesn't make your decisions or guarantee what the world will do. You still choose, act, learn and meet other people who have choices of their own.\n\nWhat interests us is how much becomes possible when more of you is present for it.\n\n[Read about the connected self](connected-self.md)\n\n[See what listeners reported in our study](the-year-long-study.md)\n\n\n## Hear your own music\n\nNew to Zodiac? [Find your frequencies](../pages/birth-details.md) and hear three short songs in each one without a card.\n\nAlready have your frequencies? [Open your music](../pages/free-listen.md) with the same account email."},{"category":"FAQ","slug":"website-faq","title":"Website FAQ","label":"FAQ · Website","hasSourceH1":true,"html":"\u003ch1>Zodiac.fm FAQ\u003c/h1>\n\u003ch2>1. What is Zodiac.fm?\u003c/h2>\n\u003cp>Zodiac uses music tuned to four personal frequencies calculated from your birth information. Over time, listening to your personalized frequencies amplifies your access to the connected self, making it more available in your everyday life.\u003c/p>\n\u003ch2>2. What do you mean by my connected self?\u003c/h2>\n\u003cp>It&#39;s the part of you connected to everything and everyone else, who you were before anyone taught you who to be. You might call it your essence, soul, or higher self. Use the word that means something to you.\u003c/p>\n\u003cp>That part of you is already whole. Zodiac is about amplifying your access to it, so more of who you are can come through in your relationships, your decisions, and what you contribute.\u003c/p>\n\u003ch2>3. How do I listen to Zodiac.fm?\u003c/h2>\n\u003cp>Just play your personalized music through headphones or a quality Bluetooth speaker. You don&#39;t have to concentrate on a tone or try to make anything happen. Listening amplifies your access to your connected self over time.\u003c/p>\n\u003cp>The change you notice may be a decision that becomes obvious, a boundary you recognize, or a growing sense of what is yours to do.\u003c/p>\n\u003ch2>4. Do I need to believe in astrology or Human Design?\u003c/h2>\n\u003cp>No. You don&#39;t need to know your chart or adopt a belief system to listen. You can try Zodiac and pay attention to your own experience.\u003c/p>\n\u003ch2>5. Do I need to meditate while listening?\u003c/h2>\n\u003cp>No, you can simply listen. If you enjoy meditation, you&#39;re welcome to use Zodiac with it. There&#39;s no special technique to learn.\u003c/p>\n\u003ch2>6. What are my four frequencies?\u003c/h2>\n\u003cp>Your four frequencies are Core, Love, Vitality, and Abundance:\u003c/p>\n\u003cul>\n\u003cli>Core: The signal for who you are and what is yours to do.\u003c/li>\n\u003cli>Love: The signal for who to let close and how to connect.\u003c/li>\n\u003cli>Vitality: The signal for what feeds you and what drains you.\u003c/li>\n\u003cli>Abundance: The signal for when to move and which opportunities are yours.\u003c/li>\n\u003c/ul>\n\u003ch2>7. How are my frequencies calculated?\u003c/h2>\n\u003cp>We use your birth date, time, and place to identify the planetary configuration when you were born, then a protected method turns that pattern into four frequencies in the audible range of 250 to 950 hertz.\u003c/p>\n\u003ch2>8. What if I don&#39;t know my birth time?\u003c/h2>\n\u003cp>Use your best estimate. If you know it was morning or evening, choose a time within that period. Use noon only if you have no idea.\u003c/p>\n\u003cp>Give that starting point a steady week of listening before trying another time. If you&#39;re unsure how to approach it, write to us and we&#39;ll help you work with the information you have.\u003c/p>\n\u003ch2>9. Do my frequencies change over time?\u003c/h2>\n\u003cp>Your four frequencies stay fixed. What grows with listening is your access to them, rather than the numbers changing as you grow.\u003c/p>\n\u003cp>Correcting your birth information can change the calculation, although not every correction produces different values.\u003c/p>\n\u003ch2>10. What do my bands mean?\u003c/h2>\n\u003cp>Your band tells you how you most naturally process information in that area of your life.\u003c/p>\n\u003cul>\n\u003cli>Root works through grounding and steadiness.\u003c/li>\n\u003cli>Solar Plexus works through drive and motion.\u003c/li>\n\u003cli>Throat works through articulation and expression.\u003c/li>\n\u003cli>Crown works through systems, perspective, and the bigger picture.\u003c/li>\n\u003c/ul>\n\u003cp>Everyone can use all four approaches. Your band describes the route that comes most naturally.\u003c/p>\n\u003ch2>11. Why does Zodiac use sound?\u003c/h2>\n\u003cp>Nāda Brahma is a Vedic teaching that says the one reality beneath everything is sound. Within it, your birth pattern can have a sound too. Zodiac holds this as a possibility rather than scientific proof, then makes the four calculated frequencies practical by placing them in music.\u003c/p>\n\u003ch2>12. How is my frequency put into the music?\u003c/h2>\n\u003cp>Each piece is retuned until your personal frequency becomes one of its harmonies, so you can enjoy the music without trying to pick out a separate tone.\u003c/p>\n\u003ch2>13. Where can I listen to Zodiac?\u003c/h2>\n\u003cp>You can \u003ca href=\"https://apps.apple.com/us/app/zodiacfm/id6764863619\" target=\"_blank\" rel=\"noopener noreferrer\">download Zodiac for iPhone\u003c/a>, \u003ca href=\"https://play.google.com/store/apps/details?id=fm.zodiac.app\" target=\"_blank\" rel=\"noopener noreferrer\">download Zodiac for Android\u003c/a>, or \u003ca href=\"https://app.zodiac.fm/\" target=\"_blank\" rel=\"noopener noreferrer\">listen in a desktop or laptop browser\u003c/a>. Sign in with the same email address wherever you listen.\u003c/p>\n\u003ch2>14. Can I listen through my phone or computer speakers?\u003c/h2>\n\u003cp>Please use headphones, a quality Bluetooth speaker, or your car&#39;s sound system instead of built-in phone or computer speakers, and choose a volume that&#39;s clear and comfortable without overpowering the noise around you.\u003c/p>\n\u003ch2>15. How much should I listen?\u003c/h2>\n\u003cp>Aim for about nine minutes a day on average across the week. That&#39;s roughly 63 minutes, with all four frequencies included. Find a time that fits your life so listening becomes easy to keep coming back to.\u003c/p>\n\u003ch2>16. How do I balance my four frequencies?\u003c/h2>\n\u003cp>Give each frequency at least 15 percent of your total listening across the week. The remaining 40 percent can go wherever you&#39;d like more emphasis.\u003c/p>\n\u003cp>You don&#39;t need exactly equal time. Rotate through the four, then check your weekly percentages to see whether one needs a little more attention.\u003c/p>\n\u003ch2>17. Can I do other things while listening?\u003c/h2>\n\u003cp>Yes. You can listen while working, walking, cooking, or relaxing. Choose music that suits what you&#39;re doing and keep it at a comfortable volume.\u003c/p>\n\u003cp>If you&#39;re driving or doing something that needs your full attention, avoid sleep music or anything you find distracting.\u003c/p>\n\u003ch2>18. Can I listen while sleeping?\u003c/h2>\n\u003cp>Yes, the library includes music intended for sleep. Choose a comfortable volume and include all four frequencies across your week, rather than playing only one every night.\u003c/p>\n\u003ch2>19. What might I notice?\u003c/h2>\n\u003cp>You may find yourself recognizing what feels right for you more easily. A decision becomes clearer, you notice what&#39;s draining your energy, or you stop talking yourself out of a boundary you already know you need.\u003c/p>\n\u003cp>It isn&#39;t necessarily a sensation while the music plays. Sometimes it&#39;s a gradual, instinctive knowing, and you recognize the difference in how you&#39;re living.\u003c/p>\n\u003ch2>20. What if I don&#39;t feel anything?\u003c/h2>\n\u003cp>That happens. Michael didn&#39;t notice a difference himself until about a month, while some people notice something much sooner.\u003c/p>\n\u003cp>Give all four frequencies a place in your week and look at what happens outside the listening itself, such as decisions becoming clearer or recognizing what gives you energy a little sooner.\u003c/p>\n\u003ch2>21. What were the results of your study?\u003c/h2>\n\u003cp>In Zodiac&#39;s 52-week internal study, 300 people started and 278 completed it. Among people who listened as designed, \u003cstrong>84 percent called Zodiac life-changing\u003c/strong> after averaging at least nine minutes a day across the week, with every frequency receiving at least 15 percent of their listening.\u003c/p>\n\u003cp>Across all completers, \u003cstrong>98.6 percent said they would recommend Zodiac and 70.5 percent called it life-changing\u003c/strong>, figures that record participants&#39; reports from Zodiac&#39;s own study rather than results from an independent clinical trial.\u003c/p>\n\u003ch2>22. How long does it take to notice a change?\u003c/h2>\n\u003cp>It varies. In the internal study, among people who listened as designed, 61 percent reported a clear shift by month one, 81 percent by month three, and 87 percent by month six.\u003c/p>\n\u003cp>Those are cumulative reports, not a deadline or promise for an individual listener.\u003c/p>\n\u003ch2>23. Is Zodiac scientifically proven?\u003c/h2>\n\u003cp>No independent clinical trial has proven Zodiac or its complete mechanism. What we have is a year-long internal study and a growing body of customer experiences that help us understand what people notice. Our explanation for why it happens is still a working model.\u003c/p>\n\u003ch2>24. How is Zodiac different from astrology, Human Design, or a sound app?\u003c/h2>\n\u003cp>Astrology and Human Design give you a map and language for understanding your nature. Zodiac gives you another way in: listening to the frequencies of your own birth pattern so that what a good reading helps you recognize can become easier to know from within.\u003c/p>\n\u003cp>Unlike a general sound app, the music is tuned to your four personal frequencies.\u003c/p>\n\u003ch2>25. Can I use Zodiac for free?\u003c/h2>\n\u003cp>Yes. You keep three short songs in each of your four frequencies for free, without a paid membership. You can get started at your own pace.\u003c/p>\n\u003ch2>26. What does Zodiac cost?\u003c/h2>\n\u003cp>Annual membership is $9.08 a month, billed as $109 yearly. The monthly option is $17, and both plans include access to the longer music.\u003c/p>\n\u003ch2>27. Can I try the paid membership first?\u003c/h2>\n\u003cp>Yes. You can try either plan for seven days for $3. Choose monthly or annual when you join, and that plan begins on day eight unless you cancel during the trial.\u003c/p>\n\u003ch2>28. Can I get a refund on my website purchase?\u003c/h2>\n\u003cp>Purchases that begin with a trial aren&#39;t refundable. That includes the $3 trial charge. Please cancel during the seven days if you don&#39;t want your selected plan to begin.\u003c/p>\n\u003cp>If you joined before trials were introduced, your original refund window applies: 90 days from purchase for annual membership or 30 days for monthly membership. If you&#39;re unsure which applies to you, write to us and we&#39;ll check your purchase.\u003c/p>\n\u003ch2>29. How do you use my personal information?\u003c/h2>\n\u003cp>We use your birth date, time, and place to calculate your frequencies. We use account and listening information to provide Zodiac. The current \u003ca href=\"https://zodiac.fm/privacy\" target=\"_blank\" rel=\"noopener noreferrer\">Privacy Policy\u003c/a> explains the service providers involved, any advertising or analytics use, retention, and the choices available to you.\u003c/p>\n\u003ch2>30. Where did the protected method come from?\u003c/h2>\n\u003cp>Zodiac begins with Nāda Brahma, the Vedic view that reality is sound. Within that worldview, a birth pattern having a sound follows naturally. A mantra lineage had developed a protected method for finding it. Zodiac uses the frequency part of that method, while the sacred mantras remain private.\u003c/p>\n\u003cp>Zodiac does not ask you to treat that privacy as proof, and it does not present its modern app, band model, or music system as ancient technology.\u003c/p>\n\u003ch2>31. How do I contact Zodiac for help?\u003c/h2>\n\u003cp>\u003ca href=\"mailto:support@zodiac.fm\">Email support@zodiac.fm\u003c/a> from your account email when you can, describe the question or problem, and leave your password, full card number, and complete birth information out of an unsecured first message.\u003c/p>\n\u003ch2>Hear your own music\u003c/h2>\n\u003cp>New to Zodiac? \u003ca href=\"#birth-details\">Find your frequencies\u003c/a> and hear three short songs in each one without a card.\u003c/p>\n\u003cp>Already have your frequencies? \u003ca href=\"#free-listen\">Open your music\u003c/a> with the same account email.\u003c/p>\n","text":"Zodiac.fm FAQ\n\n 1. What is Zodiac.fm?\n\nZodiac uses music tuned to four personal frequencies calculated from your birth information. Over time, listening to your personalized frequencies amplifies your access to the connected self, making it more available in your everyday life.\n\n 2. What do you mean by my connected self?\n\nIt's the part of you connected to everything and everyone else, who you were before anyone taught you who to be. You might call it your essence, soul, or higher self. Use the word that means something to you.\n\nThat part of you is already whole. Zodiac is about amplifying your access to it, so more of who you are can come through in your relationships, your decisions, and what you contribute.\n\n 3. How do I listen to Zodiac.fm?\n\nJust play your personalized music through headphones or a quality Bluetooth speaker. You don't have to concentrate on a tone or try to make anything happen. Listening amplifies your access to your connected self over time.\n\nThe change you notice may be a decision that becomes obvious, a boundary you recognize, or a growing sense of what is yours to do.\n\n 4. Do I need to believe in astrology or Human Design?\n\nNo. You don't need to know your chart or adopt a belief system to listen. You can try Zodiac and pay attention to your own experience.\n\n 5. Do I need to meditate while listening?\n\nNo, you can simply listen. If you enjoy meditation, you're welcome to use Zodiac with it. There's no special technique to learn.\n\n 6. What are my four frequencies?\n\nYour four frequencies are Core, Love, Vitality, and Abundance:\n\n- Core: The signal for who you are and what is yours to do.\n- Love: The signal for who to let close and how to connect.\n- Vitality: The signal for what feeds you and what drains you.\n- Abundance: The signal for when to move and which opportunities are yours.\n\n 7. How are my frequencies calculated?\n\nWe use your birth date, time, and place to identify the planetary configuration when you were born, then a protected method turns that pattern into four frequencies in the audible range of 250 to 950 hertz.\n\n 8. What if I don't know my birth time?\n\nUse your best estimate. If you know it was morning or evening, choose a time within that period. Use noon only if you have no idea.\n\nGive that starting point a steady week of listening before trying another time. If you're unsure how to approach it, write to us and we'll help you work with the information you have.\n\n 9. Do my frequencies change over time?\n\nYour four frequencies stay fixed. What grows with listening is your access to them, rather than the numbers changing as you grow.\n\nCorrecting your birth information can change the calculation, although not every correction produces different values.\n\n 10. What do my bands mean?\n\nYour band tells you how you most naturally process information in that area of your life.\n\n- Root works through grounding and steadiness.\n- Solar Plexus works through drive and motion.\n- Throat works through articulation and expression.\n- Crown works through systems, perspective, and the bigger picture.\n\nEveryone can use all four approaches. Your band describes the route that comes most naturally.\n\n 11. Why does Zodiac use sound?\n\nNāda Brahma is a Vedic teaching that says the one reality beneath everything is sound. Within it, your birth pattern can have a sound too. Zodiac holds this as a possibility rather than scientific proof, then makes the four calculated frequencies practical by placing them in music.\n\n 12. How is my frequency put into the music?\n\nEach piece is retuned until your personal frequency becomes one of its harmonies, so you can enjoy the music without trying to pick out a separate tone.\n\n 13. Where can I listen to Zodiac?\n\nYou can download Zodiac for iPhone, download Zodiac for Android, or listen in a desktop or laptop browser. Sign in with the same email address wherever you listen.\n\n 14. Can I listen through my phone or computer speakers?\n\nPlease use headphones, a quality Bluetooth speaker, or your car's sound system instead of built-in phone or computer speakers, and choose a volume that's clear and comfortable without overpowering the noise around you.\n\n 15. How much should I listen?\n\nAim for about nine minutes a day on average across the week. That's roughly 63 minutes, with all four frequencies included. Find a time that fits your life so listening becomes easy to keep coming back to.\n\n 16. How do I balance my four frequencies?\n\nGive each frequency at least 15 percent of your total listening across the week. The remaining 40 percent can go wherever you'd like more emphasis.\n\nYou don't need exactly equal time. Rotate through the four, then check your weekly percentages to see whether one needs a little more attention.\n\n 17. Can I do other things while listening?\n\nYes. You can listen while working, walking, cooking, or relaxing. Choose music that suits what you're doing and keep it at a comfortable volume.\n\nIf you're driving or doing something that needs your full attention, avoid sleep music or anything you find distracting.\n\n 18. Can I listen while sleeping?\n\nYes, the library includes music intended for sleep. Choose a comfortable volume and include all four frequencies across your week, rather than playing only one every night.\n\n 19. What might I notice?\n\nYou may find yourself recognizing what feels right for you more easily. A decision becomes clearer, you notice what's draining your energy, or you stop talking yourself out of a boundary you already know you need.\n\nIt isn't necessarily a sensation while the music plays. Sometimes it's a gradual, instinctive knowing, and you recognize the difference in how you're living.\n\n 20. What if I don't feel anything?\n\nThat happens. Michael didn't notice a difference himself until about a month, while some people notice something much sooner.\n\nGive all four frequencies a place in your week and look at what happens outside the listening itself, such as decisions becoming clearer or recognizing what gives you energy a little sooner.\n\n 21. What were the results of your study?\n\nIn Zodiac's 52-week internal study, 300 people started and 278 completed it. Among people who listened as designed, 84 percent called Zodiac life-changing after averaging at least nine minutes a day across the week, with every frequency receiving at least 15 percent of their listening.\n\nAcross all completers, 98.6 percent said they would recommend Zodiac and 70.5 percent called it life-changing, figures that record participants' reports from Zodiac's own study rather than results from an independent clinical trial.\n\n 22. How long does it take to notice a change?\n\nIt varies. In the internal study, among people who listened as designed, 61 percent reported a clear shift by month one, 81 percent by month three, and 87 percent by month six.\n\nThose are cumulative reports, not a deadline or promise for an individual listener.\n\n 23. Is Zodiac scientifically proven?\n\nNo independent clinical trial has proven Zodiac or its complete mechanism. What we have is a year-long internal study and a growing body of customer experiences that help us understand what people notice. Our explanation for why it happens is still a working model.\n\n 24. How is Zodiac different from astrology, Human Design, or a sound app?\n\nAstrology and Human Design give you a map and language for understanding your nature. Zodiac gives you another way in: listening to the frequencies of your own birth pattern so that what a good reading helps you recognize can become easier to know from within.\n\nUnlike a general sound app, the music is tuned to your four personal frequencies.\n\n 25. Can I use Zodiac for free?\n\nYes. You keep three short songs in each of your four frequencies for free, without a paid membership. You can get started at your own pace.\n\n 26. What does Zodiac cost?\n\nAnnual membership is $9.08 a month, billed as $109 yearly. The monthly option is $17, and both plans include access to the longer music.\n\n 27. Can I try the paid membership first?\n\nYes. You can try either plan for seven days for $3. Choose monthly or annual when you join, and that plan begins on day eight unless you cancel during the trial.\n\n 28. Can I get a refund on my website purchase?\n\nPurchases that begin with a trial aren't refundable. That includes the $3 trial charge. Please cancel during the seven days if you don't want your selected plan to begin.\n\nIf you joined before trials were introduced, your original refund window applies: 90 days from purchase for annual membership or 30 days for monthly membership. If you're unsure which applies to you, write to us and we'll check your purchase.\n\n 29. How do you use my personal information?\n\nWe use your birth date, time, and place to calculate your frequencies. We use account and listening information to provide Zodiac. The current Privacy Policy explains the service providers involved, any advertising or analytics use, retention, and the choices available to you.\n\n 30. Where did the protected method come from?\n\nZodiac begins with Nāda Brahma, the Vedic view that reality is sound. Within that worldview, a birth pattern having a sound follows naturally. A mantra lineage had developed a protected method for finding it. Zodiac uses the frequency part of that method, while the sacred mantras remain private.\n\nZodiac does not ask you to treat that privacy as proof, and it does not present its modern app, band model, or music system as ancient technology.\n\n 31. How do I contact Zodiac for help?\n\nEmail support@zodiac.fm from your account email when you can, describe the question or problem, and leave your password, full card number, and complete birth information out of an unsecured first message.\n\n Hear your own music\n\nNew to Zodiac? Find your frequencies and hear three short songs in each one without a card.\n\nAlready have your frequencies? Open your music with the same account email.","copyText":"# Zodiac.fm FAQ\n\n## 1. What is Zodiac.fm?\n\nZodiac uses music tuned to four personal frequencies calculated from your birth information. Over time, listening to your personalized frequencies amplifies your access to the connected self, making it more available in your everyday life.\n\n## 2. What do you mean by my connected self?\n\nIt's the part of you connected to everything and everyone else, who you were before anyone taught you who to be. You might call it your essence, soul, or higher self. Use the word that means something to you.\n\nThat part of you is already whole. Zodiac is about amplifying your access to it, so more of who you are can come through in your relationships, your decisions, and what you contribute.\n\n## 3. How do I listen to Zodiac.fm?\n\nJust play your personalized music through headphones or a quality Bluetooth speaker. You don't have to concentrate on a tone or try to make anything happen. Listening amplifies your access to your connected self over time.\n\nThe change you notice may be a decision that becomes obvious, a boundary you recognize, or a growing sense of what is yours to do.\n\n## 4. Do I need to believe in astrology or Human Design?\n\nNo. You don't need to know your chart or adopt a belief system to listen. You can try Zodiac and pay attention to your own experience.\n\n## 5. Do I need to meditate while listening?\n\nNo, you can simply listen. If you enjoy meditation, you're welcome to use Zodiac with it. There's no special technique to learn.\n\n## 6. What are my four frequencies?\n\nYour four frequencies are Core, Love, Vitality, and Abundance:\n\n- Core: The signal for who you are and what is yours to do.\n- Love: The signal for who to let close and how to connect.\n- Vitality: The signal for what feeds you and what drains you.\n- Abundance: The signal for when to move and which opportunities are yours.\n\n## 7. How are my frequencies calculated?\n\nWe use your birth date, time, and place to identify the planetary configuration when you were born, then a protected method turns that pattern into four frequencies in the audible range of 250 to 950 hertz.\n\n## 8. What if I don't know my birth time?\n\nUse your best estimate. If you know it was morning or evening, choose a time within that period. Use noon only if you have no idea.\n\nGive that starting point a steady week of listening before trying another time. If you're unsure how to approach it, write to us and we'll help you work with the information you have.\n\n## 9. Do my frequencies change over time?\n\nYour four frequencies stay fixed. What grows with listening is your access to them, rather than the numbers changing as you grow.\n\nCorrecting your birth information can change the calculation, although not every correction produces different values.\n\n## 10. What do my bands mean?\n\nYour band tells you how you most naturally process information in that area of your life.\n\n- Root works through grounding and steadiness.\n- Solar Plexus works through drive and motion.\n- Throat works through articulation and expression.\n- Crown works through systems, perspective, and the bigger picture.\n\nEveryone can use all four approaches. Your band describes the route that comes most naturally.\n\n## 11. Why does Zodiac use sound?\n\nNāda Brahma is a Vedic teaching that says the one reality beneath everything is sound. Within it, your birth pattern can have a sound too. Zodiac holds this as a possibility rather than scientific proof, then makes the four calculated frequencies practical by placing them in music.\n\n## 12. How is my frequency put into the music?\n\nEach piece is retuned until your personal frequency becomes one of its harmonies, so you can enjoy the music without trying to pick out a separate tone.\n\n## 13. Where can I listen to Zodiac?\n\nYou can [download Zodiac for iPhone](https://apps.apple.com/us/app/zodiacfm/id6764863619), [download Zodiac for Android](https://play.google.com/store/apps/details?id=fm.zodiac.app), or [listen in a desktop or laptop browser](https://app.zodiac.fm/). Sign in with the same email address wherever you listen.\n\n## 14. Can I listen through my phone or computer speakers?\n\nPlease use headphones, a quality Bluetooth speaker, or your car's sound system instead of built-in phone or computer speakers, and choose a volume that's clear and comfortable without overpowering the noise around you.\n\n## 15. How much should I listen?\n\nAim for about nine minutes a day on average across the week. That's roughly 63 minutes, with all four frequencies included. Find a time that fits your life so listening becomes easy to keep coming back to.\n\n## 16. How do I balance my four frequencies?\n\nGive each frequency at least 15 percent of your total listening across the week. The remaining 40 percent can go wherever you'd like more emphasis.\n\nYou don't need exactly equal time. Rotate through the four, then check your weekly percentages to see whether one needs a little more attention.\n\n## 17. Can I do other things while listening?\n\nYes. You can listen while working, walking, cooking, or relaxing. Choose music that suits what you're doing and keep it at a comfortable volume.\n\nIf you're driving or doing something that needs your full attention, avoid sleep music or anything you find distracting.\n\n## 18. Can I listen while sleeping?\n\nYes, the library includes music intended for sleep. Choose a comfortable volume and include all four frequencies across your week, rather than playing only one every night.\n\n## 19. What might I notice?\n\nYou may find yourself recognizing what feels right for you more easily. A decision becomes clearer, you notice what's draining your energy, or you stop talking yourself out of a boundary you already know you need.\n\nIt isn't necessarily a sensation while the music plays. Sometimes it's a gradual, instinctive knowing, and you recognize the difference in how you're living.\n\n## 20. What if I don't feel anything?\n\nThat happens. Michael didn't notice a difference himself until about a month, while some people notice something much sooner.\n\nGive all four frequencies a place in your week and look at what happens outside the listening itself, such as decisions becoming clearer or recognizing what gives you energy a little sooner.\n\n## 21. What were the results of your study?\n\nIn Zodiac's 52-week internal study, 300 people started and 278 completed it. Among people who listened as designed, **84 percent called Zodiac life-changing** after averaging at least nine minutes a day across the week, with every frequency receiving at least 15 percent of their listening.\n\nAcross all completers, **98.6 percent said they would recommend Zodiac and 70.5 percent called it life-changing**, figures that record participants' reports from Zodiac's own study rather than results from an independent clinical trial.\n\n## 22. How long does it take to notice a change?\n\nIt varies. In the internal study, among people who listened as designed, 61 percent reported a clear shift by month one, 81 percent by month three, and 87 percent by month six.\n\nThose are cumulative reports, not a deadline or promise for an individual listener.\n\n## 23. Is Zodiac scientifically proven?\n\nNo independent clinical trial has proven Zodiac or its complete mechanism. What we have is a year-long internal study and a growing body of customer experiences that help us understand what people notice. Our explanation for why it happens is still a working model.\n\n## 24. How is Zodiac different from astrology, Human Design, or a sound app?\n\nAstrology and Human Design give you a map and language for understanding your nature. Zodiac gives you another way in: listening to the frequencies of your own birth pattern so that what a good reading helps you recognize can become easier to know from within.\n\nUnlike a general sound app, the music is tuned to your four personal frequencies.\n\n## 25. Can I use Zodiac for free?\n\nYes. You keep three short songs in each of your four frequencies for free, without a paid membership. You can get started at your own pace.\n\n## 26. What does Zodiac cost?\n\nAnnual membership is $9.08 a month, billed as $109 yearly. The monthly option is $17, and both plans include access to the longer music.\n\n## 27. Can I try the paid membership first?\n\nYes. You can try either plan for seven days for $3. Choose monthly or annual when you join, and that plan begins on day eight unless you cancel during the trial.\n\n## 28. Can I get a refund on my website purchase?\n\nPurchases that begin with a trial aren't refundable. That includes the $3 trial charge. Please cancel during the seven days if you don't want your selected plan to begin.\n\nIf you joined before trials were introduced, your original refund window applies: 90 days from purchase for annual membership or 30 days for monthly membership. If you're unsure which applies to you, write to us and we'll check your purchase.\n\n## 29. How do you use my personal information?\n\nWe use your birth date, time, and place to calculate your frequencies. We use account and listening information to provide Zodiac. The current [Privacy Policy](https://zodiac.fm/privacy) explains the service providers involved, any advertising or analytics use, retention, and the choices available to you.\n\n## 30. Where did the protected method come from?\n\nZodiac begins with Nāda Brahma, the Vedic view that reality is sound. Within that worldview, a birth pattern having a sound follows naturally. A mantra lineage had developed a protected method for finding it. Zodiac uses the frequency part of that method, while the sacred mantras remain private.\n\nZodiac does not ask you to treat that privacy as proof, and it does not present its modern app, band model, or music system as ancient technology.\n\n## 31. How do I contact Zodiac for help?\n\n[Email support@zodiac.fm](mailto:support@zodiac.fm) from your account email when you can, describe the question or problem, and leave your password, full card number, and complete birth information out of an unsecured first message.\n\n\n## Hear your own music\n\nNew to Zodiac? [Find your frequencies](../pages/birth-details.md) and hear three short songs in each one without a card.\n\nAlready have your frequencies? [Open your music](../pages/free-listen.md) with the same account email."},{"category":"FAQ","slug":"customer-faq","title":"Complete help bank","label":"FAQ · Complete help bank","hasSourceH1":true,"html":"\u003ch1>Zodiac customer FAQ bank\u003c/h1>\n\u003cp>Final writing pass, October 18, 2026. Each question has one job and a named placement. Website answers serve the general public. Member, account, billing, and app help answers apply only where their stated route and current product evidence match.\u003c/p>\n\u003cp>\u003cstrong>Getting to know Zodiac\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1. What is Zodiac.fm?\u003c/strong>\n\u003cem>Website and app\u003c/em>\u003c/p>\n\u003cp>Zodiac uses music tuned to four personal frequencies calculated from your birth information. Over time, listening to your personalized frequencies amplifies your access to the connected self, making it more available in your everyday life.\u003c/p>\n\u003cp>\u003cstrong>2. What do you mean by my connected self?\u003c/strong>\n\u003cem>Website and app\u003c/em>\u003c/p>\n\u003cp>It&#39;s the part of you connected to everything and everyone else, who you were before anyone taught you who to be. You might call it your essence, soul, or higher self. Use the word that means something to you.\u003c/p>\n\u003cp>That part of you is already whole. Zodiac is about amplifying your access to it, so more of who you are can come through in your relationships, your decisions, and what you contribute.\u003c/p>\n\u003cp>\u003cstrong>3. How do I listen to Zodiac.fm?\u003c/strong>\n\u003cem>Website and getting started\u003c/em>\u003c/p>\n\u003cp>Just play your personalized music through headphones or a quality Bluetooth speaker. You don&#39;t have to concentrate on a tone or try to make anything happen. Listening amplifies your access to your connected self over time.\u003c/p>\n\u003cp>The change you notice may be a decision that becomes obvious, a boundary you recognize, or a growing sense of what is yours to do.\u003c/p>\n\u003cp>\u003cstrong>4. Do I need to believe in astrology or Human Design?\u003c/strong>\n\u003cem>Website\u003c/em>\u003c/p>\n\u003cp>No. You don&#39;t need to know your chart or adopt a belief system to listen. You can try Zodiac and pay attention to your own experience.\u003c/p>\n\u003cp>\u003cstrong>5. Do I need to meditate while listening?\u003c/strong>\n\u003cem>Website and getting started\u003c/em>\u003c/p>\n\u003cp>No, you can simply listen. If you enjoy meditation, you&#39;re welcome to use Zodiac with it. There&#39;s no special technique to learn.\u003c/p>\n\u003chr>\n\u003cp>\u003cstrong>Your frequencies and bands\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>6. What are my four frequencies?\u003c/strong>\n\u003cem>Website and My Zodiac\u003c/em>\u003c/p>\n\u003cp>Your four frequencies are Core, Love, Vitality, and Abundance:\u003c/p>\n\u003cul>\n\u003cli>Core: The signal for who you are and what is yours to do.\u003c/li>\n\u003cli>Love: The signal for who to let close and how to connect.\u003c/li>\n\u003cli>Vitality: The signal for what feeds you and what drains you.\u003c/li>\n\u003cli>Abundance: The signal for when to move and which opportunities are yours.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>7. How are my frequencies calculated?\u003c/strong>\n\u003cem>Website\u003c/em>\u003c/p>\n\u003cp>We use your birth date, time, and place to identify the planetar
