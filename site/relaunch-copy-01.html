s not to perform the right experience. It is to listen and find out what becomes more available.\n\n## Start with the pattern you were born with.\n\nEnter your birth date, time and place. Your results show Core, Love, Vitality and Abundance, plus the band for each frequency. Your three short songs in every frequency are free to keep without a card.\n\nMembership adds the longer library across all four frequencies: nine-minute immersions, extended meditation tracks and an hour-long track. The complete library contains nearly ten hours of music.\n\n## Your first seven days are free through this invitation.\n\nChoose annual or monthly. The free week applies to either plan.\n\n**$7.33/mo · $88 billed yearly.** Save $21 a year.\n\n**$14/mo.** Save $3 a month.\n\nAdd a card when you start. On day 8, the plan you chose is charged. Cancel before day 8 and there is no membership charge. Charges after the trial are non-refundable. Your checkout shows the exact charge date.\n\n[Reveal my frequencies](birth-details.md)\n\nYour three short songs in each frequency stay free either way.\n\n## Questions\n\n### Does Zodiac manifest a particular result?\n\nNo. Zodiac does not promise a specific relationship, job, amount of money or event. It is music built around your fixed birth frequencies, meant to support connection with your own nature as you take the actions that are yours.\n\n### Do the frequencies change when my goals or circumstances change?\n\nNo. They are derived from your birth date, time and place and stay fixed. Your life can change while they remain a personal reference.\n\n### What if I do not know my birth time?\n\nUse your best estimate. If you have no estimate at all, use noon.\n\n### Where do I listen?\n\nListen in the native iPhone or Android app, or in a browser on your desktop or laptop. Sign in with the same email you used for Zodiac."},{"category":"Affiliate","slug":"spiritual-integrators","title":"Successful spiritual integrators landing page","label":"Review variant · Successful spiritual integrators landing page","hasSourceH1":true,"html":"\u003ch1>More of you in the life you already love.\u003c/h1>\n\u003cp>You have built a life with things in it that matter. Work you care about. People you show up for. A home, a practice, a body of experience.\u003c/p>\n\u003cp>You want to arrive more fully inside it.\u003c/p>\n\u003cp>The person who shared this link may earn a commission if you become a paying member.\u003c/p>\n\u003cp>Zodiac puts your four birth frequencies into music, so your connection with yourself can travel into the conversations, leadership, work, intimacy and ordinary pleasure that make up your life.\u003c/p>\n\u003cp>\u003ca href=\"#birth-details\">Reveal my frequencies\u003c/a>\u003c/p>\n\u003cp>See your four birth frequencies and their bands. Your three short songs in each frequency are free, with no card required.\u003c/p>\n\u003ch2>Your practice belongs in the middle of a real life.\u003c/h2>\n\u003cp>Spirituality does not need to happen on a mountaintop or after everything else is handled. It can live beside a calendar, a family dinner, a difficult decision, a project you care about, or ten quiet minutes before the house wakes up.\u003c/p>\n\u003cp>You may already have ways of coming back to yourself: meditation, prayer, journaling, a reading, a long walk, therapy, a teacher, a song that changes the temperature in a room. Keep them. They are part of the life you have chosen.\u003c/p>\n\u003cp>Zodiac adds music made from your birth pattern. It does not give you a new identity to perform. It gives you a personal way to return to the self underneath all the roles you hold.\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;It lets you finally feel the parts of yourself you have only ever read about.&quot;\u003c/p>\n\u003cp>Zehra Ashary, Kundalini Practitioner, London. Zodiac.fm team member.\u003c/p>\n\u003c/blockquote>\n\u003ch2>The Vedic idea is simple: if the world is sound, your birth pattern has a sound too.\u003c/h2>\n\u003cp>Nāda Brahma is the Vedic teaching that the world is sound. Within that worldview, the pattern present when you were born has a sound of its own.\u003c/p>\n\u003cp>A mantra lineage had already developed a way to find it. Zodiac uses the shared frequency part of their method to derive four frequencies from your date, time and place of birth: Core, Love, Vitality and Abundance.\u003c/p>\n\u003cp>Core is the signal for who you are and what is yours to do.\u003c/p>\n\u003cp>Love is the signal for who to let close and how to connect.\u003c/p>\n\u003cp>Vitality is the signal for what feeds you and what drains you.\u003c/p>\n\u003cp>Abundance is the signal for when to move and which opportunities are yours.\u003c/p>\n\u003cp>They are fixed at birth. The day can be demanding, the sky can change, and your life can enter a new season. Your four frequencies remain yours.\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;This music tickled my soul and reminded me that there&#39;s such a connection between vibration, the stars and the sounds that are coordinated by higher intelligence. Give it a try.. you&#39;ll love it.&quot;\u003c/p>\n\u003cp>Debra Silverman, Astrologer to Sting, Jennifer Aniston, Aaron Rodgers\u003c/p>\n\u003c/blockquote>\n\u003ch2>Zodiac turns that pattern into music you can actually live with.\u003c/h2>\n\u003cp>Real musicians make every Zodiac composition. Your exact frequency often lands between standard musical notes, so we do not place a tone over a finished song and call it personal.\u003c/p>\n\u003cp>Instead, each piece is retuned until your frequency becomes one of its own harmonies. Every composition is prepared in 701 versions, one for each whole frequency from 250 to 950 Hz. Your exact tone runs through the track as part of the music.\u003c/p>\n\u003cp>It can be there while you work through a proposal, make dinner, drive home, write in a notebook, rest after a long day, or sit with someone you love. Use headphones, the car, or a decent speaker. There is no technique to master before you press play.\u003c/p>\n\u003ch2>The music amplifies a connection you already have.\u003c/h2>\n\u003cp>Your connected self is who you were before anyone taught you who to be, and the part of you connected to everything and everyone else. Your signal is the connection to it.\u003c/p>\n\u003cp>Zodiac plays your four frequencies back to you to amplify that signal. A tuning fork beside a guitar string offers the picture: when the same note sounds nearby, the string can begin to hum. It is an analogy for our proposed explanation, not a measured account of what happens inside a listener.\u003c/p>\n\u003cp>The point is more access to yourself when it matters. In the conversation where you want to say what is true. In the meeting where a clear boundary serves everyone. In the intimate moment where you want to be fully present.\u003c/p>\n\u003cp>The choices remain yours. Zodiac does not replace discernment, planning, your relationships or practical action. It is music that can accompany them.\u003c/p>\n\u003ch2>Your bands can show you how clarity arrives.\u003c/h2>\n\u003cp>Each of your frequencies falls into one of four bands. Root, 250 to 425 Hz: you get clear through stillness and steadiness. Solar Plexus, 425 to 600 Hz: you get clear by moving and doing. Throat, 600 to 775 Hz: you get clear by saying it or writing it. Crown, 775 to 950 Hz: you get clear by seeing the whole picture.\u003c/p>\n\u003cp>You can have a different band for each frequency. Everyone uses all four ways. Your band describes a preference, not a ceiling.\u003c/p>\n\u003cp>That may be why a walk clears the work problem, why the right sentence appears only after you say it out loud, or why you need space before you can see a situation whole. The point is not to make you dependent on an answer from outside. It is to help you notice how you naturally come back to your own.\u003c/p>\n\u003ch2>Your practice can be small enough to keep.\u003c/h2>\n\u003cp>The app balances all four frequencies across the week. The listening pattern used in our study was about nine minutes a day on average, with each frequency receiving at least 15 percent of listening time. A missed day does not erase anything. Come back when it fits.\u003c/p>\n\u003cp>You can listen while you work, walk, journal, meditate, cook, travel, unwind or sleep. The music belongs in the life you have made.\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;I&#39;ve been using Zodiac for over a month now and having it on in the background while I work has allowed me to slip into my flow state MUCH easier while having a greater sense of calm and ease&quot;\u003c/p>\n\u003cp>Alex Kikel, Trainer to Olympians and Professional Athletes\u003c/p>\n\u003c/blockquote>\n\u003ch2>What people reported after a year of listening.\u003c/h2>\n\u003cp>Three hundred people began Zodiac&#39;s 52-week internal study, and 278 completed the year. They answered open questions every two weeks while their listening was logged.\u003c/p>\n\u003cp>Of the people who completed the year, 98.6 percent said they would recommend Zodiac to a friend. Among people who listened as designed, at least nine minutes a day on average across the week with each frequency receiving at least 15 percent of listening time, 84 percent called it life-changing.\u003c/p>\n\u003cp>The study was coded in-house. It was not a clinical trial and has not been published in a journal. These are participant reports, not proof of the mechanism or a promise for your life.\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;I am seeing a huge difference in how much more loving I am. I&#39;m more affectionate, more grounded, and when I skip a few days, I feel it. This is the only sound healing that&#39;s made just for me. It fast-tracked clarity in my relationship. I knew who I was, so I saw him more clearly. That foggy feeling was gone. It&#39;s subtle, but after a couple days without it, something feels off. When I listen again, I&#39;m lighter. I smile more. I care more.&quot;\u003c/p>\n\u003cp>Amy Wilcox\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>&quot;Listening to my frequency immersion feels like coming home to myself.&quot;\u003c/p>\n\u003cp>Katie Wells, Founder, Wellness Mama, Best-Selling Author\u003c/p>\n\u003c/blockquote>\n\u003ch2>The first week gives you room to notice.\u003c/h2>\n\u003cp>Seven days lets you hear the full library and see where it belongs in your day. It does not need to deliver your entire experience in a week.\u003c/p>\n\u003cp>Among participants who listened as designed, 61 percent reported a clear shift by month one, 81 percent by month three and 87 percent by month six. Those are cumulative group observations, not a personal schedule or a demand to notice something on cue.\u003c/p>\n\u003cp>The useful question is smaller and more honest: does this help you bring more of yourself into the life you already love?\u003c/p>\n\u003ch2>Start with your four frequencies.\u003c/h2>\n\u003cp>Enter your birth date, time and place. You will see your Core, Love, Vitality and Abundance frequencies and the band for each. Your three short songs in every frequency are free to keep, with no card.\u003c/p>\n\u003cp>Membership adds the longer library across all four frequencies: nine-minute immersions, extended meditation tracks and an hour-long track. The complete library contains nearly ten hours of music.\u003c/p>\n\u003ch2>Your first seven days are free through this invitation.\u003c/h2>\n\u003cp>Choose annual or monthly. The free week applies to either plan.\u003c/p>\n\u003cp>\u003cstrong>$7.33/mo · $88 billed yearly.\u003c/strong> Save $21 a year.\u003c/p>\n\u003cp>\u003cstrong>$14/mo.\u003c/strong> Save $3 a month.\u003c/p>\n\u003cp>Add a card when you start. On day 8, the plan you chose is charged. Cancel before day 8 and there is no membership charge. Charges after the trial are non-refundable. Your checkout shows the exact charge date.\u003c/p>\n\u003cp>\u003ca href=\"#birth-details\">Reveal my frequencies\u003c/a>\u003c/p>\n\u003cp>Your three short songs in each frequency stay free either way.\u003c/p>\n\u003ch2>Questions\u003c/h2>\n\u003ch3>Is Zodiac a replacement for my existing practice?\u003c/h3>\n\u003cp>No. It is music made around your four fixed birth frequencies. Use it alongside the practices, relationships and practical responsibilities that already matter to you.\u003c/p>\n\u003ch3>Do the frequencies change with my life?\u003c/h3>\n\u003cp>No. They are derived from your birth date, time and place and remain fixed while life changes around you.\u003c/p>\n\u003ch3>What if I do not know my birth time?\u003c/h3>\n\u003cp>Use your best estimate. If you have no estimate at all, use noon.\u003c/p>\n\u003ch3>Where do I listen?\u003c/h3>\n\u003cp>After web checkout, download Zodiac from the App Store on iPhone or Google Play on Android. You can also listen in your browser on a desktop or laptop. Sign in with the same email you used here.\u003c/p>\n","text":"More of you in the life you already love.\n\nYou have built a life with things in it that matter. Work you care about. People you show up for. A home, a practice, a body of experience.\n\nYou want to arrive more fully inside it.\n\nThe person who shared this link may earn a commission if you become a paying member.\n\nZodiac puts your four birth frequencies into music, so your connection with yourself can travel into the conversations, leadership, work, intimacy and ordinary pleasure that make up your life.\n\nReveal my frequencies\n\nSee your four birth frequencies and their bands. Your three short songs in each frequency are free, with no card required.\n\n Your practice belongs in the middle of a real life.\n\nSpirituality does not need to happen on a mountaintop or after everything else is handled. It can live beside a calendar, a family dinner, a difficult decision, a project you care about, or ten quiet minutes before the house wakes up.\n\nYou may already have ways of coming back to yourself: meditation, prayer, journaling, a reading, a long walk, therapy, a teacher, a song that changes the temperature in a room. Keep them. They are part of the life you have chosen.\n\nZodiac adds music made from your birth pattern. It does not give you a new identity to perform. It gives you a personal way to return to the self underneath all the roles you hold.\n\n \"It lets you finally feel the parts of yourself you have only ever read about.\"\n\n Zehra Ashary, Kundalini Practitioner, London. Zodiac.fm team member.\n\n The Vedic idea is simple: if the world is sound, your birth pattern has a sound too.\n\nNāda Brahma is the Vedic teaching that the world is sound. Within that worldview, the pattern present when you were born has a sound of its own.\n\nA mantra lineage had already developed a way to find it. Zodiac uses the shared frequency part of their method to derive four frequencies from your date, time and place of birth: Core, Love, Vitality and Abundance.\n\nCore is the signal for who you are and what is yours to do.\n\nLove is the signal for who to let close and how to connect.\n\nVitality is the signal for what feeds you and what drains you.\n\nAbundance is the signal for when to move and which opportunities are yours.\n\nThey are fixed at birth. The day can be demanding, the sky can change, and your life can enter a new season. Your four frequencies remain yours.\n\n \"This music tickled my soul and reminded me that there's such a connection between vibration, the stars and the sounds that are coordinated by higher intelligence. Give it a try.. you'll love it.\"\n\n Debra Silverman, Astrologer to Sting, Jennifer Aniston, Aaron Rodgers\n\n Zodiac turns that pattern into music you can actually live with.\n\nReal musicians make every Zodiac composition. Your exact frequency often lands between standard musical notes, so we do not place a tone over a finished song and call it personal.\n\nInstead, each piece is retuned until your frequency becomes one of its own harmonies. Every composition is prepared in 701 versions, one for each whole frequency from 250 to 950 Hz. Your exact tone runs through the track as part of the music.\n\nIt can be there while you work through a proposal, make dinner, drive home, write in a notebook, rest after a long day, or sit with someone you love. Use headphones, the car, or a decent speaker. There is no technique to master before you press play.\n\n The music amplifies a connection you already have.\n\nYour connected self is who you were before anyone taught you who to be, and the part of you connected to everything and everyone else. Your signal is the connection to it.\n\nZodiac plays your four frequencies back to you to amplify that signal. A tuning fork beside a guitar string offers the picture: when the same note sounds nearby, the string can begin to hum. It is an analogy for our proposed explanation, not a measured account of what happens inside a listener.\n\nThe point is more access to yourself when it matters. In the conversation where you want to say what is true. In the meeting where a clear boundary serves everyone. In the intimate moment where you want to be fully present.\n\nThe choices remain yours. Zodiac does not replace discernment, planning, your relationships or practical action. It is music that can accompany them.\n\n Your bands can show you how clarity arrives.\n\nEach of your frequencies falls into one of four bands. Root, 250 to 425 Hz: you get clear through stillness and steadiness. Solar Plexus, 425 to 600 Hz: you get clear by moving and doing. Throat, 600 to 775 Hz: you get clear by saying it or writing it. Crown, 775 to 950 Hz: you get clear by seeing the whole picture.\n\nYou can have a different band for each frequency. Everyone uses all four ways. Your band describes a preference, not a ceiling.\n\nThat may be why a walk clears the work problem, why the right sentence appears only after you say it out loud, or why you need space before you can see a situation whole. The point is not to make you dependent on an answer from outside. It is to help you notice how you naturally come back to your own.\n\n Your practice can be small enough to keep.\n\nThe app balances all four frequencies across the week. The listening pattern used in our study was about nine minutes a day on average, with each frequency receiving at least 15 percent of listening time. A missed day does not erase anything. Come back when it fits.\n\nYou can listen while you work, walk, journal, meditate, cook, travel, unwind or sleep. The music belongs in the life you have made.\n\n \"I've been using Zodiac for over a month now and having it on in the background while I work has allowed me to slip into my flow state MUCH easier while having a greater sense of calm and ease\"\n\n Alex Kikel, Trainer to Olympians and Professional Athletes\n\n What people reported after a year of listening.\n\nThree hundred people began Zodiac's 52-week internal study, and 278 completed the year. They answered open questions every two weeks while their listening was logged.\n\nOf the people who completed the year, 98.6 percent said they would recommend Zodiac to a friend. Among people who listened as designed, at least nine minutes a day on average across the week with each frequency receiving at least 15 percent of listening time, 84 percent called it life-changing.\n\nThe study was coded in-house. It was not a clinical trial and has not been published in a journal. These are participant reports, not proof of the mechanism or a promise for your life.\n\n \"I am seeing a huge difference in how much more loving I am. I'm more affectionate, more grounded, and when I skip a few days, I feel it. This is the only sound healing that's made just for me. It fast-tracked clarity in my relationship. I knew who I was, so I saw him more clearly. That foggy feeling was gone. It's subtle, but after a couple days without it, something feels off. When I listen again, I'm lighter. I smile more. I care more.\"\n\n Amy Wilcox\n\n \"Listening to my frequency immersion feels like coming home to myself.\"\n\n Katie Wells, Founder, Wellness Mama, Best-Selling Author\n\n The first week gives you room to notice.\n\nSeven days lets you hear the full library and see where it belongs in your day. It does not need to deliver your entire experience in a week.\n\nAmong participants who listened as designed, 61 percent reported a clear shift by month one, 81 percent by month three and 87 percent by month six. Those are cumulative group observations, not a personal schedule or a demand to notice something on cue.\n\nThe useful question is smaller and more honest: does this help you bring more of yourself into the life you already love?\n\n Start with your four frequencies.\n\nEnter your birth date, time and place. You will see your Core, Love, Vitality and Abundance frequencies and the band for each. Your three short songs in every frequency are free to keep, with no card.\n\nMembership adds the longer library across all four frequencies: nine-minute immersions, extended meditation tracks and an hour-long track. The complete library contains nearly ten hours of music.\n\n Your first seven days are free through this invitation.\n\nChoose annual or monthly. The free week applies to either plan.\n\n$7.33/mo · $88 billed yearly. Save $21 a year.\n\n$14/mo. Save $3 a month.\n\nAdd a card when you start. On day 8, the plan you chose is charged. Cancel before day 8 and there is no membership charge. Charges after the trial are non-refundable. Your checkout shows the exact charge date.\n\nReveal my frequencies\n\nYour three short songs in each frequency stay free either way.\n\n Questions\n\n Is Zodiac a replacement for my existing practice?\n\nNo. It is music made around your four fixed birth frequencies. Use it alongside the practices, relationships and practical responsibilities that already matter to you.\n\n Do the frequencies change with my life?\n\nNo. They are derived from your birth date, time and place and remain fixed while life changes around you.\n\n What if I do not know my birth time?\n\nUse your best estimate. If you have no estimate at all, use noon.\n\n Where do I listen?\n\nAfter web checkout, download Zodiac from the App Store on iPhone or Google Play on Android. You can also listen in your browser on a desktop or laptop. Sign in with the same email you used here.","copyText":"# More of you in the life you already love.\n\nYou have built a life with things in it that matter. Work you care about. People you show up for. A home, a practice, a body of experience.\n\nYou want to arrive more fully inside it.\n\nThe person who shared this link may earn a commission if you become a paying member.\n\nZodiac puts your four birth frequencies into music, so your connection with yourself can travel into the conversations, leadership, work, intimacy and ordinary pleasure that make up your life.\n\n[Reveal my frequencies](birth-details.md)\n\nSee your four birth frequencies and their bands. Your three short songs in each frequency are free, with no card required.\n\n## Your practice belongs in the middle of a real life.\n\nSpirituality does not need to happen on a mountaintop or after everything else is handled. It can live beside a calendar, a family dinner, a difficult decision, a project you care about, or ten quiet minutes before the house wakes up.\n\nYou may already have ways of coming back to yourself: meditation, prayer, journaling, a reading, a long walk, therapy, a teacher, a song that changes the temperature in a room. Keep them. They are part of the life you have chosen.\n\nZodiac adds music made from your birth pattern. It does not give you a new identity to perform. It gives you a personal way to return to the self underneath all the roles you hold.\n\n> \"It lets you finally feel the parts of yourself you have only ever read about.\"\n>\n> Zehra Ashary, Kundalini Practitioner, London. Zodiac.fm team member.\n\n## The Vedic idea is simple: if the world is sound, your birth pattern has a sound too.\n\nNāda Brahma is the Vedic teaching that the world is sound. Within that worldview, the pattern present when you were born has a sound of its own.\n\nA mantra lineage had already developed a way to find it. Zodiac uses the shared frequency part of their method to derive four frequencies from your date, time and place of birth: Core, Love, Vitality and Abundance.\n\nCore is the signal for who you are and what is yours to do.\n\nLove is the signal for who to let close and how to connect.\n\nVitality is the signal for what feeds you and what drains you.\n\nAbundance is the signal for when to move and which opportunities are yours.\n\nThey are fixed at birth. The day can be demanding, the sky can change, and your life can enter a new season. Your four frequencies remain yours.\n\n> \"This music tickled my soul and reminded me that there's such a connection between vibration, the stars and the sounds that are coordinated by higher intelligence. Give it a try.. you'll love it.\"\n>\n> Debra Silverman, Astrologer to Sting, Jennifer Aniston, Aaron Rodgers\n\n## Zodiac turns that pattern into music you can actually live with.\n\nReal musicians make every Zodiac composition. Your exact frequency often lands between standard musical notes, so we do not place a tone over a finished song and call it personal.\n\nInstead, each piece is retuned until your frequency becomes one of its own harmonies. Every composition is prepared in 701 versions, one for each whole frequency from 250 to 950 Hz. Your exact tone runs through the track as part of the music.\n\nIt can be there while you work through a proposal, make dinner, drive home, write in a notebook, rest after a long day, or sit with someone you love. Use headphones, the car, or a decent speaker. There is no technique to master before you press play.\n\n## The music amplifies a connection you already have.\n\nYour connected self is who you were before anyone taught you who to be, and the part of you connected to everything and everyone else. Your signal is the connection to it.\n\nZodiac plays your four frequencies back to you to amplify that signal. A tuning fork beside a guitar string offers the picture: when the same note sounds nearby, the string can begin to hum. It is an analogy for our proposed explanation, not a measured account of what happens inside a listener.\n\nThe point is more access to yourself when it matters. In the conversation where you want to say what is true. In the meeting where a clear boundary serves everyone. In the intimate moment where you want to be fully present.\n\nThe choices remain yours. Zodiac does not replace discernment, planning, your relationships or practical action. It is music that can accompany them.\n\n## Your bands can show you how clarity arrives.\n\nEach of your frequencies falls into one of four bands. Root, 250 to 425 Hz: you get clear through stillness and steadiness. Solar Plexus, 425 to 600 Hz: you get clear by moving and doing. Throat, 600 to 775 Hz: you get clear by saying it or writing it. Crown, 775 to 950 Hz: you get clear by seeing the whole picture.\n\nYou can have a different band for each frequency. Everyone uses all four ways. Your band describes a preference, not a ceiling.\n\nThat may be why a walk clears the work problem, why the right sentence appears only after you say it out loud, or why you need space before you can see a situation whole. The point is not to make you dependent on an answer from outside. It is to help you notice how you naturally come back to your own.\n\n## Your practice can be small enough to keep.\n\nThe app balances all four frequencies across the week. The listening pattern used in our study was about nine minutes a day on average, with each frequency receiving at least 15 percent of listening time. A missed day does not erase anything. Come back when it fits.\n\nYou can listen while you work, walk, journal, meditate, cook, travel, unwind or sleep. The music belongs in the life you have made.\n\n> \"I've been using Zodiac for over a month now and having it on in the background while I work has allowed me to slip into my flow state MUCH easier while having a greater sense of calm and ease\"\n>\n> Alex Kikel, Trainer to Olympians and Professional Athletes\n\n## What people reported after a year of listening.\n\nThree hundred people began Zodiac's 52-week internal study, and 278 completed the year. They answered open questions every two weeks while their listening was logged.\n\nOf the people who completed the year, 98.6 percent said they would recommend Zodiac to a friend. Among people who listened as designed, at least nine minutes a day on average across the week with each frequency receiving at least 15 percent of listening time, 84 percent called it life-changing.\n\nThe study was coded in-house. It was not a clinical trial and has not been published in a journal. These are participant reports, not proof of the mechanism or a promise for your life.\n\n> \"I am seeing a huge difference in how much more loving I am. I'm more affectionate, more grounded, and when I skip a few days, I feel it. This is the only sound healing that's made just for me. It fast-tracked clarity in my relationship. I knew who I was, so I saw him more clearly. That foggy feeling was gone. It's subtle, but after a couple days without it, something feels off. When I listen again, I'm lighter. I smile more. I care more.\"\n>\n> Amy Wilcox\n\n> \"Listening to my frequency immersion feels like coming home to myself.\"\n>\n> Katie Wells, Founder, Wellness Mama, Best-Selling Author\n\n## The first week gives you room to notice.\n\nSeven days lets you hear the full library and see where it belongs in your day. It does not need to deliver your entire experience in a week.\n\nAmong participants who listened as designed, 61 percent reported a clear shift by month one, 81 percent by month three and 87 percent by month six. Those are cumulative group observations, not a personal schedule or a demand to notice something on cue.\n\nThe useful question is smaller and more honest: does this help you bring more of yourself into the life you already love?\n\n## Start with your four frequencies.\n\nEnter your birth date, time and place. You will see your Core, Love, Vitality and Abundance frequencies and the band for each. Your three short songs in every frequency are free to keep, with no card.\n\nMembership adds the longer library across all four frequencies: nine-minute immersions, extended meditation tracks and an hour-long track. The complete library contains nearly ten hours of music.\n\n## Your first seven days are free through this invitation.\n\nChoose annual or monthly. The free week applies to either plan.\n\n**$7.33/mo · $88 billed yearly.** Save $21 a year.\n\n**$14/mo.** Save $3 a month.\n\nAdd a card when you start. On day 8, the plan you chose is charged. Cancel before day 8 and there is no membership charge. Charges after the trial are non-refundable. Your checkout shows the exact charge date.\n\n[Reveal my frequencies](birth-details.md)\n\nYour three short songs in each frequency stay free either way.\n\n## Questions\n\n### Is Zodiac a replacement for my existing practice?\n\nNo. It is music made around your four fixed birth frequencies. Use it alongside the practices, relationships and practical responsibilities that already matter to you.\n\n### Do the frequencies change with my life?\n\nNo. They are derived from your birth date, time and place and remain fixed while life changes around you.\n\n### What if I do not know my birth time?\n\nUse your best estimate. If you have no estimate at all, use noon.\n\n### Where do I listen?\n\nAfter web checkout, download Zodiac from the App Store on iPhone or Google Play on Android. You can also listen in your browser on a desktop or laptop. Sign in with the same email you used here."},{"category":"Pages","slug":"paid-ad","title":"Paid-ad landing page","label":"Review variant · Paid-ad landing page","hasSourceH1":true,"html":"\u003ch1>Hear the part of you a reading recognizes.\u003c/h1>\n\u003cp>Four fixed frequencies from your birth pattern, carried through music to amplify your connection with your connected self.\u003c/p>\n\u003cp>\u003ca href=\"#birth-details\">Reveal my frequencies\u003c/a>\u003c/p>\n\u003cp>See your four frequencies and their bands. Your three short songs in each frequency are free, with no card needed.\u003c/p>\n\u003ch2>Live more of what you recognize about yourself\u003c/h2>\n\u003cp>A reading can describe you so well that you stop trying to explain yourself for a moment. Yes. That is me.\u003c/p>\n\u003cp>You may know that recognition through astrology, Human Design or a practice you have made your own. It can give you language for your nature, compassion for your quirks and context for the chapter you are in.\u003c/p>\n\u003cp>Now think about having more access to that knowing while you live. When you are choosing what to put your time into. When an opportunity arrives. When you want to be fully there with someone you love.\u003c/p>\n\u003cp>That is what Zodiac is for.\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;Insight is powerful. But insight alone does not create integration. Zodiac.fm works at the frequency level underneath the pattern. Instead of just studying your blueprint, you begin resonating with it.&quot;\u003c/p>\n\u003cp>Summer Phoenix, Human Design and Gene Keys Practitioner\u003c/p>\n\u003c/blockquote>\n\u003ch2>If the world is sound, your birth pattern has a sound too\u003c/h2>\n\u003cp>Nāda Brahma is the Vedic teaching that the world is sound. You, the planets and the music are part of one reality.\u003c/p>\n\u003cp>So the pattern present when you were born would have a sound of its own. That was the question worth following.\u003c/p>\n\u003cp>A mantra lineage had already developed a way to find it.\u003c/p>\n\u003cp>We use the frequency part of their method to derive four frequencies from your birth date, time and place. Then we put them into music. You can listen to the pattern a reading helps you recognize, without having to translate it into words first.\u003c/p>\n\u003cp>The origin is old. The music and the way you use it belong in the life you have now.\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;This music tickled my soul and reminded me that there&#39;s such a connection between vibration, the stars and the sounds that are coordinated by higher intelligence. Give it a try.. you&#39;ll love it.&quot;\u003c/p>\n\u003cp>Debra Silverman, Astrologer to Sting, Jennifer Aniston, Aaron Rodgers\u003c/p>\n\u003c/blockquote>\n\u003ch2>Here is how the birth pattern becomes music\u003c/h2>\n\u003ch3>1. Start with the moment you arrived\u003c/h3>\n\u003cp>Your date, time and place of birth identify the planetary arrangement you were born into. Astrology treats that pattern as meaningful throughout your life. Zodiac begins with the same personally meaningful birth moment.\u003c/p>\n\u003ch3>2. Find its sound\u003c/h3>\n\u003cp>The mantra lineage&#39;s method derives four frequencies from that birth information. They are actual musical pitches, between 250 and 950 Hz. The method remains protected.\u003c/p>\n\u003ch3>3. Four frequencies, with four places in your life\u003c/h3>\n\u003cp>Core is the signal for who you are and what is yours to do.\u003c/p>\n\u003cp>Love is the signal for who to let close and how to connect.\u003c/p>\n\u003cp>Vitality is the signal for what feeds you and what drains you.\u003c/p>\n\u003cp>Abundance is the signal for when to move and which opportunities are yours.\u003c/p>\n\u003cp>They stay fixed. Your life changes, the sky keeps moving, and your birth frequencies stay yours.\u003c/p>\n\u003ch3>4. Give the frequencies music worth listening to\u003c/h3>\n\u003cp>A frequency by itself is a pure tone. We wanted something you would enjoy leaving on.\u003c/p>\n\u003cp>Real musicians make the songs, from short pieces to longer music for work, meditation or winding down. Each version carries one of your frequencies.\u003c/p>\n\u003ch3>5. Tune the song around your frequency\u003c/h3>\n\u003cp>Your frequency usually falls between standard musical notes. Simply adding it to a finished song could make the two clash.\u003c/p>\n\u003cp>Instead, the music is retuned until your exact frequency becomes part of its harmony. The tone stays exact and runs through the track, fading in at the beginning and out at the end.\u003c/p>\n\u003cp>Every composition is prepared in 701 versions, one for each whole frequency from 250 to 950 Hz. There is a version for yours.\u003c/p>\n\u003ch3>6. Turn up the connection you already have\u003c/h3>\n\u003cp>Your connected self is who you were before anyone taught you who to be, and the part of you connected to everything and everyone else.\u003c/p>\n\u003cp>Your signal is how you reach it. Think of a familiar voice calling across a crowded room. The voice is not the person, but it is how you find them.\u003c/p>\n\u003cp>Zodiac plays your frequencies back to you to amplify that connection. A tuning fork gives a useful picture: sound the same note beside a guitar string and the string can begin to hum. That is an analogy for our proposed explanation, not a measured account of what happens inside a listener.\u003c/p>\n\u003ch3>7. Bring the connection into the day\u003c/h3>\n\u003cp>You don&#39;t have to get away from your life to use it.\u003c/p>\n\u003cp>The music can play while you cook, work, journal or sit with someone. Your signal can become easier to recognize in the middle of the noise, where your choices are actually being made.\u003c/p>\n\u003ch3>8. Recognize how you get clear\u003c/h3>\n\u003cp>Each frequency falls into a band. Your band describes how you naturally take things in within that area of life.\u003c/p>\n\u003cp>Root is associated with stillness and steadiness. Solar Plexus with moving and doing. Throat with speaking or writing. Crown with seeing the whole picture.\u003c/p>\n\u003cp>You can have a different band for each frequency. Everybody uses all four ways. The band describes a preference, not a limit.\u003c/p>\n\u003cp>Something you were criticized for may make more sense in that light. Needing to talk it through can be how you arrive at clarity. Taking your time can be how you find solid ground.\u003c/p>\n\u003ch3>9. Give all four frequencies time\u003c/h3>\n\u003cp>The app balances your listening across the week. The pattern behind our study findings was about nine minutes a day on average, with each frequency receiving at least 15 percent of the listening time.\u003c/p>\n\u003cp>A missed day does not erase what came before. Come back when you can.\u003c/p>\n\u003ch3>10. Listen in a way that fits\u003c/h3>\n\u003cp>Use headphones, your car speakers or a quality Bluetooth speaker. Your phone and laptop speakers don&#39;t do the frequencies justice.\u003c/p>\n\u003cp>You can meditate to it, but you don&#39;t have to. There is no technique to master before you press play.\u003c/p>\n\u003ch3>11. Notice what becomes available\u003c/h3>\n\u003cp>You might notice something while listening. You might notice it later, in the way you meet a person, a choice or a situation.\u003c/p>\n\u003cp>The Vedic account gives us a way to understand the possibility. The listener experiences give us something else to examine. We hold the worldview as a possibility, not scientific proof, and we have studied what people reported over a year.\u003c/p>\n\u003cp>\u003ca href=\"#birth-details\">Reveal my frequencies\u003c/a>\u003c/p>\n\u003ch2>What would more access to yourself make possible?\u003c/h2>\n\u003cp>It may be taking a part of your nature seriously that you have always explained away. The work you keep returning to. Your need to talk something through. The time you need before an answer becomes clear.\u003c/p>\n\u003cp>It can reach into the life you already value. More of you in a conversation with your partner. A boundary said simply. Recognizing the opportunity you want to meet, with less effort spent convincing yourself to want the other one.\u003c/p>\n\u003cp>For someone who follows astrology, this can mean meeting a transit or a new chapter from a stronger connection with their own nature. For someone practicing manifestation, it can mean recognizing what is theirs to pursue. The same connection belongs in an already successful life, too.\u003c/p>\n\u003cp>We cannot promise a particular relationship, job, amount of money or event. Your decisions remain yours.\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;It lets you finally feel the parts of yourself you have only ever read about.&quot;\u003c/p>\n\u003cp>Zehra Ashary, Kundalini Practitioner, London. Zodiac.fm team member.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Music beside the things you already do\u003c/h2>\n\u003cp>A reading can give you context. Your practice can help you see what is happening. Zodiac adds a way to keep your own signal available as you use what you know.\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;I&#39;ve been using Zodiac for over a month now and having it on in the background while I work has allowed me to slip into my flow state MUCH easier while having a greater sense of calm and ease&quot;\u003c/p>\n\u003cp>Alex Kikel, Trainer to Olympians and Professional Athletes\u003c/p>\n\u003c/blockquote>\n\u003cp>You may have an hour to settle in. You may have a few minutes between things. Choose music that suits the moment and let it play.\u003c/p>\n\u003ch2>What listeners reported over a year\u003c/h2>\n\u003cp>Three hundred people began our 52-week study. Two hundred and seventy-eight completed it. They answered open questions every two weeks, and their listening was logged.\u003c/p>\n\u003cp>Of those who completed the year, 98.6 percent said they would recommend Zodiac to a friend. Among those who listened as designed, about nine minutes a day on average with each frequency receiving at least 15 percent of listening time, 84 percent called it life-changing.\u003c/p>\n\u003cp>In that as-designed group, 94 percent described deeper self-access. Ninety-one percent reported sharper instincts, and 90 percent reported better relationships and love.\u003c/p>\n\u003cp>The study was internal and coded in-house. It was not a clinical trial and has not been published in a journal. These are participants&#39; reports, not proof of the mechanism or a promised result for you.\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;I am seeing a huge difference in how much more loving I am. I&#39;m more affectionate, more grounded.&quot;\u003c/p>\n\u003cp>Amy Wilcox\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>&quot;Listening to my frequency immersion feels like coming home to myself.&quot;\u003c/p>\n\u003cp>Katie Wells, Founder, Wellness Mama, Best-Selling Author\u003c/p>\n\u003c/blockquote>\n\u003ch2>The first week is a beginning\u003c/h2>\n\u003cp>Seven days gives you time to hear the full library and see where it fits in your day. It doesn&#39;t have to deliver your entire experience in a week.\u003c/p>\n\u003cp>Among the study participants who listened as designed, 61 percent reported a clear shift by month one, 81 percent by month three and 87 percent by month six. People moved at different speeds. Those figures describe the group, not a schedule you have to keep.\u003c/p>\n\u003cp>Let the music be part of your life, then notice your life.\u003c/p>\n\u003ch2>Start with your four frequencies\u003c/h2>\n\u003cp>Enter your birth date, time and place. Your results show Core, Love, Vitality and Abundance, with the band for each.\u003c/p>\n\u003cp>You can hear three short songs in every frequency without a card. They remain free whether or not you choose membership.\u003c/p>\n\u003cp>Membership adds the longer tracks across all four frequencies, including nine-minute immersions, extended meditation tracks and an hour-long track. The nce may become apparent over time. You don&#39;t have to produce a sensation during a song.\u003c/p>\n\u003ch3>Where do I listen?\u003c/h3>\n\u003cp>In the native iPhone or Android app, or in your browser on a desktop or laptop. Sign in with the same email you used here.\u003c/p>\n\u003ch3>Do I need a card to hear the free songs?\u003c/h3>\n\u003cp>No. A card is required when you choose the $3 full-library week.\u003c/p>\n\u003ch2>Hear what belongs to you\u003c/h2>\n\u003cp>Your birth frequencies are already yours. The next step is finding them and hearing the music.\u003c/p>\n\u003cp>\u003ca href=\"#birth-details\">Reveal my frequencies\u003c/a>\u003c/p>\n\u003cp>Three short songs in each frequency, free to keep. No card required for those songs.\u003c/p>\n","text":"Hear the part of you a reading recognizes.\n\nFour fixed frequencies from your birth pattern, carried through music to amplify your connection with your connected self.\n\nReveal my frequencies\n\nSee your four frequencies and their bands. Your three short songs in each frequency are free, with no card needed.\n\n Live more of what you recognize about yourself\n\nA reading can describe you so well that you stop trying to explain yourself for a moment. Yes. That is me.\n\nYou may know that recognition through astrology, Human Design or a practice you have made your own. It can give you language for your nature, compassion for your quirks and context for the chapter you are in.\n\nNow think about having more access to that knowing while you live. When you are choosing what to put your time into. When an opportunity arrives. When you want to be fully there with someone you love.\n\nThat is what Zodiac is for.\n\n \"Insight is powerful. But insight alone does not create integration. Zodiac.fm works at the frequency level underneath the pattern. Instead of just studying your blueprint, you begin resonating with it.\"\n\n Summer Phoenix, Human Design and Gene Keys Practitioner\n\n If the world is sound, your birth pattern has a sound too\n\nNāda Brahma is the Vedic teaching that the world is sound. You, the planets and the music are part of one reality.\n\nSo the pattern present when you were born would have a sound of its own. That was the question worth following.\n\nA mantra lineage had already developed a way to find it.\n\nWe use the frequency part of their method to derive four frequencies from your birth date, time and place. Then we put them into music. You can listen to the pattern a reading helps you recognize, without having to translate it into words first.\n\nThe origin is old. The music and the way you use it belong in the life you have now.\n\n \"This music tickled my soul and reminded me that there's such a connection between vibration, the stars and the sounds that are coordinated by higher intelligence. Give it a try.. you'll love it.\"\n\n Debra Silverman, Astrologer to Sting, Jennifer Aniston, Aaron Rodgers\n\n Here is how the birth pattern becomes music\n\n 1. Start with the moment you arrived\n\nYour date, time and place of birth identify the planetary arrangement you were born into. Astrology treats that pattern as meaningful throughout your life. Zodiac begins with the same personally meaningful birth moment.\n\n 2. Find its sound\n\nThe mantra lineage's method derives four frequencies from that birth information. They are actual musical pitches, between 250 and 950 Hz. The method remains protected.\n\n 3. Four frequencies, with four places in your life\n\nCore is the signal for who you are and what is yours to do.\n\nLove is the signal for who to let close and how to connect.\n\nVitality is the signal for what feeds you and what drains you.\n\nAbundance is the signal for when to move and which opportunities are yours.\n\nThey stay fixed. Your life changes, the sky keeps moving, and your birth frequencies stay yours.\n\n 4. Give the frequencies music worth listening to\n\nA frequency by itself is a pure tone. We wanted something you would enjoy leaving on.\n\nReal musicians make the songs, from short pieces to longer music for work, meditation or winding down. Each version carries one of your frequencies.\n\n 5. Tune the song around your frequency\n\nYour frequency usually falls between standard musical notes. Simply adding it to a finished song could make the two clash.\n\nInstead, the music is retuned until your exact frequency becomes part of its harmony. The tone stays exact and runs through the track, fading in at the beginning and out at the end.\n\nEvery composition is prepared in 701 versions, one for each whole frequency from 250 to 950 Hz. There is a version for yours.\n\n 6. Turn up the connection you already have\n\nYour connected self is who you were before anyone taught you who to be, and the part of you connected to everything and everyone else.\n\nYour signal is how you reach it. Think of a familiar voice calling across a crowded room. The voice is not the person, but it is how you find them.\n\nZodiac plays your frequencies back to you to amplify that connection. A tuning fork gives a useful picture: sound the same note beside a guitar string and the string can begin to hum. That is an analogy for our proposed explanation, not a measured account of what happens inside a listener.\n\n 7. Bring the connection into the day\n\nYou don't have to get away from your life to use it.\n\nThe music can play while you cook, work, journal or sit with someone. Your signal can become easier to recognize in the middle of the noise, where your choices are actually being made.\n\n 8. Recognize how you get clear\n\nEach frequency falls into a band. Your band describes how you naturally take things in within that area of life.\n\nRoot is associated with stillness and steadiness. Solar Plexus with moving and doing. Throat with speaking or writing. Crown with seeing the whole picture.\n\nYou can have a different band for each frequency. Everybody uses all four ways. The band describes a preference, not a limit.\ e an answer becomes clear.\n\nIt can reach into the life you already value. More of you in a conversation with your partner. A boundary said simply. Recognizing the opportunity you want to meet, with less effort spent convincing yourself to want the other one.\n\nFor someone who follows astrology, this can mean meeting a transit or a new chapter from a stronger connection with their own nature. For someone practicing manifestation, it can mean recognizing what is theirs to pursue. The same connection belongs in an already successful life, too.\n\nWe cannot promise a particular relationship, job, amount of money or event. Your decisions remain yours.\n\n> \"It lets you finally feel the parts of yourself you have only ever read about.\"\n>\n> Zehra Ashary, Kundalini Practitioner, London. Zodiac.fm team member.\n\n## Music beside the things you already do\n\nA reading can give you context. Your practice can help you see what is happening. Zodiac adds a way to keep your own signal available as you use what you know.\n\n> \"I've been using Zodiac for over a month now and having it on in the background while I work has allowed me to slip into my flow state MUCH easier while having a greater sense of calm and ease\"\n>\n> Alex Kikel, Trainer to Olympians and Professional Athletes\n\nYou may have an hour to settle in. You may have a few minutes between things. Choose music that suits the moment and let it play.\n\n## What listeners reported over a year\n\nThree hundred people began our 52-week study. Two hundred and seventy-eight completed it. They answered open questions every two weeks, and their listening was logged.\n\nOf those who completed the year, 98.6 percent said they would recommend Zodiac to a friend. Among those who listened as designed, about nine minutes a day on average with each frequency receiving at least 15 percent of listening time, 84 percent called it life-changing.\n\nIn that as-designed group, 94 percent described deeper self-access. Ninety-one percent reported sharper instincts, and 90 percent reported better relationships and love.\n\nThe study was internal and coded in-house. It was not a clinical trial and has not been published in a journal. These are participants' reports, not proof of the mechanism or a promised result for you.\n\n> \"I am seeing a huge difference in how much more loving I am. I'm more affectionate, more grounded.\"\n>\n> Amy Wilcox\n\n> \"Listening to my frequency immersion feels like coming home to myself.\"\n>\n> Katie Wells, Founder, Wellness Mama, Best-Selling Author\n\n## The first week is a beginning\n\nSeven days gives you time to hear the full library and see where it fits in your day. It doesn't have to deliver your entire experience in a week.\n\nAmong the study participants who listened as designed, 61 percent reported a clear shift by month one, 81 percent by month three and 87 percent by month six. People moved at different speeds. Those figures describe the group, not a schedule you have to keep.\n\nLet the music be part of your life, then notice your life.\n\n## Start with your four frequencies\n\nEnter your birth date, time and place. Your results show Core, Love, Vitality and Abundance, with the band for each.\n\nYou can hear three short songs in every frequency without a card. They remain free whether or not you choose membership.\n\nMembership adds the longer tracks across all four frequencies, including nine-minute immersions, extended meditation tracks and an hour-long track. The complete library currently holds nearly ten hours of music across your four frequencies.\n\n## Hear the full library for seven days for $3\n\nChoose annual or monthly. Your first seven days cost $3 on either plan.\n\n$7.33 a month, billed at $88 a year. Save $21 a year compared with our current $109 annual price.\n\nOr $14 a month. Save $3 a month compared with our current $17 monthly price.\n\nPay $3 to start your seven days. On day eight, you are charged for the plan you chose unless you s I'm softer.\"\n\n Todd Shipman, Founder & CEO, Quantum Wellness Leader\n\n \"I am seeing a huge difference in how much more loving I am. I'm more affectionate, more grounded.\"\n\n Amy Wilcox\n\n \"It felt like the floodgates of abundance, prosperity, and purpose opened.\"\n\n Jennifer K. Hill, Global Wellness Leader, Founder, OptiMatch\n\nThese are personal experiences. Zodiac does not promise a particular relationship, financial result or event.\n\n There is music for all four.\n\nThree short songs in every frequency are yours without a card. You can start there, or try the full library for more time with the music.\n\nChoose my full-library plan\n\nHear my free songs\n\nUse the same email you entered with your birth details.\n\n \"Listening to my frequency immersion feels like coming home to myself.\"\n\n Katie Wells, Founder, Wellness Mama, Best-Selling Author\n\n The bands give your nature some room.\n\nYou may get clear about work by talking it through, while a relationship makes more sense when you can be still. There is no contradiction in that.\n\nEach of your four frequencies falls into a band. Root is associated with stillness and steadiness. Solar Plexus with motion and action. Throat with speaking or writing. Crown with seeing the whole picture.\n\nYou can use all four ways. Your band describes a natural preference in that area, not a rule you have to obey or a level you need to rise above.\n\nRead your personal descriptions below. You may recognize something that has been true of you for years.\n\n Core · [Core band]\n\n[Personal Core band description]\n\n Love · [Love band]\n\n[Personal Love band description]\n\n Vitality · [Vitality band]\n\n[Personal Vitality band description]\n\n Abundance · [Abundance band]\n\n[Personal Abundance band description]\n\nMore about your bands\n\n The pattern a reading recognizes has another way in.\n\nA good reading gives words to something you recognize in yourself. Zodiac works from the possibility that the same birth pattern can be approached through sound.\n\nNāda Brahma is the Vedic teaching that the world is sound. A mantra lineage developed a method for finding personal frequencies from birth information. Zodiac uses the frequency part of that method, then brings the frequencies into music.\n\nYour four numbers stay fixed. They are your reference as you move through changing circumstances, transits and chapters of life. We are not mixing today's planetary movements into a new set of tones.\n\nThe purpose is to amplify your connection with your connected self, so your nature becomes more available while you choose, relate, work and create. You keep your judgment, your practices and the freedom to decide what to do.\n\n \"Insight is powerful. But insight alone does not create integration. Zodiac.fm works at the frequency level underneath the pattern. Instead of just studying your blueprint, you begin resonating with it.\"\n\n Summer Phoenix, Human Design and Gene Keys Practitioner\n\n Your frequency belongs inside the music.\n\nA pure frequency is a tone. To make it something you can enjoy living with, real musicians create the songs and audio engineers retune them around that exact pitch.\n\nEach composition is prepared in 701 versions, one for every whole frequency from 250 to 950 Hz. The version you hear carries one of your four frequencies throughout the track.\n\nYou can choose a short song between things, a longer piece while you work, or music for meditation and winding down. The tuning is already done.\n\n \"Bypassing the mind and speaking directly to the body.\"\n\n Barbara Ditlow, Human Design Mentor, Master Practitioner, Trained/Certified/Endorsed by Ra Uru Hu (Founder of Human Design)\n\n Look for the difference in your life.\n\nA conversation where you are more present. A decision that gives you less to argue with. A familiar reaction with a little more space around it.\n\nThose are the kinds of experiences listeners describe. You do not have to produce a special sensation while a song is playing.\n\n \"If you're tired of living out of tune with yourself, this is your invitation home.\"\n\n Rhonda Britten, Author of “Fearless Living,” Emmy Award-Winner, Founder, Fearless Living Institute\n\n \"I feel like ME again.\"\n\n Amber Hedrick\n\n \"I went from ranting and complaining in my pages to writing in a way that felt hopeful and solutions oriented in only 9 minutes.\"\n\n Tangie Nadimi, Founder, Feel Good Human Design\n\n \"I've been using Zodiac for over a month now and having it on in the background while I work has allowed me to slip into my flow state MUCH easier while having a greater sense of calm and ease\"\n\n Alex Kikel, Trainer to Olympians and Professional Athletes\n\nWhat that means in your life will be personal. Zodiac does not promise a particular relationship, amount of money, job or event.\n\n \"I have received multiple unexpected new very lucrative opportunities since I began tuning in.\"\n\n Leanne Ely, Best-Selling Author, Founder, Saving Dinner\n\n What a year of listening showed us.\n\nThree hundred people began our 52-week study. Two hundred and seventy-eight completed it. Participants answered open questions every two weeks, and their listening was logged.\n\nOf those who completed the year, 98.6 percent would recommend Zodiac to a friend. Seventy-point-five percent called it life-changing.\n\nAmong those who listened as designed, at least nine minutes a day on average with each frequency receiving at least 15 percent of listening time, 84 percent called it life-changing.\n\nIn that as-designed group, listeners described seven kinds of change:\n\n- Deeper self-access, 94 percent. Feeling more like themselves.\n- Sharper instincts, 91 percent. Recognizing and trusting their own sense of a choice.\n- Internal regulation, 92 percent. Reports of feeling calmer and steadier, not a measured medical effect.\n- Better relationships and love, 90 percent. More real connection.\n- Life responds, 88 percent. Openings and situations moving their way.\n- Connection to something bigger, 90 percent.\n- The witness, 91 percent. More space between what happened and how they responded. This was the one change that tended to arrive later.\n\nNinety-six percent reported three or more of these changes. We do not have a measured sequence for the other outcomes or a month when any particular one should arrive.\n\nThis was an internal study, coded in-house. It was not a clinical trial and has not been published in a journal. It records what participants reported, rather than proving the proposed mechanism or predicting your experience.\n\nRead all the findings and how the study worked\n\n People who work with sound and self-knowledge have listened too.\n\n \"Zodiac.fm is way ahead of the curve.\"\n\n Maya Shetreat, MD, Adult and Pediatric Neurologist, Expert Astrologer, Best-Selling Author\n\n \"This music tickled my soul and reminded me that there's such a connection between vibration, the stars and the sounds that are coordinated by higher intelligence. Give it a try.. you'll love it.\"\n\n Debra Silverman, Astrologer to Sting, Jennifer Aniston, Aaron Rodgers\n\n \"I have never seen, or heard, anything like it.\"\n\n Naomi Fox Reina, Human Design Guide Mentor, Founder, Light-Filled Co\n\n Your first week has a simple job.\n\nHear the music. Find where it fits. Give all four frequencies some time.\n\nAt least nine minutes a day on average is the listening rhythm used in the study, with each frequency receiving at least 15 percent of weekly listening. That is 63 minutes across a week. The app helps keep the four frequencies in balance.\n\nLet the music accompany something already in your day. You can meditate with it, but you can also cook, work, journal or settle into the evening.\n\n \"It lets you finally feel the parts of yourself you have only ever read about.\"\n\n Zehra Ashary, Kundalini Practitioner, London. Zodiac.fm team member.\n\n \"Every time I use this technology, I am inded me that there's such a connection between vibration, the stars and the sounds that are coordinated by higher intelligence. Give it a try.. you'll love it.\"\n>\n> Debra Silverman, Astrologer to Sting, Jennifer Aniston, Aaron Rodgers\n\n> \"I have never seen, or heard, anything like it.\"\n>\n> Naomi Fox Reina, Human Design Guide Mentor, Founder, Light-Filled Co\n\n## Your first week has a simple job.\n\nHear the music. Find where it fits. Give all four frequencies some time.\n\nAt least nine minutes a day on average is the listening rhythm used in the study, with each frequency receiving at least 15 percent of weekly listening. That is 63 minutes across a week. The app helps keep the four frequencies in balance.\n\nLet the music accompany something already in your day. You can meditate with it, but you can also cook, work, journal or settle into the evening.\n\n> \"It lets you finally feel the parts of yourself you have only ever read about.\"\n>\n> Zehra Ashary, Kundalini Practitioner, London. Zodiac.fm team member.\n\n> \"Every time I use this technology, I am coming home.\"\n>\n> Alex Nazarov, Marketing Strategist & Conscious Leadership Builder\n\nIn the as-designed study group, 61 percent reported a clear shift by month one, 81 percent by month three and 87 percent by month six. Your experience doesn't have to fit those dates, and a quiet first week is not a verdict.\n\n## Give yourself more room to listen.\n\nYour three short songs in every frequency stay free.\n\nMembership adds longer music across all four frequencies, including nine-minute immersions, extended meditations and an hour-long track. The full library currently holds nearly ten hours of music across your four frequencies.\n\nYou can stay with a piece for longer, instead of choosing another short song every few minutes.\n\n> \"It's like a little cheat code for experiencing your authentic vibration. Because it's personalized to you, not generic. I use it every day. This one earned it.\"\n>\n> David McEwen, Transformation Thought Leader, Over 12 Million YouTube Views. Zodiac.fm affiliate.\n\n> \"I have never experienced change in self as I have with this experience.\"\n>\n> Paul Tribe, Addictions Counselor\n\n> \"Without doing anything but listening, I become a different person.\"\n>\n> Joey Vaillancourt, VP of Marketing, BiOptimizers\n\n> \"My wife especially loves the man I am turning into since subscribing.\"\n>\n> Ken Hoffman, Operations Manager, WNY Dyslexia Specialists\n\n> \"I kid you not, from the first 631 Hz tonal ring in my ears, it's as if my soul comes alive\"\n>\n> Ellen Grimaldi, Mission, KS\n\n[See my plans and start listening](buy.md)\n\nYour checkout shows your starting offer, annual or monthly price and exact charge date before you choose. Listen in the native iPhone or Android app, or a desktop or laptop browser, with the same email.\n\n\n\n## Before you press play\n\n### Do I need to understand all of this first?\n\nNo. Your results are there to explore whenever you want. You can begin with the music.\n\n### What if a birth detail is wrong?\n\nCorrect it before relying on the result. Email [support@zodiac.fm](mailto:support@zodiac.fm) from your account email and tell us which detail needs attention. Your frequencies are fixed for your birth information, so a correction can change the calculation.\n\n### Can I use this with astrology or Human Design?\n\nYes. Zodiac belongs alongside readings and practices you value. It does not interpret every placement, gate or center, or replace the time your Authority may need for clarity.\n\n### Do I need headphones?\n\nHeadphones or a decent speaker are both suitable. Use a comfortable volume. There is no need to turn it up to make the frequency work harder.\n\n### What happens if I cancel?\n\nCancelling a renewing plan stops its next renewal. Your paid access continues through the period you have already paid for. Your three short songs in each frequency stay free afterward.\n\n### Are payments refundable?\n\nThe current seven-day starting offer is your chance to try the full library before the chosen membership charge. The $3 starting payment, where applicable, and subsequent membership payments are non-refundable.\n\n### Where can I get help?\n\nEmail [support@zodiac.fm](mailto:support@zodiac.fm) from the email you used for Zodiac. Tell us what you were trying to do and what happened.\n\n## You have the numbers. The music is next.\n\n[Choose my full-library plan](buy.md)\n\nOr [begin with my free songs](free-listen.md)."},{"category":"Pages","slug":"birth-details","title":"Hear your birth frequencies","label":"Page · Birth details","hasSourceH1":true,"html":"\u003ch1>Hear your birth frequencies\u003c/h1>\n\u003cp>Your birth date, time and place give us the starting point. We use a mantra lineage&#39;s method to find your four frequencies, then match them with your music.\u003c/p>\n\u003ch2>Enter your birth information\u003c/h2>\n\u003cp>Name\u003c/p>\n\u003cp>Enter your full name\u003c/p>\n\u003cp>Email\u003c/p>\n\u003cp>Use the email you&#39;ll use to sign in to Zodiac.\u003c/p>\n\u003cp>Date of birth\u003c/p>\n\u003cp>Month · Day · Year\u003c/p>\n\u003cp>Birth location\u003c/p>\n\u003cp>Enter the city or town where you were born, then choose the matching location.\u003c/p>\n\u003cp>Time of birth\u003c/p>\n\u003cp>Use your local birth time. Check whether it was AM or PM.\u003c/p>\n\u003ch3>Don&#39;t know your birth time?\u003c/h3>\n\u003cp>Use your best estimate. If you know it was morning or evening, start there. Choose noon only if you have no idea. You can ask us for help if you find a more accurate time later.\u003c/p>\n\u003cp>Phone number, optional\u003c/p>\n\u003cp>Enter your phone number\u003c/p>\n\u003cp>\u003ca href=\"#results\">Show me my frequencies\u003c/a>\u003c/p>\n\u003cp>Your next page shows Core, Love, Vitality and Abundance, with the band for each one. You can review your membership options there.\u003c/p>\n\u003ch3>Why do you need these details?\u003c/h3>\n\u003cp>Your date, time and place of birth are the inputs for your frequency calculation. Your email lets you return to your account and music.\u003c/p>\n\u003ch3>Can I correct a mistake?\u003c/h3>\n\u003cp>Yes. If you notice an error in your birth details, contact us for help correcting it. A correction can change your frequencies, though it won&#39;t always do so.\u003c/p>\n","text":"Hear your birth frequencies\n\nYour birth date, time and place give us the starting point. We use a mantra lineage's method to find your four frequencies, then match them with your music.\n\n Enter your birth information\n\nName\n\nEnter your full name\n\nEmail\n\nUse the email you'll use to sign in to Zodiac.\n\nDate of birth\n\nMonth · Day · Year\n\nBirth location\n\nEnter the city or town where you were born, then choose the matching location.\n\nTime of birth\n\nUse your local birth time. Check whether it was AM or PM.\n\n Don't know your birth time?\n\nUse your best estimate. If you know it was morning or evening, start there. Choose noon only if you have no idea. You can ask us for help if you find a more accurate time later.\n\nPhone number, optional\n\nEnter your phone number\n\nShow me my frequencies\n\nYour next page shows Core, Love, Vitality and Abundance, with the band for each one. You can review your membership options there.\n\n Why do you need these details?\n\nYour date, time and place of birth are the inputs for your frequency calculation. Your email lets you return to your account and music.\n\n Can I correct a mistake?\n\nYes. If you notice an error in your birth details, contact us for help correcting it. A correction can change your frequencies, though it won't always do so.","copyText":"# Hear your birth frequencies\n\nYour birth date, time and place give us the starting point. We use a mantra lineage's method to find your four frequencies, then match them with your music.\n\n## Enter your birth information\n\nName\n\nEnter your full name\n\nEmail\n\nUse the email you'll use to sign in to Zodiac.\n\nDate of birth\n\nMonth · Day · Year\n\nBirth location\n\nEnter the city or town where you were born, then choose the matching location.\n\nTime of birth\n\nUse your local birth time. Check whether it was AM or PM.\n\n### Don't know your birth time?\n\nUse your best estimate. If you know it was morning or evening, start there. Choose noon only if you have no idea. You can ask us for help if you find a more accurate time later.\n\nPhone number, optional\n\nEnter your phone number\n\n[Show me my frequencies](results.md)\n\nYour next page shows Core, Love, Vitality and Abundance, with the band for each one. You can review your membership options there.\n\n### Why do you need these details?\n\nYour date, time and place of birth are the inputs for your frequency calculation. Your email lets you return to your account and music.\n\n### Can I correct a mistake?\n\nYes. If you notice an error in your birth details, contact us for help correcting it. A correction can change your frequencies, though it won't always do so."},{"category":"Pages","slug":"buy","title":"Make room for your music","label":"Review template · Purchase page","hasSourceH1":true,"html":"\u003ch1>Make room for your music\u003c/h1>\n\u003cp>Your four birth frequencies are ready. Membership gives you the complete music library, including longer tracks for working, meditating or winding down, with your frequencies playing throughout.\u003c/p>\n\u003cp>Choose annual or monthly. Both give you the same music.\u003c/p>\n\u003ch2>Homepage offer\u003c/h2>\n\u003ch3>Annual\u003c/h3>\n\u003cp>$9.08 a month, billed at $109 a year.\u003c/p>\n\u003cp>Seven days for $3. Then $109 on day eight, renewing annually until you cancel.\u003c/p>\n\u003ch3>Monthly\u003c/h3>\n\u003cp>$17 a month.\u003c/p>\n\u003cp>Seven days for $3. Then $17 on day eight, renewing monthly until you cancel.\u003c/p>\n\u003cp>\u003ca href=\"#after-purchase\">Start my 7 days for $3\u003c/ a desktop or laptop.\u003c/p>\n\u003cp>You can begin with an ordinary part of your day. Put on headphones or use a quality Bluetooth speaker, choose your music and press play.\u003c/p>\n\u003ch3>What if I decide to cancel?\u003c/h3>\n\u003cp>Cancel before your trial ends and there is no membership charge. If you&#39;ve already paid for a membership period, your access continues until that period ends. Your three short songs in each frequency remain free.\u003c/p>\n","text":"Make room for your music\n\nYour four birth frequencies are ready. Membership gives you the complete music library, including longer tracks for working, meditating or winding down, with your frequencies playing throughout.\n\nChoose annual or monthly. Both give you the same music.\n\n Homepage offer\n\n Annual\n\n$9.08 a month, billed at $109 a year.\n\nSeven days for $3. Then $109 on day eight, renewing annually until you cancel.\n\n Monthly\n\n$17 a month.\n\nSeven days for $3. Then $17 on day eight, renewing monthly until you cancel.\n\nStart my 7 days for $3\n\nYour card is charged $3 today. Cancel before your trial ends to avoid the membership charge. The trial payment and subsequent membership charges are non-refundable. Your checkout shows the exact charge date and how to manage your subscription.\n\n Affiliate offer\n\n Annual\n\n$7.33 a month, billed at $88 a year.\n\nSeven days free. Then $88 on day eight, renewing annually until you cancel.\n\nSave $21 a year compared with our current $109 annual price.\n\n Monthly\n\n$14 a month.\n\nSeven days free. Then $14 on day eight, renewing monthly until you cancel.\n\nSave $3 a month compared with our current $17 monthly price.\n\nStart my free week\n\nA card is required. You won't be charged today. Cancel before your free week ends to avoid the membership charge. Charges after the trial are non-refundable. Your checkout shows the exact charge date and how to manage your subscription.\n\n Paid-ad offer\n\n Annual\n\n$7.33 a month, billed at $88 a year.\n\nSeven days for $3. Then $88 on day eight, renewing annually until you cancel.\n\n Monthly\n\n$14 a month.\n\nSeven days for $3. Then $14 on day eight, renewing monthly until you cancel.\n\nStart my 7 days for $3\n\nYour card is charged $3 today. Cancel before your trial ends to avoid the membership charge. The trial payment and subsequent membership charges are non-refundable. Your checkout shows the exact charge date and how to manage your subscription.\n\n What happens next?\n\nSign in to Zodiac with the email you used here. Listen in the iPhone or Android app, or in your browser on a desktop or laptop.\n\nYou can begin with an ordinary part of your day. Put on headphones or use a quality Bluetooth speaker, choose your music and press play.\n\n What if I decide to cancel?\n\nCancel before your trial ends and there is no membership charge. If you've already paid for a membership period, your access continues until that period ends. Your three short songs in each frequency remain free.","copyText":"# Make room for your music\n\nYour four birth frequencies are ready. Membership gives you the complete music library, including longer tracks for working, meditating or winding down, with your frequencies playing throughout.\n\nChoose annual or monthly. Both give you the same music.\n\n## Homepage offer\n\n### Annual\n\n$9.08 a month, billed at $109 a year.\n\nSeven days for $3. Then $109 on day eight, renewing annually until you cancel.\n\n### Monthly\n\n$17 a month.\n\nSeven days for $3. Then $17 on day eight, renewing monthly until you cancel.\n\n[Start my 7 days for $3](after-purchase.md)\n\nYour card is charged $3 today. Cancel before your trial ends to avoid the membership charge. The trial payment and subsequent membership charges are non-refundable. Your checkout shows the exact charge date and how to manage your subscription.\n\n## Affiliate offer\n\n### Annual\n\n$7.33 a month, billed at $88 a year.\n\nSeven days free. Then $88 on day eight, renewing annually until you cancel.\n\nSave $21 a year compared with our current $109 annual price.\n\n### Monthly\n\n$14 a month.\n\nSeven days free. Then $14 on day eight, renewing monthly until you cancel.\n\nSave $3 a month compared with our current $17 monthly price.\n\n[Start my free week](after-purchase.md)\n\nA card is required. You won't be charged today. Cancel before your free week ends to avoid the membership charge. Charges after the trial are non-refundable. Your checkout shows the exact charge date and how to manage your subscription.\n\n## Paid-ad offer\n\n### Annual\n\n$7.33 a month, billed at $88 a year.\n\nSeven days for $3. Then $88 on day eight, renewing annually until you cancel.\n\n### Monthly\n\n$14 a month.\n\nSeven days for $3. Then $14 on day eight, renewing monthly until you cancel.\n\n[Start my 7 days for $3](after-purchase.md)\n\nYour card is charged $3 today. Cancel before your trial ends to avoid the membership charge. The trial payment and subsequent membership charges are non-refundable. Your checkout shows the exact charge date and how to manage your subscription.\n\n## What happens next?\n\nSign in to Zodiac with the email you used here. Listen in the iPhone or Android app, or in your browser on a desktop or laptop.\n\nYou can begin with an ordinary part of your day. Put on headphones or use a quality Bluetooth speaker, choose your music and press play.\n\n### What if I decide to cancel?\n\nCancel before your trial ends and there is no membership charge. If you've already paid for a membership period, your access continues until that period ends. Your three short songs in each frequency remain free."},{"category":"Pages","slug":"after-purchase","title":"Your music is ready","label":"Page · After purchase","hasSourceH1":true,"html":"\u003ch1>Your music is ready\u003c/h1>\n\u003cp>Sign in with the same email you used at checkout. Your membership belongs to that account, wherever you listen.\u003c/p>\n\u003cp>\u003ca href=\"https://apps.apple.com/us/app/zodiacfm/id6764863619\" target=\"_blank\" rel=\"noopener noreferrer\">Get Zodiac for iPhone\u003c/a>\u003c/p>\n\u003cp>\u003ca href=\"https://play.google.com/store/apps/details?id=fm.zodiac.app\" target=\"_blank\" rel=\"noopener noreferrer\">Get Zodiac for Android\u003c/a>\u003c/p>\n\u003cp>\u003ca href=\"https://app.zodiac.fm/\" target=\"_blank\" rel=\"noopener noreferrer\">Listen on your computer\u003c/a>\u003c/p>\n\u003ch2>Start with a song you want to hear\u003c/h2>\n\u003cp>Use headphones, your car speakers or a quality Bluetooth speaker. Choose music that suits what you&#39;re doing and let it play at a comfortable volume.\u003c/p>\n\u003cp>You don&#39;t have to concentrate on a tone or try to make something happen. The music can play while you cook, work or settle in for the evening. Meditation is welcome, if that&#39;s what you want to do. It isn&#39;t required.\u003c/p>\n\u003ch2>Give all four frequencies a place in your week\u003c/h2>\n\u003cp>About nine minutes a day on average, or 63 minutes across a week, is the listening pattern behind our study findings. Each frequency needs at least 15 percent of your weekly listening. The rest is flexible.\u003c/p>\n\u003cp>Missing a day doesn&#39;t erase what came before. Come back when you can, and keep all four in the mix.\u003c/p>\n\u003ch2>Look for the difference in your life\u003c/h2>\n\u003cp>You might enjoy the first listen without noticing anything else. That is a perfectly reasonable place to start.\u003c/p>\n\u003cp>Over time, pay attention to what becomes easier to recognize: what is yours to do, who you let close, what feeds you and when an opportunity fits. You don&#39;t have to grade every song.\u003c/p>\n\u003cp>\u003ca href=\"#how-to-listen\">Read the listening guide\u003c/a>\u003c/p>\n\u003ch3>Already have the app?\u003c/h3>\n\u003cp>Open it and sign in with your checkout email. If your membership doesn&#39;t appear, check that you&#39;re in the same account before buying again. Conta
