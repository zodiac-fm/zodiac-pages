table volume. Let the music accompany something you already enjoy doing, or give it some quiet time if you prefer.\u003c/p>\n\u003cp>Across the week, include Core, Love, Vitality and Abundance. There is no need to produce a particular feeling while a track plays. You have room to explore the music and notice what it means in your own life.\u003c/p>\n\u003cp>\u003ca href=\"#how-to-listen\">Read the listening guide\u003c/a>\u003c/p>\n\u003cp>Your receipt comes from {{billing_provider_name}}. You can review your subscription through your membership settings — Review placeholder: \u003ccode>{{manage_membership_url}}\u003c/code>.\u003c/p>\n\u003cp>If you need help getting started, reply to us here.\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n","text":"Subject: Your Zodiac membership is ready\n\nPreheader: Start listening with your full music library.\n\nHi {{givenname}},\n\nWelcome to Zodiac, and thank you for becoming a member. Your full music library is available in all four of your personal frequencies.\n\nOpen the app with your account email, {{accountemail}}, and choose a track you want to hear. You can also listen on a desktop or laptop at app.zodiac.fm.\n\nUse good headphones or a suitable speaker at a comfortable volume. Let the music accompany something you already enjoy doing, or give it some quiet time if you prefer.\n\nAcross the week, include Core, Love, Vitality and Abundance. There is no need to produce a particular feeling while a track plays. You have room to explore the music and notice what it means in your own life.\n\nRead the listening guide\n\nYour receipt comes from {{billingprovidername}}. You can review your subscription through your membership settings — Review placeholder: {{managemembershipurl}}.\n\nIf you need help getting started, reply to us here.\n\nTeam Zodiac","copyText":"**Subject:** Your Zodiac membership is ready\n\n**Preheader:** Start listening with your full music library.\n\nHi {{given_name}},\n\nWelcome to Zodiac, and thank you for becoming a member. Your full music library is available in all four of your personal frequencies.\n\nOpen the app with your account email, {{account_email}}, and choose a track you want to hear. You can also listen on a desktop or laptop at [app.zodiac.fm](https://app.zodiac.fm).\n\nUse good headphones or a suitable speaker at a comfortable volume. Let the music accompany something you already enjoy doing, or give it some quiet time if you prefer.\n\nAcross the week, include Core, Love, Vitality and Abundance. There is no need to produce a particular feeling while a track plays. You have room to explore the music and notice what it means in your own life.\n\n[Read the listening guide]({{article_01_listening}})\n\nYour receipt comes from {{billing_provider_name}}. You can review your subscription through [your membership settings]({{manage_membership_url}}).\n\nIf you need help getting started, reply to us here.\n\nTeam Zodiac"},{"category":"Emails","slug":"family-f10","title":"F10 · Existing paid customer app announcement","label":"Review email · F10","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Your Zodiac membership is ready in the apps\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Get Zodiac for iPhone or Android and sign in with your existing email.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>Zodiac is now available as an app for iPhone and Android.\u003c/p>\n\u003cp>Your current membership comes with you. Download the app for your phone and sign in with the email you already use for Zodiac:\u003c/p>\n\u003cp>{{account_email}}\u003c/p>\n\u003cp>\u003ca href=\"https://apps.apple.com/us/app/zodiacfm/id6764863619\" target=\"_blank\" rel=\"noopener noreferrer\">Download Zodiac for iPhone\u003c/a>\u003c/p>\n\u003cp>\u003ca href=\"https://play.google.com/store/apps/details?id=fm.zodiac.app\" target=\"_blank\" rel=\"noopener noreferrer\">Get Zodiac for Android\u003c/a>\u003c/p>\n\u003cp>The apps bring improvements to the music, playlists and downloads, along with more functionality than the old installed web app. You do not need to buy another subscription to use them.\u003c/p>\n\u003cp>If you cannot remember your password, use the email-code login option. A code will be sent to your account email.\u003c/p>\n\u003cp>Prefer listening at your desk? Desktop and laptop browser listening continues at \u003ca href=\"https://app.zodiac.fm\" target=\"_blank\" rel=\"noopener noreferrer\">app.zodiac.fm\u003c/a>.\u003c/p>\n\u003cp>Reply if you have trouble getting into your account and we will help you find what is getting in the way.\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n","text":"Subject: Your Zodiac membership is ready in the apps\n\nPreheader: Get Zodiac for iPhone or Android and sign in with your existing email.\n\nHi {{givenname}},\n\nZodiac is now available as an app for iPhone and Android.\n\nYour current membership comes with you. Download the app for your phone and sign in with the email you already use for Zodiac:\n\n{{accountemail}}\n\nDownload Zodiac for iPhone\n\nGet Zodiac for Android\n\nThe apps bring improvements to the music, playlists and downloads, along with more functionality than the old installed web app. You do not need to buy another subscription to use them.\n\nIf you cannot remember your password, use the email-code login option. A code will be sent to your account email.\n\nPrefer listening at your desk? Desktop and laptop browser listening continues at app.zodiac.fm.\n\nReply if you have trouble getting into your account and we will help you find what is getting in the way.\n\nTeam Zodiac","copyText":"**Subject:** Your Zodiac membership is ready in the apps\n\n**Preheader:** Get Zodiac for iPhone or Android and sign in with your existing email.\n\nHi {{given_name}},\n\nZodiac is now available as an app for iPhone and Android.\n\nYour current membership comes with you. Download the app for your phone and sign in with the email you already use for Zodiac:\n\n{{account_email}}\n\n[Download Zodiac for iPhone](https://apps.apple.com/us/app/zodiacfm/id6764863619)\n\n[Get Zodiac for Android](https://play.google.com/store/apps/details?id=fm.zodiac.app)\n\nThe apps bring improvements to the music, playlists and downloads, along with more functionality than the old installed web app. You do not need to buy another subscription to use them.\n\nIf you cannot remember your password, use the email-code login option. A code will be sent to your account email.\n\nPrefer listening at your desk? Desktop and laptop browser listening continues at [app.zodiac.fm](https://app.zodiac.fm).\n\nReply if you have trouble getting into your account and we will help you find what is getting in the way.\n\nTeam Zodiac"},{"category":"Emails","slug":"family-f11","title":"F11 · Top-fifty follow-up","label":"Review email · F11","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> A quick note about your Zodiac app login\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Use the same email as your current membership.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>A quick follow-up to the app announcement we sent you: your existing Zodiac membership works in the iPhone and Android apps.\u003c/p>\n\u003cp>Use {{account_email}} to sign in. That is the email on your current membership, so there is no need to create a second account or buy another subscription.\u003c/p>\n\u003cp>\u003ca href=\"https://apps.apple.com/us/app/zodiacfm/id6764863619\" target=\"_blank\" rel=\"noopener noreferrer\">Zodiac for iPhone\u003c/a>\u003c/p>\n\u003cp>\u003ca href=\"https://play.google.com/store/apps/details?id=fm.zodiac.app\" target=\"_blank\" rel=\"noopener noreferrer\">Zodiac for Android\u003c/a>\u003c/p>\n\u003cp>If you need to, choose the email-code login option to have a code sent to that inbox.\u003c/p>\n\u003cp>Desktop and laptop listening is still available too. The apps give you another way to take the music with you.\u003c/p>\n\u003cp>If you have already tried one, reply and tell us how it is working for you.\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n","text":"Subject: A quick note about your Zodiac app login\n\nPreheader: Use the same email as your current membership.\n\nHi {{givenname}},\n\nA quick follow-up to the app announcement we sent you: your existing Zodiac membership works in the iPhone and Android apps.\n\nUse {{accountemail}} to sign in. That is the email on your current membership, so there is no need to create a second account or buy another subscription.\n\nZodiac for iPhone\n\nZodiac for Android\n\nIf you need to, choose the email-code login option to have a code sent to that inbox.\n\nDesktop and laptop listening is still available too. The apps give you another way to take the music with you.\n\nIf you have already tried one, reply and tell us how it is working for you.\n\nTeam Zodiac","copyText":"**Subject:** A quick note about your Zodiac app login\n\n**Preheader:** Use the same email as your current membership.\n\nHi {{given_name}},\n\nA quick follow-up to the app announcement we sent you: your existing Zodiac membership works in the iPhone and Android apps.\n\nUse {{account_email}} to sign in. That is the email on your current membership, so there is no need to create a second account or buy another subscription.\n\n[Zodiac for iPhone](https://apps.apple.com/us/app/zodiacfm/id6764863619)\n\n[Zodiac for Android](https://play.google.com/store/apps/details?id=fm.zodiac.app)\n\nIf you need to, choose the email-code login option to have a code sent to that inbox.\n\nDesktop and laptop listening is still available too. The apps give you another way to take the music with you.\n\nIf you have already tried one, reply and tell us how it is working for you.\n\nTeam Zodiac"},{"category":"Emails","slug":"family-f12","title":"F12 · Existing prospect app announcement","label":"Review email · F12","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Your free Zodiac music is now in the apps\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Listen on iPhone or Android with the account you already have.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>If you made a Zodiac account but have not been back for a while, there is a new way to listen.\u003c/p>\n\u003cp>Zodiac is now available for iPhone and Android. Your account includes three short songs in each of your four frequencies, free, with no expiry date.\u003c/p>\n\u003cp>\u003ca href=\"https://apps.apple.com/us/app/zodiacfm/id6764863619\" target=\"_blank\" rel=\"noopener noreferrer\">Download Zodiac for iPhone\u003c/a>\u003c/p>\n\u003cp>\u003ca href=\"https://play.google.com/store/apps/details?id=fm.zodiac.app\" target=\"_blank\" rel=\"noopener noreferrer\">Get Zodiac for Android\u003c/a>\u003c/p>\n\u003cp>Sign in with {{account_email}}. If you do not remember your password, use the email-code option to have a code sent to your inbox.\u003c/p>\n\u003cp>Choose a song you like and give it a listen. You can return to the music without deciding about a paid membership first.\u003c/p>\n\u003cp>Desktop and laptop listening remains available at \u003ca href=\"https://app.zodiac.fm\" target=\"_blank\" rel=\"noopener noreferrer\">app.zodiac.fm\u003c/a>.\u003c/p>\n\u003cp>Reply if you need help finding your account.\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n","text":"Subject: Your free Zodiac music is now in the apps\n\nPreheader: Listen on iPhone or Android with the account you already have.\n\nHi {{givenname}},\n\nIf you made a Zodiac account but have not been back for a while, there is a new way to listen.\n\nZodiac is now available for iPhone and Android. Your account includes three short songs in each of your four frequencies, free, with no expiry date.\n\nDownload Zodiac for iPhone\n\nGet Zodiac for Android\n\nSign in with {{accountemail}}. If you do not remember your password, use the email-code option to have a code sent to your inbox.\n\nChoose a song you like and give it a listen. You can return to the music without deciding about a paid membership first.\n\nDesktop and laptop listening remains available at app.zodiac.fm.\n\nReply if you need help finding your account.\n\nTeam Zodiac","copyText":"**Subject:** Your free Zodiac music is now in the apps\n\n**Preheader:** Listen on iPhone or Android with the account you already have.\n\nHi {{given_name}},\n\nIf you made a Zodiac account but have not been back for a while, there is a new way to listen.\n\nZodiac is now available for iPhone and Android. Your account includes three short songs in each of your four frequencies, free, with no expiry date.\n\n[Download Zodiac for iPhone](https://apps.apple.com/us/app/zodiacfm/id6764863619)\n\n[Get Zodiac for Android](https://play.google.com/store/apps/details?id=fm.zodiac.app)\n\nSign in with {{account_email}}. If you do not remember your password, use the email-code option to have a code sent to your inbox.\n\nChoose a song you like and give it a listen. You can return to the music without deciding about a paid membership first.\n\nDesktop and laptop listening remains available at [app.zodiac.fm](https://app.zodiac.fm).\n\nReply if you need help finding your account.\n\nTeam Zodiac"},{"category":"Emails","slug":"family-f13","title":"F13 · Astrology and Human Design recognition","label":"Review email · F13","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Let your reading meet the life you’re living\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> A way to explore recognition through sound.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>A reading can give you language for something you recognize in yourself. The interesting part is what you do with that recognition when life asks for a decision.\u003c/p>\n\u003cp>Zodiac offers a way to explore it through sound. A method from a mantra lineage within the Vedic tradition uses birth details to find four personal frequencies. We bring those frequencies into music to amplify your connection to the connected self.\u003c/p>\n\u003cp>Your astrologer or Human Design teacher may have given you useful ways to understand your pattern. You can keep that work and listen alongside it.\u003c/p>\n\u003cp>If your Human Design practice asks you to wait for clarity, listening does not turn every impulse into an instruction. Give your own process its time.\u003c/p>\n\u003cp>Your three short songs in each frequency are available for free. Explore the music and notice what becomes useful beyond a description on a page.\u003c/p>\n\u003cp>\u003ca href=\"#readings-and-birth-sound\">Read about Zodiac and readings\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n","text":"Subject: Let your reading meet the life you’re living\n\nPreheader: A way to explore recognition through sound.\n\nHi {{givenname}},\n\nA reading can give you language for something you recognize in yourself. The interesting part is what you do with that recognition when life asks for a decision.\n\nZodiac offers a way to explore it through sound. A method from a mantra lineage within the Vedic tradition uses birth details to find four personal frequencies. We bring those frequencies into music to amplify your connection to the connected self.\n\nYour astrologer or Human Design teacher may have given you useful ways to understand your pattern. You can keep that work and listen alongside it.\n\nIf your Human Design practice asks you to wait for clarity, listening does not turn every impulse into an instruction. Give your own process its time.\n\nYour three short songs in each frequency are available for free. Explore the music and notice what becomes useful beyond a description on a page.\n\nRead about Zodiac and readings\n\nTeam Zodiac","copyText":"**Subject:** Let your reading meet the life you’re living\n\n**Preheader:** A way to explore recognition through sound.\n\nHi {{given_name}},\n\nA reading can give you language for something you recognize in yourself. The interesting part is what you do with that recognition when life asks for a decision.\n\nZodiac offers a way to explore it through sound. A method from a mantra lineage within the Vedic tradition uses birth details to find four personal frequencies. We bring those frequencies into music to amplify your connection to the connected self.\n\nYour astrologer or Human Design teacher may have given you useful ways to understand your pattern. You can keep that work and listen alongside it.\n\nIf your Human Design practice asks you to wait for clarity, listening does not turn every impulse into an instruction. Give your own process its time.\n\nYour three short songs in each frequency are available for free. Explore the music and notice what becomes useful beyond a description on a page.\n\n[Read about Zodiac and readings]({{article_09_readings}})\n\nTeam Zodiac"},{"category":"Emails","slug":"family-f14","title":"F14 · Manifestation","label":"Review email · F14","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Is the thing you want actually yours to pursue?\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> A question worth bringing into your manifestation practice.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>You can be clear about the picture you want to create and still wonder whether it fits the person you are.\u003c/p>\n\u003cp>That is a useful question to bring into a manifestation practice. Where did this desire come from? Does pursuing it make room for the life you want to live?\u003c/p>\n\u003cp>Zodiac explores what we call the connected self, the part of you beneath what you have learned to perform. The music is intended to amplify your signal, your connection to it.\u003c/p>\n\u003cp>The four frequencies come from your birth details through a method rooted in a Vedic mantra lineage. They remain fixed. They do not change to match the particular outcome you are trying to attract.\u003c/p>\n\u003cp>Listen alongside the practices you value. See whether it helps you recognize what is worth your attention, then bring your judgment and action to it.\u003c/p>\n\u003cp>Your free songs are there to explore. We are not promising that listening delivers a particular person, opportunity or amount of money.\u003c/p>\n\u003cp>\u003ca href=\"#manifestation-and-your-own-signal\">Read about manifestation and Zodiac\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n","text":"Subject: Is the thing you want actually yours to pursue?\n\nPreheader: A question worth bringing into your manifestation practice.\n\nHi {{givenname}},\n\nYou can be clear about the picture you want to create and still wonder whether it fits the person you are.\n\nThat is a useful question to bring into a manifestation practice. Where did this desire come from? Does pursuing it make room for the life you want to live?\n\nZodiac explores what we call the connected self, the part of you beneath what you have learned to perform. The music is intended to amplify your signal, your connection to it.\n\nThe four frequencies come from your birth details through a method rooted in a Vedic mantra lineage. They remain fixed. They do not change to match the particular outcome you are trying to attract.\n\nListen alongside the practices you value. See whether it helps you recognize what is worth your attention, then bring your judgment and action to it.\n\nYour free songs are there to explore. We are not promising that listening delivers a particular person, opportunity or amount of money.\n\nRead about manifestation and Zodiac\n\nTeam Zodiac","copyText":"**Subject:** Is the thing you want actually yours to pursue?\n\n**Preheader:** A question worth bringing into your manifestation practice.\n\nHi {{given_name}},\n\nYou can be clear about the picture you want to create and still wonder whether it fits the person you are.\n\nThat is a useful question to bring into a manifestation practice. Where did this desire come from? Does pursuing it make room for the life you want to live?\n\nZodiac explores what we call the connected self, the part of you beneath what you have learned to perform. The music is intended to amplify your signal, your connection to it.\n\nThe four frequencies come from your birth details through a method rooted in a Vedic mantra lineage. They remain fixed. They do not change to match the particular outcome you are trying to attract.\n\nListen alongside the practices you value. See whether it helps you recognize what is worth your attention, then bring your judgment and action to it.\n\nYour free songs are there to explore. We are not promising that listening delivers a particular person, opportunity or amount of money.\n\n[Read about manifestation and Zodiac]({{article_10_manifestation}})\n\nTeam Zodiac"},{"category":"Emails","slug":"family-f15","title":"F15 · A life already worth living","label":"Review email · F15","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Bring this into the life you already value\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Explore Zodiac without needing to start your life over.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>You can like your life and still want a deeper connection with the person living it.\u003c/p>\n\u003cp>Think of the work you care about and the people you love. A spiritual practice can belong inside that life, in how you show up for what already matters.\u003c/p>\n\u003cp>That is one way to explore Zodiac. Put the music into a part of your day you enjoy, then pay attention to how you meet the rest of it.\u003c/p>\n\u003cp>The premise begins with the Vedic view of Nāda Brahma: reality is sound. A mantra lineage supplied the method for finding your personal frequencies from the time, date and place of your birth. Zodiac carries those four frequencies through music to amplify your signal, your connection to the connected self.\u003c/p>\n\u003cp>The question is what that connection makes available to you in your own circumstances. It might concern a choice at work or how fully you can listen to someone at home. You get to decide what matters.\u003c/p>\n\u003cp>Your free songs let you begin without turning this into a new commitment.\u003c/p>\n\u003cp>\u003ca href=\"#connected-self\">Read about the connected self\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n","text":"Subject: Bring this into the life you already value\n\nPreheader: Explore Zodiac without needing to start your life over.\n\nHi {{givenname}},\n\nYou can like your life and still want a deeper connection with the person living it.\n\nThink of the work you care about and the people you love. A spiritual practice can belong inside that life, in how you show up for what already matters.\n\nThat is one way to explore Zodiac. Put the music into a part of your day you enjoy, then pay attention to how you meet the rest of it.\n\nThe premise begins with the Vedic view of Nāda Brahma: reality is sound. A mantra lineage supplied the method for finding your personal frequencies from the time, date and place of your birth. Zodiac carries those four frequencies through music to amplify your signal, your connection to the connected self.\n\nThe question is what that connection makes available to you in your own circumstances. It might concern a choice at work or how fully you can listen to someone at home. You get to decide what matters.\n\nYour free songs let you begin without turning this into a new commitment.\n\nRead about the connected self\n\nTeam Zodiac","copyText":"**Subject:** Bring this into the life you already value\n\n**Preheader:** Explore Zodiac without needing to start your life over.\n\nHi {{given_name}},\n\nYou can like your life and still want a deeper connection with the person living it.\n\nThink of the work you care about and the people you love. A spiritual practice can belong inside that life, in how you show up for what already matters.\n\nThat is one way to explore Zodiac. Put the music into a part of your day you enjoy, then pay attention to how you meet the rest of it.\n\nThe premise begins with the Vedic view of Nāda Brahma: reality is sound. A mantra lineage supplied the method for finding your personal frequencies from the time, date and place of your birth. Zodiac carries those four frequencies through music to amplify your signal, your connection to the connected self.\n\nThe question is what that connection makes available to you in your own circumstances. It might concern a choice at work or how fully you can listen to someone at home. You get to decide what matters.\n\nYour free songs let you begin without turning this into a new commitment.\n\n[Read about the connected self]({{article_03_connected_self}})\n\nTeam Zodiac"},{"category":"Emails","slug":"family-f16","title":"F16 · Prospect follow-up: what to notice","label":"Review email · F16","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Notice the conversation after the music\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> What you notice in everyday life matters too.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>Think of a conversation where you said what you meant without rehearsing it first, or a choice you recognized as yours before finding the words to explain it.\u003c/p>\n\u003cp>Those are places to notice your experience with Zodiac, beyond how you feel while a song plays.\u003c/p>\n\u003cp>Our premise is that listening amplifies your signal, your connection to the connected self. With repeated listening, that reference can become easier to recognize. You still decide what to do with what you notice in your own life.\u003c/p>\n\u003cp>Katie Wells, founder of Wellness Mama, described her experience this way:\u003c/p>\n\u003cp>“Listening to my frequency immersion feels like coming home to myself.”\u003c/p>\n\u003cp>Your experience may be different. There is no particular sensation to produce or deadline for a change. You may simply enjoy the music at first.\u003c/p>\n\u003cp>Your three short songs in each frequency remain free. Include all four as you return to listen, and notice what is actually there without trying to make a better story of it.\u003c/p>\n\u003cp>Return to my music — Review placeholder: \u003ccode>{{personal_results_url}}\u003c/code>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>P.S. To try the full library, your account’s offer is $3 for seven days, then $7.33 a month billed at $88 a year, or $14 a month. Before the trial ends, we will email you the charge details and cancellation link. Cancel before the subscription starts to avoid that charge. Payments are nonrefundable.\u003c/p>\n\u003cp>\u003ca href=\"#what-to-expect\">Read what to expect as you listen\u003c/a>\u003c/p>\n","text":"Subject: Notice the conversation after the music\n\nPreheader: What you notice in everyday life matters too.\n\nHi {{givenname}},\n\nThink of a conversation where you said what you meant without rehearsing it first, or a choice you recognized as yours before finding the words to explain it.\n\nThose are places to notice your experience with Zodiac, beyond how you feel while a song plays.\n\nOur premise is that listening amplifies your signal, your connection to the connected self. With repeated listening, that reference can become easier to recognize. You still decide what to do with what you notice in your own life.\n\nKatie Wells, founder of Wellness Mama, described her experience this way:\n\n“Listening to my frequency immersion feels like coming home to myself.”\n\nYour experience may be different. There is no particular sensation to produce or deadline for a change. You may simply enjoy the music at first.\n\nYour three short songs in each frequency remain free. Include all four as you return to listen, and notice what is actually there without trying to make a better story of it.\n\nReturn to my music — Review placeholder: {{personalresultsurl}}\n\nTeam Zodiac\n\nP.S. To try the full library, your account’s offer is $3 for seven days, then $7.33 a month billed at $88 a year, or $14 a month. Before the trial ends, we will email you the charge details and cancellation link. Cancel before the subscription starts to avoid that charge. Payments are nonrefundable.\n\nRead what to expect as you listen","copyText":"**Subject:** Notice the conversation after the music\n\n**Preheader:** What you notice in everyday life matters too.\n\nHi {{given_name}},\n\nThink of a conversation where you said what you meant without rehearsing it first, or a choice you recognized as yours before finding the words to explain it.\n\nThose are places to notice your experience with Zodiac, beyond how you feel while a song plays.\n\nOur premise is that listening amplifies your signal, your connection to the connected self. With repeated listening, that reference can become easier to recognize. You still decide what to do with what you notice in your own life.\n\nKatie Wells, founder of Wellness Mama, described her experience this way:\n\n“Listening to my frequency immersion feels like coming home to myself.”\n\nYour experience may be different. There is no particular sensation to produce or deadline for a change. You may simply enjoy the music at first.\n\nYour three short songs in each frequency remain free. Include all four as you return to listen, and notice what is actually there without trying to make a better story of it.\n\n[Return to my music]({{personal_results_url}})\n\nTeam Zodiac\n\nP.S. To try the full library, your account’s offer is $3 for seven days, then $7.33 a month billed at $88 a year, or $14 a month. Before the trial ends, we will email you the charge details and cancellation link. Cancel before the subscription starts to avoid that charge. Payments are nonrefundable.\n\n[Read what to expect as you listen]({{article_06_expectations}})"},{"category":"Emails","slug":"family-f17","title":"F17 · Prospect follow-up: longer music","label":"Review email · F17","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Longer Zodiac tracks, seven days for $3\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Let the music keep playing while you get on with your day.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>Sometimes a short song fits the time you have. Other times you are settling into work, reading or meditation and would like the music to keep playing.\u003c/p>\n\u003cp>Membership adds the longer Zodiac tracks in all four of your frequencies. There are nine-minute immersions, longer meditations and an hour-long track. Your frequency plays throughout, so you can stay with what you are doing instead of choosing another song every few minutes.\u003c/p>\n\u003cp>You can try the full library for $3 for seven days. Choose what follows:\u003c/p>\n\u003cul>\n\u003cli>$7.33 a month, billed at $88 a year.\u003c/li>\n\u003cli>$14 a month, billed monthly.\u003c/li>\n\u003c/ul>\n\u003cp>Your selected subscription starts billing after the trial unless you cancel. Check the details before confirming: checkout shows the actual charge date and amount for your selected plan. To avoid that charge, cancel beforehand through your membership settings.\u003c/p>\n\u003cp>Before the trial ends, we will email you the charge details and cancellation link. Payments are nonrefundable, including the $3 trial fee.\u003c/p>\n\u003cp>Start my seven days for $3 — Review placeholder: \u003ccode>{{eligible_email_offer_url}}\u003c/code>\u003c/p>\n\u003cp>Longer music gives you more room to listen. It does not change your four birth frequencies or promise a particular result.\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>P.S. Your three short songs in each frequency stay free whether or not you continue with membership.\u003c/p>\n\u003cp>\u003ca href=\"#music-and-longer-tracks\">Read about the music and longer tracks\u003c/a>\u003c/p>\n","text":"Subject: Longer Zodiac tracks, seven days for $3\n\nPreheader: Let the music keep playing while you get on with your day.\n\nHi {{givenname}},\n\nSometimes a short song fits the time you have. Other times you are settling into work, reading or meditation and would like the music to keep playing.\n\nMembership adds the longer Zodiac tracks in all four of your frequencies. There are nine-minute immersions, longer meditations and an hour-long track. Your frequency plays throughout, so you can stay with what you are doing instead of choosing another song every few minutes.\n\nYou can try the full library for $3 for seven days. Choose what follows:\n\n- $7.33 a month, billed at $88 a year.\n- $14 a month, billed monthly.\n\nYour selected subscription starts billing after the trial unless you cancel. Check the details before confirming: checkout shows the actual charge date and amount for your selected plan. To avoid that charge, cancel beforehand through your membership settings.\n\nBefore the trial ends, we will email you the charge details and cancellation link. Payments are nonrefundable, including the $3 trial fee.\n\nStart my seven days for $3 — Review placeholder: {{eligibleemailofferurl}}\n\nLonger music gives you more room to listen. It does not change your four birth frequencies or promise a particular result.\n\nTeam Zodiac\n\nP.S. Your three short songs in each frequency stay free whether or not you continue with membership.\n\nRead about the music and longer tracks","copyText":"**Subject:** Longer Zodiac tracks, seven days for $3\n\n**Preheader:** Let the music keep playing while you get on with your day.\n\nHi {{given_name}},\n\nSometimes a short song fits the time you have. Other times you are settling into work, reading or meditation and would like the music to keep playing.\n\nMembership adds the longer Zodiac tracks in all four of your frequencies. There are nine-minute immersions, longer meditations and an hour-long track. Your frequency plays throughout, so you can stay with what you are doing instead of choosing another song every few minutes.\n\nYou can try the full library for $3 for seven days. Choose what follows:\n\n- $7.33 a month, billed at $88 a year.\n- $14 a month, billed monthly.\n\nYour selected subscription starts billing after the trial unless you cancel. Check the details before confirming: checkout shows the actual charge date and amount for your selected plan. To avoid that charge, cancel beforehand through your membership settings.\n\nBefore the trial ends, we will email you the charge details and cancellation link. Payments are nonrefundable, including the $3 trial fee.\n\n[Start my seven days for $3]({{eligible_email_offer_url}})\n\nLonger music gives you more room to listen. It does not change your four birth frequencies or promise a particular result.\n\nTeam Zodiac\n\nP.S. Your three short songs in each frequency stay free whether or not you continue with membership.\n\n[Read about the music and longer tracks]({{article_07_music}})"},{"category":"Emails","slug":"family-f18","title":"F18 · Prospect results with personal frequencies","label":"Review email · F18","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Your four Zodiac frequencies, as promised\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Your personal results, with free music ready to hear.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>Here are your four Zodiac frequencies, as promised:\u003c/p>\n\u003cp>Core: {{core_hz}} Hz · {{core_band_name}}\nWho you are and what is yours to do.\u003c/p>\n\u003cp>Love: {{love_hz}} Hz · {{love_band_name}}\nWho to let close and how to connect.\u003c/p>\n\u003cp>Vitality: {{vitality_hz}} Hz · {{vitality_band_name}}\nWhat feeds you and what drains you.\u003c/p>\n\u003cp>Abundance: {{abundance_hz}} Hz · {{abundance_band_name}}\nWhen to move and which opportunities are yours.\u003c/p>\n\u003cp>Hear my frequencies — Review placeholder: \u003ccode>{{personal_listening_url}}\u003c/code>\u003c/p>\n\u003cp>Three short songs in each frequency are yours to keep listening to for free.\u003c/p>\n\u003cp>Your numbers come from your birth date, time and place, using the frequency part of a method from a Vedic mantra lineage. They stay fixed as your life changes. The bands describe how you naturally get clear in each part of life.\u003c/p>\n\u003cp>Choose a song you like and use headphones, car speakers or a suitable speaker at a comfortable volume. You can listen while you get on with your day.\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>P.S. Your account’s offer is $3 for seven days of the full library, then $7.33 a month billed at $88 a year, or $14 a month. Before the trial ends, we will email you the charge details and cancellation link. Cancel before the subscription starts to avoid that charge. Payments are nonrefundable.\u003c/p>\n\u003cp>\u003ca href=\"#four-frequencies\">Read about your signal and four frequencies\u003c/a>\u003c/p>\n","text":"Subject: Your four Zodiac frequencies, as promised\n\nPreheader: Your personal results, with free music ready to hear.\n\nHi {{givenname}},\n\nHere are your four Zodiac frequencies, as promised:\n\nCore: {{corehz}} Hz · {{corebandname}}\nWho you are and what is yours to do.\n\nLove: {{lovehz}} Hz · {{lovebandname}}\nWho to let close and how to connect.\n\nVitality: {{vitalityhz}} Hz · {{vitalitybandname}}\nWhat feeds you and what drains you.\n\nAbundance: {{abundancehz}} Hz · {{abundancebandname}}\nWhen to move and which opportunities are yours.\n\nHear my frequencies — Review placeholder: {{personallisteningurl}}\n\nThree short songs in each frequency are yours to keep listening to for free.\n\nYour numbers come from your birth date, time and place, using the frequency part of a method from a Vedic mantra lineage. They stay fixed as your life changes. The bands describe how you naturally get clear in each part of life.\n\nChoose a song you like and use headphones, car speakers or a suitable speaker at a comfortable volume. You can listen while you get on with your day.\n\nTeam Zodiac\n\nP.S. Your account’s offer is $3 for seven days of the full library, then $7.33 a month billed at $88 a year, or $14 a month. Before the trial ends, we will email you the charge details and cancellation link. Cancel before the subscription starts to avoid that charge. Payments are nonrefundable.\n\nRead about your signal and four frequencies","copyText":"**Subject:** Your four Zodiac frequencies, as promised\n\n**Preheader:** Your personal results, with free music ready to hear.\n\nHi {{given_name}},\n\nHere are your four Zodiac frequencies, as promised:\n\nCore: {{core_hz}} Hz · {{core_band_name}}\nWho you are and what is yours to do.\n\nLove: {{love_hz}} Hz · {{love_band_name}}\nWho to let close and how to connect.\n\nVitality: {{vitality_hz}} Hz · {{vitality_band_name}}\nWhat feeds you and what drains you.\n\nAbundance: {{abundance_hz}} Hz · {{abundance_band_name}}\nWhen to move and which opportunities are yours.\n\n[Hear my frequencies]({{personal_listening_url}})\n\nThree short songs in each frequency are yours to keep listening to for free.\n\nYour numbers come from your birth date, time and place, using the frequency part of a method from a Vedic mantra lineage. They stay fixed as your life changes. The bands describe how you naturally get clear in each part of life.\n\nChoose a song you like and use headphones, car speakers or a suitable speaker at a comfortable volume. You can listen while you get on with your day.\n\nTeam Zodiac\n\nP.S. Your account’s offer is $3 for seven days of the full library, then $7.33 a month billed at $88 a year, or $14 a month. Before the trial ends, we will email you the charge details and cancellation link. Cancel before the subscription starts to avoid that charge. Payments are nonrefundable.\n\n[Read about your signal and four frequencies]({{article_04_four_frequencies}})"},{"category":"Emails","slug":"family-f19","title":"F19 · Prospect listening guide","label":"Review email · F19","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Your music can fit into the day you already have\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Choose a song, press play and let it accompany what you are doing.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>You might have a walk planned, dinner to make or a little work you want to settle into. Any of those can be a place for your Zodiac music.\u003c/p>\n\u003cp>Choose a song you want to hear and press play. Use headphones, car speakers or a suitable speaker at a comfortable volume. Phone and laptop speakers do not do the recording justice.\u003c/p>\n\u003cp>Across the week, include all four frequencies. The listening condition in our internal product study was at least nine minutes a day on average, with at least fifteen percent of listening in each frequency. You do not need equal minutes or a perfect daily streak.\u003c/p>\n\u003cp>You can meditate with the music, or bring it alongside another practice you value. It also works as music you listen to while doing something ordinary.\u003c/p>\n\u003cp>There is no particular sensation you need to produce. Notice your life beyond the song too, without deciding in advance what your experience should be.\u003c/p>\n\u003cp>Kevin Knabe described his experience this way:\u003c/p>\n\u003cp>“From the onset the frequencies resonated with me and I felt more grounded”\u003c/p>\n\u003cp>That is Kevin’s account, with room for yours to be different.\u003c/p>\n\u003cp>Listen now — Review placeholder: \u003ccode>{{personal_listening_url}}\u003c/code>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>P.S. Your account’s offer is $3 for seven days of the full library, then $7.33 a month billed at $88 a year, or $14 a month. Before the trial ends, we will email you the charge details and cancellation link. Cancel before the subscription starts to avoid that charge. Payments are nonrefundable.\u003c/p>\n\u003cp>\u003ca href=\"#how-to-listen\">Read the listening guide\u003c/a>\u003c/p>\n","text":"Subject: Your music can fit into the day you already have\n\nPreheader: Choose a song, press play and let it accompany what you are doing.\n\nHi {{givenname}},\n\nYou might have a walk planned, dinner to make or a little work you want to settle into. Any of those can be a place for your Zodiac music.\n\nChoose a song you want to hear and press play. Use headphones, car speakers or a suitable speaker at a comfortable volume. Phone and laptop speakers do not do the recording justice.\n\nAcross the week, include all four frequencies. The listening condition in our internal product study was at least nine minutes a day on average, with at least fifteen percent of listening in each frequency. You do not need equal minutes or a perfect daily streak.\n\nYou can meditate with the music, or bring it alongside another practice you value. It also works as music you listen to while doing something ordinary.\n\nThere is no particular sensation you need to produce. Notice your life beyond the song too, without deciding in advance what your experience should be.\n\nKevin Knabe described his experience this way:\n\n“From the onset the frequencies resonated with me and I felt more grounded”\n\nThat is Kevin’s account, with room for yours to be different.\n\nListen now — Review placeholder: {{personallisteningurl}}\n\nTeam Zodiac\n\nP.S. Your account’s offer is $3 for seven days of the full library, then $7.33 a month billed at $88 a year, or $14 a month. Before the trial ends, we will email you the charge details and cancellation link. Cancel before the subscription starts to avoid that charge. Payments are nonrefundable.\n\nRead the listening guide","copyText":"**Subject:** Your music can fit into the day you already have\n\n**Preheader:** Choose a song, press play and let it accompany what you are doing.\n\nHi {{given_name}},\n\nYou might have a walk planned, dinner to make or a little work you want to settle into. Any of those can be a place for your Zodiac music.\n\nChoose a song you want to hear and press play. Use headphones, car speakers or a suitable speaker at a comfortable volume. Phone and laptop speakers do not do the recording justice.\n\nAcross the week, include all four frequencies. The listening condition in our internal product study was at least nine minutes a day on average, with at least fifteen percent of listening in each frequency. You do not need equal minutes or a perfect daily streak.\n\nYou can meditate with the music, or bring it alongside another practice you value. It also works as music you listen to while doing something ordinary.\n\nThere is no particular sensation you need to produce. Notice your life beyond the song too, without deciding in advance what your experience should be.\n\nKevin Knabe described his experience this way:\n\n“From the onset the frequencies resonated with me and I felt more grounded”\n\nThat is Kevin’s account, with room for yours to be different.\n\n[Listen now]({{personal_listening_url}})\n\nTeam Zodiac\n\nP.S. Your account’s offer is $3 for seven days of the full library, then $7.33 a month billed at $88 a year, or $14 a month. Before the trial ends, we will email you the charge details and cancellation link. Cancel before the subscription starts to avoid that charge. Payments are nonrefundable.\n\n[Read the listening guide]({{article_01_listening}})"},{"category":"Emails","slug":"family-f20","title":"F20 · Prospect bands with personal explanations","label":"Review email · F20","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> {{core_band_subject}}\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Four personal explanations, one for each of your frequencies.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>{{core_band_reframe}}\u003c/p>\n\u003cp>Core: {{core_hz}} Hz · {{core_band_name}}\u003c/p>\n\u003cp>{{core_next_band_paragraph}}\u003c/p>\n\u003cp>Your bands describe how you naturally get clear in each part of life. Alongside Core, here are the other three in your results.\u003c/p>\n\u003cp>Love: {{love_hz}} Hz · {{love_band_name}}\u003c/p>\n\u003cp>{{love_band_reframe}}\u003c/p>\n\u003cp>{{love_next_band_paragraph}}\u003c/p>\n\u003cp>Vitality: {{vitality_hz}} Hz · {{vitality_band_name}}\u003c/p>\n\u003cp>{{vitality_band_reframe}}\u003c/p>\n\u003cp>{{vitality_next_band_paragraph}}\u003c/p>\n\u003cp>Abundance: {{abundance_hz}} Hz · {{abundance_band_name}}\u003c/p>\n\u003cp>{{abundance_band_reframe}}\u003c/p>\n\u003cp>{{abundance_next_band_paragraph}}\u003c/p>\n\u003cp>A band is a range of pitch, not a spiritual rank. Everyone uses stillness, motion, words and perspective. Your band describes a preferred route in that part of life, with room to use the others too.\u003c/p>\n\u003cp>Read the descriptions against your own experience. They can give you words for a way of being that feels familiar, without making it the only way you are allowed to be.\u003c/p>\n\u003cp>Listen now — Review placeholder: \u003ccode>{{personal_listening_url}}\u003c/code>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>P.S. Your account’s offer is $3 for seven days of the full library, then $7.33 a month billed at $88 a year, or $14 a month. Before the trial ends, we will email you the charge details and cancellation link. Cancel before the subscription starts to avoid that charge. Payments are nonrefundable.\u003c/p>\n\u003cp>\u003ca href=\"#your-bands\">Read about your bands and how you get clear\u003c/a>\u003c/p>\n","text":"Subject: {{corebandsubject}}\n\nPreheader: Four personal explanations, one for each of your frequencies.\n\nHi {{givenname}},\n\n{{corebandreframe}}\n\nCore: {{corehz}} Hz · {{corebandname}}\n\n{{corenextbandparagraph}}\n\nYour bands describe how you naturally get clear in each part of life. Alongside Core, here are the other three in your results.\n\nLove: {{lovehz}} Hz · {{lovebandname}}\n\n{{lovebandreframe}}\n\n{{lovenextbandparagraph}}\n\nVitality: {{vitalityhz}} Hz · {{vitalitybandname}}\n\n{{vitalitybandreframe}}\n\n{{vitalitynextbandparagraph}}\n\nAbundance: {{abundancehz}} Hz · {{abundancebandname}}\n\n{{abundancebandreframe}}\n\n{{abundancenextbandparagraph}}\n\nA band is a range of pitch, not a spiritual rank. Everyone uses stillness, motion, words and perspective. Your band describes a preferred route in that part of life, with room to use the others too.\n\nRead the descriptions against your own experience. They can give you words for a way of being that feels familiar, without making it the only way you are allowed to be.\n\nListen now — Review placeholder: {{personallisteningurl}}\n\nTeam Zodiac\n\nP.S. Your account’s offer is $3 for seven days of the full library, then $7.33 a month billed at $88 a year, or $14 a month. Before the trial ends, we will email you the charge details and cancellation link. Cancel before the subscription starts to avoid that charge. Payments are nonrefundable.\n\nRead about your bands and how you get clear","copyText":"**Subject:** {{core_band_subject}}\n\n**Preheader:** Four personal explanations, one for each of your frequencies.\n\nHi {{given_name}},\n\n{{core_band_reframe}}\n\nCore: {{core_hz}} Hz · {{core_band_name}}\n\n{{core_next_band_paragraph}}\n\nYour bands describe how you naturally get clear in each part of life. Alongside Core, here are the other three in your results.\n\nLove: {{love_hz}} Hz · {{love_band_name}}\n\n{{love_band_reframe}}\n\n{{love_next_band_paragraph}}\n\nVitality: {{vitality_hz}} Hz · {{vitality_band_name}}\n\n{{vitality_band_reframe}}\n\n{{vitality_next_band_paragraph}}\n\nAbundance: {{abundance_hz}} Hz · {{abundance_band_name}}\n\n{{abundance_band_reframe}}\n\n{{abundance_next_band_paragraph}}\n\nA band is a range of pitch, not a spiritual rank. Everyone uses stillness, motion, words and perspective. Your band describes a preferred route in that part of life, with room to use the others too.\n\nRead the descriptions against your own experience. They can give you words for a way of being that feels familiar, without making it the only way you are allowed to be.\n\n[Listen now]({{personal_listening_url}})\n\nTeam Zodiac\n\nP.S. Your account’s offer is $3 for seven days of the full library, then $7.33 a month billed at $88 a year, or $14 a month. Before the trial ends, we will email you the charge details and cancellation link. Cancel before the subscription starts to avoid that charge. Payments are nonrefundable.\n\n[Read about your bands and how you get clear]({{article_02_bands}})"},{"category":"Emails","slug":"member-m01","title":"M01 · Music in the life you already have","label":"Review email · M01","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Your music belongs in your day\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Start with a track you want to hear, and make room for all four frequencies.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>Your music can come with you into the day you already have. Put on a track while you make breakfast, take a walk or settle into something you enjoy. You can meditate to it too, if that is part of your day.\u003c/p>\n\u003cp>On your phone, open the Zodiac app for iPhone or Android and sign in with your account email. Use the same email if you bought on the website. Desktop and laptop browser listening is available too.\u003c/p>\n\u003cp>Choose music you want to hear. Good headphones or a suitable speaker can carry the recording at a comfortable volume. Across the week, include Core, Love, Vitality and Abundance, so each part of your personal signal gets time.\u003c/p>\n\u003cp>You might notice something while a track plays. You might simply enjoy the music. The larger interest is what becomes available in ordinary life: recognizing a choice that is yours, meeting someone more openly, knowing where you want to put your energy.\u003c/p>\n\u003cp>You can put the screen away. There is nothing you need to watch happen.\u003c/p>\n\u003cp>\u003ca href=\"#how-to-listen\">Read the listening guide\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: Your music belongs in your day\n\nPreheader: Start with a track you want to hear, and make room for all four frequencies.\n\nHi {{givenname}},\n\nYour music can come with you into the day you already have. Put on a track while you make breakfast, take a walk or settle into something you enjoy. You can meditate to it too, if that is part of your day.\n\nOn your phone, open the Zodiac app for iPhone or Android and sign in with your account email. Use the same email if you bought on the website. Desktop and laptop browser listening is available too.\n\nChoose music you want to hear. Good headphones or a suitable speaker can carry the recording at a comfortable volume. Across the week, include Core, Love, Vitality and Abundance, so each part of your personal signal gets time.\n\nYou might notice something while a track plays. You might simply enjoy the music. The larger interest is what becomes available in ordinary life: recognizing a choice that is yours, meeting someone more openly, knowing where you want to put your energy.\n\nYou can put the screen away. There is nothing you need to watch happen.\n\nRead the listening guide\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** Your music belongs in your day\n\n**Preheader:** Start with a track you want to hear, and make room for all four frequencies.\n\nHi {{given_name}},\n\nYour music can come with you into the day you already have. Put on a track while you make breakfast, take a walk or settle into something you enjoy. You can meditate to it too, if that is part of your day.\n\nOn your phone, open the Zodiac app for iPhone or Android and sign in with your account email. Use the same email if you bought on the website. Desktop and laptop browser listening is available too.\n\nChoose music you want to hear. Good headphones or a suitable speaker can carry the recording at a comfortable volume. Across the week, include Core, Love, Vitality and Abundance, so each part of your personal signal gets time.\n\nYou might notice something while a track plays. You might simply enjoy the music. The larger interest is what becomes available in ordinary life: recognizing a choice that is yours, meeting someone more openly, knowing where you want to put your energy.\n\nYou can put the screen away. There is nothing you need to watch happen.\n\n[Read the listening guide]({{article_01_listening}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m02","title":"M02 · The birth pattern in the music","label":"Review email · M02","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Why your birth details became music\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> The Vedic idea behind Zodiac, and the mantra lineage that supplied the method.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>Your date, time and place of birth might seem an unusual place to begin making music. The connection is Nāda Brahma, the Vedic idea that reality is sound.\u003c/p>\n\u003cp>Within that worldview, the pattern present when you were born can have a sound of its own. A mantra lineage developed a method for finding it. Zodiac uses the frequency part of that method to derive your four birth frequencies, then puts them into music.\u003c/p>\n\u003cp>That is the origin of what you&#39;re hearing, with frequencies that stay fixed while your life changes.\u003c/p>\n\u003cp>The possibility that interests us is access. What a meaningful reading helps someone recognize in words can become more available from within, when a conversation, a decision or an opportunity asks something of them.\u003c/p>\n\u003cp>We call that part of you the connected self. It is already whole. The music amplifies your signal, the connection to it.\u003c/p>\n\u003cp>We hold this as a possibility, not scientific proof. It gives the listening a purpose worth exploring in your own life.\u003c/p>\n\u003cp>\u003ca href=\"#where-zodiac-comes-from\">Read where Zodiac comes from\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: Why your birth details became music\n\nPreheader: The Vedic idea behind Zodiac, and the mantra lineage that supplied the method.\n\nHi {{givenname}},\n\nYour date, time and place of birth might seem an unusual place to begin making music. The connection is Nāda Brahma, the Vedic idea that reality is sound.\n\nWithin that worldview, the pattern present when you were born can have a sound of its own. A mantra lineage developed a method for finding it. Zodiac uses the frequency part of that method to derive your four birth frequencies, then puts them into music.\n\nThat is the origin of what you're hearing, with frequencies that stay fixed while your life changes.\n\nThe possibility that interests us is access. What a meaningful reading helps someone recognize in words can become more available from within, when a conversation, a decision or an opportunity asks something of them.\n\nWe call that part of you the connected self. It is already whole. The music amplifies your signal, the connection to it.\n\nWe hold this as a possibility, not scientific proof. It gives the listening a purpose worth exploring in your own life.\n\nRead where Zodiac comes from\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** Why your birth details became music\n\n**Preheader:** The Vedic idea behind Zodiac, and the mantra lineage that supplied the method.\n\nHi {{given_name}},\n\nYour date, time and place of birth might seem an unusual place to begin making music. The connection is Nāda Brahma, the Vedic idea that reality is sound.\n\nWithin that worldview, the pattern present when you were born can have a sound of its own. A mantra lineage developed a method for finding it. Zodiac uses the frequency part of that method to derive your four birth frequencies, then puts them into music.\n\nThat is the origin of what you're hearing, with frequencies that stay fixed while your life changes.\n\nThe possibility that interests us is access. What a meaningful reading helps someone recognize in words can become more available from within, when a conversation, a decision or an opportunity asks something of them.\n\nWe call that part of you the connected self. It is already whole. The music amplifies your signal, the connection to it.\n\nWe hold this as a possibility, not scientific proof. It gives the listening a purpose worth exploring in your own life.\n\n[Read where Zodiac comes from]({{article_12_origin}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m03","title":"M03 · Four parts of one life","label":"Review email · M03","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Why there are four frequencies\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> A choice can involve who you are, other people, your energy and your timing.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>An invitation arrives. You like the people, the project sounds interesting, and there is room in the calendar. That still leaves a question. Do you want to be part of it?\u003c/p>\n\u003cp>A real choice rarely stays inside one part of life. It touches who you are, how you connect, what the work will ask of you and whether the time is right.\u003c/p>\n\u003cp>That is why Zodiac has four frequencies. Core concerns who you are and what is yours to do. Love concerns connection and how you meet people, while Vitality concerns what supports or drains your energy. Abundance concerns opportunity, exchange and when to move or wait.\u003c/p>\n\u003cp>Together, they form one birth signature. They aren&#39;t four competing instructions, and the music doesn&#39;t make the decision for you.\u003c/p>\n\u003cp>The aim is to make your own reference clearer while you consider the actual invitation. Sometimes that means an easier yes. Sometimes you see what needs to change before you can agree.\u003c/p>\n\u003cp>Include all four across the week, with room to enjoy the songs you return to most often.\u003c/p>\n\u003cp>\u003ca href=\"#four-frequencies\">Meet your four frequencies\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: Why there are four frequencies\n\nPreheader: A choice can involve who you are, other people, your energy and your timing.\n\nHi {{givenname}},\n\nAn invitation arrives. You like the people, the project sounds interesting, and there is room in the calendar. That still leaves a question. Do you want to be part of it?\n\nA real choice rarely stays inside one part of life. It touches who you are, how you connect, what the work will ask of you and whether the time is right.\n\nThat is why Zodiac has four frequencies. Core concerns who you are and what is yours to do. Love concerns connection and how you meet people, while Vitality concerns what supports or drains your energy. Abundance concerns opportunity, exchange and when to move or wait.\n\nTogether, they form one birth signature. They aren't four competing instructions, and the music doesn't make the decision for you.\n\nThe aim is to make your own reference clearer while you consider the actual invitation. Sometimes that means an easier yes. Sometimes you see what needs to change before you can agree.\n\nInclude all four across the week, with room to enjoy the songs you return to most often.\n\nMeet your four frequencies\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** Why there are four frequencies\n\n**Preheader:** A choice can involve who you are, other people, your energy and your timing.\n\nHi {{given_name}},\n\nAn invitation arrives. You like the people, the project sounds interesting, and there is room in the calendar. That still leaves a question. Do you want to be part of it?\n\nA real choice rarely stays inside one part of life. It touches who you are, how you connect, what the work will ask of you and whether the time is right.\n\nThat is why Zodiac has four frequencies. Core concerns who you are and what is yours to do. Love concerns connection and how you meet people, while Vitality concerns what supports or drains your energy. Abundance concerns opportunity, exchange and when to move or wait.\n\nTogether, they form one birth signature. They aren't four competing instructions, and the music doesn't make the decision for you.\n\nThe aim is to make your own reference clearer while you consider the actual invitation. Sometimes that means an easier yes. Sometimes you see what needs to change before you can agree.\n\nInclude all four across the week, with room to enjoy the songs you return to most often.\n\n[Meet your four frequencies]({{article_04_four_frequencies}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m04","title":"M04 · The first-month check-in","label":"Review email · M04","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> A month in, what stands out?\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> A useful check-in leaves room for your actual experience.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>Take a moment to look back over the past month. What stands out in your life, beyond the moments when the music was playing?\u003c/p>\n\u003cp>Perhaps a decision came more easily, or a conversation stayed with you because you said something you had wanted to say. Maybe you found music you love. You may have no clear difference to name yet, which is also worth recording honestly.\u003c/p>\n\u003cp>In Zodiac&#39;s year-long internal study, 61 percent of participants who listened as designed reported a clear shift by month one. Listening as designed meant at least nine minutes a day on average across the week, with at least 15 percent of listening in each frequency.\u003c/p>\n\u003cp>Those were participants&#39; reports, coded by Zodiac. The study wasn&#39;t a clinical trial, and that number isn&#39;t a deadline for your own experience.\u003c/p>\n\u003cp>For your check-in, one honest observation is enough. You can keep it privately and come back to it later. There is no need to turn a quiet month into a better story.\u003c/p>\n\u003cp>If listening has been uneven, make the next week easier to use. Include all four frequencies in the time you have.\u003c/p>\n\u003cp>\u003ca href=\"#the-year-long-study\">Read about the year-long study\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: A month in, what stands out?\n\nPreheader: A useful check-in leaves room for your actual experience.\n\nHi {{givenname}},\n\nTake a moment to look back over the past month. What stands out in your life, beyond the moments when the music was playing?\n\nPerhaps a decision came more easily, or a conversation stayed with you because you said something you had wanted to say. Maybe you found music you love. You may have no clear difference to name yet, which is also worth recording honestly.\n\nIn Zodiac's year-long internal study, 61 percent of participants who listened as designed reported a clear shift by month one. Listening as designed meant at least nine minutes a day on average across the week, with at least 15 percent of listening in each frequency.\n\nThose were participants' reports, coded by Zodiac. The study wasn't a clinical trial, and that number isn't a deadline for your own experience.\n\nFor your check-in, one honest observation is enough. You can keep it privately and come back to it later. There is no need to turn a quiet month into a better story.\n\nIf listening has been uneven, make the next week easier to use. Include all four frequencies in the time you have.\n\nRead about the year-long study\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** A month in, what stands out?\n\n**Preheader:** A useful check-in leaves room for your actual experience.\n\nHi {{given_name}},\n\nTake a moment to look back over the past month. What stands out in your life, beyond the moments when the music was playing?\n\nPerhaps a decision came more easily, or a conversation stayed with you because you said something you had wanted to say. Maybe you found music you love. You may have no clear difference to name yet, which is also worth recording honestly.\n\nIn Zodiac's year-long internal study, 61 percent of participants who listened as designed reported a clear shift by month one. Listening as designed meant at least nine minutes a day on average across the week, with at least 15 percent of listening in each frequency.\n\nThose were participants' reports, coded by Zodiac. The study wasn't a clinical trial, and that number isn't a deadline for your own experience.\n\nFor your check-in, one honest observation is enough. You can keep it privately and come back to it later. There is no need to turn a quiet month into a better story.\n\nIf listening has been uneven, make the next week easier to use. Include all four frequencies in the time you have.\n\n[Read about the year-long study]({{article_13_study}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m05","title":"M05 · Music worth leaving on","label":"Review email · M05","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> The song is tuned around your frequency\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Your frequency stays exact. The music moves to meet it.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>Your birth frequency doesn&#39;t have to land neatly on a piano key. Often it falls between the notes musicians normally use. Put that frequency into an unchanged song and the two can clash.\u003c/p>\n\u003cp>So the music is retuned around it.\u003c/p>\n\u003cp>We begin with music made by real musicians. Your exact frequency is carried by a pure tone, and the song is adjusted until that tone fits its harmony. The frequency remains what it was. It isn&#39;t rounded to a more convenient note.\u003c/p>\n\u003cp>That means you can listen to a piece of music rather than spend your day concentrating on a tone. Picking out the frequency by ear isn&#39;t a test you need to pass.\u003c/p>\n\u003cp>Musical taste still matters. A track can suit a long stretch of reading and be wrong for the walk you want to take. Choose what belongs in the moment and include all four frequencies across the week.\u003c/p>\n\u003cp>The construction is precise. Enjoying the music can be simple.\u003c/p>\n\u003cp>\u003ca href=\"#music-and-longer-tracks\">See how the music is made\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: The song is tuned around your frequency\n\nPreheader: Your frequency stays exact. The music moves to meet it.\n\nHi {{givenname}},\n\nYour birth frequency doesn't have to land neatly on a piano key. Often it falls between the notes musicians normally use. Put that frequency into an unchanged song and the two can clash.\n\nSo the music is retuned around it.\n\nWe begin with music made by real musicians. Your exact frequency is carried by a pure tone, and the song is adjusted until that tone fits its harmony. The frequency remains what it was. It isn't rounded to a more convenient note.\n\nThat means you can listen to a piece of music rather than spend your day concentrating on a tone. Picking out the frequency by ear isn't a test you need to pass.\n\nMusical taste still matters. A track can suit a long stretch of reading and be wrong for the walk you want to take. Choose what belongs in the moment and include all four frequencies across the week.\n\nThe construction is precise. Enjoying the music can be simple.\n\nSee how the music is made\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** The song is tuned around your frequency\n\n**Preheader:** Your frequency stays exact. The music moves to meet it.\n\nHi {{given_name}},\n\nYour birth frequency doesn't have to land neatly on a piano key. Often it falls between the notes musicians normally use. Put that frequency into an unchanged song and the two can clash.\n\nSo the music is retuned around it.\n\nWe begin with music made by real musicians. Your exact frequency is carried by a pure tone, and the song is adjusted until that tone fits its harmony. The frequency remains what it was. It isn't rounded to a more convenient note.\n\nThat means you can listen to a piece of music rather than spend your day concentrating on a tone. Picking out the frequency by ear isn't a test you need to pass.\n\nMusical taste still matters. A track can suit a long stretch of reading and be wrong for the walk you want to take. Choose what belongs in the moment and include all four frequencies across the week.\n\nThe construction is precise. Enjoying the music can be simple.\n\n[See how the music is made]({{article_07_music}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m06","title":"M06 · Your way of getting clear","label":"Review email · M06","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Some things become clear when you say them\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Your bands describe a preferred way of taking things in.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>You can think about a question for hours, then understand what you mean halfway through saying it to someone. Another answer arrives on a walk.\u003c/p>\n\u003cp>Zodiac&#39;s bands give language to those different ways of taking things in.\u003c/p>\n\u003cp>Each of your four frequencies sits in a band. Root works through steadiness and grounding, while Solar Plexus works through movement and doing. With Throat, saying or writing something can help it become clear. Crown works through perspective and seeing the larger picture.\u003c/p>\n\u003cp>Everyone uses all four ways. Your band describes a preferred route in that part of life, not the only route you&#39;re allowed to take. You can have different bands for Core, Love, Vitality and Abundance.\u003c/p>\n\u003cp>If you enjoy exploring this, bring one ordinary question to a way of reflecting that suits you. Let it be a conversation, a walk or a quiet moment. You don&#39;t have to manufacture a bodily sensation or arrive at an answer immediately.\u003c/p>\n\u003cp>The point is understanding yourself with a little more room to be yourself.\u003c/p>\n\u003cp>\u003ca href=\"#your-bands\">Understand your bands\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: Some things become clear when you say them\n\nPreheader: Your bands describe a preferred way of taking things in.\n\nHi {{givenname}},\n\nYou can think about a question for hours, then understand what you mean halfway through saying it to someone. Another answer arrives on a walk.\n\nZodiac's bands give language to those different ways of taking things in.\n\nEach of your four frequencies sits in a band. Root works through steadiness and grounding, while Solar Plexus works through movement and doing. With Throat, saying or writing something can help it become clear. Crown works through perspective and seeing the larger picture.\n\nEveryone uses all four ways. Your band describes a preferred route in that part of life, not the only route you're allowed to take. You can have different bands for Core, Love, Vitality and Abundance.\n\nIf you enjoy exploring this, bring one ordinary question to a way of reflecting that suits you. Let it be a conversation, a walk or a quiet moment. You don't have to manufacture a bodily sensation or arrive at an answer immediately.\n\nThe point is understanding yourself with a little more room to be yourself.\n\nUnderstand your bands\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** Some things become clear when you say them\n\n**Preheader:** Your bands describe a preferred way of taking things in.\n\nHi {{given_name}},\n\nYou can think about a question for hours, then understand what you mean halfway through saying it to someone. Another answer arrives on a walk.\n\nZodiac's bands give language to those different ways of taking things in.\n\nEach of your four frequencies sits in a band. Root works through steadiness and grounding, while Solar Plexus works through movement and doing. With Throat, saying or writing something can help it become clear. Crown works through perspective and seeing the larger picture.\n\nEveryone uses all four ways. Your band describes a preferred route in that part of life, not the only route you're allowed to take. You can have different bands for Core, Love, Vitality and Abundance.\n\nIf you enjoy exploring this, bring one ordinary question to a way of reflecting that suits you. Let it be a conversation, a walk or a quiet moment. You don't have to manufacture a bodily sensation or arrive at an answer immediately.\n\nThe point is understanding yourself with a little more room to be yourself.\n\n[Understand your bands]({{article_02_bands}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m07","title":"M07 · A week that includes all four","label":"Review email · M07","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Balance leaves room for preference\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> All four frequencies belong in the week. They don&#39;t need equal time.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>You can have a favorite track. You can also have a week when one part of life asks for more attention than the others. Balanced listening leaves room for both.\u003c/p>\n\u003cp>Zodiac is designed around all four frequencies. Across the week, give each one at least 15 percent of your listening. That leaves 40 percent to distribute as you prefer. Equal quarters aren&#39;t required.\u003c/p>\n\u003cp>The study&#39;s listening threshold was at least nine minutes a day on average, or 63 minutes across a week. You can miss a day and continue.\u003c/p>\n\u003cp>Why include all four when a particular issue is on your mind? Because a relationship also involves who you are, what you can give and the timing of a conversation. These parts of life belong together.\u003c/p>\n\u003cp>If a week was uneven, your previous listening hasn&#39;t disappeared. Give the coming week a complete mix and carry on from where you are.\u003c/p>\n\u003cp>Repeated contact is the point. There is no perfect daily streak to protect.\u003c/p>\n\u003cp>\u003ca href=\"#balance-across-all-four\">Read the balance guide\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: Balance leaves room for preference\n\nPreheader: All four frequencies belong in the week. They don't need equal time.\n\nHi {{givenname}},\n\nYou can have a favorite track. You can also have a week when one part of life asks for more attention than the others. Balanced listening leaves room for both.\n\nZodiac is designed around all four frequencies. Across the week, give each one at least 15 percent of your listening. That leaves 40 percent to distribute as you prefer. Equal quarters aren't required.\n\nThe study's listening threshold was at least nine minutes a day on average, or 63 minutes across a week. You can miss a day and continue.\n\nWhy include all four when a particular issue is on your mind? Because a relationship also involves who you are, what you can give and the timing of a conversation. These parts of life belong together.\n\nIf a week was uneven, your previous listening hasn't disappeared. Give the coming week a complete mix and carry on from where you are.\n\nRepeated contact is the point. There is no perfect daily streak to protect.\n\nRead the balance guide\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** Balance leaves room for preference\n\n**Preheader:** All four frequencies belong in the week. They don't need equal time.\n\nHi {{given_name}},\n\nYou can have a favorite track. You can also have a week when one part of life asks for more attention than the others. Balanced listening leaves room for both.\n\nZodiac is designed around all four frequencies. Across the week, give each one at least 15 percent of your listening. That leaves 40 percent to distribute as you prefer. Equal quarters aren't required.\n\nThe study's listening threshold was at least nine minutes a day on average, or 63 minutes across a week. You can miss a day and continue.\n\nWhy include all four when a particular issue is on your mind? Because a relationship also involves who you are, what you can give and the timing of a conversation. These parts of life belong together.\n\nIf a week was uneven, your previous listening hasn't disappeared. Give the coming week a complete mix and carry on from where you are.\n\nRepeated contact is the point. There is no perfect daily streak to protect.\n\n[Read the balance guide]({{article_15_balance}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m08","title":"M08 · A reading in the rest of your life","label":"Review email · M08",
