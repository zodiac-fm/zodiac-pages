ct us if you need help.\u003c/p>\n","text":"Your music is ready\n\nSign in with the same email you used at checkout. Your membership belongs to that account, wherever you listen.\n\nGet Zodiac for iPhone\n\nGet Zodiac for Android\n\nListen on your computer\n\n Start with a song you want to hear\n\nUse headphones, your car speakers or a quality Bluetooth speaker. Choose music that suits what you're doing and let it play at a comfortable volume.\n\nYou don't have to concentrate on a tone or try to make something happen. The music can play while you cook, work or settle in for the evening. Meditation is welcome, if that's what you want to do. It isn't required.\n\n Give all four frequencies a place in your week\n\nAbout nine minutes a day on average, or 63 minutes across a week, is the listening pattern behind our study findings. Each frequency needs at least 15 percent of your weekly listening. The rest is flexible.\n\nMissing a day doesn't erase what came before. Come back when you can, and keep all four in the mix.\n\n Look for the difference in your life\n\nYou might enjoy the first listen without noticing anything else. That is a perfectly reasonable place to start.\n\nOver time, pay attention to what becomes easier to recognize: what is yours to do, who you let close, what feeds you and when an opportunity fits. You don't have to grade every song.\n\nRead the listening guide\n\n Already have the app?\n\nOpen it and sign in with your checkout email. If your membership doesn't appear, check that you're in the same account before buying again. Contact us if you need help.","copyText":"# Your music is ready\n\nSign in with the same email you used at checkout. Your membership belongs to that account, wherever you listen.\n\n[Get Zodiac for iPhone](https://apps.apple.com/us/app/zodiacfm/id6764863619)\n\n[Get Zodiac for Android](https://play.google.com/store/apps/details?id=fm.zodiac.app)\n\n[Listen on your computer](https://app.zodiac.fm/)\n\n## Start with a song you want to hear\n\nUse headphones, your car speakers or a quality Bluetooth speaker. Choose music that suits what you're doing and let it play at a comfortable volume.\n\nYou don't have to concentrate on a tone or try to make something happen. The music can play while you cook, work or settle in for the evening. Meditation is welcome, if that's what you want to do. It isn't required.\n\n## Give all four frequencies a place in your week\n\nAbout nine minutes a day on average, or 63 minutes across a week, is the listening pattern behind our study findings. Each frequency needs at least 15 percent of your weekly listening. The rest is flexible.\n\nMissing a day doesn't erase what came before. Come back when you can, and keep all four in the mix.\n\n## Look for the difference in your life\n\nYou might enjoy the first listen without noticing anything else. That is a perfectly reasonable place to start.\n\nOver time, pay attention to what becomes easier to recognize: what is yours to do, who you let close, what feeds you and when an opportunity fits. You don't have to grade every song.\n\n[Read the listening guide](../articles/how-to-listen.md)\n\n### Already have the app?\n\nOpen it and sign in with your checkout email. If your membership doesn't appear, check that you're in the same account before buying again. Contact us if you need help."},{"category":"Pages","slug":"free-listen","title":"Your first songs are ready","label":"Page · Free listening","hasSourceH1":true,"html":"\u003ch1>Your first songs are ready.\u003c/h1>\n\u003cp>Three short songs in each of your four frequencies are free. You don&#39;t need to start a paid trial to hear them.\u003c/p>\n\u003cp>Sign in with the same email you used for your birth details.\u003c/p>\n\u003cp>\u003ca href=\"https://apps.apple.com/us/app/zodiacfm/id6764863619\" target=\"_blank\" rel=\"noopener noreferrer\">Get Zodiac for iPhone\u003c/a>\u003c/p>\n\u003cp>\u003ca href=\"https://play.google.com/store/apps/details?id=fm.zodiac.app\" target=\"_blank\" rel=\"noopener noreferrer\">Get Zodiac for Android\u003c/a>\u003c/p>\n\u003cp>\u003ca href=\"https://app.zodiac.fm/\" target=\"_blank\" rel=\"noopener noreferrer\">Listen on your computer\u003c/a>\u003c/p>\n\u003ch2>Choose a song and let it play.\u003c/h2>\n\u003cp>Use headphones or a decent speaker at a comfortable volume. You can give the music your attention or leave it on while you do something else.\u003c/p>\n\u003cp>There is no need to test yourself for a feeling. Start by hearing the music.\u003c/p>\n\u003ch2>All four belong in your week.\u003c/h2>\n\u003cp>Make room for Core, Love, Vitality and Abundance. At least nine minutes a day on average, with each frequency receiving at least 15 percent of weekly listening, is the pattern used in our study.\u003c/p>\n\u003cp>Your free songs give you a way to begin. Membership adds longer music when you want more time with a track.\u003c/p>\n\u003cp>\u003ca href=\"#how-to-listen\">Read the listening guide\u003c/a>\u003c/p>\n\u003ch2>Need help getting in?\u003c/h2>\n\u003cp>Check that you are using the email you entered with your birth details. If you still need help, email \u003ca href=\"mailto:support@zodiac.fm\">support@zodiac.fm\u003c/a>.\u003c/p>\n","text":"Your first songs are ready.\n\nThree short songs in each of your four frequencies are free. You don't need to start a paid trial to hear them.\n\nSign in with the same email you used for your birth details.\n\nGet Zodiac for iPhone\n\nGet Zodiac for Android\n\nListen on your computer\n\n Choose a song and let it play.\n\nUse headphones or a decent speaker at a comfortable volume. You can give the music your attention or leave it on while you do something else.\n\nThere is no need to test yourself for a feeling. Start by hearing the music.\n\n All four belong in your week.\n\nMake room for Core, Love, Vitality and Abundance. At least nine minutes a day on average, with each frequency receiving at least 15 percent of weekly listening, is the pattern used in our study.\n\nYour free songs give you a way to begin. Membership adds longer music when you want more time with a track.\n\nRead the listening guide\n\n Need help getting in?\n\nCheck that you are using the email you entered with your birth details. If you still need help, email support@zodiac.fm.","copyText":"# Your first songs are ready.\n\nThree short songs in each of your four frequencies are free. You don't need to start a paid trial to hear them.\n\nSign in with the same email you used for your birth details.\n\n[Get Zodiac for iPhone](https://apps.apple.com/us/app/zodiacfm/id6764863619)\n\n[Get Zodiac for Android](https://play.google.com/store/apps/details?id=fm.zodiac.app)\n\n[Listen on your computer](https://app.zodiac.fm/)\n\n## Choose a song and let it play.\n\nUse headphones or a decent speaker at a comfortable volume. You can give the music your attention or leave it on while you do something else.\n\nThere is no need to test yourself for a feeling. Start by hearing the music.\n\n## All four belong in your week.\n\nMake room for Core, Love, Vitality and Abundance. At least nine minutes a day on average, with each frequency receiving at least 15 percent of weekly listening, is the pattern used in our study.\n\nYour free songs give you a way to begin. Membership adds longer music when you want more time with a track.\n\n[Read the listening guide](../articles/how-to-listen.md)\n\n## Need help getting in?\n\nCheck that you are using the email you entered with your birth details. If you still need help, email [support@zodiac.fm](mailto:support@zodiac.fm)."},{"category":"Pages","slug":"about","title":"The birth pattern has a sound, too","label":"Page · About","hasSourceH1":true,"html":"\u003ch1>The birth pattern has a sound, too\u003c/h1>\n\u003cp>A good reading can be unnervingly personal. Someone looks at the time and place you were born and describes a part of you they had no ordinary way of knowing.\u003c/p>\n\u003cp>We kept coming back to a question. What are they reading?\u003c/p>\n\u003cp>The Vedic teaching of Nāda Brahma gave us a way to think about it. The world is sound. You are part of that world. So the pattern present when you arrived would have a sound of its own.\u003c/p>\n\u003cp>Someone had already gone looking for it.\u003c/p>\n\u003ch2>A sound tradition, made personal\u003c/h2>\n\u003cp>Mantra Śāstra works with the precision of sound. Within that tradition, a Sri Vidyā lineage was making personal mantras from birth information.\u003c/p>\n\u003cp>They kept their seed mantras private. What became available to Zodiac was the frequency part of their method.\u003c/p>\n\u003cp>That method gives us four frequencies from a person&#39;s birth date, time and place. We call them Core, Love, Vitality and Abundance. They remain fixed throughout life.\u003c/p>\n\u003cp>Zodiac brings those frequencies into music. The protected method remains private, and the music, technology and listening experience are what we built around it.\u003c/p>\n\u003ch2>We had to make music worth leaving on\u003c/h2>\n\u003cp>A pure frequency on its own is a tone. An interesting thing to hear, perhaps. Less interesting as the soundtrack to your afternoon.\u003c/p>\n\u003cp>Real musicians make our songs. Audio engineers then retune each composition so a listener&#39;s frequency belongs inside its harmony. The frequency itself stays exact and plays through the track.\u003c/p>\n\u003cp>Every song is prepared in 701 versions, one for every whole frequency from 250 to 950 Hz. Your version is matched to your frequency.\u003c/p>\n\u003cp>That work is why listening can be simple. You choose the music. We have already done the tuning.\u003c/p>\n\u003ch2>What we mean by the connected self\u003c/h2>\n\u003cp>Your connected self is who you were before anyone taught you who to be. It is also the part of you connected to everything and everyone else.\u003c/p>\n\u003cp>You may have another name for it. What matters to us is being able to live from it: recognizing what is yours, being present with the people you love, knowing what feeds you and meeting an opening when it comes.\u003c/p>\n\u003cp>Zodiac amplifies the signal connecting you with that self. It doesn&#39;t add a new personality or decide your life for you.\u003c/p>\n\u003cp>The Vedic explanation is a possibility we work from. We do not claim to have proved it scientifically or to understand every part of it. What listeners report is a separate question, and one we have spent time studying.\u003c/p>\n\u003ch2>A year of listening\u003c/h2>\n\u003cp>Three hundred people started our 52-week study. Two hundred and seventy-eight completed it. They answered open questions every two weeks, and their listening was logged.\u003c/p>\n\u003cp>Of those who completed the year, 98.6 percent said they would recommend Zodiac to a friend. Among participants who listened as designed, at least nine minutes a day on average with each of the four frequencies receiving at least 15 percent of listening time, 84 percent called it life-changing.\u003c/p>\n\u003cp>This was our own study, coded in-house. It was not a clinical trial and has not been published in a journal. Those findings describe a group of listeners, not a promise about what will happen to you.\u003c/p>\n\u003cp>\u003ca href=\"#the-year-long-study\">Read about the study\u003c/a>\u003c/p>\n\u003ch2>The people behind it\u003c/h2>\n\u003cp>Zodiac began with Michael Lovitch asking questions after an astrology reading described him far more closely than he expected. Those questions took him into Vedic astrology, then to the sound tradition behind the frequency method.\u003c/p>\n\u003cp>Composers, musicians and audio engineers helped turn the method into something people could listen to in ordinary life. Listeners have been teaching us about the experience ever since.\u003c/p>\n\u003cp>The story gets more interesting when it becomes yours.\u003c/p>\n\u003ch2>The music turns you up. The walking is yours.\u003c/h2>\n\u003cp>We love the teachers who help people become more themselves. A good reading, a practice you value, an honest conversation. Zodiac belongs alongside that work.\u003c/p>\n\u003cp>There is no dress code for any of this. No higher frequency to aspire to. Your frequencies are yours.\u003c/p>\n\u003cp>Press play, and see what you make of it.\u003c/p>\n\u003cp>\u003ca href=\"#birth-details\">Find my music\u003c/a>\u003c/p>\n","text":"The birth pattern has a sound, too\n\nA good reading can be unnervingly personal. Someone looks at the time and place you were born and describes a part of you they had no ordinary way of knowing.\n\nWe kept coming back to a question. What are they reading?\n\nThe Vedic teaching of Nāda Brahma gave us a way to think about it. The world is sound. You are part of that world. So the pattern present when you arrived would have a sound of its own.\n\nSomeone had already gone looking for it.\n\n A sound tradition, made personal\n\nMantra Śāstra works with the precision of sound. Within that tradition, a Sri Vidyā lineage was making personal mantras from birth information.\n\nThey kept their seed mantras private. What became available to Zodiac was the frequency part of their method.\n\nThat method gives us four frequencies from a person's birth date, time and place. We call them Core, Love, Vitality and Abundance. They remain fixed throughout life.\n\nZodiac brings those frequencies into music. The protected method remains private, and the music, technology and listening experience are what we built around it.\n\n We had to make music worth leaving on\n\nA pure frequency on its own is a tone. An interesting thing to hear, perhaps. Less interesting as the soundtrack to your afternoon.\n\nReal musicians make our songs. Audio engineers then retune each composition so a listener's frequency belongs inside its harmony. The frequency itself stays exact and plays through the track.\n\nEvery song is prepared in 701 versions, one for every whole frequency from 250 to 950 Hz. Your version is matched to your frequency.\n\nThat work is why listening can be simple. You choose the music. We have already done the tuning.\n\n What we mean by the connected self\n\nYour connected self is who you were before anyone taught you who to be. It is also the part of you connected to everything and everyone else.\n\nYou may have another name for it. What matters to us is being able to live from it: recognizing what is yours, being present with the people you love, knowing what feeds you and meeting an opening when it comes.\n\nZodiac amplifies the signal connecting you with that self. It doesn't add a new personality or decide your life for you.\n\nThe Vedic explanation is a possibility we work from. We do not claim to have proved it scientifically or to understand every part of it. What listeners report is a separate question, and one we have spent time studying.\n\n A year of listening\n\nThree hundred people started our 52-week study. Two hundred and seventy-eight completed it. They answered open questions every two weeks, and their listening was logged.\n\nOf those who completed the year, 98.6 percent said they would recommend Zodiac to a friend. Among participants who listened as designed, at least nine minutes a day on average with each of the four frequencies receiving at least 15 percent of listening time, 84 percent called it life-changing.\n\nThis was our own study, coded in-house. It was not a clinical trial and has not been published in a journal. Those findings describe a group of listeners, not a promise about what will happen to you.\n\nRead about the study\n\n The people behind it\n\nZodiac began with Michael Lovitch asking questions after an astrology reading described him far more closely than he expected. Those questions took him into Vedic astrology, then to the sound tradition behind the frequency method.\n\nComposers, musicians and audio engineers helped turn the method into something people could listen to in ordinary life. Listeners have been teaching us about the experience ever since.\n\nThe story gets more interesting when it becomes yours.\n\n The music turns you up. The walking is yours.\n\nWe love the teachers who help people become more themselves. A good reading, a practice you value, an honest conversation. Zodiac belongs alongside that work.\n\nThere is no dress code for any of this. No higher frequency to aspire to. Your frequencies are yours.\n\nPress play, and see what you make of it.\n\nFind my music","copyText":"# The birth pattern has a sound, too\n\nA good reading can be unnervingly personal. Someone looks at the time and place you were born and describes a part of you they had no ordinary way of knowing.\n\nWe kept coming back to a question. What are they reading?\n\nThe Vedic teaching of Nāda Brahma gave us a way to think about it. The world is sound. You are part of that world. So the pattern present when you arrived would have a sound of its own.\n\nSomeone had already gone looking for it.\n\n## A sound tradition, made personal\n\nMantra Śāstra works with the precision of sound. Within that tradition, a Sri Vidyā lineage was making personal mantras from birth information.\n\nThey kept their seed mantras private. What became available to Zodiac was the frequency part of their method.\n\nThat method gives us four frequencies from a person's birth date, time and place. We call them Core, Love, Vitality and Abundance. They remain fixed throughout life.\n\nZodiac brings those frequencies into music. The protected method remains private, and the music, technology and listening experience are what we built around it.\n\n## We had to make music worth leaving on\n\nA pure frequency on its own is a tone. An interesting thing to hear, perhaps. Less interesting as the soundtrack to your afternoon.\n\nReal musicians make our songs. Audio engineers then retune each composition so a listener's frequency belongs inside its harmony. The frequency itself stays exact and plays through the track.\n\nEvery song is prepared in 701 versions, one for every whole frequency from 250 to 950 Hz. Your version is matched to your frequency.\n\nThat work is why listening can be simple. You choose the music. We have already done the tuning.\n\n## What we mean by the connected self\n\nYour connected self is who you were before anyone taught you who to be. It is also the part of you connected to everything and everyone else.\n\nYou may have another name for it. What matters to us is being able to live from it: recognizing what is yours, being present with the people you love, knowing what feeds you and meeting an opening when it comes.\n\nZodiac amplifies the signal connecting you with that self. It doesn't add a new personality or decide your life for you.\n\nThe Vedic explanation is a possibility we work from. We do not claim to have proved it scientifically or to understand every part of it. What listeners report is a separate question, and one we have spent time studying.\n\n## A year of listening\n\nThree hundred people started our 52-week study. Two hundred and seventy-eight completed it. They answered open questions every two weeks, and their listening was logged.\n\nOf those who completed the year, 98.6 percent said they would recommend Zodiac to a friend. Among participants who listened as designed, at least nine minutes a day on average with each of the four frequencies receiving at least 15 percent of listening time, 84 percent called it life-changing.\n\nThis was our own study, coded in-house. It was not a clinical trial and has not been published in a journal. Those findings describe a group of listeners, not a promise about what will happen to you.\n\n[Read about the study](../articles/the-year-long-study.md)\n\n## The people behind it\n\nZodiac began with Michael Lovitch asking questions after an astrology reading described him far more closely than he expected. Those questions took him into Vedic astrology, then to the sound tradition behind the frequency method.\n\nComposers, musicians and audio engineers helped turn the method into something people could listen to in ordinary life. Listeners have been teaching us about the experience ever since.\n\nThe story gets more interesting when it becomes yours.\n\n## The music turns you up. The walking is yours.\n\nWe love the teachers who help people become more themselves. A good reading, a practice you value, an honest conversation. Zodiac belongs alongside that work.\n\nThere is no dress code for any of this. No higher frequency to aspire to. Your frequencies are yours.\n\nPress play, and see what you make of it.\n\n[Find my music](birth-details.md)"},{"category":"Articles","slug":"articles","title":"A little more about your music","label":"Article index","hasSourceH1":true,"html":"\u003ch1>A little more about your music.\u003c/h1>\n\u003cp>Start listening, explore your frequencies, or follow the question that brought you here.\u003c/p>\n\u003ch2>Getting started\u003c/h2>\n\u003cp>\u003ca href=\"#how-to-listen\">Put on the music. Go about your day.\u003c/a>\u003c/p>\n\u003cp>A simple guide to where, when and how to listen.\u003c/p>\n\u003cp>\u003ca href=\"#what-to-expect\">The first song is the beginning\u003c/a>\u003c/p>\n\u003cp>What to notice in your first week, and why the experience can take time.\u003c/p>\n\u003cp>\u003ca href=\"#balance-across-all-four\">Give all four frequencies a place in your week\u003c/a>\u003c/p>\n\u003cp>What balance means, without making your listening another thing to manage.\u003c/p>\n\u003ch2>Your frequencies and bands\u003c/h2>\n\u003cp>\u003ca href=\"#four-frequencies\">What your four frequencies are for\u003c/a>\u003c/p>\n\u003cp>Core, Love, Vitality and Abundance, and the places they have in your life.\u003c/p>\n\u003cp>\u003ca href=\"#your-bands\">Four ways of getting clear\u003c/a>\u003c/p>\n\u003cp>Why stillness, action, words or a wider view may help you find your answer.\u003c/p>\n\u003cp>\u003ca href=\"#connected-self\">The self you recognize\u003c/a>\u003c/p>\n\u003cp>What we mean by the connected self, and what it has to do with the music.\u003c/p>\n\u003ch2>The idea behind Zodiac\u003c/h2>\n\u003cp>\u003ca href=\"#where-zodiac-comes-from\">If the world is sound, what is your sound?\u003c/a>\u003c/p>\n\u003cp>The Vedic teaching, a mantra lineage and the method behind your birth frequencies.\u003c/p>\n\u003cp>\u003ca href=\"#readings-and-birth-sound\">Living what your chart describes\u003c/a>\u003c/p>\n\u003cp>A way to bring the recognition of a reading into everyday life.\u003c/p>\n\u003cp>\u003ca href=\"#manifestation-and-your-own-signal\">What if the wanting became clearer?\u003c/a>\u003c/p>\n\u003cp>Intention, action and recognizing what is yours to pursue.\u003c/p>\n\u003ch2>The music and the evidence\u003c/h2>\n\u003cp>\u003ca href=\"#finding-your-people\">The people you can be yourself with\u003c/a>\u003c/p>\n\u003cp>Making room for your nature, and for the different people in your life.\u003c/p>\n\u003cp>\u003ca href=\"#what-we-believe\">There is room for more of you\u003c/a>\u003c/p>\n\u003cp>What Zodiac is here for, and what remains yours.\u003c/p>\n\u003cp>\u003ca href=\"#music-and-longer-tracks\">Music you can stay with\u003c/a>\u003c/p>\n\u003cp>How real musicians and precise tuning bring your frequencies into the songs.\u003c/p>\n\u003cp>\u003ca href=\"#the-year-long-study\">What listeners reported over a year\u003c/a>\u003c/p>\n\u003cp>Who took part, what they reported and what the findings can tell us.\u003c/p>\n\u003ch2>Hear your own music\u003c/h2>\n\u003cp>New to Zodiac? \u003ca href=\"#birth-details\">Find your frequencies\u003c/a> and hear three short songs in each one without a card.\u003c/p>\n\u003cp>Already have your frequencies? \u003ca href=\"#free-listen\">Open your music\u003c/a> with the same account email.\u003c/p>\n","text":"A little more about your music.\n\nStart listening, explore your frequencies, or follow the question that brought you here.\n\n Getting started\n\nPut on the music. Go about your day.\n\nA simple guide to where, when and how to listen.\n\nThe first song is the beginning\n\nWhat to notice in your first week, and why the experience can take time.\n\nGive all four frequencies a place in your week\n\nWhat balance means, without making your listening another thing to manage.\n\n Your frequencies and bands\n\nWhat your four frequencies are for\n\nCore, Love, Vitality and Abundance, and the places they have in your life.\n\nFour ways of getting clear\n\nWhy stillness, action, words or a wider view may help you find your answer.\n\nThe self you recognize\n\nWhat we mean by the connected self, and what it has to do with the music.\n\n The idea behind Zodiac\n\nIf the world is sound, what is your sound?\n\nThe Vedic teaching, a mantra lineage and the method behind your birth frequencies.\n\nLiving what your chart describes\n\nA way to bring the recognition of a reading into everyday life.\n\nWhat if the wanting became clearer?\n\nIntention, action and recognizing what is yours to pursue.\n\n The music and the evidence\n\nThe people you can be yourself with\n\nMaking room for your nature, and for the different people in your life.\n\nThere is room for more of you\n\nWhat Zodiac is here for, and what remains yours.\n\nMusic you can stay with\n\nHow real musicians and precise tuning bring your frequencies into the songs.\n\nWhat listeners reported over a year\n\nWho took part, what they reported and what the findings can tell us.\n\n Hear your own music\n\nNew to Zodiac? Find your frequencies and hear three short songs in each one without a card.\n\nAlready have your frequencies? Open your music with the same account email.","copyText":"# A little more about your music.\n\nStart listening, explore your frequencies, or follow the question that brought you here.\n\n## Getting started\n\n[Put on the music. Go about your day.](how-to-listen.md)\n\nA simple guide to where, when and how to listen.\n\n[The first song is the beginning](what-to-expect.md)\n\nWhat to notice in your first week, and why the experience can take time.\n\n[Give all four frequencies a place in your week](balance-across-all-four.md)\n\nWhat balance means, without making your listening another thing to manage.\n\n## Your frequencies and bands\n\n[What your four frequencies are for](four-frequencies.md)\n\nCore, Love, Vitality and Abundance, and the places they have in your life.\n\n[Four ways of getting clear](your-bands.md)\n\nWhy stillness, action, words or a wider view may help you find your answer.\n\n[The self you recognize](connected-self.md)\n\nWhat we mean by the connected self, and what it has to do with the music.\n\n## The idea behind Zodiac\n\n[If the world is sound, what is your sound?](where-zodiac-comes-from.md)\n\nThe Vedic teaching, a mantra lineage and the method behind your birth frequencies.\n\n[Living what your chart describes](readings-and-birth-sound.md)\n\nA way to bring the recognition of a reading into everyday life.\n\n[What if the wanting became clearer?](manifestation-and-your-own-signal.md)\n\nIntention, action and recognizing what is yours to pursue.\n\n## The music and the evidence\n\n[The people you can be yourself with](finding-your-people.md)\n\nMaking room for your nature, and for the different people in your life.\n\n[There is room for more of you](what-we-believe.md)\n\nWhat Zodiac is here for, and what remains yours.\n\n[Music you can stay with](music-and-longer-tracks.md)\n\nHow real musicians and precise tuning bring your frequencies into the songs.\n\n[What listeners reported over a year](the-year-long-study.md)\n\nWho took part, what they reported and what the findings can tell us.\n\n\n## Hear your own music\n\nNew to Zodiac? [Find your frequencies](../pages/birth-details.md) and hear three short songs in each one without a card.\n\nAlready have your frequencies? [Open your music](../pages/free-listen.md) with the same account email."},{"category":"Articles","slug":"how-to-listen","title":"Put on the music. Go about your day.","label":"Articles","hasSourceH1":true,"html":"\u003ch1>Put on the music. Go about your day.\u003c/h1>\n\u003cp>Choose a song you want to hear and press play. You can cook, work, journal or settle in for the evening while it plays.\u003c/p>\n\u003cp>You don&#39;t have to concentrate on the frequency or try to bring on a feeling. The tone is already in the music.\u003c/p>\n\u003ch2>Give the music a decent way to reach you\u003c/h2>\n\u003cp>Headphones, car speakers or a quality Bluetooth speaker work well. Your phone or laptop speakers don&#39;t do the frequencies justice.\u003c/p>\n\u003cp>Keep the volume comfortable. Louder is not the goal. If a song doesn&#39;t suit the moment, choose another.\u003c/p>\n\u003ch2>About nine minutes a day, averaged across the week\u003c/h2>\n\u003cp>That is the listening pattern behind our study findings. It works out to about 63 minutes a week, with at least 15 percent of your listening going to each of the four frequencies.\u003c/p>\n\u003cp>It doesn&#39;t require a nine-minute appointment every morning. Short listens count, and a longer track can fit a quieter part of the week. Missing a day doesn&#39;t erase your listening.\u003c/p>\n\u003cp>The app helps keep all four frequencies in balance. Core, Love, Vitality and Abundance each have a place, even if one description interests you most.\u003c/p>\n\u003ch2>Your existing practice can come with you\u003c/h2>\n\u003cp>Meditate to it if you like. Use it while you write, visualize or pray. You can also listen without doing any of those things.\u003c/p>\n\u003cp>Over time, listening amplifies your access to the connected self, making it more available in everyday life. What changes may be easier to notice in a conversation or a choice than during the song itself.\u003c/p>\n\u003cp>Let the music be music while it is playing. You have the rest of your day to live.\u003c/p>\n\u003cp>\u003ca href=\"#what-to-expect\">Read what to expect when you begin\u003c/a>.\u003c/p>\n\u003ch2>Hear your own music\u003c/h2>\n\u003cp>New to Zodiac? \u003ca href=\"#birth-details\">Find your frequencies\u003c/a> and hear three short songs in each one without a card.\u003c/p>\n\u003cp>Already have your frequencies? \u003ca href=\"#free-listen\">Open your music\u003c/a> with the same account email.\u003c/p>\n","text":"Put on the music. Go about your day.\n\nChoose a song you want to hear and press play. You can cook, work, journal or settle in for the evening while it plays.\n\nYou don't have to concentrate on the frequency or try to bring on a feeling. The tone is already in the music.\n\n Give the music a decent way to reach you\n\nHeadphones, car speakers or a quality Bluetooth speaker work well. Your phone or laptop speakers don't do the frequencies justice.\n\nKeep the volume comfortable. Louder is not the goal. If a song doesn't suit the moment, choose another.\n\n About nine minutes a day, averaged across the week\n\nThat is the listening pattern behind our study findings. It works out to about 63 minutes a week, with at least 15 percent of your listening going to each of the four frequencies.\n\nIt doesn't require a nine-minute appointment every morning. Short listens count, and a longer track can fit a quieter part of the week. Missing a day doesn't erase your listening.\n\nThe app helps keep all four frequencies in balance. Core, Love, Vitality and Abundance each have a place, even if one description interests you most.\n\n Your existing practice can come with you\n\nMeditate to it if you like. Use it while you write, visualize or pray. You can also listen without doing any of those things.\n\nOver time, listening amplifies your access to the connected self, making it more available in everyday life. What changes may be easier to notice in a conversation or a choice than during the song itself.\n\nLet the music be music while it is playing. You have the rest of your day to live.\n\nRead what to expect when you begin.\n\n Hear your own music\n\nNew to Zodiac? Find your frequencies and hear three short songs in each one without a card.\n\nAlready have your frequencies? Open your music with the same account email.","copyText":"# Put on the music. Go about your day.\n\nChoose a song you want to hear and press play. You can cook, work, journal or settle in for the evening while it plays.\n\nYou don't have to concentrate on the frequency or try to bring on a feeling. The tone is already in the music.\n\n## Give the music a decent way to reach you\n\nHeadphones, car speakers or a quality Bluetooth speaker work well. Your phone or laptop speakers don't do the frequencies justice.\n\nKeep the volume comfortable. Louder is not the goal. If a song doesn't suit the moment, choose another.\n\n## About nine minutes a day, averaged across the week\n\nThat is the listening pattern behind our study findings. It works out to about 63 minutes a week, with at least 15 percent of your listening going to each of the four frequencies.\n\nIt doesn't require a nine-minute appointment every morning. Short listens count, and a longer track can fit a quieter part of the week. Missing a day doesn't erase your listening.\n\nThe app helps keep all four frequencies in balance. Core, Love, Vitality and Abundance each have a place, even if one description interests you most.\n\n## Your existing practice can come with you\n\nMeditate to it if you like. Use it while you write, visualize or pray. You can also listen without doing any of those things.\n\nOver time, listening amplifies your access to the connected self, making it more available in everyday life. What changes may be easier to notice in a conversation or a choice than during the song itself.\n\nLet the music be music while it is playing. You have the rest of your day to live.\n\n[Read what to expect when you begin](./what-to-expect.md).\n\n\n## Hear your own music\n\nNew to Zodiac? [Find your frequencies](../pages/birth-details.md) and hear three short songs in each one without a card.\n\nAlready have your frequencies? [Open your music](../pages/free-listen.md) with the same account email."},{"category":"Articles","slug":"balance-across-all-four","title":"Give all four frequencies a place in your week","label":"Articles","hasSourceH1":true,"html":"\u003ch1>Give all four frequencies a place in your week\u003c/h1>\n\u003cp>If Love is the description that speaks to you, you might want to listen only to Love. The same can happen with Abundance when you are thinking about work or an opportunity.\u003c/p>\n\u003cp>All four still matter.\u003c/p>\n\u003cp>Your sense of who you are, how you connect, what feeds you and when you move are parts of the same life. Zodiac was designed and studied with those four frequencies together.\u003c/p>\n\u003ch2>What balanced listening means\u003c/h2>\n\u003cp>The listening pattern behind our study findings was about nine minutes a day on average, with each frequency receiving at least 15 percent of weekly listening time.\u003c/p>\n\u003cp>Across a 63-minute week, that is about nine and a half minutes for each frequency. The remaining time is flexible.\u003c/p>\n\u003cp>You don&#39;t need equal quarters. Nor do you need to make up a missed Tuesday on Wednesday.\u003c/p>\n\u003ch2>Let the app help\u003c/h2>\n\u003cp>The app balances the four across your week. If you are choosing music yourself, keep Core, Love, Vitality and Abundance in the mix instead of giving one frequency all the time.\u003c/p>\n\u003cp>Your bands are a different part of the picture. They describe how you naturally take things in within each area of life. They are not four extra frequencies to add to your playlist.\u003c/p>\n\u003ch2>A lighter week is still a week of listening\u003c/h2>\n\u003cp>Missing a day doesn&#39;t reset your history. A week below the listening pattern does not make that time worthless.\u003c/p>\n\u003cp>Come back when you can. Balance is there to support the whole experience, not to give you something else to judge yourself for.\u003c/p>\n\u003cp>\u003ca href=\"#how-to-listen\">Read the full listening guide\u003c/a>.\u003c/p>\n\u003ch2>Hear your own music\u003c/h2>\n\u003cp>New to Zodiac? \u003ca href=\"#birth-details\">Find your frequencies\u003c/a> and hear three short songs in each one without a card.\u003c/p>\n\u003cp>Already have your frequencies? \u003ca href=\"#free-listen\">Open your music\u003c/a> with the same account email.\u003c/p>\n","text":"Give all four frequencies a place in your week\n\nIf Love is the description that speaks to you, you might want to listen only to Love. The same can happen with Abundance when you are thinking about work or an opportunity.\n\nAll four still matter.\n\nYour sense of who you are, how you connect, what feeds you and when you move are parts of the same life. Zodiac was designed and studied with those four frequencies together.\n\n What balanced listening means\n\nThe listening pattern behind our study findings was about nine minutes a day on average, with each frequency receiving at least 15 percent of weekly listening time.\n\nAcross a 63-minute week, that is about nine and a half minutes for each frequency. The remaining time is flexible.\n\nYou don't need equal quarters. Nor do you need to make up a missed Tuesday on Wednesday.\n\n Let the app help\n\nThe app balances the four across your week. If you are choosing music yourself, keep Core, Love, Vitality and Abundance in the mix instead of giving one frequency all the time.\n\nYour bands are a different part of the picture. They describe how you naturally take things in within each area of life. They are not four extra frequencies to add to your playlist.\n\n A lighter week is still a week of listening\n\nMissing a day doesn't reset your history. A week below the listening pattern does not make that time worthless.\n\nCome back when you can. Balance is there to support the whole experience, not to give you something else to judge yourself for.\n\nRead the full listening guide.\n\n Hear your own music\n\nNew to Zodiac? Find your frequencies and hear three short songs in each one without a card.\n\nAlready have your frequencies? Open your music with the same account email.","copyText":"# Give all four frequencies a place in your week\n\nIf Love is the description that speaks to you, you might want to listen only to Love. The same can happen with Abundance when you are thinking about work or an opportunity.\n\nAll four still matter.\n\nYour sense of who you are, how you connect, what feeds you and when you move are parts of the same life. Zodiac was designed and studied with those four frequencies together.\n\n## What balanced listening means\n\nThe listening pattern behind our study findings was about nine minutes a day on average, with each frequency receiving at least 15 percent of weekly listening time.\n\nAcross a 63-minute week, that is about nine and a half minutes for each frequency. The remaining time is flexible.\n\nYou don't need equal quarters. Nor do you need to make up a missed Tuesday on Wednesday.\n\n## Let the app help\n\nThe app balances the four across your week. If you are choosing music yourself, keep Core, Love, Vitality and Abundance in the mix instead of giving one frequency all the time.\n\nYour bands are a different part of the picture. They describe how you naturally take things in within each area of life. They are not four extra frequencies to add to your playlist.\n\n## A lighter week is still a week of listening\n\nMissing a day doesn't reset your history. A week below the listening pattern does not make that time worthless.\n\nCome back when you can. Balance is there to support the whole experience, not to give you something else to judge yourself for.\n\n[Read the full listening guide](./how-to-listen.md).\n\n\n## Hear your own music\n\nNew to Zodiac? [Find your frequencies](../pages/birth-details.md) and hear three short songs in each one without a card.\n\nAlready have your frequencies? [Open your music](../pages/free-listen.md) with the same account email."},{"category":"Articles","slug":"connected-self","title":"The self you recognize","label":"Articles","hasSourceH1":true,"html":"\u003ch1>The self you recognize\u003c/h1>\n\u003cp>Sometimes a reading puts words to something you already knew. You hear a description of yourself and there is very little to argue with. Yes. That is me.\u003c/p>\n\u003cp>The recognition is personal. Nobody had to persuade you to have it.\u003c/p>\n\u003cp>We call the part of you that recognizes itself your connected self. It was there before family, school, work and the rest of life taught you who to be. It is also the part of you connected to everything and everyone else.\u003c/p>\n\u003ch2>You have probably met it already\u003c/h2>\n\u003cp>You might know it through a practice. You might recognize it while making something, being with someone you love, or reaching a decision that is yours even before you can explain it.\u003c/p>\n\u003cp>The name is less important than that recognition. Soul, essence, higher self. Use the word that means something to you.\u003c/p>\n\u003cp>What interests us is how available that connection can become while you live. When an offer arrives. When someone asks for your time. When a familiar argument begins and you have a chance to meet the person in front of you.\u003c/p>\n\u003ch2>Your signal is how you reach it\u003c/h2>\n\u003cp>Think of someone you love calling across a loud room. Their voice is not them. It is how you find them.\u003c/p>\n\u003cp>That is the distinction between your connected self and your signal. Zodiac works with the connection. The self is already whole.\u003c/p>\n\u003cp>The Vedic teaching of Nāda Brahma says the world is sound. A mantra lineage developed a method for finding four frequencies from the pattern present at birth. We put those frequencies into music to amplify your access to the connected self.\u003c/p>\n\u003cp>You listen as you live. Over time, what you recognize about yourself can become more available in how you choose, connect and meet the world.\u003c/p>\n\u003ch2>More of you belongs in your life\u003c/h2>\n\u003cp>This can mean taking your own interests seriously, letting someone get closer, or knowing that a good opportunity is not your opportunity.\u003c/p>\n\u003cp>It can also mean enjoying what you already have with less of yourself held back.\u003c/p>\n\u003cp>That is where the idea becomes worth something. In your life.\u003c/p>\n\u003cp>\u003ca href=\"#four-frequencies\">Meet your four frequencies\u003c/a>.\u003c/p>\n\u003ch2>Hear your own music\u003c/h2>\n\u003cp>New to Zodiac? \u003ca href=\"#birth-details\">Find your frequencies\u003c/a> and hear three short songs in each one without a card.\u003c/p>\n\u003cp>Already have your frequencies? \u003ca href=\"#free-listen\">Open your music\u003c/a> with the same account email.\u003c/p>\n","text":"The self you recognize\n\nSometimes a reading puts words to something you already knew. You hear a description of yourself and there is very little to argue with. Yes. That is me.\n\nThe recognition is personal. Nobody had to persuade you to have it.\n\nWe call the part of you that recognizes itself your connected self. It was there before family, school, work and the rest of life taught you who to be. It is also the part of you connected to everything and everyone else.\n\n You have probably met it already\n\nYou might know it through a practice. You might recognize it while making something, being with someone you love, or reaching a decision that is yours even before you can explain it.\n\nThe name is less important than that recognition. Soul, essence, higher self. Use the word that means something to you.\n\nWhat interests us is how available that connection can become while you live. When an offer arrives. When someone asks for your time. When a familiar argument begins and you have a chance to meet the person in front of you.\n\n Your signal is how you reach it\n\nThink of someone you love calling across a loud room. Their voice is not them. It is how you find them.\n\nThat is the distinction between your connected self and your signal. Zodiac works with the connection. The self is already whole.\n\nThe Vedic teaching of Nāda Brahma says the world is sound. A mantra lineage developed a method for finding four frequencies from the pattern present at birth. We put those frequencies into music to amplify your access to the connected self.\n\nYou listen as you live. Over time, what you recognize about yourself can become more available in how you choose, connect and meet the world.\n\n More of you belongs in your life\n\nThis can mean taking your own interests seriously, letting someone get closer, or knowing that a good opportunity is not your opportunity.\n\nIt can also mean enjoying what you already have with less of yourself held back.\n\nThat is where the idea becomes worth something. In your life.\n\nMeet your four frequencies.\n\n Hear your own music\n\nNew to Zodiac? Find your frequencies and hear three short songs in each one without a card.\n\nAlready have your frequencies? Open your music with the same account email.","copyText":"# The self you recognize\n\nSometimes a reading puts words to something you already knew. You hear a description of yourself and there is very little to argue with. Yes. That is me.\n\nThe recognition is personal. Nobody had to persuade you to have it.\n\nWe call the part of you that recognizes itself your connected self. It was there before family, school, work and the rest of life taught you who to be. It is also the part of you connected to everything and everyone else.\n\n## You have probably met it already\n\nYou might know it through a practice. You might recognize it while making something, being with someone you love, or reaching a decision that is yours even before you can explain it.\n\nThe name is less important than that recognition. Soul, essence, higher self. Use the word that means something to you.\n\nWhat interests us is how available that connection can become while you live. When an offer arrives. When someone asks for your time. When a familiar argument begins and you have a chance to meet the person in front of you.\n\n## Your signal is how you reach it\n\nThink of someone you love calling across a loud room. Their voice is not them. It is how you find them.\n\nThat is the distinction between your connected self and your signal. Zodiac works with the connection. The self is already whole.\n\nThe Vedic teaching of Nāda Brahma says the world is sound. A mantra lineage developed a method for finding four frequencies from the pattern present at birth. We put those frequencies into music to amplify your access to the connected self.\n\nYou listen as you live. Over time, what you recognize about yourself can become more available in how you choose, connect and meet the world.\n\n## More of you belongs in your life\n\nThis can mean taking your own interests seriously, letting someone get closer, or knowing that a good opportunity is not your opportunity.\n\nIt can also mean enjoying what you already have with less of yourself held back.\n\nThat is where the idea becomes worth something. In your life.\n\n[Meet your four frequencies](./four-frequencies.md).\n\n\n## Hear your own music\n\nNew to Zodiac? [Find your frequencies](../pages/birth-details.md) and hear three short songs in each one without a card.\n\nAlready have your frequencies? [Open your music](../pages/free-listen.md) with the same account email."},{"category":"Articles","slug":"four-frequencies","title":"What your four frequencies are for","label":"Articles","hasSourceH1":true,"html":"\u003ch1>What your four frequencies are for\u003c/h1>\n\u003cp>Your birth date, time and place give us four frequencies. Each is an actual musical pitch, measured in hertz. Together, they are your signal, the connection to your connected self.\u003c/p>\n\u003cp>The names tell you which part of life each one concerns.\u003c/p>\n\u003ch2>Core\u003c/h2>\n\u003cp>The signal for who you are and what is yours to do.\u003c/p>\n\u003cp>There are things you are drawn to without needing a case made for them. A kind of work, a way of making something, a part of yourself that keeps asking for room. Core concerns recognizing that as yours.\u003c/p>\n\u003ch2>Love\u003c/h2>\n\u003cp>The signal for who to let close and how to connect.\u003c/p>\n\u003cp>This includes the people you already love. Being more present in a conversation, letting yourself be known, or recognizing a boundary before you have agreed to something you don&#39;t want. Love is about your way of connecting. It does not score another person&#39;s suitability.\u003c/p>\n\u003ch2>Vitality\u003c/h2>\n\u003cp>The signal for what feeds you and what drains you.\u003c/p>\n\u003cp>Think of the difference between a full day that leaves you satisfied and one that costs you more than you expected. Vitality concerns recognizing your own energy and where you want to put it. It is not a health assessment.\u003c/p>\n\u003ch2>Abundance\u003c/h2>\n\u003cp>The signal for when to move and which opportunities are yours.\u003c/p>\n\u003cp>An opening can look good and still be wrong for you. Another may ask you to act before you have found the perfect explanation. Abundance concerns your own sense of timing, including when to wait.\u003c/p>\n\u003ch2>The frequencies stay yours\u003c/h2>\n\u003cp>Your four values fall between 250 and 950 Hz. They remain fixed as life and the sky change. A higher number does not make someone more spiritually developed.\u003c/p>\n\u003cp>Where do they come from? The Vedic teaching of Nāda Brahma understands the world as sound. A mantra lineage developed a method for finding the sound of the birth pattern. We use the frequency part of that method, then bring your frequencies into music.\u003c/p>\n\u003cp>The music carries one frequency at a time. All four belong in your listening week, because your life includes all four.\u003c/p>\n\u003cp>\u003ca href=\"#your-bands\">See how your bands add to the picture\u003c/a>.\u003c/p>\n\u003ch2>Hear your own music\u003c/h2>\n\u003cp>New to Zodiac? \u003ca href=\"#birth-details\">Find your frequencies\u003c/a> and hear three short songs in each one without a card.\u003c/p>\n\u003cp>Already have your frequencies? \u003ca href=\"#free-listen\">Open your music\u003c/a> with the same account email.\u003c/p>\n","text":"What your four frequencies are for\n\nYour birth date, time and place give us four frequencies. Each is an actual musical pitch, measured in hertz. Together, they are your signal, the connection to your connected self.\n\nThe names tell you which part of life each one concerns.\n\n Core\n\nThe signal for who you are and what is yours to do.\n\nThere are things you are drawn to without needing a case made for them. A kind of work, a way of making something, a part of yourself that keeps asking for room. Core concerns recognizing that as yours.\n\n Love\n\nThe signal for who to let close and how to connect.\n\nThis includes the people you already love. Being more present in a conversation, letting yourself be known, or recognizing a boundary before you have agreed to something you don't want. Love is about your way of connecting. It does not score another person's suitability.\n\n Vitality\n\nThe signal for what feeds you and what drains you.\n\nThink of the difference between a full day that leaves you satisfied and one that costs you more than you expected. Vitality concerns recognizing your own energy and where you want to put it. It is not a health assessment.\n\n Abundance\n\nThe signal for when to move and which opportunities are yours.\n\nAn opening can look good and still be wrong for you. Another may ask you to act before you have found the perfect explanation. Abundance concerns your own sense of timing, including when to wait.\n\n The frequencies stay yours\n\nYour four values fall between 250 and 950 Hz. They remain fixed as life and the sky change. A higher number does not make someone more spiritually developed.\n\nWhere do they come from? The Vedic teaching of Nāda Brahma understands the world as sound. A mantra lineage developed a method for finding the sound of the birth pattern. We use the frequency part of that method, then bring your frequencies into music.\n\nThe music carries one frequency at a time. All four belong in your listening week, because your life includes all four.\n\nSee how your bands add to the picture.\n\n Hear your own music\n\nNew to Zodiac? Find your frequencies and hear three short songs in each one without a card.\n\nAlready have your frequencies? Open your music with the same account email.","copyText":"# What your four frequencies are for\n\nYour birth date, time and place give us four frequencies. Each is an actual musical pitch, measured in hertz. Together, they are your signal, the connection to your connected self.\n\nThe names tell you which part of life each one concerns.\n\n## Core\n\nThe signal for who you are and what is yours to do.\n\nThere are things you are drawn to without needing a case made for them. A kind of work, a way of making something, a part of yourself that keeps asking for room. Core concerns recognizing that as yours.\n\n## Love\n\nThe signal for who to let close and how to connect.\n\nThis includes the people you already love. Being more present in a conversation, letting yourself be known, or recognizing a boundary before you have agreed to something you don't want. Love is about your way of connecting. It does not score another person's suitability.\n\n## Vitality\n\nThe signal for what feeds you and what drains you.\n\nThink of the difference between a full day that leaves you satisfied and one that costs you more than you expected. Vitality concerns recognizing your own energy and where you want to put it. It is not a health assessment.\n\n## Abundance\n\nThe signal for when to move and which opportunities are yours.\n\nAn opening can look good and still be wrong for you. Another may ask you to act before you have found the perfect explanation. Abundance concerns your own sense of timing, including when to wait.\n\n## The frequencies stay yours\n\nYour four values fall between 250 and 950 Hz. They remain fixed as life and the sky change. A higher number does not make someone more spiritually developed.\n\nWhere do they come from? The Vedic teaching of Nāda Brahma understands the world as sound. A mantra lineage developed a method for finding the sound of the birth pattern. We use the frequency part of that method, then bring your frequencies into music.\n\nThe music carries one frequency at a time. All four belong in your listening week, because your life includes all four.\n\n[See how your bands add to the picture](./your-bands.md).\n\n\n## Hear your own music\n\nNew to Zodiac? [Find your frequencies](../pages/birth-details.md) and hear three short songs in each one without a card.\n\nAlready have your frequencies? [Open your music](../pages/free-listen.md) with the same account email."},{"category":"Articles","slug":"what-to-expect","title":"The first song is the beginning","label":"Articles","hasSourceH1":true,"html":"\u003ch1>The first song is the beginning\u003c/h1>\n\u003cp>Your first listen can simply be a song you enjoy.\u003c/p>\n\u003cp>Some people notice something while the music is playing. Others describe a gradual instinctive knowing that becomes apparent later, in a decision or a conversation. You don&#39;t have to make a sensation happen to listen correctly.\u003c/p>\n\u003ch2>Look beyond the headphones\u003c/h2>\n\u003cp>The point is greater access to your connected self in everyday life.\u003c/p>\n\u003cp>A choice may become easier to recognize as yours. You might say what you mean with less rehearsal, see a familiar pattern sooner, or find yourself giving time to something you have always cared about.\u003c/p>\n\u003cp>Those are examples of the kinds of changes listeners describe. Your experience has room to be your own.\u003c/p>\n\u003ch2>Give it an ordinary week\u003c/h2>\n\u003cp>Choose music you enjoy and let all four frequencies have a place. The listening pattern behind our study was about nine minutes a day on average, with each frequency receiving at least 15 percent of weekly listening.\u003c/p>\n\u003cp>You can meditate with it or keep doing what you were doing. Missing a day doesn&#39;t erase the days before it.\u003c/p>\n\u003cp>If the music is uncomfortable, lower the volume, change the track or take a break. You don&#39;t need to push through discomfort to get something from Zodiac.\u003c/p>\n\u003ch2>There is no date you have to become different\u003c/h2>\n\u003cp>In our year-long internal study, 61 percent of people who listened as designed reported a clear shift by month one, 81 percent by month three and 87 percent by month six. Those figures describe the group, not an individual schedule.\u003c/p>\n\u003cp>Some weeks can be quiet. You will still have hard decisions and old reactions. Listening is not a test of whether you can become perfectly calm.\u003c/p>\n\u003cp>Give the music a place in your life, then notice your life. That is where this becomes personal.\u003c/p>\n\u003cp>\u003ca href=\"#the-year-long-study\">See how the study was conducted\u003c/a>.\u003c/p>\n\u003ch2>Hear your own music\u003c/h2>\n\u003cp>New to Zodiac? \u003ca href=\"#birth-details\">Find your frequencies\u003c/a> and hear three short songs in each one without a card.\u003c/p>\n\u003cp>Already have your frequencies? \u003ca href=\"#free-listen\">Open your music\u003c/a> with the same account email.\u003c/p>\n","text":"The first song is the beginning\n\nYour first listen can simply be a song you enjoy.\n\nSome people notice something while the music is playing. Others describe a gradual instinctive knowing that becomes apparent later, in a decision or a conversation. You don't have to make a sensation happen to listen correctly.\n\n Look beyond the headphones\n\nThe point is greater access to your connected self in everyday life.\n\nA choice may become easier to recognize as yours. You might say what you mean with less rehearsal, see a familiar pattern sooner, or find yourself giving time to something you have always cared about.\n\nThose are examples of the kinds of changes listeners describe. Your experience has room to be your own.\n\n Give it an ordinary week\n\nChoose music you enjoy and let all four frequencies have a place. The listening pattern behind our study was about nine minutes a day on average, with each frequency receiving at least 15 percent of weekly listening.\n\nYou can meditate with it or keep doing what you were doing. Missing a day doesn't erase the days before it.\n\nIf the music is uncomfortable, lower the volume, change the track or take a break. You don't need to push through discomfort to get something from Zodiac.\n\n There is no date you have to become different\n\nIn our year-long internal study, 61 percent of people who listened as designed reported a clear shift by month one, 81 percent by month three and 87 percent by month six. Those figures describe the group, not an individual schedule.\n\nSome weeks can be quiet. You will still have hard decisions and old reactions. Listening is not a test of whether you can become perfectly calm.\n\nGive the music a place in your life, then notice your life. That is where this becomes personal.\n\nSee how the study was conducted.\n\n Hear your own music\n\nNew to Zodiac? Find your frequencies and hear three short songs in each one without a card.\n\nAlready have your frequencies? Open your music with the same account email.","copyText":"# The first song is the beginning\n\nYour first listen can simply be a song you enjoy.\n\nSome people notice something while the music is playing. Others describe a gradual instinctive knowing that becomes apparent later, in a decision or a conversation. You don't have to make a sensation happen to listen correctly.\n\n## Look beyond the headphones\n\nThe point is greater access to your connected self in everyday life.\n\nA choice may become easier to recognize as yours. You might say what you mean with less rehearsal, see a familiar pattern sooner, or find yourself giving time to something you have always cared about.\n\nThose are examples of the kinds of changes listeners describe. Your experience has room to be your own.\n\n## Give it an ordinary week\n\nChoose music you enjoy and let all four frequencies have a place. The listening pattern behind our study was about nine minutes a day on average, with each frequency receiving at least 15 percent of weekly listening.\n\nYou can meditate with it or keep doing what you were doing. Missing a day doesn't erase the days before it.\n\nIf the music is uncomfortable, lower the volume, change the track or take a break. You don't need to push through discomfort to get something from Zodiac.\n\n## There is no date you have to become different\n\nIn our year-long internal study, 61 percent of people who listened as designed reported a clear shift by month one, 81 percent by month three and 87 percent by month six. Those figures describe the group, not an individual schedule.\n\nSome weeks can be quiet. You will still have hard decisions and old reactions. Listening is not a test of whether you can become perfectly calm.\n\nGive the music a place in your life, then notice your life. That is where this becomes personal.\n\n[See how the study was conducted](./the-year-long-study.md).\n\n\n## Hear your own music\n\nNew to Zodiac? [Find your frequencies](../pages/birth-details.md) and hear three short songs in each one without a card.\n\nAlready have your frequencies? [Open your music](../pages/free-listen.md) with the same account email."},{"category":"Articles","slug":"your-bands","title":"Four ways of getting clear","label":"Articles","hasSourceH1":true,"html":"\u003ch1>Four ways of getting clear\u003c/h1>\n\u003cp>Some people need to sit with a question. Others start to understand it while doing something. You may hear your own answer halfway through explaining the situation to a friend.\u003c/p>\n\u003cp>Those are different ways of getting clear. Your bands give them a name.\u003c/p>\n\u003cp>Each of your four frequencies falls within a band. You can have one band for Core and another for Love, Vitality or Abundance.\u003c/p>\n\u003ch2>Root\u003c/h2>\n\u003cp>Root spans 250 to 425 Hz. It is associated with grounding, stillness and steadiness.\u003c/p>\n\u003cp>You may recognize the value of settling before you decide. What somebody calls slow can be the time you need to know where you stand.\u003c/p>\n\u003ch2>Solar Plexus\u003c/h2>\n\u003cp>Solar Plexus spans 425 to 600 Hz. It is associated with motion, action and engagement.\u003c/p>\n\u003cp>Doing something can help you understand what thinking alone has not settled. Movement gives the question somewhere to go.\u003c/p>\n\u003ch2>Throat\u003c/h2>\n\u003cp>Throat spans 600 to 775 Hz. It is associated with speaking, writing and expression.\u003c/p>\n\u003cp>You may need to say it before you know what you think. Talking it through can be part of arriving at the answer.\u003c/p>\n\u003ch2>Crown\u003c/h2>\n\u003cp>Crown spans 775 to 950 Hz. It is associated with perspective, patterns and the larger picture.\u003c/p>\n\u003cp>The next move can make more sense once you understand how the pieces fit. That wider view is part of getting clear.\u003c/p>\n\u003ch2>A preference, with room around it\u003c/h2>\n\u003cp>Everybody uses all four ways. A band describes your preferred route within that part of life, not the only route available to you.\u003c/p>\n\u003cp>If your frequency falls in the top third of Root, Solar Plexus or Throat, it keeps its home band while carrying some qualities of the next band up. Crown has no next-band addition.\u003c/p>\n\u003cp>Higher means pitch, not spiritual rank.\u003c/p>\n\u003cp>Your results give the specific description for each of your four pairings. Read it as a way to recognize how you work, with the judgment taken off.\u003c/p>\n\u003cp>\u003ca href=\"#four-frequencies\">Return to the four frequencies\u003c/a>.\u003c/p>\n\u003ch2>Hear your own music\u003c/h2>\n\u003cp>New to Zodiac? \u003ca href=\"#birth-details\">Find your frequencies\u003c/a> and hear three short songs in each one without a card.\u003c/p>\n\u003cp>Already have your frequencies? \u003ca href=\"#free-listen\">Open your music\u003c/a> with the same account email.\u003c/p>\n","text":"Four ways of getting clear\n\nSome people need to sit with a question. Others start to understand it while doing something. You may hear your own answer halfway through explaining the situation to a friend.\n\nThose are different ways of getting clear. Your bands give them a name.\n\nEach of your four frequencies falls within a band. You can have one band for Core and another for Love, Vitality or Abundance.\n\n Root\n\nRoot spans 250 to 425 Hz. It is associated with grounding, stillness and steadiness.\n\nYou may recognize the value of settling before you decide. What somebody calls slow can be the time you need to know where you stand.\n\n Solar Plexus\n\nSolar Plexus spans 425 to 600 Hz. It is associated with motion, action and engagement.\n\nDoing something can help you understand what thinking alone has not settled. Movement gives the question somewhere to go.\n\n Throat\n\nThroat spans 600 to 775 Hz. It is associated with speaking, writing and expression.\n\nYou may need to say it before you know what you think. Talking it through can be part of arriving at the answer.\n\n Crown\n\nCrown spans 775 to 950 Hz. It is associated with perspective, patterns and the larger picture.\n\nThe next move can make more sense once you understand how the pieces fit. That wider view is part of getting clear.\n\n A preference, with room around it\n\nEverybody uses all four ways. A band describes your preferred route within that part of life, not the only route available to you.\n\nIf your frequency falls in the top third of Root, Solar Plexus or Throat, it keeps its home band while carrying some qualities of the next band up. Crown has no next-band addition.\n\nHigher means pitch, not spiritual rank.\n\nYour results give the specific description for each of your four pairings. Read it as a way to recognize how you work, with the judgment taken off.\n\nReturn to the four frequencies.\n\n Hear your own music\n\nNew to Zodiac? Find your frequencies and hear three short songs in each one without a card.\n\nAlready have your frequencies? Open your music with the same account email.","copyText":"# Four ways of getting clear\n\nSome people need to sit with a question. Others start to understand it while doing something. You may hear your own answer halfway through explaining the situation to a friend.\n\nThose are different ways of getting clear. Your bands give them a name.\n\nEach of your four frequencies falls within a band. You can have one band for Core and another for Love, Vitality or Abundance.\n\n## Root\n\nRoot spans 250 to 425 Hz. It is associated with grounding, stillness and steadiness.\n\nYou may recognize the value of settling before you decide. What somebody calls slow can be the time you need to know where you stand.\n\n## Solar Plexus\n\nSolar Plexus spans 425 to 600 Hz. It is associated with motion, action and engagement.\n\nDoing something can help you understand what thinking alone has not settled. Movement gives the question somewhere to go.\n\n## Throat\n\nThroat spans 600 to 775 Hz. It is associated with speaking, writing and expression.\n\nYou may need to say it before you know what you think. Talking it through can be part of arriving at the answer.\n\n## Crown\n\nCrown spans 775 to 950 Hz. It is associated with perspective, patterns and the larger picture.\n\nThe next move can make more sense once you understand how the pieces fit. That wider view is part of getting clear.\n\n## A preference, with room around it\n\nEverybody uses all four ways. A band describes your preferred route within that part of life, not the only route available to you.\n\nIf your frequency falls in the top third of Root, Solar Plexus or Throat, it keeps its home band while carrying some qualities of the next band up. Crown has no next-band addition.\n\nHigher means pitch, not spiritual rank.\n\nYour results give the specific description for each of your four pairings. Read it as a way to recognize how you work, with the judgment taken off.\n\n[Return to the four frequencies](./four-frequencies.md).\n\n\n## Hear your own music\n\nNew to Zodiac? [Find your frequencies](../pages/birth-details.md) and hear three short songs in each one without a card.\n\nAlready have your frequencies? [Open your music](../pages/free-listen.md) with the same account email."},{"category":"Articles","slug":"music-and-longer-tracks","title":"Music you can stay with","label":"Articles","hasSourceH1":true,"html":"\u003ch1>Music you can stay with\u003c/h1>\n\u003cp>Sometimes you have a few minutes. Sometimes you are settling in to work, meditate or read and would rather leave the music alone.\u003c/p>\n\u003cp>That is why Zodiac has different lengths. Your three short songs in each frequency remain free. Membership adds the longer tracks, including nine-minute immersions, extended listening and an hour-long track.\u003c/p>\n\u003cp>The extra time is useful because you can stay with what you are doing. Your frequency keeps playing inside the music.\u003c/p>\n\u003ch2>The song is tuned around your frequency\u003c/h2>\n\u003cp>Your frequency is an exact pitch. It usually falls between the notes a song was originally written around.\u003c/p>\n\u003cp>If we simply laid it over the recording, the two could clash. Instead, audio engineers retune the music until your frequency belongs inside its harmony. The frequency itself stays where it is.\u003c/p>\n\u003cp>Every composition goes through this for all 701 whole frequencies from 250 to 950 Hz. Real musicians make the songs, and the work behind each version is what lets your part remain simple.\u003c/p>\n\u003ch2>Choose the music for the moment\u003c/h2>\n\u003cp>A short song can fit a break. A longer piece can play while you work or meditate, with no need to keep selecting another track.\u003c/p>\n\u003cp>You can use slower music for winding down or sleep. Choose something else when you need to stay alert.\u003c/p>\n\u003cp>Length changes how the music fits your day. It doesn&#39;t make one song spiritually better than another, and it doesn&#39;t change your birth frequencies.\u003c/p>\n\u003cp>Keep all four frequencies in your week. Then let your taste have a say. You are going to be listening.\u003c/p>\n\u003cp>\u003ca href=\"#how-to-listen\">Start with the listening guide\u003c/a>.\u003c/p>\n\u003ch2>Hear your own music\u003c/h2>\n\u003cp>New to Zodiac? \u003ca href=\"#birth-details\">Find your frequencies\u003c/a> and hear three short songs in each one without a card.\u003c/p>\n\u003cp>Already have your frequencies? \u003ca href=\"#free-listen\">Open your music\u003c/a> with the same account email.\u003c/p>\n","text":"Music you can stay with\n\nSometimes you have a few minutes. Sometimes you are settling in to work, meditate or read and would rather leave the music alone.\n\nThat is why Zodiac has different lengths. Your three short songs in each frequency remain free. Membership adds the longer tracks, including nine-minute immersions, extended listening and an hour-long track.\n\nThe extra time is useful because you can stay with what you are doing. Your frequency keeps playing inside the music.\n\n The song is tuned around your frequency\n\nYour frequency is an exact pitch. It usually falls between the notes a song was originally written around.\n\nIf we simply laid it over the recording, the two could clash. Instead, audio engineers retune the music until your frequency belongs inside its harmony. The frequency itself stays where it is.\n\nEvery composition goes through this for all 701 whole frequencies from 250 to 950 Hz. Real musicians make the songs, and the work behind each version is what lets your part remain simple.\n\n Choose the music for the moment\n\nA short song can fit a break. A longer piece can play while you work or meditate, with no need to keep selecting another track.\n\nYou can use slower music for winding down or sleep. Choose something else when you need to stay alert.\n\nLength changes how the music fits your day. It doesn't make one song spiritually better than another, and it doesn't change your birth frequencies.\n\nKeep all four frequencies in your week. Then let your taste have a say. You are going to be listening.\n\nStart with the listening guide.\n\n Hear your own music\n\nNew to Zodiac? Find your frequencies and hear three short songs in each one without a card.\n\nAlready have your frequencies? Open your music with the same account email.","copyText":"# Music you can stay with\n\nSometimes you have a few minutes. Sometimes you are settling in to work, meditate or read and would rather leave the music alone.\n\nThat is why Zodiac has different lengths. Your three short songs in each frequency remain free. Membership adds the longer tracks, including nine-minute immersions, extended listening and an hour-long track.\n\nThe extra time is useful because you can stay with what you are doing. Your frequency keeps playing inside the music.\n\n## The song is tuned around your frequency\n\nYour frequency is an exact pitch. It usually falls between the notes a song was originally written around.\n\nIf we simply laid it over the recording, the two could clash. Instead, audio engineers retune the music until your frequency belongs inside its harmony. The frequency itself stays where it is.\n\nEvery composition goes through this for all 701 whole frequencies from 250 to 950 Hz. Real musicians make the songs, and the work behind each version is what lets your part remain simple.\n\n## Choose the music for the moment\n\nA short song can fit a break. A longer piece can play while you work or meditate, with no need to keep selecting another track.\n\nYou can use slower music for winding down or sleep. Choose something else when you need to stay alert.\n\nLength changes how the music fits your day. It doesn't make one song spiritually better than another, and it doesn't change your birth frequencies.\n\nKeep all four frequencies in your week. Then let your taste have a say. You are going to be listening.\n\n[Start with the listening guide](./how-to-listen.md).\n\n\n## Hear your own music\n\nNew to Zodiac? [Find your frequencies](../pages/birth-details.md) and hear three short songs in each one without a card.\n\nAlready have your frequencies? [Open your music](../pages/free-listen.md) with the same account email."},{"category":"Articles","slug":"readings-and-birth-sound","title":"Living what your chart describes","label":"Articles","hasSourceH1":true,"html":"\u003ch1>Living what your chart describes\u003c/h1>\n\u003cp>There is a particular pleasure in being described accurately. A trait you have spent years explaining suddenly makes sense. Someone names the pattern, and you recognize yourself.\u003c/p>\n\u003cp>A reading can do that. It can give you compassion for your nature and context for the chapter you are in.\u003c/p>\n\u003cp>Now imagine that recognition becoming more available while you live. In the conversation itself. At the point of choosing. When you need to know whether to move or give something time.\u003c/p>\n\u003cp>That is the possibility behind Zodiac.\u003c/p>\n\u003ch2>The pattern can be approached through sound\u003c/h2>\n\u003cp>Nāda Brahma is the Vedic teaching that the world is sound. Within that understanding, the pattern present at birth has a sound too.\u003c/p>\n\u003cp>A mantra lineage developed a method for finding it. We use the frequency part of that method to derive four frequencies from your birth date, time and place, then put them into music.\u003c/p>\n\u003cp>Listening amplifies your access to the connected self. The nature you recognize in a reading can become something you recognize from within, while the day is happening.\u003c/p>\n\u003ch2>Your timing, through a changing sky\u003c/h2>\n\u003cp>If you follow astrology, a transit or return can give language to a change you are already living. Progressions and profections can put that chapter in a larger frame.\u003c/p>\n\u003cp>Your birth frequencies remain fixed through it. Zodiac does not mix today&#39;s sky into a new set of tones. Your own signal is the steady reference.\u003c/p>\n\u003cp>The appeal is being more connected to your nature as you meet the change. You can value the reading and still want that access when you are making a choice, not only while discussing one.\u003c/p>\n\u003ch2>Your design, with room to live it\u003c/h2>\n\u003cp>Human Design gives specific language to Type, Strategy and Authority, and to patterns in Centers, profile and incarnation cross.\u003c/p>\n\u003cp>Living that design is personal. For someone whose Authority involves emotional clarity over time, a clearer connection with themselves can include knowing to wait. Intuition is not a command to act on the first impulse.\u003c/p>\n\u003cp>Zodiac does not calculate each of those chart components into a separate tone or teach their meanings through music. Its contribution is access to the self you are learning about.\u003c/p>\n\u003cp>Keep the language and context that help you. The music can come with you into the parts of life where you use them.\u003c/p>\n\u003cp>\u003ca href=\"#where-zodiac-comes-from\">Read where the frequencies come from\u003c/a>.\u003c/p>\n\u003ch2>Hear your own music\u003c/h2>\n\u003cp>New to Zodiac? \u003ca href=\"#birth-details\">Find your frequencies\u003c/a> and hear three short songs in each one without a card.\u003c/p>\n\u003cp>Already have your frequencies? \u003ca href=\"#free-listen\">Open your music\u003c/a> with the same account email.\u003c/p>\n","text":"Living what your chart describes\n\nThere is a particular pleasure in being described accurately. A trait you have spent years explaining suddenly makes sense. Someone names the pattern, and you recognize yourself.\n\nA reading can do that. It can give you compassion for your nature and context for the chapter you are in.\n\nNow imagine that recognition becoming more available while you live. In the conversation itself. At the point of choosing. When you need to know whether to move or give something time.\n\nThat is the possibility behind Zodiac.\n\n The pattern can be approached through sound\n\nNāda Brahma is the Vedic teaching that the world is sound. Within that understanding, the pattern present at birth has a sound too.\n\nA mantra lineage developed a method for finding it. We use the frequency part of that method to derive four frequencies from your birth date, time and place, then put them into music.\n\nListening amplifies your access to the connected self. The nature you recognize in a reading can become something you recognize from within, while the day is happening.\n\n Your timing, through a changing sky\n\nIf you follow astrology, a transit or return can give language to a change you are already living. Progressions and profections can put that chapter in a larger frame.\n\nYour birth frequencies remain fixed through it. Zodiac does not mix today's sky into a new set of tones. Your own signal is the steady reference.\n\nThe appeal is being more connected to your nature as you meet the change. You can value the reading and still want that access when you are making a choice, not only while discussing one.\n\n Your design, with room to live it\n\nHuman Design gives specific language to Type, Strategy and Authority, and to p
