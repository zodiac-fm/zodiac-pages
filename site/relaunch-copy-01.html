"hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> When a reading gives you words for yourself\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Zodiac explores another route to that recognition, through sound.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>If astrology is part of your life, you may know the pleasure of a reading that names something accurately. You recognize yourself, and now you have words for what you recognize.\u003c/p>\n\u003cp>Zodiac begins with the possibility that this connection can become more available while you live, beyond the reading itself.\u003c/p>\n\u003cp>Its origin is the Vedic teaching of Nāda Brahma, the idea that reality is sound. A mantra lineage developed a way to hear the birth pattern. Zodiac brings your four fixed birth frequencies into music to amplify your connection with your connected self.\u003c/p>\n\u003cp>So a reading can help you understand a transition, while listening accompanies your own response to it. The frequencies don&#39;t change with a transit, return or progression. They remain a steady reference as the sky and your circumstances move.\u003c/p>\n\u003cp>Keep the interpretations that help you. Look at how they meet the choices you actually face, and leave room for what you discover yourself.\u003c/p>\n\u003cp>Your own life supplies the questions, even if you&#39;ve never learned the vocabulary of a chart.\u003c/p>\n\u003cp>\u003ca href=\"#readings-and-birth-sound\">Read about readings and Zodiac\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: When a reading gives you words for yourself\n\nPreheader: Zodiac explores another route to that recognition, through sound.\n\nHi {{givenname}},\n\nIf astrology is part of your life, you may know the pleasure of a reading that names something accurately. You recognize yourself, and now you have words for what you recognize.\n\nZodiac begins with the possibility that this connection can become more available while you live, beyond the reading itself.\n\nIts origin is the Vedic teaching of Nāda Brahma, the idea that reality is sound. A mantra lineage developed a way to hear the birth pattern. Zodiac brings your four fixed birth frequencies into music to amplify your connection with your connected self.\n\nSo a reading can help you understand a transition, while listening accompanies your own response to it. The frequencies don't change with a transit, return or progression. They remain a steady reference as the sky and your circumstances move.\n\nKeep the interpretations that help you. Look at how they meet the choices you actually face, and leave room for what you discover yourself.\n\nYour own life supplies the questions, even if you've never learned the vocabulary of a chart.\n\nRead about readings and Zodiac\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** When a reading gives you words for yourself\n\n**Preheader:** Zodiac explores another route to that recognition, through sound.\n\nHi {{given_name}},\n\nIf astrology is part of your life, you may know the pleasure of a reading that names something accurately. You recognize yourself, and now you have words for what you recognize.\n\nZodiac begins with the possibility that this connection can become more available while you live, beyond the reading itself.\n\nIts origin is the Vedic teaching of Nāda Brahma, the idea that reality is sound. A mantra lineage developed a way to hear the birth pattern. Zodiac brings your four fixed birth frequencies into music to amplify your connection with your connected self.\n\nSo a reading can help you understand a transition, while listening accompanies your own response to it. The frequencies don't change with a transit, return or progression. They remain a steady reference as the sky and your circumstances move.\n\nKeep the interpretations that help you. Look at how they meet the choices you actually face, and leave room for what you discover yourself.\n\nYour own life supplies the questions, even if you've never learned the vocabulary of a chart.\n\n[Read about readings and Zodiac]({{article_09_readings}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m09","title":"M09 · Recognizing the pattern","label":"Review email · M09","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> You can notice a pattern without solving it today\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Recognition gives you somewhere to begin.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>Perhaps you hear yourself agree to something, then realize you wanted time to consider it. Or you recognize a familiar argument before it has gone very far.\u003c/p>\n\u003cp>That moment of recognition has value. You can see something while it is happening, even if you haven&#39;t worked out what to do differently yet.\u003c/p>\n\u003cp>Zodiac&#39;s intended progression begins with repeated contact through the music. Your own reference can become easier to distinguish, then easier to recognize again in different situations. Living from that recognition takes time.\u003c/p>\n\u003cp>These experiences overlap. An old pattern can return in a new situation without making earlier understanding meaningless. You still have a real conversation to work through.\u003c/p>\n\u003cp>If a recent moment comes to mind, give it a fair look. What did you recognize? What would you like to bring to a similar moment next time?\u003c/p>\n\u003cp>The reflection is optional. Listening can remain part of the day without making the whole day a self-observation exercise.\u003c/p>\n\u003cp>\u003ca href=\"#what-to-expect\">Read how the experience can unfold\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: You can notice a pattern without solving it today\n\nPreheader: Recognition gives you somewhere to begin.\n\nHi {{givenname}},\n\nPerhaps you hear yourself agree to something, then realize you wanted time to consider it. Or you recognize a familiar argument before it has gone very far.\n\nThat moment of recognition has value. You can see something while it is happening, even if you haven't worked out what to do differently yet.\n\nZodiac's intended progression begins with repeated contact through the music. Your own reference can become easier to distinguish, then easier to recognize again in different situations. Living from that recognition takes time.\n\nThese experiences overlap. An old pattern can return in a new situation without making earlier understanding meaningless. You still have a real conversation to work through.\n\nIf a recent moment comes to mind, give it a fair look. What did you recognize? What would you like to bring to a similar moment next time?\n\nThe reflection is optional. Listening can remain part of the day without making the whole day a self-observation exercise.\n\nRead how the experience can unfold\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** You can notice a pattern without solving it today\n\n**Preheader:** Recognition gives you somewhere to begin.\n\nHi {{given_name}},\n\nPerhaps you hear yourself agree to something, then realize you wanted time to consider it. Or you recognize a familiar argument before it has gone very far.\n\nThat moment of recognition has value. You can see something while it is happening, even if you haven't worked out what to do differently yet.\n\nZodiac's intended progression begins with repeated contact through the music. Your own reference can become easier to distinguish, then easier to recognize again in different situations. Living from that recognition takes time.\n\nThese experiences overlap. An old pattern can return in a new situation without making earlier understanding meaningless. You still have a real conversation to work through.\n\nIf a recent moment comes to mind, give it a fair look. What did you recognize? What would you like to bring to a similar moment next time?\n\nThe reflection is optional. Listening can remain part of the day without making the whole day a self-observation exercise.\n\n[Read how the experience can unfold]({{article_06_expectations}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m10","title":"M10 · Permission without a project","label":"Review email · M10","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Let one preference be yours\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> An optional way to notice what you already know about yourself.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>There are ordinary things you know you like. Perhaps you enjoy making something with your hands, or a conversation with no reason to rush. You know when you&#39;d like time to think before answering.\u003c/p>\n\u003cp>Sometimes those preferences need no explanation. Sometimes you catch yourself preparing a defense of them before anyone has objected.\u003c/p>\n\u003cp>Here is an optional way to tune in. Notice one preference today and let yourself acknowledge it plainly. You can like what you like without turning it into a statement about how everyone else should live.\u003c/p>\n\u003cp>This is a small use of the larger idea behind Zodiac. The connected self is already whole. The music works with your connection to it, so what is yours can become easier to recognize amid the other voices in your day.\u003c/p>\n\u003cp>You can bring that attention into a practice you already value, or leave the exercise here and listen. Nothing extra is required for the music.\u003c/p>\n\u003cp>For the next ordinary choice, there might be room to include your own preference alongside the practical needs of the people involved.\u003c/p>\n\u003cp>\u003ca href=\"#your-bands\">Explore the four ways of getting clear\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: Let one preference be yours\n\nPreheader: An optional way to notice what you already know about yourself.\n\nHi {{givenname}},\n\nThere are ordinary things you know you like. Perhaps you enjoy making something with your hands, or a conversation with no reason to rush. You know when you'd like time to think before answering.\n\nSometimes those preferences need no explanation. Sometimes you catch yourself preparing a defense of them before anyone has objected.\n\nHere is an optional way to tune in. Notice one preference today and let yourself acknowledge it plainly. You can like what you like without turning it into a statement about how everyone else should live.\n\nThis is a small use of the larger idea behind Zodiac. The connected self is already whole. The music works with your connection to it, so what is yours can become easier to recognize amid the other voices in your day.\n\nYou can bring that attention into a practice you already value, or leave the exercise here and listen. Nothing extra is required for the music.\n\nFor the next ordinary choice, there might be room to include your own preference alongside the practical needs of the people involved.\n\nExplore the four ways of getting clear\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** Let one preference be yours\n\n**Preheader:** An optional way to notice what you already know about yourself.\n\nHi {{given_name}},\n\nThere are ordinary things you know you like. Perhaps you enjoy making something with your hands, or a conversation with no reason to rush. You know when you'd like time to think before answering.\n\nSometimes those preferences need no explanation. Sometimes you catch yourself preparing a defense of them before anyone has objected.\n\nHere is an optional way to tune in. Notice one preference today and let yourself acknowledge it plainly. You can like what you like without turning it into a statement about how everyone else should live.\n\nThis is a small use of the larger idea behind Zodiac. The connected self is already whole. The music works with your connection to it, so what is yours can become easier to recognize amid the other voices in your day.\n\nYou can bring that attention into a practice you already value, or leave the exercise here and listen. Nothing extra is required for the music.\n\nFor the next ordinary choice, there might be room to include your own preference alongside the practical needs of the people involved.\n\n[Explore the four ways of getting clear]({{article_11_exercises}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m11","title":"M11 · A listener's words","label":"Review email · M11","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> What Katie Wells calls coming home\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Her words name an experience. Yours has room to be different.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>Katie Wells, founder of Wellness Mama and best-selling author, described her experience of Zodiac this way:\u003c/p>\n\u003cp>“Listening to my frequency immersion feels like coming home to myself.”\u003c/p>\n\u003cp>Those are her words, and they get at something we care about. Coming home is a way of describing recognition. There is less distance between what you know of yourself and the person taking part in your life.\u003c/p>\n\u003cp>That can mean something different to each listener. You might think of being more present with someone you love, or recognizing which work you want to make room for. Another person&#39;s description can give you language without deciding what your own experience should be.\u003c/p>\n\u003cp>The connected self is the part of you we understand as connected with everything and everyone else. It is already whole. Your four frequencies are the signal through which that connection can become more available.\u003c/p>\n\u003cp>Katie&#39;s words aren&#39;t an instruction to recreate a feeling during a song. Let the music accompany your day, and leave the meaning of your experience open to what you actually find.\u003c/p>\n\u003cp>\u003ca href=\"#connected-self\">Read about the connected self\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: What Katie Wells calls coming home\n\nPreheader: Her words name an experience. Yours has room to be different.\n\nHi {{givenname}},\n\nKatie Wells, founder of Wellness Mama and best-selling author, described her experience of Zodiac this way:\n\n“Listening to my frequency immersion feels like coming home to myself.”\n\nThose are her words, and they get at something we care about. Coming home is a way of describing recognition. There is less distance between what you know of yourself and the person taking part in your life.\n\nThat can mean something different to each listener. You might think of being more present with someone you love, or recognizing which work you want to make room for. Another person's description can give you language without deciding what your own experience should be.\n\nThe connected self is the part of you we understand as connected with everything and everyone else. It is already whole. Your four frequencies are the signal through which that connection can become more available.\n\nKatie's words aren't an instruction to recreate a feeling during a song. Let the music accompany your day, and leave the meaning of your experience open to what you actually find.\n\nRead about the connected self\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** What Katie Wells calls coming home\n\n**Preheader:** Her words name an experience. Yours has room to be different.\n\nHi {{given_name}},\n\nKatie Wells, founder of Wellness Mama and best-selling author, described her experience of Zodiac this way:\n\n“Listening to my frequency immersion feels like coming home to myself.”\n\nThose are her words, and they get at something we care about. Coming home is a way of describing recognition. There is less distance between what you know of yourself and the person taking part in your life.\n\nThat can mean something different to each listener. You might think of being more present with someone you love, or recognizing which work you want to make room for. Another person's description can give you language without deciding what your own experience should be.\n\nThe connected self is the part of you we understand as connected with everything and everyone else. It is already whole. Your four frequencies are the signal through which that connection can become more available.\n\nKatie's words aren't an instruction to recreate a feeling during a song. Let the music accompany your day, and leave the meaning of your experience open to what you actually find.\n\n[Read about the connected self]({{article_03_connected_self}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m12","title":"M12 · The three-month check-in","label":"Review email · M12","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> What has become easier to recognize?\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Three months gives you a little more life to look back over.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>After three months, there is more to look back on than individual listening sessions. Think about the conversations, choices and ordinary days in between.\u003c/p>\n\u003cp>Is there something you recognize about yourself more readily now? Perhaps you know sooner when you need time, or find it easier to say what you mean. A mixed answer belongs here too.\u003c/p>\n\u003cp>In Zodiac&#39;s year-long internal study, 81 percent of participants who listened as designed reported a clear shift by month three. That meant at least nine minutes a day on average across the week, with at least 15 percent of listening in each frequency.\u003c/p>\n\u003cp>Zodiac coded participants&#39; own reports. This wasn&#39;t a clinical trial, and the finding describes that group rather than a stage every member should reach.\u003c/p>\n\u003cp>Return to any note you made at your first-month check-in. What still seems true, and what would you describe differently with more experience behind you?\u003c/p>\n\u003cp>There is room for a complicated answer. Keep listening in a way that includes all four frequencies, and let the next stretch belong to your actual life.\u003c/p>\n\u003cp>\u003ca href=\"#the-year-long-study\">Read the study and its limits\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: What has become easier to recognize?\n\nPreheader: Three months gives you a little more life to look back over.\n\nHi {{givenname}},\n\nAfter three months, there is more to look back on than individual listening sessions. Think about the conversations, choices and ordinary days in between.\n\nIs there something you recognize about yourself more readily now? Perhaps you know sooner when you need time, or find it easier to say what you mean. A mixed answer belongs here too.\n\nIn Zodiac's year-long internal study, 81 percent of participants who listened as designed reported a clear shift by month three. That meant at least nine minutes a day on average across the week, with at least 15 percent of listening in each frequency.\n\nZodiac coded participants' own reports. This wasn't a clinical trial, and the finding describes that group rather than a stage every member should reach.\n\nReturn to any note you made at your first-month check-in. What still seems true, and what would you describe differently with more experience behind you?\n\nThere is room for a complicated answer. Keep listening in a way that includes all four frequencies, and let the next stretch belong to your actual life.\n\nRead the study and its limits\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** What has become easier to recognize?\n\n**Preheader:** Three months gives you a little more life to look back over.\n\nHi {{given_name}},\n\nAfter three months, there is more to look back on than individual listening sessions. Think about the conversations, choices and ordinary days in between.\n\nIs there something you recognize about yourself more readily now? Perhaps you know sooner when you need time, or find it easier to say what you mean. A mixed answer belongs here too.\n\nIn Zodiac's year-long internal study, 81 percent of participants who listened as designed reported a clear shift by month three. That meant at least nine minutes a day on average across the week, with at least 15 percent of listening in each frequency.\n\nZodiac coded participants' own reports. This wasn't a clinical trial, and the finding describes that group rather than a stage every member should reach.\n\nReturn to any note you made at your first-month check-in. What still seems true, and what would you describe differently with more experience behind you?\n\nThere is room for a complicated answer. Keep listening in a way that includes all four frequencies, and let the next stretch belong to your actual life.\n\n[Read the study and its limits]({{article_13_study}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m13","title":"M13 · Already whole, still discovering","label":"Review email · M13","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> There is more to know about a life you like\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Self-connection can deepen what already matters to you.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>You can like your life and still be curious about yourself. A good relationship has more to discover. Work you care about can ask you to grow in a direction you hadn&#39;t considered before. A choice can be interesting without arriving as a crisis.\u003c/p>\n\u003cp>That matters to the way we understand Zodiac. The connected self is already whole. Listening doesn&#39;t earn you a more complete self or replace the person who built the life you value.\u003c/p>\n\u003cp>The music amplifies the signal connecting you with that self, so your own nature can become more available in what comes next.\u003c/p>\n\u003cp>Think of someone you love spending time with. What would you enjoy bringing more of to that relationship, including the things you already do well together? You could follow a curiosity they mention or make time for an unhurried conversation.\u003c/p>\n\u003cp>There is no required answer. The useful part is letting your interest move toward life itself.\u003c/p>\n\u003cp>Your listening can accompany that. Self-knowledge has somewhere to go when there are people and possibilities you want to meet.\u003c/p>\n\u003cp>\u003ca href=\"#connected-self\">Read about your connected self\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: There is more to know about a life you like\n\nPreheader: Self-connection can deepen what already matters to you.\n\nHi {{givenname}},\n\nYou can like your life and still be curious about yourself. A good relationship has more to discover. Work you care about can ask you to grow in a direction you hadn't considered before. A choice can be interesting without arriving as a crisis.\n\nThat matters to the way we understand Zodiac. The connected self is already whole. Listening doesn't earn you a more complete self or replace the person who built the life you value.\n\nThe music amplifies the signal connecting you with that self, so your own nature can become more available in what comes next.\n\nThink of someone you love spending time with. What would you enjoy bringing more of to that relationship, including the things you already do well together? You could follow a curiosity they mention or make time for an unhurried conversation.\n\nThere is no required answer. The useful part is letting your interest move toward life itself.\n\nYour listening can accompany that. Self-knowledge has somewhere to go when there are people and possibilities you want to meet.\n\nRead about your connected self\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** There is more to know about a life you like\n\n**Preheader:** Self-connection can deepen what already matters to you.\n\nHi {{given_name}},\n\nYou can like your life and still be curious about yourself. A good relationship has more to discover. Work you care about can ask you to grow in a direction you hadn't considered before. A choice can be interesting without arriving as a crisis.\n\nThat matters to the way we understand Zodiac. The connected self is already whole. Listening doesn't earn you a more complete self or replace the person who built the life you value.\n\nThe music amplifies the signal connecting you with that self, so your own nature can become more available in what comes next.\n\nThink of someone you love spending time with. What would you enjoy bringing more of to that relationship, including the things you already do well together? You could follow a curiosity they mention or make time for an unhurried conversation.\n\nThere is no required answer. The useful part is letting your interest move toward life itself.\n\nYour listening can accompany that. Self-knowledge has somewhere to go when there are people and possibilities you want to meet.\n\n[Read about your connected self]({{article_03_connected_self}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m14","title":"M14 · Hearing yourself among other voices","label":"Review email · M14","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> The day doesn&#39;t have to go quiet\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Your own preference belongs in the conversation too.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>Someone recommends a book. A message asks for an answer. You open the calendar and remember three other things you meant to do. Most of these voices are welcome, and each one is asking for a little of your attention.\u003c/p>\n\u003cp>That is what we mean by the noise of a busy world. Zodiac&#39;s idea is that your signal can become easier to hear in the middle of it.\u003c/p>\n\u003cp>You don&#39;t have to wait for an empty calendar before listening. The music can be part of making dinner or taking a walk, while your life carries on around it.\u003c/p>\n\u003cp>Later, when you consider an invitation or choose how to spend an afternoon, include your own response. What interests you about it? Is there something you would rather do? Practical commitments matter, and so does the person making them.\u003c/p>\n\u003cp>You can listen to other people and still hear yourself. Their advice might help you recognize what you want, or give you a useful question to take your time with.\u003c/p>\n\u003cp>There is room for both in a real day.\u003c/p>\n\u003cp>\u003ca href=\"#connected-self\">Read about your connection to the connected self\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: The day doesn't have to go quiet\n\nPreheader: Your own preference belongs in the conversation too.\n\nHi {{givenname}},\n\nSomeone recommends a book. A message asks for an answer. You open the calendar and remember three other things you meant to do. Most of these voices are welcome, and each one is asking for a little of your attention.\n\nThat is what we mean by the noise of a busy world. Zodiac's idea is that your signal can become easier to hear in the middle of it.\n\nYou don't have to wait for an empty calendar before listening. The music can be part of making dinner or taking a walk, while your life carries on around it.\n\nLater, when you consider an invitation or choose how to spend an afternoon, include your own response. What interests you about it? Is there something you would rather do? Practical commitments matter, and so does the person making them.\n\nYou can listen to other people and still hear yourself. Their advice might help you recognize what you want, or give you a useful question to take your time with.\n\nThere is room for both in a real day.\n\nRead about your connection to the connected self\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** The day doesn't have to go quiet\n\n**Preheader:** Your own preference belongs in the conversation too.\n\nHi {{given_name}},\n\nSomeone recommends a book. A message asks for an answer. You open the calendar and remember three other things you meant to do. Most of these voices are welcome, and each one is asking for a little of your attention.\n\nThat is what we mean by the noise of a busy world. Zodiac's idea is that your signal can become easier to hear in the middle of it.\n\nYou don't have to wait for an empty calendar before listening. The music can be part of making dinner or taking a walk, while your life carries on around it.\n\nLater, when you consider an invitation or choose how to spend an afternoon, include your own response. What interests you about it? Is there something you would rather do? Practical commitments matter, and so does the person making them.\n\nYou can listen to other people and still hear yourself. Their advice might help you recognize what you want, or give you a useful question to take your time with.\n\nThere is room for both in a real day.\n\n[Read about your connection to the connected self]({{article_05_noise}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m15","title":"M15 · The six-month check-in","label":"Review email · M15","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Six months, in your own words\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Look across your life, with room for a mixed answer.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>At this six-month check-in, look beyond how a particular listening session went. What has occupied your life?\u003c/p>\n\u003cp>Is there a choice you understand better now? Has anything changed in how you relate to someone, spend your energy or recognize an opportunity? Something else might matter more to you than any of those questions.\u003c/p>\n\u003cp>In Zodiac&#39;s year-long internal study, 87 percent of participants who listened as designed reported a clear shift by month six. The listening condition was at least nine minutes a day on average across the week, with at least 15 percent in each of the four frequencies.\u003c/p>\n\u003cp>Zodiac coded participants&#39; reports. This was an internal product study, not a clinical trial, and the group result doesn&#39;t tell us what any individual should experience.\u003c/p>\n\u003cp>Your own account can include change, uncertainty and things that haven&#39;t moved. You don&#39;t owe the music an enthusiastic review.\u003c/p>\n\u003cp>If there is something worth remembering, keep it in your own words. You can return to it later, when the next stretch of life has given you more to consider.\u003c/p>\n\u003cp>\u003ca href=\"#the-year-long-study\">Read the six-month study finding\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: Six months, in your own words\n\nPreheader: Look across your life, with room for a mixed answer.\n\nHi {{givenname}},\n\nAt this six-month check-in, look beyond how a particular listening session went. What has occupied your life?\n\nIs there a choice you understand better now? Has anything changed in how you relate to someone, spend your energy or recognize an opportunity? Something else might matter more to you than any of those questions.\n\nIn Zodiac's year-long internal study, 87 percent of participants who listened as designed reported a clear shift by month six. The listening condition was at least nine minutes a day on average across the week, with at least 15 percent in each of the four frequencies.\n\nZodiac coded participants' reports. This was an internal product study, not a clinical trial, and the group result doesn't tell us what any individual should experience.\n\nYour own account can include change, uncertainty and things that haven't moved. You don't owe the music an enthusiastic review.\n\nIf there is something worth remembering, keep it in your own words. You can return to it later, when the next stretch of life has given you more to consider.\n\nRead the six-month study finding\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** Six months, in your own words\n\n**Preheader:** Look across your life, with room for a mixed answer.\n\nHi {{given_name}},\n\nAt this six-month check-in, look beyond how a particular listening session went. What has occupied your life?\n\nIs there a choice you understand better now? Has anything changed in how you relate to someone, spend your energy or recognize an opportunity? Something else might matter more to you than any of those questions.\n\nIn Zodiac's year-long internal study, 87 percent of participants who listened as designed reported a clear shift by month six. The listening condition was at least nine minutes a day on average across the week, with at least 15 percent in each of the four frequencies.\n\nZodiac coded participants' reports. This was an internal product study, not a clinical trial, and the group result doesn't tell us what any individual should experience.\n\nYour own account can include change, uncertainty and things that haven't moved. You don't owe the music an enthusiastic review.\n\nIf there is something worth remembering, keep it in your own words. You can return to it later, when the next stretch of life has given you more to consider.\n\n[Read the six-month study finding]({{article_13_study}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m16","title":"M16 · Living your design from within","label":"Review email · M16","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> If Human Design is part of your life\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Intuitive access leaves room for your own Strategy, Authority and timing.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>If you work with Human Design, you may already have useful language for how you meet decisions. Type, Strategy and Authority give that conversation distinctions worth keeping.\u003c/p>\n\u003cp>Zodiac&#39;s contribution is the possibility of living from a stronger connection with the self you recognize in that work.\u003c/p>\n\u003cp>The idea comes through a different route. Nāda Brahma, a Vedic teaching, understands reality as sound. A mantra lineage developed a method for finding the sound of the birth pattern, and Zodiac uses its frequency component to put your four fixed birth frequencies into music.\u003c/p>\n\u003cp>The music amplifies the connection to your already whole connected self. It doesn&#39;t deliver a spoken reading or teach the technical details of your BodyGraph.\u003c/p>\n\u003cp>And intuitive access doesn&#39;t always mean an immediate answer. If your practice gives you time to reach clarity, keep that time. There is room to listen, reflect and see what remains true after the first response has passed.\u003c/p>\n\u003cp>The invitation is to bring more of yourself into the choice in front of you, with the distinctions your own practice finds useful.\u003c/p>\n\u003cp>\u003ca href=\"#readings-and-birth-sound\">Explore readings and Zodiac\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: If Human Design is part of your life\n\nPreheader: Intuitive access leaves room for your own Strategy, Authority and timing.\n\nHi {{givenname}},\n\nIf you work with Human Design, you may already have useful language for how you meet decisions. Type, Strategy and Authority give that conversation distinctions worth keeping.\n\nZodiac's contribution is the possibility of living from a stronger connection with the self you recognize in that work.\n\nThe idea comes through a different route. Nāda Brahma, a Vedic teaching, understands reality as sound. A mantra lineage developed a method for finding the sound of the birth pattern, and Zodiac uses its frequency component to put your four fixed birth frequencies into music.\n\nThe music amplifies the connection to your already whole connected self. It doesn't deliver a spoken reading or teach the technical details of your BodyGraph.\n\nAnd intuitive access doesn't always mean an immediate answer. If your practice gives you time to reach clarity, keep that time. There is room to listen, reflect and see what remains true after the first response has passed.\n\nThe invitation is to bring more of yourself into the choice in front of you, with the distinctions your own practice finds useful.\n\nExplore readings and Zodiac\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** If Human Design is part of your life\n\n**Preheader:** Intuitive access leaves room for your own Strategy, Authority and timing.\n\nHi {{given_name}},\n\nIf you work with Human Design, you may already have useful language for how you meet decisions. Type, Strategy and Authority give that conversation distinctions worth keeping.\n\nZodiac's contribution is the possibility of living from a stronger connection with the self you recognize in that work.\n\nThe idea comes through a different route. Nāda Brahma, a Vedic teaching, understands reality as sound. A mantra lineage developed a method for finding the sound of the birth pattern, and Zodiac uses its frequency component to put your four fixed birth frequencies into music.\n\nThe music amplifies the connection to your already whole connected self. It doesn't deliver a spoken reading or teach the technical details of your BodyGraph.\n\nAnd intuitive access doesn't always mean an immediate answer. If your practice gives you time to reach clarity, keep that time. There is room to listen, reflect and see what remains true after the first response has passed.\n\nThe invitation is to bring more of yourself into the choice in front of you, with the distinctions your own practice finds useful.\n\n[Explore readings and Zodiac]({{article_09_readings}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m17","title":"M17 · Meeting the person in front of you","label":"Review email · M17","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Someone you know still has more to show you\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Connection leaves room for the person they are today.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>When you know someone well, you can sometimes finish their sentence before they do. Familiarity can be lovely. It can also mean you miss the part they were about to say differently.\u003c/p>\n\u003cp>One way self-connection goes outward is through curiosity about other people. You can bring your own experience to a conversation and still leave room for theirs.\u003c/p>\n\u003cp>Love is the Zodiac frequency concerned with connection, including how you relate, what fits and where a boundary belongs. It offers a reference within you. It doesn&#39;t give you a verdict on another person.\u003c/p>\n\u003cp>If you want to explore that today, let someone familiar surprise you. Ask about something they care about and hear the answer before deciding what it means. Leave room for the conversation to go somewhere unexpected.\u003c/p>\n\u003cp>This is an optional invitation, not something you need to do while a track plays. Keep listening across all four frequencies and let life supply the conversations.\u003c/p>\n\u003cp>The person in front of you has a life of their own, still unfolding.\u003c/p>\n\u003cp>\u003ca href=\"#finding-your-people\">Read about connection and your people\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: Someone you know still has more to show you\n\nPreheader: Connection leaves room for the person they are today.\n\nHi {{givenname}},\n\nWhen you know someone well, you can sometimes finish their sentence before they do. Familiarity can be lovely. It can also mean you miss the part they were about to say differently.\n\nOne way self-connection goes outward is through curiosity about other people. You can bring your own experience to a conversation and still leave room for theirs.\n\nLove is the Zodiac frequency concerned with connection, including how you relate, what fits and where a boundary belongs. It offers a reference within you. It doesn't give you a verdict on another person.\n\nIf you want to explore that today, let someone familiar surprise you. Ask about something they care about and hear the answer before deciding what it means. Leave room for the conversation to go somewhere unexpected.\n\nThis is an optional invitation, not something you need to do while a track plays. Keep listening across all four frequencies and let life supply the conversations.\n\nThe person in front of you has a life of their own, still unfolding.\n\nRead about connection and your people\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** Someone you know still has more to show you\n\n**Preheader:** Connection leaves room for the person they are today.\n\nHi {{given_name}},\n\nWhen you know someone well, you can sometimes finish their sentence before they do. Familiarity can be lovely. It can also mean you miss the part they were about to say differently.\n\nOne way self-connection goes outward is through curiosity about other people. You can bring your own experience to a conversation and still leave room for theirs.\n\nLove is the Zodiac frequency concerned with connection, including how you relate, what fits and where a boundary belongs. It offers a reference within you. It doesn't give you a verdict on another person.\n\nIf you want to explore that today, let someone familiar surprise you. Ask about something they care about and hear the answer before deciding what it means. Leave room for the conversation to go somewhere unexpected.\n\nThis is an optional invitation, not something you need to do while a track plays. Keep listening across all four frequencies and let life supply the conversations.\n\nThe person in front of you has a life of their own, still unfolding.\n\n[Read about connection and your people]({{article_14_people}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m18","title":"M18 · A desire you recognize as yours","label":"Review email · M18","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> What do you want the opportunity to make possible?\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> A question for the life you&#39;re trying to create.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>If manifestation is part of your practice, you probably have something you want to bring into your life. A relationship, work you care about, a different way to spend your days.\u003c/p>\n\u003cp>What do you want that desire to make possible? Picture the ordinary life around the achievement, including the people and responsibilities that would come with it.\u003c/p>\n\u003cp>Zodiac&#39;s interest is in the person doing the wanting. Its origin is the Vedic idea of Nāda Brahma, that reality is sound. A mantra lineage developed a way to hear the birth pattern. Zodiac puts your four fixed birth frequencies into music to amplify your connection with your connected self.\u003c/p>\n\u003cp>From there, the possibility is recognizing what is yours to pursue, and meeting an opening with more of yourself available.\u003c/p>\n\u003cp>You still make the application, build the thing or start the conversation. The music doesn&#39;t promise that a particular event will follow.\u003c/p>\n\u003cp>Let your practice and your actions stay in conversation with what you actually want to live.\u003c/p>\n\u003cp>\u003ca href=\"#manifestation-and-your-own-signal\">Read about manifestation and Zodiac\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: What do you want the opportunity to make possible?\n\nPreheader: A question for the life you're trying to create.\n\nHi {{givenname}},\n\nIf manifestation is part of your practice, you probably have something you want to bring into your life. A relationship, work you care about, a different way to spend your days.\n\nWhat do you want that desire to make possible? Picture the ordinary life around the achievement, including the people and responsibilities that would come with it.\n\nZodiac's interest is in the person doing the wanting. Its origin is the Vedic idea of Nāda Brahma, that reality is sound. A mantra lineage developed a way to hear the birth pattern. Zodiac puts your four fixed birth frequencies into music to amplify your connection with your connected self.\n\nFrom there, the possibility is recognizing what is yours to pursue, and meeting an opening with more of yourself available.\n\nYou still make the application, build the thing or start the conversation. The music doesn't promise that a particular event will follow.\n\nLet your practice and your actions stay in conversation with what you actually want to live.\n\nRead about manifestation and Zodiac\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** What do you want the opportunity to make possible?\n\n**Preheader:** A question for the life you're trying to create.\n\nHi {{given_name}},\n\nIf manifestation is part of your practice, you probably have something you want to bring into your life. A relationship, work you care about, a different way to spend your days.\n\nWhat do you want that desire to make possible? Picture the ordinary life around the achievement, including the people and responsibilities that would come with it.\n\nZodiac's interest is in the person doing the wanting. Its origin is the Vedic idea of Nāda Brahma, that reality is sound. A mantra lineage developed a way to hear the birth pattern. Zodiac puts your four fixed birth frequencies into music to amplify your connection with your connected self.\n\nFrom there, the possibility is recognizing what is yours to pursue, and meeting an opening with more of yourself available.\n\nYou still make the application, build the thing or start the conversation. The music doesn't promise that a particular event will follow.\n\nLet your practice and your actions stay in conversation with what you actually want to live.\n\n[Read about manifestation and Zodiac]({{article_10_manifestation}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m19","title":"M19 · Bringing the practice into a good life","label":"Review email · M19","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Your spiritual life can come to dinner\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> The people and work you value are part of the point.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>If you&#39;ve built a life you value, your spiritual practice has somewhere important to go. A conversation at dinner is one place. So is the way you spend an afternoon with someone who knows you well.\u003c/p>\n\u003cp>The work and relationships you care about give that exploration a place to matter.\u003c/p>\n\u003cp>Zodiac starts with the Vedic teaching of Nāda Brahma, the idea that reality is sound. A mantra lineage developed a way to hear the birth pattern. Your four fixed birth frequencies go into music to amplify your connection with your already whole connected self.\u003c/p>\n\u003cp>What interests us is how that connection becomes part of living. You can be good at what you do and still discover which opportunities you want, including the ones that would change how you spend your days. That question belongs in a successful life too.\u003c/p>\n\u003cp>The music can accompany ordinary parts of the day alongside the practices you already value.\u003c/p>\n\u003cp>When you think about what matters, include enjoyment. An evening with people you love is a meaningful place for your attention to land.\u003c/p>\n\u003cp>\u003ca href=\"#what-we-believe\">Read what Zodiac stands for\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: Your spiritual life can come to dinner\n\nPreheader: The people and work you value are part of the point.\n\nHi {{givenname}},\n\nIf you've built a life you value, your spiritual practice has somewhere important to go. A conversation at dinner is one place. So is the way you spend an afternoon with someone who knows you well.\n\nThe work and relationships you care about give that exploration a place to matter.\n\nZodiac starts with the Vedic teaching of Nāda Brahma, the idea that reality is sound. A mantra lineage developed a way to hear the birth pattern. Your four fixed birth frequencies go into music to amplify your connection with your already whole connected self.\n\nWhat interests us is how that connection becomes part of living. You can be good at what you do and still discover which opportunities you want, including the ones that would change how you spend your days. That question belongs in a successful life too.\n\nThe music can accompany ordinary parts of the day alongside the practices you already value.\n\nWhen you think about what matters, include enjoyment. An evening with people you love is a meaningful place for your attention to land.\n\nRead what Zodiac stands for\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** Your spiritual life can come to dinner\n\n**Preheader:** The people and work you value are part of the point.\n\nHi {{given_name}},\n\nIf you've built a life you value, your spiritual practice has somewhere important to go. A conversation at dinner is one place. So is the way you spend an afternoon with someone who knows you well.\n\nThe work and relationships you care about give that exploration a place to matter.\n\nZodiac starts with the Vedic teaching of Nāda Brahma, the idea that reality is sound. A mantra lineage developed a way to hear the birth pattern. Your four fixed birth frequencies go into music to amplify your connection with your already whole connected self.\n\nWhat interests us is how that connection becomes part of living. You can be good at what you do and still discover which opportunities you want, including the ones that would change how you spend your days. That question belongs in a successful life too.\n\nThe music can accompany ordinary parts of the day alongside the practices you already value.\n\nWhen you think about what matters, include enjoyment. An evening with people you love is a meaningful place for your attention to land.\n\n[Read what Zodiac stands for]({{article_16_beliefs}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m20","title":"M20 · The work you want to bring","label":"Review email · M20","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> What you bring doesn&#39;t need a grand title\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Contribution has a place in an ordinary day.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>There is work that matters because someone receives it. A meal made with care. A problem understood well enough to solve. A person given time to finish what they are trying to say.\u003c/p>\n\u003cp>Contribution can be visible to a whole room or to one other person. It doesn&#39;t need a grand title to count.\u003c/p>\n\u003cp>Core concerns who you are and what is yours to do. As that reference becomes more available, the question can move from describing yourself to participating more fully. What do you actually want to bring to the people and work around you?\u003c/p>\n\u003cp>You might already know. There may be a piece of work you enjoy doing well, or a way of helping that uses something particular about you. There is room to take that seriously without making it your entire identity.\u003c/p>\n\u003cp>Zodiac&#39;s purpose reaches beyond private self-understanding. Connection has consequences in how we make things, keep commitments and treat people.\u003c/p>\n\u003cp>Keep the music in your week, and notice where your attention wants to become a contribution. Someone else gets to meet you there.\u003c/p>\n\u003cp>\u003ca href=\"#finding-your-people\">Read why every role counts\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: What you bring doesn't need a grand title\n\nPreheader: Contribution has a place in an ordinary day.\n\nHi {{givenname}},\n\nThere is work that matters because someone receives it. A meal made with care. A problem understood well enough to solve. A person given time to finish what they are trying to say.\n\nContribution can be visible to a whole room or to one other person. It doesn't need a grand title to count.\n\nCore concerns who you are and what is yours to do. As that reference becomes more available, the question can move from describing yourself to participating more fully. What do you actually want to bring to the people and work around you?\n\nYou might already know. There may be a piece of work you enjoy doing well, or a way of helping that uses something particular about you. There is room to take that seriously without making it your entire identity.\n\nZodiac's purpose reaches beyond private self-understanding. Connection has consequences in how we make things, keep commitments and treat people.\n\nKeep the music in your week, and notice where your attention wants to become a contribution. Someone else gets to meet you there.\n\nRead why every role counts\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** What you bring doesn't need a grand title\n\n**Preheader:** Contribution has a place in an ordinary day.\n\nHi {{given_name}},\n\nThere is work that matters because someone receives it. A meal made with care. A problem understood well enough to solve. A person given time to finish what they are trying to say.\n\nContribution can be visible to a whole room or to one other person. It doesn't need a grand title to count.\n\nCore concerns who you are and what is yours to do. As that reference becomes more available, the question can move from describing yourself to participating more fully. What do you actually want to bring to the people and work around you?\n\nYou might already know. There may be a piece of work you enjoy doing well, or a way of helping that uses something particular about you. There is room to take that seriously without making it your entire identity.\n\nZodiac's purpose reaches beyond private self-understanding. Connection has consequences in how we make things, keep commitments and treat people.\n\nKeep the music in your week, and notice where your attention wants to become a contribution. Someone else gets to meet you there.\n\n[Read why every role counts]({{article_14_people}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m21","title":"M21 · A first-year reflection","label":"Review email · M21","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Look at the year you actually lived\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> There is more to a year than a before-and-after story.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>A year gives you enough distance to see things that were hard to notice as they happened. Return to the person who first became curious about Zodiac. What mattered to you then? What matters now?\u003c/p>\n\u003cp>You might recognize more confidence in a choice, a different quality in a relationship or a clearer sense of where your energy belongs. You might have questions you didn&#39;t have at the beginning. Your year can hold both.\u003c/p>\n\u003cp>If you kept any earlier notes, read them without trying to make a tidy story. Some things change gradually. Others stay complicated because life is complicated.\u003c/p>\n\u003cp>Zodiac&#39;s intended movement is from repeated contact to recognition, easier access and more natural participation in life. Those experiences can overlap and recur. An anniversary doesn&#39;t certify that you have completed them.\u003c/p>\n\u003cp>Your frequencies remain the four you were born with, and you bring a year&#39;s worth of living to them now.\u003c/p>\n\u003cp>Keep what has been useful. Let your account of the year be accurate enough that it gives you something real to carry forward.\u003c/p>\n\u003cp>\u003ca href=\"#what-to-expect\">Read about continuing the experience\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: Look at the year you actually lived\n\nPreheader: There is more to a year than a before-and-after story.\n\nHi {{givenname}},\n\nA year gives you enough distance to see things that were hard to notice as they happened. Return to the person who first became curious about Zodiac. What mattered to you then? What matters now?\n\nYou might recognize more confidence in a choice, a different quality in a relationship or a clearer sense of where your energy belongs. You might have questions you didn't have at the beginning. Your year can hold both.\n\nIf you kept any earlier notes, read them without trying to make a tidy story. Some things change gradually. Others stay complicated because life is complicated.\n\nZodiac's intended movement is from repeated contact to recognition, easier access and more natural participation in life. Those experiences can overlap and recur. An anniversary doesn't certify that you have completed them.\n\nYour frequencies remain the four you were born with, and you bring a year's worth of living to them now.\n\nKeep what has been useful. Let your account of the year be accurate enough that it gives you something real to carry forward.\n\nRead about continuing the experience\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** Look at the year you actually lived\n\n**Preheader:** There is more to a year than a before-and-after story.\n\nHi {{given_name}},\n\nA year gives you enough distance to see things that were hard to notice as they happened. Return to the person who first became curious about Zodiac. What mattered to you then? What matters now?\n\nYou might recognize more confidence in a choice, a different quality in a relationship or a clearer sense of where your energy belongs. You might have questions you didn't have at the beginning. Your year can hold both.\n\nIf you kept any earlier notes, read them without trying to make a tidy story. Some things change gradually. Others stay complicated because life is complicated.\n\nZodiac's intended movement is from repeated contact to recognition, easier access and more natural participation in life. Those experiences can overlap and recur. An anniversary doesn't certify that you have completed them.\n\nYour frequencies remain the four you were born with, and you bring a year's worth of living to them now.\n\nKeep what has been useful. Let your account of the year be accurate enough that it gives you something real to carry forward.\n\n[Read about continuing the experience]({{article_06_expectations}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m22","title":"M22 · Familiar frequencies, new questions","label":"Review email · M22","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> The same frequencies meet a different year\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Your reference stays fixed while the questions in your life change.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>As another year opens, some questions in your life may be new. A role has changed. Someone matters in a different way. An opportunity that once looked appealing no longer fits what you want to do.\u003c/p>\n\u003cp>Your four birth frequencies remain the same while your interests, responsibilities and understanding continue to develop.\u003c/p>\n\u003cp>Core still concerns who you are and what is yours. Love concerns how you connect, while Vitality concerns where your energy belongs. Abundance concerns opportunity and timing. What you bring to those questions can change as you gain experience.\u003c/p>\n\u003cp>That is part of why continued listening has a place. The music returns to your personal references while you encounter new circumstances, with more life behind you than when you began.\u003c/p>\n\u003cp>There is no need to invent a new version of yourself for the year. Start with one thing that matters now. What would you like to understand, choose or participate in more fully?\u003c/p>\n\u003cp>Let the answer have practical shape in something you want to do, from a conversation you&#39;ve been meaning to have to a piece of work you&#39;d like to begin.\u003c/p>\n\u003cp>\u003ca href=\"#four-frequencies\">Revisit your four frequencies\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: The same frequencies meet a different year\n\nPreheader: Your reference stays fixed while the questions in your life change.\n\nHi {{givenname}},\n\nAs another year opens, some questions in your life may be new. A role has changed. Someone matters in a different way. An opportunity that once looked appealing no longer fits what you want to do.\n\nYour four birth frequencies remain the same while your interests, responsibilities and understanding continue to develop.\n\nCore still concerns who you are and what is yours. Love concerns how you connect, while Vitality concerns where your energy belongs. Abundance concerns opportunity and timing. What you bring to those questions can change as you gain experience.\n\nThat is part of why continued listening has a place. The music returns to your personal references while you encounter new circumstances, with more life behind you than when you began.\n\nThere is no need to invent a new version of yourself for the year. Start with one thing that matters now. What would you like to understand, choose or participate in more fully?\n\nLet the answer have practical shape in something you want to do, from a conversation you've been meaning to have to a piece of work you'd like to begin.\n\nRevisit your four frequencies\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** The same frequencies meet a different year\n\n**Preheader:** Your reference stays fixed while the questions in your life change.\n\nHi {{given_name}},\n\nAs another year opens, some questions in your life may be new. A role has changed. Someone matters in a different way. An opportunity that once looked appealing no longer fits what you want to do.\n\nYour four birth frequencies remain the same while your interests, responsibilities and understanding continue to develop.\n\nCore still concerns who you are and what is yours. Love concerns how you connect, while Vitality concerns where your energy belongs. Abundance concerns opportunity and timing. What you bring to those questions can change as you gain experience.\n\nThat is part of why continued listening has a place. The music returns to your personal references while you encounter new circumstances, with more life behind you than when you began.\n\nThere is no need to invent a new version of yourself for the year. Start with one thing that matters now. What would you like to understand, choose or participate in more fully?\n\nLet the answer have practical shape in something you want to do, from a conversation you've been meaning to have to a piece of work you'd like to begin.\n\n[Revisit your four frequencies]({{article_04_four_frequencies}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m23","title":"M23 · A clear limit can keep you close","label":"Review email · M23","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> You can care and still have a limit\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Being clear gives a relationship something real to work with.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>You want to help someone, but the time they need is time you have already promised elsewhere. Both things can be true. You care about them, and you have a limit.\u003c/p>\n\u003cp>A clear answer gives the other person something real to work with. You might offer another time, explain what you can do or simply acknowledge what you can&#39;t take on.\u003c/p>\n\u003cp>Love, in Zodiac, includes closeness and boundaries. Recognizing your own position can make it easier to meet someone honestly, with less need to agree first and untangle the agreement later.\u003c/p>\n\u003cp>That doesn&#39;t make every boundary easy, because a relationship includes another person&#39;s needs and choices too.\u003c/p>\n\u003cp>If a situation comes to mind, consider the actual facts. Which commitments have you made that you want to keep, and what room is left for this request? Give the other person an answer they can understand.\u003c/p>\n\u003cp>Keep all four frequencies in your listening. The point of connection is to be more available to life, including the moments when being present means giving a truthful answer.\u003c/p>\n\u003cp>\u003ca href=\"#finding-your-people\">Read about connection and boundaries\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: You can care and still have a limit\n\nPreheader: Being clear gives a relationship something real to work with.\n\nHi {{givenname}},\n\nYou want to help someone, but the time they need is time you have already promised elsewhere. Both things can be true. You care about them, and you have a limit.\n\nA clear answer gives the other person something real to work with. You might offer another time, explain what you can do or simply acknowledge what you can't take on.\n\nLove, in Zodiac, includes closeness and boundaries. Recognizing your own position can make it easier to meet someone honestly, with less need to agree first and untangle the agreement later.\n\nThat doesn't make every boundary easy, because a relationship includes another person's needs and choices too.\n\nIf a situation comes to mind, consider the actual facts. Which commitments have you made that you want to keep, and what room is left for this request? Give the other person an answer they can understand.\n\nKeep all four frequencies in your listening. The point of connection is to be more available to life, including the moments when being present means giving a truthful answer.\n\nRead about connection and boundaries\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** You can care and still have a limit\n\n**Preheader:** Being clear gives a relationship something real to work with.\n\nHi {{given_name}},\n\nYou want to help someone, but the time they need is time you have already promised elsewhere. Both things can be true. You care about them, and you have a limit.\n\nA clear answer gives the other person something real to work with. You might offer another time, explain what you can do or simply acknowledge what you can't take on.\n\nLove, in Zodiac, includes closeness and boundaries. Recognizing your own position can make it easier to meet someone honestly, with less need to agree first and untangle the agreement later.\n\nThat doesn't make every boundary easy, because a relationship includes another person's needs and choices too.\n\nIf a situation comes to mind, consider the actual facts. Which commitments have you made that you want to keep, and what room is left for this request? Give the other person an answer they can understand.\n\nKeep all four frequencies in your listening. The point of connection is to be more available to life, including the moments when being present means giving a truthful answer.\n\n[Read about connection and boundaries]({{article_14_people}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m24","title":"M24 · Effort you want to give","label":"Review email · M24","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> Some worthwhile things take effort\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Vitality concerns where your energy belongs, including work you care about.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>You can finish a demanding piece of work and be glad you gave it the day. Some easier afternoons leave you wishing you had said no.\u003c/p>\n\u003cp>Effort alone doesn&#39;t tell you whether something belongs in your life. The relationship you have with that effort matters too.\u003c/p>\n\u003cp>Vitality is the part of Zodiac&#39;s four-frequency system concerned with what supports or drains your energy. It invites a more personal understanding of where you want to spend yourself.\u003c/p>\n\u003cp>Consider a recent commitment. What did you value about doing it? Which parts asked too much, and which parts would you willingly do again? The answer can help you shape the next commitment more honestly.\u003c/p>\n\u003cp>That might mean asking for help, changing the scope or protecting time for work you already love. Difficulty by itself doesn&#39;t mean you chose badly.\u003c/p>\n\u003cp>Listening keeps returning you to all four personal frequencies. What you do with a clearer understanding remains practical, particular and yours to decide.\u003c/p>\n\u003cp>\u003ca href=\"#four-frequencies\">Explore Vitality and the four frequencies\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: Some worthwhile things take effort\n\nPreheader: Vitality concerns where your energy belongs, including work you care about.\n\nHi {{givenname}},\n\nYou can finish a demanding piece of work and be glad you gave it the day. Some easier afternoons leave you wishing you had said no.\n\nEffort alone doesn't tell you whether something belongs in your life. The relationship you have with that effort matters too.\n\nVitality is the part of Zodiac's four-frequency system concerned with what supports or drains your energy. It invites a more personal understanding of where you want to spend yourself.\n\nConsider a recent commitment. What did you value about doing it? Which parts asked too much, and which parts would you willingly do again? The answer can help you shape the next commitment more honestly.\n\nThat might mean asking for help, changing the scope or protecting time for work you already love. Difficulty by itself doesn't mean you chose badly.\n\nListening keeps returning you to all four personal frequencies. What you do with a clearer understanding remains practical, particular and yours to decide.\n\nExplore Vitality and the four frequencies\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** Some worthwhile things take effort\n\n**Preheader:** Vitality concerns where your energy belongs, including work you care about.\n\nHi {{given_name}},\n\nYou can finish a demanding piece of work and be glad you gave it the day. Some easier afternoons leave you wishing you had said no.\n\nEffort alone doesn't tell you whether something belongs in your life. The relationship you have with that effort matters too.\n\nVitality is the part of Zodiac's four-frequency system concerned with what supports or drains your energy. It invites a more personal understanding of where you want to spend yourself.\n\nConsider a recent commitment. What did you value about doing it? Which parts asked too much, and which parts would you willingly do again? The answer can help you shape the next commitment more honestly.\n\nThat might mean asking for help, changing the scope or protecting time for work you already love. Difficulty by itself doesn't mean you chose badly.\n\nListening keeps returning you to all four personal frequencies. What you do with a clearer understanding remains practical, particular and yours to decide.\n\n[Explore Vitality and the four frequencies]({{article_04_four_frequencies}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m25","title":"M25 · Making room to decide","label":"Review email · M25","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> An opportunity can deserve a question\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> Interest and discernment can belong in the same response.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>An opportunity can appeal to you before you know enough to accept it. You like the idea, and you still want to understand the commitment, the people or the timing.\u003c/p>\n\u003cp>Asking a question is one way to meet an opening, with enough time to consider the answer before you commit.\u003c/p>\n\u003cp>Abundance concerns opportunity, exchange and when to move or wait. Its place in Zodiac is to support recognition of what is yours to meet, with room for information and the practical conditions of the choice.\u003c/p>\n\u003cp>You don&#39;t have to treat uncertainty as a no, or excitement as a complete answer. Both can tell you something worth exploring.\u003c/p>\n\u003cp>Think of the next invitation that interests you. What would you want to know about the people involved or the commitment before saying yes? Consider what would let you participate fully.\u003c/p>\n\u003cp>The music doesn&#39;t forecast the result. It returns to your four fixed references as you live, with the aim of making your own response easier to recognize among the possibilities in front of you.\u003c/p>\n\u003cp>\u003ca href=\"#four-frequencies\">Read about Abundance and timing\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsubscribe — Review placeholder: \u003ccode>{{unsubscribe_url}}\u003c/code>\u003c/p>\n","text":"Subject: An opportunity can deserve a question\n\nPreheader: Interest and discernment can belong in the same response.\n\nHi {{givenname}},\n\nAn opportunity can appeal to you before you know enough to accept it. You like the idea, and you still want to understand the commitment, the people or the timing.\n\nAsking a question is one way to meet an opening, with enough time to consider the answer before you commit.\n\nAbundance concerns opportunity, exchange and when to move or wait. Its place in Zodiac is to support recognition of what is yours to meet, with room for information and the practical conditions of the choice.\n\nYou don't have to treat uncertainty as a no, or excitement as a complete answer. Both can tell you something worth exploring.\n\nThink of the next invitation that interests you. What would you want to know about the people involved or the commitment before saying yes? Consider what would let you participate fully.\n\nThe music doesn't forecast the result. It returns to your four fixed references as you live, with the aim of making your own response easier to recognize among the possibilities in front of you.\n\nRead about Abundance and timing\n\nTeam Zodiac\n\nUnsubscribe — Review placeholder: {{unsubscribeurl}}","copyText":"**Subject:** An opportunity can deserve a question\n\n**Preheader:** Interest and discernment can belong in the same response.\n\nHi {{given_name}},\n\nAn opportunity can appeal to you before you know enough to accept it. You like the idea, and you still want to understand the commitment, the people or the timing.\n\nAsking a question is one way to meet an opening, with enough time to consider the answer before you commit.\n\nAbundance concerns opportunity, exchange and when to move or wait. Its place in Zodiac is to support recognition of what is yours to meet, with room for information and the practical conditions of the choice.\n\nYou don't have to treat uncertainty as a no, or excitement as a complete answer. Both can tell you something worth exploring.\n\nThink of the next invitation that interests you. What would you want to know about the people involved or the commitment before saying yes? Consider what would let you participate fully.\n\nThe music doesn't forecast the result. It returns to your four fixed references as you live, with the aim of making your own response easier to recognize among the possibilities in front of you.\n\n[Read about Abundance and timing]({{article_04_four_frequencies}})\n\nTeam Zodiac\n\n[Unsubscribe]({{unsubscribe_url}})"},{"category":"Emails","slug":"member-m26","title":"M26 · What the recording carries","label":"Review email · M26","hasSourceH1":false,"html":"\u003cp>\u003cstrong>Subject:\u003c/strong> What we mean by your actual frequency\u003c/p>\n\u003cp>\u003cstrong>Preheader:\u003c/strong> A precise tone, held inside the music.\u003c/p>\n\u003cp>Hi {{given_name}},\u003c/p>\n\u003cp>The word frequency gets used for many kinds of audio. In Zodiac, it has a specific meaning. Each personal frequency is a pitch derived from your birth information, and that exact pitch is present in the recording you hear.\u003c/p>\n\u003cp>It is carried as a steady pure tone inside music retuned to fit it. That makes it part of the harmony.\u003c/p>\n\u003cp>The recording doesn&#39;t require a different tone in each ear. You can use suitable headphones or a speaker that reproduces the music clearly, at a comfortable volume.\u003c/p>\n\u003cp>You also don&#39;t have to identify the tone by listening hard. Its presence is a feature of how the recording is made, not something you need to prove with your attention.\u003c/p>\n\u003cp>The larger reason remains the same. Zodiac brings your four fixed birth frequencies into repeated listening to amplify the connection with your connected self.\u003c/p>\n\u003cp>Knowing how the music is built can answer a useful question. Once that question is answered, you can return to simply hearing a song you enjoy.\u003c/p>\n\u003cp>\u003ca href=\"#music-and-longer-tracks\">See how the music is made\u003c/a>\u003c/p>\n\u003cp>Team Zodiac\u003c/p>\n\u003cp>Unsu
