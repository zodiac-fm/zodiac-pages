<script>window.ZODIAC_REVIEW_CONTENT={"defaultSlug":"homepage","items":[{"category":"Pages","slug":"homepage","title":"Homepage","label":"Page · Homepage","hasSourceH1":true,"html":"\u003ch1>More of you in the life you live.\u003c/h1>\n\u003cp>Music made with your birth frequencies, to amplify your connection with the self you recognize in a good reading.\u003c/p>\n\u003cp>\u003ca href=\"#birth-details\">Find my frequencies\u003c/a>\u003c/p>\n\u003cp>Your birth date, time and place. Four personal frequencies. Three short songs in each, free without a card.\u003c/p>\n\u003ch2>You know that feeling of being read.\u003c/h2>\n\u003cp>Someone describes your nature so precisely that a part of you relaxes. A pattern makes sense. A quality you used to explain away starts to feel like it belongs.\u003c/p>\n\u003cp>Astrology, Human Design and other systems can help you recognize yourself. Zodiac gives that recognition another way into your day.\u003c/p>\n\u003cp>Through sound.\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;It lets you finally feel the parts of yourself you have only ever read about.&quot;\u003c/p>\n\u003cp>Zehra Ashary, Kundalini Practitioner, London. Zodiac.fm team member.\u003c/p>\n\u003c/blockquote>\n\u003ch2>If the world is sound, what is your sound?\u003c/h2>\n\u003cp>Nāda Brahma is the Vedic teaching that the world is sound. From that perspective, the pattern present when you were born would have a sound of its own.\u003c/p>\n\u003cp>A mantra lineage had already developed a method for finding it. Zodiac uses the frequency part of that method to derive four frequencies from your birth information, then puts them into music.\u003c/p>\n\u003cp>The idea is to amplify your connection with your connected self: the part of you that knows your nature and belongs to something larger.\u003c/p>\n\u003cp>You can listen while you live. No chart to interpret in the middle of a conversation. No new practice to master before you begin.\u003c/p>\n\u003cp>\u003ca href=\"#where-zodiac-comes-from\">How birth information becomes music\u003c/a>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;This music tickled my soul and reminded me that there&#39;s such a connection between vibration, the stars and the sounds that are coordinated by higher intelligence. Give it a try.. you&#39;ll love it.&quot;\u003c/p>\n\u003cp>Debra Silverman, Astrologer to Sting, Jennifer Aniston, Aaron Rodgers\u003c/p>\n\u003c/blockquote>\n\u003ch2>Four frequencies. Your whole life to use them in.\u003c/h2>\n\u003ch3>Core\u003c/h3>\n\u003cp>The signal for who you are and what is yours to do.\u003c/p>\n\u003cp>The work you keep returning to. The part of yourself you recognize even when your life changes around it.\u003c/p>\n\u003ch3>Love\u003c/h3>\n\u003cp>The signal for who to let close and how to connect.\u003c/p>\n\u003cp>Being more available to the people you love. Recognizing when to open up and when to give yourself room.\u003c/p>\n\u003ch3>Vitality\u003c/h3>\n\u003cp>The signal for what feeds you and what drains you.\u003c/p>\n\u003cp>Knowing which commitments leave you more alive, and which ones ask for more than you want to give.\u003c/p>\n\u003ch3>Abundance\u003c/h3>\n\u003cp>The signal for when to move and which opportunities are yours.\u003c/p>\n\u003cp>Meeting an opening with a clearer sense of your own timing. Letting your choices reflect the life you actually want.\u003c/p>\n\u003cp>Your four frequencies stay fixed. They are your reference while your life and its cycles keep moving.\u003c/p>\n\u003ch2>Bring more of yourself to what matters.\u003c/h2>\n\u003cp>You may be entering a new chapter in your chart, learning to trust your Authority or putting intention behind something you want to create.\u003c/p>\n\u003cp>You may love the life you have and want to be more fully in it.\u003c/p>\n\u003cp>Zodiac belongs beside those things. Put it on while you work, cook, journal or settle into the evening. The point is what becomes available in your life, not how much you can feel during a song.\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;I&#39;ve been using Zodiac for over a month now and having it on in the background while I work has allowed me to slip into my flow state MUCH easier while having a greater sense of calm and ease&quot;\u003c/p>\n\u003cp>Alex Kikel, Trainer to Olympians and Professional Athletes\u003c/p>\n\u003c/blockquote>\n\u003ch2>Made around your frequency, all the way through.\u003c/h2>\n\u003cp>Real musicians make each song. Audio engineers retune it so your exact frequency belongs inside its harmony.\u003c/p>\n\u003cp>Each composition comes in 701 versions. Yours carries one of your four frequencies through the track. You choose the music that fits the moment.\u003c/p>\n\u003cp>A useful rhythm is at least nine minutes a day on average, with time for all four frequencies across the week. The app helps keep them in balance.\u003c/p>\n\u003cp>\u003ca href=\"#music-and-longer-tracks\">Hear how the music is made\u003c/a>\u003c/p>\n\u003ch2>A year of listening. A clearer picture of the experience.\u003c/h2>\n\u003cblockquote>\n\u003cp>&quot;\u003cstrong>Zodiac.fm helps people access aspects of themselves that have always been there.\u003c/strong> Listening to your frequencies bypasses language and creates profound levels of self-awareness and coherence. This leads to clearer decisions, more authentic relationships, and expanded possibilities.&quot;\u003c/p>\n\u003cp>Srini Pillay, M.D., Harvard Neuroscientist &amp; Author\u003c/p>\n\u003c/blockquote>\n\u003cp>Three hundred people began our 52-week study. Two hundred and seventy-eight completed it. Of the completers, 98.6 percent said they would recommend Zodiac to a friend.\u003c/p>\n\u003cp>Among people who listened as designed, at least nine minutes a day on average with each frequency receiving at least 15 percent of listening time, 84 percent called it life-changing.\u003c/p>\n\u003cp>Participants answered open questions every two weeks, and their listening was logged. This was our own study, coded in-house. It was not a clinical trial and has not been published in a journal. The findings describe reported experiences, not proof of the metaphysical explanation or a promise about your results.\u003c/p>\n\u003cp>\u003ca href=\"#the-year-long-study\">Read the study\u003c/a>\u003c/p>\n\u003ch2>Start with the songs that are already yours.\u003c/h2>\n\u003cp>Find your frequencies and hear three short songs in each one. Those stay free.\u003c/p>\n\u003cp>For the full library, try seven days for $3. Choose $109 billed yearly, equivalent to $9.08 a month, or $17 billed monthly. Your chosen membership starts on day eight unless you cancel first. The $3 and subsequent membership charges are non-refundable.\u003c/p>\n\u003cp>Membership gives you longer music across all four frequencies, from nine-minute immersions to extended meditations and an hour-long track. Nearly ten hours in total, with more room to leave the music on.\u003c/p>\n\u003cp>Listen on iPhone, Android, or in a desktop or laptop browser. Use the same email wherever you listen.\u003c/p>\n\u003cp>\u003ca href=\"#birth-details\">Find my frequencies\u003c/a>\u003c/p>\n\u003cp>No card needed for your free songs.\u003c/p>\n\u003ch2>A few things you might be wondering\u003c/h2>\n\u003ch3>Do I need to understand my chart?\u003c/h3>\n\u003cp>No. Your birth information lets us find your frequencies. Listening doesn&#39;t require you to learn a system first.\u003c/p>\n\u003ch3>Does the music change with my transits?\u003c/h3>\n\u003cp>Your birth frequencies stay the same. Zodiac is about access to your own nature as you move through changing circumstances and cycles. It does not generate a new soundtrack from today&#39;s sky.\u003c/p>\n\u003ch3>Can I use it with my existing practice?\u003c/h3>\n\u003cp>Yes. It can play alongside meditation, journaling or other practices you value, as well as during an ordinary day.\u003c/p>\n\u003ch3>What if I don&#39;t notice anything at first?\u003c/h3>\n\u003cp>Your first listen may be quiet. Give yourself room to notice how you meet your life over time, without trying to produce a particular feeling during the music.\u003c/p>\n\u003cp>\u003ca href=\"#website-faq\">More questions, answered\u003c/a>\u003c/p>\n","text":"More of you in the life you live.\n\nMusic made with your birth frequencies, to amplify your connection with the self you recognize in a good reading.\n\nFind my frequencies\n\nYour birth date, time and place. Four personal frequencies. Three short songs in each, free without a card.\n\n You know that feeling of being read.\n\nSomeone describes your nature so precisely that a part of you relaxes. A pattern makes sense. A quality you used to explain away starts to feel like it belongs.\n\nAstrology, Human Design and other systems can help you recognize yourself. Zodiac gives that recognition another way into your day.\n\nThrough sound.\n\n \"It lets you finally feel the parts of yourself you have only ever read about.\"\n\n Zehra Ashary, Kundalini Practitioner, London. Zodiac.fm team member.\n\n If the world is sound, what is your sound?\n\nNāda Brahma is the Vedic teaching that the world is sound. From that perspective, the pattern present when you were born would have a sound of its own.\n\nA mantra lineage had already developed a method for finding it. Zodiac uses the frequency part of that method to derive four frequencies from your birth information, then puts them into music.\n\nThe idea is to amplify your connection with your connected self: the part of you that knows your nature and belongs to something larger.\n\nYou can listen while you live. No chart to interpret in the middle of a conversation. No new practice to master before you begin.\n\nHow birth information becomes music\n\n \"This music tickled my soul and reminded me that there's such a connection between vibration, the stars and the sounds that are coordinated by higher intelligence. Give it a try.. you'll love it.\"\n\n Debra Silverman, Astrologer to Sting, Jennifer Aniston, Aaron Rodgers\n\n Four frequencies. Your whole life to use them in.\n\n Core\n\nThe signal for who you are and what is yours to do.\n\nThe work you keep returning to. The part of yourself you recognize even when your life changes around it.\n\n Love\n\nThe signal for who to let close and how to connect.\n\nBeing more available to the people you love. Recognizing when to open up and when to give yourself room.\n\n Vitality\n\nThe signal for what feeds you and what drains you.\n\nKnowing which commitments leave you more alive, and which ones ask for more than you want to give.\n\n Abundance\n\nThe signal for when to move and which opportunities are yours.\n\nMeeting an opening with a clearer sense of your own timing. Letting your choices reflect the life you actually want.\n\nYour four frequencies stay fixed. They are your reference while your life and its cycles keep moving.\n\n Bring more of yourself to what matters.\n\nYou may be entering a new chapter in your chart, learning to trust your Authority or putting intention behind something you want to create.\n\nYou may love the life you have and want to be more fully in it.\n\nZodiac belongs beside those things. Put it on while you work, cook, journal or settle into the evening. The point is what becomes available in your life, not how much you can feel during a song.\n\n \"I've been using Zodiac for over a month now and having it on in the background while I work has allowed me to slip into my flow state MUCH easier while having a greater sense of calm and ease\"\n\n Alex Kikel, Trainer to Olympians and Professional Athletes\n\n Made around your frequency, all the way through.\n\nReal musicians make each song. Audio engineers retune it so your exact frequency belongs inside its harmony.\n\nEach composition comes in 701 versions. Yours carries one of your four frequencies through the track. You choose the music that fits the moment.\n\nA useful rhythm is at least nine minutes a day on average, with time for all four frequencies across the week. The app helps keep them in balance.\n\nHear how the music is made\n\n A year of listening. A clearer picture of the experience.\n\n \"Zodiac.fm helps people access aspects of themselves that have always been there. Listening to your frequencies bypasses language and creates profound levels of self-awareness and coherence. This leads to clearer decisions, more authentic relationships, and expanded possibilities.\"\n\n Srini Pillay, M.D., Harvard Neuroscientist & Author\n\nThree hundred people began our 52-week study. Two hundred and seventy-eight completed it. Of the completers, 98.6 percent said they would recommend Zodiac to a friend.\n\nAmong people who listened as designed, at least nine minutes a day on average with each frequency receiving at least 15 percent of listening time, 84 percent called it life-changing.\n\nParticipants answered open questions every two weeks, and their listening was logged. This was our own study, coded in-house. It was not a clinical trial and has not been published in a journal. The findings describe reported experiences, not proof of the metaphysical explanation or a promise about your results.\n\nRead the study\n\n Start with the songs that are already yours.\n\nFind your frequencies and hear three short songs in each one. Those stay free.\n\nFor the full library, try seven days for $3. Choose $109 billed yearly, equivalent to $9.08 a month, or $17 billed monthly. Your chosen membership starts on day eight unless you cancel first. The $3 and subsequent membership charges are non-refundable.\n\nMembership gives you longer music across all four frequencies, from nine-minute immersions to extended meditations and an hour-long track. Nearly ten hours in total, with more room to leave the music on.\n\nListen on iPhone, Android, or in a desktop or laptop browser. Use the same email wherever you listen.\n\nFind my frequencies\n\nNo card needed for your free songs.\n\n A few things you might be wondering\n\n Do I need to understand my chart?\n\nNo. Your birth information lets us find your frequencies. Listening doesn't require you to learn a system first.\n\n Does the music change with my transits?\n\nYour birth frequencies stay the same. Zodiac is about access to your own nature as you move through changing circumstances and cycles. It does not generate a new soundtrack from today's sky.\n\n Can I use it with my existing practice?\n\nYes. It can play alongside meditation, journaling or other practices you value, as well as during an ordinary day.\n\n What if I don't notice anything at first?\n\nYour first listen may be quiet. Give yourself room to notice how you meet your life over time, without trying to produce a particular feeling during the music.\n\nMore questions, answered","copyText":"# More of you in the life you live.\n\nMusic made with your birth frequencies, to amplify your connection with the self you recognize in a good reading.\n\n[Find my frequencies](birth-details.md)\n\nYour birth date, time and place. Four personal frequencies. Three short songs in each, free without a card.\n\n## You know that feeling of being read.\n\nSomeone describes your nature so precisely that a part of you relaxes. A pattern makes sense. A quality you used to explain away starts to feel like it belongs.\n\nAstrology, Human Design and other systems can help you recognize yourself. Zodiac gives that recognition another way into your day.\n\nThrough sound.\n\n> \"It lets you finally feel the parts of yourself you have only ever read about.\"\n>\n> Zehra Ashary, Kundalini Practitioner, London. Zodiac.fm team member.\n\n## If the world is sound, what is your sound?\n\nNāda Brahma is the Vedic teaching that the world is sound. From that perspective, the pattern present when you were born would have a sound of its own.\n\nA mantra lineage had already developed a method for finding it. Zodiac uses the frequency part of that method to derive four frequencies from your birth information, then puts them into music.\n\nThe idea is to amplify your connection with your connected self: the part of you that knows your nature and belongs to something larger.\n\nYou can listen while you live. No chart to interpret in the middle of a conversation. No new practice to master before you begin.\n\n[How birth information becomes music](../articles/where-zodiac-comes-from.md)\n\n> \"This music tickled my soul and reminded me that there's such a connection between vibration, the stars and the sounds that are coordinated by higher intelligence. Give it a try.. you'll love it.\"\n>\n> Debra Silverman, Astrologer to Sting, Jennifer Aniston, Aaron Rodgers\n\n## Four frequencies. Your whole life to use them in.\n\n### Core\n\nThe signal for who you are and what is yours to do.\n\nThe work you keep returning to. The part of yourself you recognize even when your life changes around it.\n\n### Love\n\nThe signal for who to let close and how to connect.\n\nBeing more available to the people you love. Recognizing when to open up and when to give yourself room.\n\n### Vitality\n\nThe signal for what feeds you and what drains you.\n\nKnowing which commitments leave you more alive, and which ones ask for more than you want to give.\n\n### Abundance\n\nThe signal for when to move and which opportunities are yours.\n\nMeeting an opening with a clearer sense of your own timing. Letting your choices reflect the life you actually want.\n\nYour four frequencies stay fixed. They are your reference while your life and its cycles keep moving.\n\n## Bring more of yourself to what matters.\n\nYou may be entering a new chapter in your chart, learning to trust your Authority or putting intention behind something you want to create.\n\nYou may love the life you have and want to be more fully in it.\n\nZodiac belongs beside those things. Put it on while you work, cook, journal or settle into the evening. The point is what becomes available in your life, not how much you can feel during a song.\n\n> \"I've been using Zodiac for over a month now and having it on in the background while I work has allowed me to slip into my flow state MUCH easier while having a greater sense of calm and ease\"\n>\n> Alex Kikel, Trainer to Olympians and Professional Athletes\n\n## Made around your frequency, all the way through.\n\nReal musicians make each song. Audio engineers retune it so your exact frequency belongs inside its harmony.\n\nEach composition comes in 701 versions. Yours carries one of your four frequencies through the track. You choose the music that fits the moment.\n\nA useful rhythm is at least nine minutes a day on average, with time for all four frequencies across the week. The app helps keep them in balance.\n\n[Hear how the music is made](../articles/music-and-longer-tracks.md)\n\n## A year of listening. A clearer picture of the experience.\n\n> \"**Zodiac.fm helps people access aspects of themselves that have always been there.** Listening to your frequencies bypasses language and creates profound levels of self-awareness and coherence. This leads to clearer decisions, more authentic relationships, and expanded possibilities.\"\n>\n> Srini Pillay, M.D., Harvard Neuroscientist & Author\n\nThree hundred people began our 52-week study. Two hundred and seventy-eight completed it. Of the completers, 98.6 percent said they would recommend Zodiac to a friend.\n\nAmong people who listened as designed, at least nine minutes a day on average with each frequency receiving at least 15 percent of listening time, 84 percent called it life-changing.\n\nParticipants answered open questions every two weeks, and their listening was logged. This was our own study, coded in-house. It was not a clinical trial and has not been published in a journal. The findings describe reported experiences, not proof of the metaphysical explanation or a promise about your results.\n\n[Read the study](../articles/the-year-long-study.md)\n\n## Start with the songs that are already yours.\n\nFind your frequencies and hear three short songs in each one. Those stay free.\n\nFor the full library, try seven days for $3. Choose $109 billed yearly, equivalent to $9.08 a month, or $17 billed monthly. Your chosen membership starts on day eight unless you cancel first. The $3 and subsequent membership charges are non-refundable.\n\nMembership gives you longer music across all four frequencies, from nine-minute immersions to extended meditations and an hour-long track. Nearly ten hours in total, with more room to leave the music on.\n\nListen on iPhone, Android, or in a desktop or laptop browser. Use the same email wherever you listen.\n\n[Find my frequencies](birth-details.md)\n\nNo card needed for your free songs.\n\n## A few things you might be wondering\n\n### Do I need to understand my chart?\n\nNo. Your birth information lets us find your frequencies. Listening doesn't require you to learn a system first.\n\n### Does the music change with my transits?\n\nYour birth frequencies stay the same. Zodiac is about access to your own nature as you move through changing circumstances and cycles. It does not generate a new soundtrack from today's sky.\n\n### Can I use it with my existing practice?\n\nYes. It can play alongside meditation, journaling or other practices you value, as well as during an ordinary day.\n\n### What if I don't notice anything at first?\n\nYour first listen may be quiet. Give yourself room to notice how you meet your life over time, without trying to produce a particular feeling during the music.\n\n[More questions, answered](../faq/website-faq.md)"},{"category":"Affiliate","slug":"general-affiliate","title":"General affiliate landing page","label":"Review variant · General affiliate landing page","hasSourceH1":true,"html":"\u003ch1>Your birth pattern has a sound.\u003c/h1>\n\u003cp>Zodiac puts your four birth frequencies into music, so you can hear yourself in the middle of you ot a limit.\u003c/p>\n\u003cp>Something you were criticized for may make more sense in that light. Needing to talk it through can be how you arrive at clarity. Taking your time can be how you find solid ground.\u003c/p>\n\u003ch3>9. Give all four frequencies time\u003c/h3>\n\u003cp>The app balances your listening across the week. The pattern behind our study findings was about nine minutes a day on average, with each frequency receiving at least 15 percent of the listening time.\u003c/p>\n\u003cp>A missed day does not erase what came before. Come back when you can.\u003c/p>\n\u003ch3>10. Listen in a way that fits\u003c/h3>\n\u003cp>Use headphones, your car speakers or a quality Bluetooth speaker. Your phone and laptop speakers don&#39;t do the frequencies justice.\u003c/p>\n\u003cp>You can meditate to it, but you don&#39;t have to. There is no technique to master before you press play.\u003c/p>\n\u003ch3>11. Notice what becomes available\u003c/h3>\n\u003cp>You might notice something while listening. You might notice it later, in the way you meet a person, a choice or a situation.\u003c/p>\n\u003cp>The Vedic account gives us a way to understand the possibility. The listener experiences give us something else to examine. We hold the worldview as a possibility, not scientific proof, and we have studied what people reported over a year.\u003c/p>\n\u003cp>\u003ca href=\"#birth-details\">Reveal my frequencies\u003c/a>\u003c/p>\n\u003ch2>What would more access to yourself make possible?\u003c/h2>\n\u003cp>It may be taking a part of your nature seriously that you have always explained away. The work you keep returning to. Your need to talk something through. The time you need before an answer becomes clear.\u003c/p>\n\u003cp>It can reach into the life you already value. More of you in a conversation with your partner. A boundary said simply. Recognizing the opportunity you want to meet, with less effort spent convincing yourself to want the other one.\u003c/p>\n\u003cp>For on carries one of your frequencies.\n\n 5. Tune the song around your frequency\n\nYour frequency usually falls between standard musical notes. Simply adding it to a finished song could make the two clash.\n\nInstead, the music is retuned until your exact frequency becomes part of its harmony. The tone stays exact and runs through the track, fading in at the beginning and out at the end.\n\nEvery composition is prepared in 701 versions, one for each whole frequency from 250 to 950 Hz. There is a version for yours.\n\n 6. Turn up the connection you already have\n\nYour connected self is who you were before anyone taught you who to be, and the part of you connected to everything and everyone else.\n\nYour signal is how you reach it. Think of a familiar voice calling across a crowded room. The voice is not the person, but it is how you find them.\n\nZodiac plays your frequencies back to you to amplify that connection. A tuning fork gives a useful picture: sound the same note beside a guitar string and the string can begin to hum. That is an analogy for our proposed explanation, not a measured account of what happens inside a listener.\n\n 7. Bring the connection into the day\n\nYou don't have to get away from your life to use it.\n\nThe music can play while you cook, work, journal or sit with someone. Your signal can become easier to recognize in the middle of the noise, where your choices are actually being made.\n\n 8. Recognize how you get clear\n\nEach frequency falls into a band. Your band describes how you naturally take things in within that area of life.\n\nRoot is associated with stillness and steadiness. Solar Plexus with moving and doing. Throat with speaking or writing. Crown with seeing the whole picture.\n\nYou can have a different band for each frequency. Everybody uses all four ways. The band describes a preference, not a limit.\n\nSomething you were criticized for may make more sense in that light. Needing to talk it through can be how you arrive at clarity. Taking your time can be how you find solid ground.\n\n 9. Give all four frequencies time\n\nThe app balances your listening across the week. The pattern behind our study findings was about nine minutes a day on average, with each frequency receiving at least 15 percent of the listening time.\n\nA missed day does not erase what came before. Come back when you can.\n\n 10. Listen in a way that fits\n\nUse headphones, your car speakers or a quality Bluetooth speaker. Your phone and laptop speakers don't do the frequencies justice.\n\nYou can meditate to it, but you don't have to. There is no technique to master before you press play.\n\n 11. Notice what becomes available\n\nYou might notice something while listening. You might notice it later, in the way you meet a person, a choice or a situation.\n\nThe Vedic account gives us a way to understand the possibility. The listener experiences give us something else to examine. We hold the worldview as a possibility, not scientific proof, and we have studied what people reported over a year.\n\nReveal my frequencies\n\n What would more access to yourself make possible?\n\nIt may be taking a part of your nature seriously that you have always explained away. The work you keep returning to. Your need to talk something through. The time you need before an answer becomes clear.\n\nIt can reach into the life you already value. More of you in a conversation with your partner. A boundary said simply. Recognizing the opportunity you want to meet, with less effort spent convincing yourself to want the other one.\n\nFor someone who follows astrology, this can mean meeting a transit or a new chapter from a stronger connection with their own nature. For someone practicing manifestation, it can mean recognizing what is theirs to pursue. The same connection belongs in an already successful life, too.\n\nWe cannot promise a particular relationship, job, amount of money or event. Your decisions remain yours.\n\n \"It lets you finally feel the parts of yourself you have only ever read about.\"\n\n Zehra Ashary, Kundalini Practitioner, London. Zodiac.fm team member.\n\n Music beside the things you already do\n\nA reading can give you context. Your practice can help you see what is happening. Zodiac adds a way to keep your own signal available as you use what you know.\n\n \"I've been using Zodiac for over a month now and having it on in the background while I work has allowed me to slip into my flow state MUCH easier while having a greater sense of calm and ease\"\n\n Alex Kikel, Trainer to Olympians and Professional Athletes\n\nYou may have an hour to settle in. You may have a few minutes between things. Choose music that suits the moment and let it play.\n\n What listeners reported over a year\n\nThree hundred people began our 52-week study. Two hundred and seventy-eight completed it. They answered open questions every two weeks, and their listening was logged.\n\nOf those who completed the year, 98.6 percent said they would recommend Zodiac to a friend. Among those who listened as designed, about nine minutes a day on average with each frequency receiving at least 15 percent of listening time, 84 percent called it life-changing.\n\nIn that as-designed group, 94 percent described deeper self-access. Ninety-one percent reported sharper instincts, and 90 percent reported better relationships and love.\n\nThe study was internal and coded in-house. It was not a clinical trial and has not been published in a journal. These are participants' reports, not proof of the mechanism or a promised result for you.\n\n \"I am seeing a huge difference in how much more loving I am. I'm more affectionate, more grounded.\"\n\n Amy Wilcox\n\n \"Listening to my frequency immersion feels like coming home to myself.\"\n\n Katie Wells, Founder, Wellness Mama, Best-Selling Author\n\n The first week is a beginning\n\nSeven days gives you time to hear the full library and see where it fits in your day. It doesn't have to deliver your entire experience in a week.\n\nAmong the study participants who listened as designed, 61 percent reported a clear shift by month one, 81 percent by month three and 87 percent by month six. People moved at different speeds. Those figures describe the group, not a schedule you have to keep.\n\nLet the music be part of your life, then notice your life.\n\n Start with your four frequencies\n\nEnter your birth date, time and place. Your results show Core, Love, Vitality and Abundance, with the band for each.\n\nYou can hear three short songs in every frequency without a card. They remain free whether or not you choose membership.\n\nMembership adds the longer tracks across all four frequencies, including nine-minute immersions, extended meditation tracks and an hour-long track. The complete library currently holds nearly ten hours of music across your four frequencies.\n\n Your first seven days are free through this invitation\n\nChoose annual or monthly. The free week applies to either plan.\n\n$7.33 a month, billed at $88 a year. Save $21 a year compared with our current $109 annual price.\n\nOr $14 a month. Save $3 a month compared with our current $17 monthly price.\n\nAdd a card when you start your free week. On day eight, you are charged for the plan you chose. Cancel before your trial ends and there is no membership charge. Charges after the trial are non-refundable.\n\nYour checkout shows the exact charge date. Your three short songs in each frequency stay free either way.\n\n Why it costs so little right now\n\nWe are keeping the price low on purpose.\n\nWe want everyone to have a chance to experience what it feels like to have access to their connected self, and we want to grow quickly while we do it.\n\nThat will change. In a couple of months we will be raising the price so we can cover our costs, which are real: every song is written by real composers, played by real musicians, and prepared in roughly 700 frequency-specific versions by audio engineers.\n\nJoin now and your price stays where it is for as long as you stay.\n\n A few practical questions\n\n Do I need to know my chart?\n\nNo. We use your birth details to find the frequencies. You can listen without learning a new system.\n\n What if I don't know my birth time?\n\nUse your best estimate. If you only know the general time of day, start there. Use noon only if you have no idea.\n\n What if I don't feel anything while listening?\n\nThat can happen. The point is access to yourself in everyday life, and the difference may become apparent over time. You don't have to produce a sensation during a song.\n\n Where do I listen?\n\nIn the native iPhone or Android app, or in your browser on a desktop or laptop. Sign in with the same email you used here.\n\n Do I need a card to hear the free songs?\n\nNo. A card is required only when you choose the full-library week.\n\n Hear what belongs to you\n\nYour birth frequencies are already yours. The next step is finding them and hearing the music.\n\nReveal my frequencies\n\nThree short songs in each frequency, free to keep. No card required for those songs.","copyText":"# Your birth pattern has a sound.\n\nZodiac puts your four birth frequencies into music, so you can hear yourself in the middle of your life.\n\nThe person who shared this link may earn a commission if you become a paying member.\n\n[Reveal my frequencies](birth-details.md)\n\nSee your four frequencies and their bands. Your three short songs in each frequency are free, with no card needed.\n\n## Live more of what you recognize about yourself\n\nA reading can describe you so well that you stop trying to explain yourself for a moment. Yes. That is me.\n\nYou may know that recognition through astrology, Human Design or a practice you have made your own. It can give you language for your nature, compassion for your quirks and context for the chapter you are in.\n\nNow think about having more access to that knowing while you live. When you are choosing what to put your time into. When an opportunity arrives. When you want to be fully there with someone you love.\n\nThat is what Zodiac is for.\n\n> \"Insight is powerful. But insight alone does not create integration. Zodiac.fm works at the frequency level underneath the pattern. Instead of just studying your blueprint, you begin resonating with it.\"\n>\n> Summer Phoenix, Human Design and Gene Keys Practitioner\n\n## If the world is sound, your birth pattern has a sound too\n\nNāda Brahma is the Vedic teaching that the world is sound. You, the planets and the music are part of one reality.\n\nSo the pattern present when you were born would have a sound of its own. That was the question worth following.\n\nA mantra lineage had already developed a way to find it.\n\nWe use the frequency part of their method to derive four frequencies from your birth date, time and place. Then we put them into music. You can listen to the pattern a reading helps you recognize, without having to translate it into words first.\n\nThe origin is old. The music and the way you use it belong in the life you have now.\n\n> \"This music tickled my soul and reminded me that there's such a connection between vibration, the stars and the sounds that are coordinated by higher intelligence. Give it a try.. you'll love it.\"\n>\n> Debra Silverman, Astrologer to Sting, Jennifer Aniston, Aaron Rodgers\n\n## Here is how the birth pattern becomes music\n\n### 1. Start with the moment you arrived\n\nYour date, time and place of birth identify the planetary arrangement you were born into. Astrology treats that pattern as meaningful throughout your life. Zodiac begins with the same personally meaningful birth moment.\n\n### 2. Find its sound\n\nThe mantra lineage's method derives four frequencies from that birth information. They are actual musical pitches, between 250 and 950 Hz. The method remains protected.\n\n### 3. Four frequencies, with four places in your life\n\nCore is the signal for who you are and what is yours to do.\n\nLove is the signal for who to let close and how to connect.\n\nVitality is the signal for what feeds you and what drains you.\n\nAbundance is the signal for when to move and which opportunities are yours.\n\nThey stay fixed. Your life changes, the sky keeps moving, and your birth frequencies stay yours.\n\n### 4. Give the frequencies music worth listening to\n\nA frequency by itself is a pure tone. We wanted something you would enjoy leaving on.\n\nReal musicians make the songs, from short pieces to longer music for work, meditation or winding down. Each version carries one of your frequencies.\n\n### 5. Tune the song around your frequency\n\nYour frequency usually falls between standard musical notes. Simply adding it to a finished song could make the two clash.\n\nInstead, the music is retuned until your exact frequency becomes part of its harmony. The tone stays exact and runs through the track, fading in at the beginning and out at the end.\n\nEvery composition is prepared in 701 versions, one for each whole frequency from 250 to 950 Hz. There is a version for yours.\n\n### 6. Turn up the connection you already have\n\nYour connected self is who you were before anyone taught you who to be, and the part of you connected to everything and everyone else.\n\nYour signal is how you reach it. Think of a familiar voice calling across a crowded room. The voice is not the person, but it is how you find them.\n\nZodiac plays your frequencies back to you to amplify that connection. A tuning fork gives a useful picture: sound the same note beside a guitar string and the string can begin to hum. That is an analogy for our proposed explanation, not a measured account of what happens inside a listener.\n\n### 7. Bring the connection into the day\n\nYou don't have to get away from your life to use it.\n\nThe music can play while you cook, work, journal or sit with someone. Your signal can become easier to recognize in the middle of the noise, where your choices are actually being made.\n\n### 8. Recognize how you get clear\n\nEach frequency falls into a band. Your band describes how you naturally take things in within that area of life.\n\nRoot is associated with stillness and steadiness. Solar Plexus with moving and doing. Throat with speaking or writing. Crown with seeing the whole picture.\n\nYou can have a different band for each frequency. Everybody uses all four ways. The band describes a preference, not a limit.\n\nSomething you were criticized for may make more sense in that light. Needing to talk it through can be how you arrive at clarity. Taking your time can be how you find solid ground.\n\n### 9. Give all four frequencies time\n\nThe app balances your listening across the week. The pattern behind our study findings was about nine minutes a day on average, with each frequency receiving at least 15 percent of the listening time.\n\nA missed day does not erase what came before. Come back when you can.\n\n### 10. Listen in a way that fits\n\nUse headphones, your car speakers or a quality Bluetooth speaker. Your phone and laptop speakers don't do the frequencies justice.\n\nYou can meditate to it, but you don't have to. There is no technique to master before you press play.\n\n### 11. Notice what becomes available\n\nYou might notice something while listening. You might notice it later, in the way you meet a person, a choice or a situation.\n\nThe Vedic account gives us a way to understand the possibility. The listener experiences give us something else to examine. We hold the worldview as a possibility, not scientific proof, and we have studied what people reported over a year.\n\n[Reveal my frequencies](birth-details.md)\n\n## What would more access to yourself make possible?\n\nIt may be taking a part of your nature seriously that you have always explained away. The work you keep returning to. Your need to talk something through. The time you need before an answer becomes clear.\n\nIt can reach into the life you already value. More of you in a conversation with your partner. A boundary said simply. Recognizing the opportunity you want to meet, with less effort spent convincing yourself to want the other one.\n\nFor someone who follows astrology, this can mean meeting a transit or a new chapter from a stronger connection with their own nature. For someone practicing manifestation, it can mean recognizing what is theirs to pursue. The same connection belongs in an already successful life, too.\n\nWe cannot promise a particular relationship, job, amount of money or event. Your decisions remain yours.\n\n> \"It lets you finally feel the parts of yourself you have only ever read about.\"\n>\n> Zehra Ashary, Kundalini Practitioner, London. Zodiac.fm team member.\n\n## Music beside the things you already do\n\nA reading can give you context. Your practice can help you see what is happening. Zodiac adds a way to keep your own signal available as you use what you know.\n\n> \"I've been using Zodiac for over a month now and having it on in the background while I work has allowed me to slip into my flow state MUCH easier while having a greater sense of calm and ease\"\n>\n> Alex Kikel, Trainer to Olympians and Professional Athletes\n\nYou may have an hour to settle in. You may have a few minutes between things. Choose music that suits the moment and let it play.\n\n## What listeners reported over a year\n\nThree hundred people began our 52-week study. Two hundred and seventy-eight completed it. They answered open questions every two weeks, and their listening was logged.\n\nOf those who completed the year, 98.6 percent said they would recommend Zodiac to a friend. Among those who listened as designed, about nine minutes a day on average with each frequency receiving at least 15 percent of listening time, 84 percent called it life-changing.\n\nIn that as-designed group, 94 percent described deeper self-access. Ninety-one percent reported sharper instincts, and 90 percent reported better relationships and love.\n\nThe study was internal and coded in-house. It was not a clinical trial and has not been published in a journal. These are participants' reports, not proof of the mechanism or a promised result for you.\n\n> \"I am seeing a huge difference in how much more loving I am. I'm more affectionate, more grounded.\"\n>\n> Amy Wilcox\n\n> \"Listening to my frequency immersion feels like coming home to myself.\"\n>\n> Katie Wells, Founder, Wellness Mama, Best-Selling Author\n\n## The first week is a beginning\n\nSeven days gives you time to hear the full library and see where it fits in your day. It doesn't have to deliver your entire experience in a week.\n\nAmong the study participants who listened as designed, 61 percent reported a clear shift by month one, 81 percent by month three and 87 percent by month six. People moved at different speeds. Those figures describe the group, not a schedule you have to keep.\n\nLet the music be part of your life, then notice your life.\n\n## Start with your four frequencies\n\nEnter your birth date, time and place. Your results show Core, Love, Vitality and Abundance, with the band for each.\n\nYou can hear three short songs in every frequency without a card. They remain free whether or not you choose membership.\n\nMembership adds the longer tracks across all four frequencies, including nine-minute immersions, extended meditation tracks and an hour-long track. The complete library currently holds nearly ten hours of music across your four frequencies.\n\n## Your first seven days are free through this invitation\n\nChoose annual or monthly. The free week applies to either plan.\n\n$7.33 a month, billed at $88 a year. Save $21 a year compared with our current $109 annual price.\n\nOr $14 a month. Save $3 a month compared with our current $17 monthly price.\n\nAdd a card when you start your free week. On day eight, you are charged for the plan you chose. Cancel before your trial ends and there is no membership charge. Charges after the trial are non-refundable.\n\nYour checkout shows the exact charge date. Your three short songs in each frequency stay free either way.\n\n## Why it costs so little right now\n\nWe are keeping the price low on purpose.\n\nWe want everyone to have a chance to experience what it feels like to have access to their connected self, and we want to grow quickly while we do it.\n\nThat will change. In a couple of months we will be raising the price so we can cover our costs, which are real: every song is written by real composers, played by real musicians, and prepared in roughly 700 frequency-specific versions by audio engineers.\n\nJoin now and your price stays where it is for as long as you stay.\n\n## A few practical questions\n\n### Do I need to know my chart?\n\nNo. We use your birth details to find the frequencies. You can listen without learning a new system.\n\n### What if I don't know my birth time?\n\nUse your best estimate. If you only know the general time of day, start there. Use noon only if you have no idea.\n\n### What if I don't feel anything while listening?\n\nThat can happen. The point is access to yourself in everyday life, and the difference may become apparent over time. You don't have to produce a sensation during a song.\n\n### Where do I listen?\n\nIn the native iPhone or Android app, or in your browser on a desktop or laptop. Sign in with the same email you used here.\n\n### Do I need a card to hear the free songs?\n\nNo. A card is required only when you choose the full-library week.\n\n## Hear what belongs to you\n\nYour birth frequencies are already yours. The next step is finding them and hearing the music.\n\n[Reveal my frequencies](birth-details.md)\n\nThree short songs in each frequency, free to keep. No card required for those songs."},{"category":"Affiliate","slug":"astrology-human-design","title":"Astrology + Human Design landing page","label":"Review variant · Astrology + Human Design landing page", r Aniston, Aaron Rodgers\n\n Four frequencies become music you can take into a real moment.\n\nCore is the signal for who you are and what is yours to do.\n\nLove is the signal for who to let close and how to connect.\n\nVitality is the signal for what feeds you and what drains you.\n\nAbundance is the signal for when to move and which opportunities are yours.\n\nReal musicians make every Zodiac composition. Your exact frequency usually falls between standard musical notes, so we do not simply lay a tone over a finished song. Each piece is retuned until your frequency is one of the music's own harmonies. There are 701 versions of every song, one for each whole frequency from 250 to 950 Hz.\n\nThe tone runs through the song as part of it. Your fixed birth frequencies are there while you listen at your desk, on a walk, while you journal, or before a conversation that matters.\n\n Your signal is a connection, not another authority.\n\nThe connected self is who you were before anyone taught you who to be, and the part of you connected to everything and everyone else. Your signal is how you reach it.\n\nThink of a familiar voice in a crowded room. The voice is not the person. It is how you find them.\n\nZodiac plays your frequencies back to you to amplify that connection. A tuning fork beside a guitar string gives a useful picture: when the same note sounds nearby, the string can begin to hum. It is an analogy for our proposed explanation, not a measured account of what happens inside you.\n\nWhat you notice, and what you do with it, remains yours.\n\n \"It lets you finally feel the parts of yourself you have only ever read about.\"\n\n Zehra Ashary, Kundalini Practitioner, London. Zodiac.fm team member.\n\n The bands can show you how clarity arrives.\n\nEach frequency falls into a band. Root is 250 to 425 Hz: you get clear through stillness and steadiness. Solar Plexus is 425 to 600 Hz: you get clear by moving and doing. Throat is 600 to 775 Hz: you get clear by saying it or writing it. Crown is 775 to 950 Hz: you get clear by seeing the whole picture.\n\nYou can have a different band for every frequency. Everyone uses all four ways. The band is a preference, not a ceiling.\n\nFor some people, that lands in a deeply practical way. Slow to decide is not always a failure to decide. Sometimes stillness is where the answer gathers. Talking something through is not automatically noise. Sometimes speaking is how the shape of a truth appears. Your Human Design Authority still has its own timing. Your chart still has its own language. Zodiac does not flatten either one into a single rule.\n\n Listening fits beside the practice you already keep.\n\nPut on headphones, play a track through the car, or use a decent speaker while you work, cook, move or write. You can meditate with Zodiac, but you do not have to. There is no technique to perform and no screen to watch.\n\nThe app balances your four frequencies across the week. The listening pattern used in the study was about nine minutes a day on average, with each frequency receiving at least 15 percent of the time. A missed day is simply a missed day.\n\n \"I've been using Zodiac for over a month now and having it on in the background while I work has allowed me to slip into my flow state MUCH easier while having a greater sense of calm and ease\"\n\n Alex Kikel, Trainer to Olympians and Professional Athletes\n\n Here is what people reported after living with it.\n\nThree hundred people began Zodiac's 52-week internal study, and 278 completed the year. They answered open questions every two weeks while their listening was logged.\n\nOf the people who completed the year, 98.6 percent said they would recommend Zodiac to a friend. Among people who listened as designed, at least nine minutes a day on average across the week with each frequency receiving at least 15 percent of listening time, 84 percent called it life-changing.\n\nThe study was coded in-house. It was not a clinical trial and has not been published in a journal. These are reports from participants, not proof of the mechanism or a promise for you.\n\n \"I am seeing a huge difference in how much more loving I am. I'm more affectionate, more grounded.\"\n\n Amy Wilcox\n\n \"Listening to my frequency immersion feels like coming home to myself.\"\n\n Katie Wells, Founder, Wellness Mama, Best-Selling Author\n\n The first week is for hearing how it belongs in your life.\n\nSeven days lets you hear the full library and discover where the music fits. It does not need to deliver a conclusion on command.\n\nAmong the participants who listened as designed, 61 percent reported a clear shift by month one, 81 percent by month three and 87 percent by month six. That describes a group over time. It is not a schedule for your experiment.\n\n Begin with your own four frequencies.\n\nEnter your birth date, time and place. You will see your Core, Love, Vitality and Abundance frequencies and the band for each. You can hear three short songs in each one for free, permanently, with no card.\n\nMembership adds the longer library across all four frequencies, including nine-minute immersions, extended meditation tracks and an hour-long track. The complete library contains nearly ten hours of music.\n\n Your first seven days are free through this invitation.\n\nChoose annual or monthly. The free week applies to either plan.\n\n$7.33/mo · $88 billed yearly. Save $21 a year.\n\n$14/mo. Save $3 a month.\n\nAdd a card when you start. On day 8, the plan you chose is charged. Cancel before day 8 and there is no membership charge. Charges after the trial are non-refundable. Your checkout shows the exact charge date.\n\nReveal my frequencies\n\nYour three short songs in each frequency stay free either way.\n\n Questions\n\n Does Zodiac change with my transits or Human Design gates?\n\nNo. Zodiac derives four fixed frequencies from your birth information. The sky, your circumstances and your practice can change while those frequencies remain a steady personal reference.\n\n Does this tell me what my Authority says or what decision to make?\n\nNo. Zodiac does not interpret your chart or enact your Authority. It is music built around your birth frequencies. Your discernment remains yours.\n\n What if I do not know my birth time?\n\nUse your best estimate. If you have no estimate at all, use noon.\n\n Where do I listen?\n\nListen in the native iPhone or Android app, or in a browser on your desktop or laptop. Sign in with the same email you used for Zodiac.","copyText":"# Live what your chart describes.\n\nMusic made with your birth frequencies, to bring the self you recognize in a reading into the way you live.\n\nThe person who shared this link may earn a commission if you become a paying member.\n\nYou know the feeling when a reading catches something no one else has named. The placement that explains a lifelong contradiction. The transit that gives context to a chapter you were already living. The Human Design detail that turns an old criticism into something you can finally meet with some compassion.\n\nZodiac is built for the moment after it, when the meeting starts, the invitation arrives, the mood changes, or you need to make a choice inside the life you actually have.\n\n[Reveal my frequencies](birth-details.md)\n\nSee your four birth frequencies and their bands. Your three short songs in each frequency are free, with no card required.\n\n## You already recognize yourself in the map.\n\nAstrology gives you a way to notice your birth pattern in a changing sky. Human Design gives you a language for Type, Strategy, Authority, Centers, profile and the experiment of meeting your life as yourself.\n\nThose are living practices, not trivia. You may journal a transit after a strange week. You may take your time with an emotional decision instead of forcing an instant answer. You may be learning what an invitation, a response or a clear no feels like in an ordinary workday.\n\nZodiac adds so es, so we do not simply lay a tone over a finished song. Each piece is retuned until your frequency is one of the music's own harmonies. There are 701 versions of every song, one for each whole frequency from 250 to 950 Hz.\n\nThe tone runs through the song as part of it. Your fixed birth frequencies are there while you listen at your desk, on a walk, while you journal, or before a conversation that matters.\n\n## Your signal is a connection, not another authority.\n\nThe connected self is who you were before anyone taught you who to be, and the part of you connected to everything and everyone else. Your signal is how you reach it.\n\nThink of a familiar voice in a crowded room. The voice is not the person. It is how you find them.\n\nZodiac plays your frequencies back to you to amplify that connection. A tuning fork beside a guitar string gives a useful picture: when the same note sounds nearby, the string can begin to hum. It is an analogy for our proposed explanation, not a measured account of what happens inside you.\n\nWhat you notice, and what you do with it, remains yours.\n\n> \"It lets you finally feel the parts of yourself you have only ever read about.\"\n>\n> Zehra Ashary, Kundalini Practitioner, London. Zodiac.fm team member.\n\n## The bands can show you how clarity arrives.\n\nEach frequency falls into a band. Root is 250 to 425 Hz: you get clear through stillness and steadiness. Solar Plexus is 425 to 600 Hz: you get clear by moving and doing. Throat is 600 to 775 Hz: you get clear by saying it or writing it. Crown is 775 to 950 Hz: you get clear by seeing the whole picture.\n\nYou can have a different band for every frequency. Everyone uses all four ways. The band is a preference, not a ceiling.\n\nFor some people, that lands in a deeply practical way. Slow to decide is not always a failure to decide. Sometimes stillness is where the answer gathers. Talking something through is not automatically noise. Sometimes speaking is how the shape of a truth appears. Your Human Design Authority still has its own timing. Your chart still has its own language. Zodiac does not flatten either one into a single rule.\n\n## Listening fits beside the practice you already keep.\n\nPut on headphones, play a track through the car, or use a decent speaker while you work, cook, move or write. You can meditate with Zodiac, but you do not have to. There is no technique to perform and no screen to watch.\n\nThe app balances your four frequencies across the week. The listening pattern used in the study was about nine minutes a day on average, with each frequency receiving at least 15 percent of the time. A missed day is simply a missed day.\n\n> \"I've been using Zodiac for over a month now and having it on in the background while I work has allowed me to slip into my flow state MUCH easier while having a greater sense of calm and ease\"\n>\n> Alex Kikel, Trainer to Olympians and Professional Athletes\n\n## Here is what people reported after living with it.\n\nThree hundred people began Zodiac's 52-week internal study, and 278 completed the year. They answered open questions every two weeks while their listening was logged.\n\nOf the people who completed the year, 98.6 percent said they would recommend Zodiac to a friend. Among people who listened as designed, at least nine minutes a day on average across the week with each frequency receiving at least 15 percent of listening time, 84 percent called it life-changing.\n\nThe study was coded in-house. It was not a clinical trial and has not been published in a journal. These are reports from participants, not proof of the mechanism or a promise for you.\n\n> \"I am seeing a huge difference in how much more loving I am. I'm more affectionate, more grounded.\"\n>\n> Amy Wilcox\n\n> \"Listening to my frequency immersion feels like coming home to myself.\"\n>\n> Katie Wells, Founder, Wellness Mama, Best-Selling Author\n\n## The first week is for hearing how it belongs in your life.\n\nSeven days lets you hear the full library and discover where the music fits. It does not need to deliver a conclusion on command.\n\nAmong the participants who listened as designed, 61 percent reported a clear shift by month one, 81 percent by month three and 87 percent by month six. That describes a group over time. It is not a schedule for your experiment.\n\n## Begin with your own four frequencies.\n\nEnter your birth date, time and place. You will see your Core, Love, Vitality and Abundance frequencies and the band for each. You can hear three short songs in each one for free, permanently, with no card.\n\nMembership adds the longer library across all four frequencies, including nine-minute immersions, extended meditation tracks and an hour-long track. The complete library contains nearly ten hours of music.\n\n## Your first seven days are free through this invitation.\n\nChoose annual or monthly. The free week applies to either plan.\n\n**$7.33/mo · $88 billed yearly.** Save $21 a year.\n\n**$14/mo.** Save $3 a month.\n\nAdd a card when you start. On day 8, the plan you chose is charged. Cancel before day 8 and there is no membership charge. Charges after the trial are non-refundable. Your checkout shows the exact charge date.\n\n[Reveal my frequencies](birth-details.md)\n\nYour three short songs in each frequency stay free either way.\n\n## Questions\n\n### Does Zodiac change with my transits or Human Design gates?\n\nNo. Zodiac derives four fixed frequencies from your birth information. The sky, your circumstances and your practice can change while those frequencies remain a steady personal reference.\n\n### Does this tell me what my Authority says or what decision to make?\n\nNo. Zodiac does not interpret your chart or enact your Authority. It is music built around your birth frequencies. Your discernment remains yours.\n\n### What if I do not know my birth time?\n\nUse your best estimate. If you have no estimate at all, use noon.\n\n### Where do I listen?\n\nListen in the native iPhone or Android app, or in a browser on your desktop or laptop. Sign in with the same email you used for Zodiac."},{"category":"Affiliate","slug":"manifestation","title":"Manifestation landing page","label":"Review variant · Manifestation landing page","hasSourceH1":true,"html":"\u003ch1>The life you want begins with what is yours.\u003c/h1>\n\u003cp>An idea keeps coming back to you. A kind of work, a way of living, something you would love to make real.\u003c/p>\n\u003cp>You can picture it. You can take steps toward it. And as you do, there is a quieter question worth staying close to: does this feel like mine?\u003c/p>\n\u003cp>Zodiac puts your birth frequencies into music to amplify your connection with the self that recognizes the answer.\u003c/p>\n\u003cp>The person who shared this link may earn a commission if you become a paying member.\u003c/p>\n\u003cp>\u003ca href=\"#birth-details\">Reveal my frequencies\u003c/a>\u003c/p>\n\u003cp>See your four birth frequencies and their bands. Your three short songs in each frequency are free, with no card required.\u003c/p>\n\u003ch2>Bring your own nature to what you want to create.\u003c/h2>\n\u003cp>Manifestation can involve vision boards, prayer, scripting, gratitude, visualization, a practical plan, a job application, a hard conversation, or the patience to let a decision ripen. Different practices use different words. What matters is that you remain present for your own life.\u003c/p>\n\u003cp>Zodiac adds a personal point of connection: music built around the birth pattern that is already yours, so you can better recognize what you want, what fits, and what you are ready to meet.\u003c/p>\n\u003ch2>Nāda Brahma gives the idea a starting point.\u003c/h2>\n\u003cp>Nāda Brahma is the Vedic teaching that the world is sound. Within that worldview, the pattern present at your birth has a sound of its own.\u003c/p>\n\u003cp>A mantra lineage had already developed a way to find that sound. Zodiac uses the shared frequency part of their method to derive four frequencies from your date, time and place of birth: Core, Love, Vitality and Abundance.\u003c/p>\n\u003cp>They are fixed at birth. Your circumstances can change. A desire can clarify, deepen, lose its hold or call for a different kind of action. Your four frequencies remain a steady reference while you meet it all.\u003c/p>\n\u003cp>That gives you a way to stay in touch with yourself as the future is made.\u003c/p>\n\u003ch2>Four parts of a life, carried into music.\u003c/h2>\n\u003cp>Core is the signal for who you are and what is yours to do.\u003c/p>\n\u003cp>Love is the signal for who to let close and how to connect.\u003c/p>\n\u003cp>Vitality is the signal for what feeds you and what drains you.\u003c/p>\n\u003cp>Abundance is the signal for when to move and which opportunities are yours.\u003c/p>\n\u003cp>Real musicians make every Zodiac song. A personal frequency often falls between standard musical notes, so we retune the music until your exact frequency becomes one of its own harmonies. Every composition is prepared in 701 versions, one for every whole frequency from 250 to 950 Hz.\u003c/p>\n\u003cp>Your tone runs through the track as part of the music. The music holds your fixed birth frequencies while you keep living, choosing and acting.\u003c/p>\n\u003ch2>The desire is yours to recognize. The action is yours to take.\u003c/h2>\n\u003cp>Your connected self is who you were before anyone taught you who to be, and the part of you connected to everything and everyone else. Your signal is the connection to it.\u003c/p>\n\u003cp>Zodiac plays your frequencies back to you to amplify that connection. A tuning fork beside a guitar string offers the picture: sound the same note nearby and the string can begin to hum. That is an analogy for the proposed explanation, not a measured account of what happens inside a listener.\u003c/p>\n\u003cp>That connection has somewhere to go. Into the work you want to make. Into a conversation that opens a possibility. Into recognizing when to take a step and when to let something develop.\u003c/p>\n\u003cp>The music belongs in the life where those things happen. Your actions remain yours, and no particular relationship, amount of money, job or event is promised.\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;It lets you finally feel the parts of yourself you have only ever read about.&quot;\u003c/p>\n\u003cp>Zehra Ashary, Kundalini Practitioner, London. Zodiac.fm team member.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Your bands can show you how clarity comes through.\u003c/h2>\n\u003cp>Each frequency falls into one of four bands. Root, 250 to 425 Hz, points to clarity through stillness and steadiness. Solar Plexus, 425 to 600 Hz, points to clarity through moving and doing. Throat, 600 to 775 Hz, points to clarity through saying it or writing it. Crown, 775 to 950 Hz, points to clarity through seeing the whole picture.\u003c/p>\n\u003cp>You can have a different band for each frequency. Everyone uses all four ways. Your band is a preference, not a verdict.\u003c/p>\n\u003cp>That can make a desire easier to meet honestly. Maybe you need to walk before you know what is true. Maybe a page in a journal tells you what a week of mental rehearsal never could. Maybe you need enough stillness to hear yourself without trying to force certainty. Nothing about that makes you late.\u003c/p>\n\u003ch2>Keep your ritual. Keep your practical life too.\u003c/h2>\n\u003cp>Listen while you write, walk, work, cook, visualize, meditate or rest. Use headphones, your car speakers or a decent Bluetooth speaker. You do not need a technique before you press play.\u003c/p>\n\u003cp>The app balances all four frequencies across the week. The listening pattern used in our study was about nine minutes a day on average, with each frequency receiving at least 15 percent of the listening time. A missed day does not erase anything. Return when it fits.\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;I&#39;ve been using Zodiac for over a month now and having it on in the background while I work has allowed me to slip into my flow state MUCH easier while having a greater sense of calm and ease&quot;\u003c/p>\n\u003cp>Alex Kikel, Trainer to Olympians and Professional Athletes\u003c/p>\n\u003c/blockquote>\n\u003ch2>What people reported after a year of listening.\u003c/h2>\n\u003cp>Three hundred people began Zodiac&#39;s 52-week internal study, and 278 completed the year. They answered open questions every two weeks while their listening was logged.\u003c/p>\n\u003cp>Of the people who completed the year, 98.6 percent said they would recommend Zodiac to a friend. Among people who listened as designed, at least nine minutes a day on average across the week with each frequency receiving at least 15 percent of listening time, 84 percent called it life-changing.\u003c/p>\n\u003cp>The study was coded in-house. It was not a clinical trial and has not been published in a journal. The figures are participant reports. They do not prove the mechanism or guarantee what will change for you.\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;I am seeing a huge difference in how much more loving I am. I&#39;m more affectionate, more grounded.&quot;\u003c/p>\n\u003cp>Amy Wilcox\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>&quot;Listening to my frequency immersion feels like coming home to myself.&quot;\u003c/p>\n\u003cp>Katie Wells, Founder, Wellness Mama, Best-Selling Author\u003c/p>\n\u003c/blockquote>\n\u003ch2>A first week is room to listen, not a demand for proof.\u003c/h2>\n\u003cp>Seven days lets you hear the full library and see whether it belongs in your own rhythm. It does not need to produce a particular result in seven days.\u003c/p>\n\u003cp>Among participants who listened as designed, 61 percent reported a clear shift by month one, 81 percent by month three and 87 percent by month six. Those are group observations, not a clock you have to beat.\u003c/p>\n\u003cp>Some people notice a feeling early. Others notice later in how they move through a choice, a relationship or a day. Either way, the point is not to perform the right experience. It is to listen and find out what becomes more available.\u003c/p>\n\u003ch2>Start with the pattern you were born with.\u003c/h2>\n\u003cp>Enter your birth date, time and place. Your results show Core, Love, Vitality and Abundance, plus the band for each frequency. Your three short songs in every frequency are free to keep without a card.\u003c/p>\n\u003cp>Membership adds the longer library across all four frequencies: nine-minute immersions, extended meditation tracks and an hour-long track. The complete library contains nearly ten hours of music.\u003c/p>\n\u003ch2>Your first seven days are free through this invitation.\u003c/h2>\n\u003cp>Choose annual or monthly. The free week applies to either plan.\u003c/p>\n\u003cp>\u003cstrong>$7.33/mo · $88 billed yearly.\u003c/strong> Save $21 a year.\u003c/p>\n\u003cp>\u003cstrong>$14/mo.\u003c/strong> Save $3 a month.\u003c/p>\n\u003cp>Add a card when you start. On day 8, the plan you chose is charged. Cancel before day 8 and there is no membership charge. Charges after the trial are non-refundable. Your checkout shows the exact charge date.\u003c/p>\n\u003cp>\u003ca href=\"#birth-details\">Reveal my frequencies\u003c/a>\u003c/p>\n\u003cp>Your three short songs in each frequency stay free either way.\u003c/p>\n\u003ch2>Questions\u003c/h2>\n\u003ch3>Does Zodiac manifest a particular result?\u003c/h3>\n\u003cp>No. Zodiac does not promise a specific relationship, job, amount of money or event. It is music built around your fixed birth frequencies, meant to support connection with your own nature as you take the actions that are yours.\u003c/p>\n\u003ch3>Do the frequencies change when my goals or circumstances change?\u003c/h3>\n\u003cp>No. They are derived from your birth date, time and place and stay fixed. Your life can change while they remain a personal reference.\u003c/p>\n\u003ch3>What if I do not know my birth time?\u003c/h3>\n\u003cp>Use your best estimate. If you have no estimate at all, use noon.\u003c/p>\n\u003ch3>Where do I listen?\u003c/h3>\n\u003cp>Listen in the native iPhone or Android app, or in a browser on your desktop or laptop. Sign in with the same email you used for Zodiac.\u003c/p>\n","text":"The life you want begins with what is yours.\n\nAn idea keeps coming back to you. A kind of work, a way of living, something you would love to make real.\n\nYou can picture it. You can take steps toward it. And as you do, there is a quieter question worth staying close to: does this feel like mine?\n\nZodiac puts your birth frequencies into music to amplify your connection with the self that recognizes the answer.\n\nThe person who shared this link may earn a commission if you become a paying member.\n\nReveal my frequencies\n\nSee your four birth frequencies and their bands. Your three short songs in each frequency are free, with no card required.\n\n Bring your own nature to what you want to create.\n\nManifestation can involve vision boards, prayer, scripting, gratitude, visualization, a practical plan, a job application, a hard conversation, or the patience to let a decision ripen. Different practices use different words. What matters is that you remain present for your own life.\n\nZodiac adds a personal point of connection: music built around the birth pattern that is already yours, so you can better recognize what you want, what fits, and what you are ready to meet.\n\n Nāda Brahma gives the idea a starting point.\n\nNāda Brahma is the Vedic teaching that the world is sound. Within that worldview, the pattern present at your birth has a sound of its own.\n\nA mantra lineage had already developed a way to find that sound. Zodiac uses the shared frequency part of their method to derive four frequencies from your date, time and place of birth: Core, Love, Vitality and Abundance.\n\nThey are fixed at birth. Your circumstances can change. A desire can clarify, deepen, lose its hold or call for a different kind of action. Your four frequencies remain a steady reference while you meet it all.\n\nThat gives you a way to stay in touch with yourself as the future is made.\n\n Four parts of a life, carried into music.\n\nCore is the signal for who you are and what is yours to do.\n\nLove is the signal for who to let close and how to connect.\n\nVitality is the signal for what feeds you and what drains you.\n\nAbundance is the signal for when to move and which opportunities are yours.\n\nReal musicians make every Zodiac song. A personal frequency often falls between standard musical notes, so we retune the music until your exact frequency becomes one of its own harmonies. Every composition is prepared in 701 versions, one for every whole frequency from 250 to 950 Hz.\n\nYour tone runs through the track as part of the music. The music holds your fixed birth frequencies while you keep living, choosing and acting.\n\n The desire is yours to recognize. The action is yours to take.\n\nYour connected self is who you were before anyone taught you who to be, and the part of you connected to everything and everyone else. Your signal is the connection to it.\n\nZodiac plays your frequencies back to you to amplify that connection. A tuning fork beside a guitar string offers the picture: sound the same note nearby and the string can begin to hum. That is an analogy for the proposed explanation, not a measured account of what happens inside a listener.\n\nThat connection has somewhere to go. Into the work you want to make. Into a conversation that opens a possibility. Into recognizing when to take a step and when to let something develop.\n\nThe music belongs in the life where those things happen. Your actions remain yours, and no particular relationship, amount of money, job or event is promised.\n\n \"It lets you finally feel the parts of yourself you have only ever read about.\"\n\n Zehra Ashary, Kundalini Practitioner, London. Zodiac.fm team member.\n\n Your bands can show you how clarity comes through.\n\nEach frequency falls into one of four bands. Root, 250 to 425 Hz, points to clarity through stillness and steadiness. Solar Plexus, 425 to 600 Hz, points to clarity through moving and doing. Throat, 600 to 775 Hz, points to clarity through saying it or writing it. Crown, 775 to 950 Hz, points to clarity through seeing the whole picture.\n\nYou can have a different band for each frequency. Everyone uses all four ways. Your band is a preference, not a verdict.\n\nThat can make a desire easier to meet honestly. Maybe you need to walk before you know what is true. Maybe a page in a journal tells you what a week of mental rehearsal never could. Maybe you need enough stillness to hear yourself without trying to force certainty. Nothing about that makes you late.\n\n Keep your ritual. Keep your practical life too.\n\nListen while you write, walk, work, cook, visualize, meditate or rest. Use headphones, your car speakers or a decent Bluetooth speaker. You do not need a technique before you press play.\n\nThe app balances all four frequencies across the week. The listening pattern used in our study was about nine minutes a day on average, with each frequency receiving at least 15 percent of the listening time. A missed day does not erase anything. Return when it fits.\n\n \"I've been using Zodiac for over a month now and having it on in the background while I work has allowed me to slip into my flow state MUCH easier while having a greater sense of calm and ease\"\n\n Alex Kikel, Trainer to Olympians and Professional Athletes\n\n What people reported after a year of listening.\n\nThree hundred people began Zodiac's 52-week internal study, and 278 completed the year. They answered open questions every two weeks while their listening was logged.\n\nOf the people who completed the year, 98.6 percent said they would recommend Zodiac to a friend. Among people who listened as designed, at least nine minutes a day on average across the week with each frequency receiving at least 15 percent of listening time, 84 percent called it life-changing.\n\nThe study was coded in-house. It was not a clinical trial and has not been published in a journal. The figures are participant reports. They do not prove the mechanism or guarantee what will change for you.\n\n \"I am seeing a huge difference in how much more loving I am. I'm more affectionate, more grounded.\"\n\n Amy Wilcox\n\n \"Listening to my frequency immersion feels like coming home to myself.\"\n\n Katie Wells, Founder, Wellness Mama, Best-Selling Author\n\n A first week is room to listen, not a demand for proof.\n\nSeven days lets you hear the full library and see whether it belongs in your own rhythm. It does not need to produce a particular result in seven days.\n\nAmong participants who listened as designed, 61 percent reported a clear shift by month one, 81 percent by month three and 87 percent by month six. Those are group observations, not a clock you have to beat.\n\nSome people notice a feeling early. Others notice later in how they move through a choice, a relationship or a day. Either way, the point is not to perform the right experience. It is to listen and find out what becomes more available.\n\n Start with the pattern you were born with.\n\nEnter your birth date, time and place. Your results show Core, Love, Vitality and Abundance, plus the band for each frequency. Your three short songs in every frequency are free to keep without a card.\n\nMembership adds the longer library across all four frequencies: nine-minute immersions, extended meditation tracks and an hour-long track. The complete library contains nearly ten hours of music.\n\n Your first seven days are free through this invitation.\n\nChoose annual or monthly. The free week applies to either plan.\n\n$7.33/mo · $88 billed yearly. Save $21 a year.\n\n$14/mo. Save $3 a month.\n
